<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Press Box Play-by-Play</title>
<meta name="theme-color" content="#151617">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500;700;800&display=swap">
<style>
/* Gamecast palette: gray page, white cards, near-black type, blue actions, red active tab. */
:root{
  --page:#EDEEF0; --card:#FFFFFF; --ground:#FFFFFF; --surface:#F4F5F6; --surface-2:#E5E6E8;
  --ink:#2B2C2D; --ink-2:#101113; --muted:#6C6D6F; --line:#CECFCF; --line-2:#E6E7E9;
  --pill:#DCDDDF; --seg:#C7C7C9; --blue:#3772DF; --blue-ink:#FFFFFF; --red:#D6301E;
  --accent:#3772DF; --accent-ink:#FFFFFF;
  --top:#151617; --top-2:#2B2C2D; --top-ink:#FFFFFF; --top-muted:#A5A6A7;
  --to:#F29A21; --to-off:#D5D6D8;
  --fld-a:#F5F6F7; --fld-b:#E9EAEC; --fld-line:#C9CACD; --fld-num:#6C6D6F; --ltg:#E0C21C; --drive:#1D1E1F;
  --good:#1E8636; --good-wash:#E5F3E8; --bad:#C8281C; --bad-wash:#FBE9E7;
  --flag:#E8B400; --flag-wash:#FFF5D2; --flag-ink:#6B5200;
  --shadow:0 2px 8px rgba(18,18,19,.24); --shadow-sm:0 1px 4px rgba(18,18,19,.24);
  --cond:"Roboto Condensed","Arial Narrow",sans-serif;
  --sans:-apple-system,system-ui,Roboto,Arial,"Helvetica Neue",Helvetica,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#151617; --card:#232425; --ground:#232425; --surface:#2B2C2D; --surface-2:#353638;
    --ink:#E7E8E9; --ink-2:#FFFFFF; --muted:#A5A6A7; --line:#3B3C3E; --line-2:#303133;
    --pill:#3B3C3E; --seg:#3B3C3E; --blue:#5B8EF0; --accent:#5B8EF0; --red:#F04A3A;
    --top:#0E0F10; --top-2:#26272A; --to-off:#48494B;
    --fld-a:#2E2F31; --fld-b:#363739; --fld-line:#4A4B4E; --fld-num:#A5A6A7; --ltg:#E6C832; --drive:#F1F2F3;
    --good:#4CC37A; --good-wash:#12301D; --bad:#FF6B61; --bad-wash:#3A1916; --flag-wash:#372E0E; --flag-ink:#F2D36B;
    --shadow:0 2px 8px rgba(0,0,0,.55); --shadow-sm:0 1px 4px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#151617; --card:#232425; --ground:#232425; --surface:#2B2C2D; --surface-2:#353638;
  --ink:#E7E8E9; --ink-2:#FFFFFF; --muted:#A5A6A7; --line:#3B3C3E; --line-2:#303133;
  --pill:#3B3C3E; --seg:#3B3C3E; --blue:#5B8EF0; --accent:#5B8EF0; --red:#F04A3A;
  --top:#0E0F10; --top-2:#26272A; --to-off:#48494B;
  --fld-a:#2E2F31; --fld-b:#363739; --fld-line:#4A4B4E; --fld-num:#A5A6A7; --ltg:#E6C832; --drive:#F1F2F3;
  --good:#4CC37A; --good-wash:#12301D; --bad:#FF6B61; --bad-wash:#3A1916; --flag-wash:#372E0E; --flag-ink:#F2D36B;
  --shadow:0 2px 8px rgba(0,0,0,.55); --shadow-sm:0 1px 4px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
/* Classes like .sample set display, which would otherwise override the hidden attribute. */
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:400 15px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font:700 11px/1.2 var(--cond);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.empty{padding:22px 12px;text-align:center;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- top bar ---------- */
.topbar{background:var(--top);color:var(--top-ink)}
.topbar-in{max-width:1280px;margin:0 auto;padding:6px 16px;min-height:48px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mark b{font:800 20px/1 var(--cond);text-transform:uppercase;letter-spacing:.01em}
.mark b i{font-style:normal;color:var(--red)}
.gtitle{margin-right:auto;min-width:0;font:500 13px/1.2 var(--sans);color:var(--top-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.abtn{background:var(--top-2);border:0;color:var(--top-ink);border-radius:16px;padding:7px 12px;font:500 12.5px/1 var(--sans)}
.abtn:hover{filter:brightness(1.25)}
.abtn.live,.syncbtn{display:inline-flex;align-items:center;gap:7px}
.syncbtn i,.abtn.live i,.livebadge i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--top-muted)}
.syncbtn.ok i{background:#3DBE6E}
.syncbtn.busy i{background:var(--to)}
.syncbtn.bad i{background:#FF5A4F}
.abtn.live{box-shadow:inset 0 0 0 1px #FF4436}
.abtn.live i{background:#FF4436}
.livebadge{display:inline-flex;align-items:center;gap:7px;font:700 12px/1 var(--sans);text-transform:uppercase;letter-spacing:.05em;color:var(--top-ink);white-space:nowrap}
.livebadge i{background:#FF4436;animation:pulse 1.6s ease-in-out infinite}
.livebadge.final i{animation:none;background:var(--top-muted)}
@keyframes pulse{50%{opacity:.3}}
@media (max-width:640px){.gtitle{display:none}.mark{margin-right:auto}}

.sample{background:var(--flag-wash);color:var(--flag-ink);padding:8px 16px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.sample button{background:var(--ink-2);color:var(--card);border:0;border-radius:14px;padding:6px 12px;font:600 12.5px/1 var(--sans)}

/* ---------- game strip ---------- */
.strip{position:sticky;top:0;z-index:30;background:var(--card);box-shadow:0 1px 0 var(--line),0 2px 6px rgba(18,18,19,.08);overflow:hidden}
.strip-in{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:12px 16px}
.st-side{position:relative;display:flex;align-items:center;gap:14px;min-width:0}
.st-side::before{content:"";position:absolute;top:-40px;bottom:-40px;left:-60px;width:300px;pointer-events:none;
  background:radial-gradient(170px 110px at 60px 30px,color-mix(in srgb,var(--tc) 40%,transparent),transparent 72%)}
.st-side.home{flex-direction:row-reverse;text-align:right}
.st-side.home::before{left:auto;right:-60px;background:radial-gradient(170px 110px at 240px 30px,color-mix(in srgb,var(--tc) 40%,transparent),transparent 72%)}
.st-logo{position:relative;flex:none;width:64px;height:64px;display:grid;place-items:center}
.st-id{position:relative;flex:1;min-width:0}
.st-name{font:600 17px/1.2 var(--sans);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-rec{font-size:12px;color:var(--muted);margin-top:2px}
.st-scorebox{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:60px}
.st-score{display:flex;align-items:center;gap:7px;font:800 44px/1 var(--cond);color:var(--ink-2);font-variant-numeric:tabular-nums}
.st-side.away .st-score{flex-direction:row-reverse}
.st-poss{width:11px;height:7px;border-radius:50%;background:var(--ink-2)}
.st-tos{display:flex;gap:4px}
.st-tos i{width:5px;height:5px;border-radius:50%;background:var(--to-off)}
.st-tos i.on{background:var(--to)}
.st-mid{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:150px;text-align:center}
.st-line1{display:flex;align-items:center;gap:6px;font:700 18px/1.25 var(--sans);color:var(--ink-2)}
.st-clock{background:none;border:0;padding:0;font:inherit;color:inherit;font-variant-numeric:tabular-nums}
body:not(.viewer) button.st-clock{border-bottom:1px dashed var(--line)}
.st-clock.run{color:var(--good)}
input.st-clock{width:72px;text-align:center;border:1px solid var(--line);border-radius:4px;background:var(--card)}
.clk-go{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0;color:var(--ink)}
.clk-go svg{width:10px;height:10px;fill:currentColor}
.st-sit{font-size:14px;line-height:1.3;color:var(--muted)}
.dbar{display:none;max-width:1280px;margin:0 auto;padding:0 18px 8px}
.dbar-track{position:relative;height:12px;border-radius:6px;background:var(--surface-2)}
.dbar-tick{position:absolute;top:3px;bottom:3px;width:1px;background:var(--seg)}
.dbar-ltg{position:absolute;top:1px;bottom:1px;width:3px;margin-left:-1px;border-radius:1px;background:var(--ltg)}
.dbar-line{position:absolute;top:4.5px;height:3px;background:var(--drive)}
.dbar-head{position:absolute;top:1px;width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent}
.dbar-head.r{border-left:9px solid var(--drive);margin-left:-9px}
.dbar-head.l{border-right:9px solid var(--drive)}
.dbar-lbl{position:relative;height:16px;font-size:12px;color:var(--muted)}
.dbar-lbl span{position:absolute;top:2px;transform:translateX(-50%)}
@media (max-width:1000px){.dbar{display:block}}
@media (max-width:700px){
  .strip-in{padding:10px 10px;gap:6px}
  .st-id{display:none}
  .st-logo{width:46px;height:46px}
  .st-score{font-size:38px}
  .st-mid{min-width:0}
  .st-line1{font-size:16px}
}

/* ---------- tabs ---------- */
.gtabs{background:var(--card);border-bottom:1px solid var(--line)}
.gtabs-in{max-width:1280px;margin:0 auto;padding:0 16px;display:flex;gap:24px;overflow-x:auto}
.gtab{background:none;border:0;border-bottom:3px solid transparent;padding:13px 0 10px;font:500 15px/1 var(--sans);color:var(--muted);white-space:nowrap}
.gtab:hover{color:var(--ink-2)}
.gtab[aria-selected="true"]{color:var(--ink-2);font-weight:600;border-bottom-color:var(--red)}

/* ---------- layout ---------- */
.gc{max-width:1280px;margin:0 auto;padding:16px 16px 60px;display:grid;grid-template-columns:minmax(0,1fr) 390px;
  grid-template-areas:"view pad" "view rail";gap:0 16px;align-items:start}
.gc > #pad{grid-area:pad;margin-bottom:16px}
.gc-view{grid-area:view;display:flex;flex-direction:column;gap:16px;min-width:0}
.gc-rail{grid-area:rail;display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:1000px){
  .gc{grid-template-columns:minmax(0,1fr);grid-template-areas:"pad" "view" "rail";gap:16px 0;padding:12px 10px 60px}
  .gc > #pad{margin-bottom:0}
}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:16px}
.card-hd{display:flex;align-items:center;gap:10px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.card-title{margin:0;font:700 17px/1.1 var(--cond);text-transform:uppercase;color:var(--ink-2);letter-spacing:.01em}
.card-sub{font-size:13px;color:var(--muted);margin-top:3px}
.card-ft{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;text-align:center}
.linkbtn2{background:none;border:0;color:var(--blue);font:500 14px/1 var(--sans);padding:4px}
.linkbtn2:hover{text-decoration:underline}
.inner{background:var(--card);border-radius:10px;box-shadow:var(--shadow-sm);padding:12px 14px}

/* team marks */
.tlogo{display:block;object-fit:contain;flex:none}
.tmono{display:inline-grid;place-items:center;flex:none;border-radius:50%;background:var(--tc);color:#fff;
  font-family:var(--cond);font-weight:800;letter-spacing:.02em;text-transform:uppercase;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}

/* current drive */
.cd-split{display:grid;grid-template-columns:1fr 1px 1fr;align-items:center;text-align:center;margin:2px 0 8px}
.cd-split > i{background:var(--line);height:46px}
.cd-lbl{font-size:13px;color:var(--muted)}
.cd-val{font:600 18px/1.3 var(--sans);color:var(--ink-2)}
.fieldbox svg{display:block;width:100%;height:auto}
.lp{margin-top:12px}
.lp-hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lp-title{font:600 17px/1.2 var(--sans);color:var(--ink-2)}
.pill{background:var(--pill);color:var(--ink-2);border-radius:4px;padding:5px 8px;font:500 12px/1 var(--sans);white-space:nowrap}
.lp-txt{color:var(--muted);font-size:14px;margin-top:6px}
.lp-txt s{opacity:.8}
.lp-sit{color:var(--muted);font-size:13px;margin-top:8px}

/* line score */
.tbl-wrap{overflow-x:auto}
.ls{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.ls th{font:500 14px var(--sans);color:var(--ink);padding:4px 8px 8px;text-align:center;border-bottom:1px solid var(--line)}
.ls td{padding:10px 8px;text-align:center;color:var(--muted)}
.ls td:first-child,.ls th:first-child{text-align:left;padding-left:0}
.ls td.tot{font-weight:700;color:var(--ink-2)}
.ls .tm{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-weight:500}

/* play-by-play */
.segctl{display:flex;background:var(--seg);border-radius:100px;padding:2px;margin:0 0 6px}
.segctl button{flex:1;border:0;background:none;border-radius:100px;padding:10px 8px;font:500 14px/1 var(--sans);color:var(--ink-2)}
.segctl button[aria-pressed="true"]{background:var(--card);box-shadow:0 0 8px rgba(0,0,0,.25)}
.qhd{font:700 15px/1 var(--cond);text-transform:uppercase;color:var(--ink-2);margin:16px 0 10px;letter-spacing:.01em}
.scard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:0 12px;align-items:center;margin-bottom:12px}
.sc-title{font:500 17px/1.25 var(--sans);color:var(--ink-2)}
.sc-time{font-size:14px;color:var(--muted)}
.sc-score{display:grid;grid-template-columns:repeat(2,46px);text-align:center}
.sc-score b{font:700 18px/1.3 var(--sans);color:var(--ink-2)}
.sc-score span{font-size:12.5px;color:var(--muted)}
.sc-desc{grid-column:1 / -1;color:var(--muted);font-size:14px;margin-top:8px}
.sc-drive{grid-column:1 / -1;color:var(--muted);font-size:13.5px;margin-top:6px}
.plays{display:flex;flex-direction:column}
.drivehd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 2px;padding:9px 10px;border-radius:8px;background:var(--surface);font-size:13px;color:var(--muted)}
.drivehd b{font:700 14px/1 var(--cond);text-transform:uppercase;color:var(--ink-2)}
.drivehd .res{font-weight:600;color:var(--ink-2)}
.pl{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:10px 6px;border:0;border-bottom:1px solid var(--line-2);
  background:none;text-align:left;width:100%;font-size:14px;color:var(--ink)}
.pl:hover,.pl.open{background:var(--surface)}
.pl-clk{font:600 14px/1.2 var(--sans);color:var(--ink-2);font-variant-numeric:tabular-nums}
.pl-no{display:block;font-size:11px;color:var(--muted)}
.pl-sit{font:600 12px/1.3 var(--sans);color:var(--muted);margin-bottom:2px}
.pl-txt s{color:var(--muted)}
.pl-act{display:flex;gap:8px;padding:0 6px 10px 78px;background:var(--surface);border-bottom:1px solid var(--line-2)}
.tags{display:inline-flex;gap:4px;margin-left:6px;vertical-align:1px;flex-wrap:wrap}
.tag{font:700 10.5px/1 var(--sans);text-transform:uppercase;letter-spacing:.04em;padding:3px 5px;border-radius:3px;white-space:nowrap}
.tag.score{background:var(--good);color:#fff}
.tag.fd{background:var(--good-wash);color:var(--good)}
.tag.to{background:var(--bad-wash);color:var(--bad)}
.tag.flag{background:var(--flag-wash);color:var(--flag-ink)}
.tag.info{background:var(--surface-2);color:var(--muted)}
.qsrc{font:600 11.5px/1.3 ui-monospace,"SF Mono",Menlo,Consolas,monospace;background:var(--surface-2);padding:1px 5px;border-radius:3px;color:var(--ink);margin-left:4px}

/* rail: leaders and team stats */
.ldr-cat{font:600 14px/1.2 var(--sans);color:var(--ink-2);margin:14px 0 8px}
.card-hd + .ldr-cat{margin-top:0}
.ldr-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ldr{display:grid;grid-template-columns:28px minmax(0,1fr) auto;grid-template-areas:"mark name big" "mark line big";gap:1px 8px;align-items:center;
  padding:8px;border-radius:8px;background:var(--surface);min-width:0}
.ldr-mark{grid-area:mark}
.ldr-name{grid-area:name;font:600 13px/1.2 var(--sans);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldr-line{grid-area:line;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldr-big{grid-area:big;font:800 21px/1 var(--cond);color:var(--ink-2)}
.ldr-empty{grid-template-areas:"mark name name"}
.cmp-teams{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font:700 14px/1 var(--cond);text-transform:uppercase;color:var(--ink-2)}
.cmp-teams span{display:inline-flex;align-items:center;gap:8px}
.cmp{padding:9px 0;border-bottom:1px solid var(--line-2)}
.cmp:last-of-type{border-bottom:0}
.cmp-top{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline}
.cmp-top b{font:600 15px/1.2 var(--sans);color:var(--ink-2);font-variant-numeric:tabular-nums}
.cmp-top span{text-align:center;color:var(--muted);font-size:13px}
.cmp-bar{display:flex;gap:3px;margin-top:6px;height:6px}
.cmp-bar i{display:block;border-radius:3px;min-width:3px}

/* box score and tables */
.bx2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:800px){.bx2{grid-template-columns:1fr}}
.bx-team{display:flex;align-items:center;gap:8px;font:600 14px/1.2 var(--sans);color:var(--ink-2);margin-bottom:6px}
table.st{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
table.st th{font:500 12px/1.2 var(--sans);color:var(--muted);text-align:right;padding:6px 7px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase}
table.st td{padding:8px 7px;text-align:right;border-bottom:1px solid var(--line-2);white-space:nowrap;color:var(--ink)}
table.st th:first-child,table.st td:first-child{text-align:left;padding-left:0}
table.st td:first-child{color:var(--ink-2);font-weight:500}
table.st tr:last-child td{border-bottom:0}

/* ---------- entry pad ---------- */
.pad{display:flex;flex-direction:column;gap:14px}
.pad-hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.pad-hd .sit{font:700 17px/1.1 var(--cond);text-transform:uppercase;color:var(--ink-2)}
.editing-bar{background:var(--flag-wash);color:var(--flag-ink);border-radius:6px;padding:7px 10px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.types{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.type{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 4px;font:700 14px/1 var(--cond);text-transform:uppercase;letter-spacing:.02em}
.type:hover{border-color:var(--muted)}
.type[aria-pressed="true"]{background:var(--ink-2);color:var(--card);border-color:var(--ink-2)}
.form{display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld > label,.fld > .eyebrow{display:block}
.inp{width:100%;height:44px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 10px;font:700 19px/1 var(--cond);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.inp:focus{border-color:var(--blue);background:var(--card);outline:none}
select.inp{font:500 15px/1 var(--sans)}
textarea.inp{height:auto;min-height:80px;padding:8px 10px;font:400 14.5px/1.4 var(--sans)}
.who{font-size:12px;color:var(--muted);min-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:4px}

<script>
/* ================================================================
   Engine. A game is its setup plus an ordered list of plays; every
   score, down, spot and stat is derived by replaying that list, so
   editing or deleting any play corrects everything after it.
   Positions are yards from the possessing team's own goal line.
   ================================================================ */
const NFHS = {kickFrom:40, safetyKickFrom:20, touchback:20, tryFrom:3, oobFreeKick:25, fgExtra:17};
const other = s => s === 'H' ? 'A' : 'H';
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const ord = n => n + (['th','st','nd','rd'][n] || 'th');
const fy = x => { const w = Math.floor(x), h = x - w >= .5; return h ? (w ? w + '½' : '½') : String(w); };

// NFHS penalty yardage. Only the four roughing fouls carry an automatic
// first down; illegal forward pass and intentional grounding lose the down.
const PENALTIES = [
  ['False start',5,'O'],['Encroachment',5,'D'],['Offside',5,'D'],['Delay of game',5,'E'],
  ['Illegal formation',5,'O'],['Illegal motion',5,'O'],['Illegal shift',5,'O'],['Illegal snap',5,'O'],
  ['Illegal substitution',5,'E'],['Too many players',5,'E'],['Ineligible downfield',5,'O'],
  ['Illegal forward pass',5,'O','l'],['Intentional grounding',5,'O','l'],['Running into the kicker',5,'D'],
  ['Free-kick infraction',5,'E'],['Invalid fair catch signal',5,'D'],
  ['Holding',10,'E'],['Illegal use of hands',10,'E'],['Illegal block in the back',10,'E'],
  ['Pass interference',15,'E'],['Kick-catch interference',15,'D'],['Facemask',15,'E'],['Horse-collar',15,'D'],
  ['Personal foul',15,'E'],['Unnecessary roughness',15,'E'],['Late hit',15,'E'],['Targeting',15,'E'],
  ['Clipping',15,'E'],['Chop block',15,'E'],['Illegal block below the waist',15,'E'],['Tripping',15,'E'],
  ['Head slap',15,'E'],['Illegal participation',15,'E'],['Unsportsmanlike conduct',15,'E'],
  ['Roughing the passer',15,'D','a'],['Roughing the kicker',15,'D','a'],
  ['Roughing the holder',15,'D','a'],['Roughing the snapper',15,'D','a'],['Other',5,'E']
].map(([name,y,s,f]) => ({name, y, s, a: f === 'a', l: f === 'l'}));

const TEAM_KEYS = 'fd fdR fdP fdX rushN rushY passC passA passY passTD passInt sk skY pen penY fum fumL pnt pntY pntTB pntBlk prN prY krN krY koN koY koTB intN intY d3a d3m d4a d4m plays top'.split(' ');
const PL_KEYS = 'pc pa py ptd pint plg psk pskY ru ry rtd rlg re rey retd relg tk ast tfl sk dint dintY fr ff pbu bk fum fgm fga fglg xpm xpa ko koy ktb pu puy pulg pi20 ptb kr kry krtd krlg pr pry prtd prlg tds two pts'.split(' ');
const zeros = keys => Object.fromEntries(keys.map(k => [k, 0]));

// 11-man plays NFHS on a 100-yard field. Kansas 8-man plays an 80-yard field
// (midfield at the 40) with its own kickoff and touchback spots. Any spot can be
// changed per game in Setup.
const FORMATS = {
  11: {len:100, kickFrom:40, tb:20, safety:20, ot:10},
  8:  {len:80,  kickFrom:30, tb:15, safety:15, ot:10}
};
function rulesOf(game){
  const s = (game && game.set) || {}, men = +s.men === 8 ? 8 : 11, f = FORMATS[men];
  const num = (v, d) => +v > 0 ? +v : d;
  return {men, len:f.len, kickFrom:num(s.kickFrom, f.kickFrom), tb:num(s.tb, f.tb), safety:num(s.safety, f.safety), ot:num(s.ot, f.ot)};
}

function replay(g, upto = g.plays.length){
  const RU = rulesOf(g), FL = RU.len, HALF = FL / 2;
  const T = g.teams, qSec = (g.set.qtr || 12) * 60, otSpot = FL - RU.ot;
  let st = {q:1, phase:'kick', kickKind:'kickoff', poss:g.set.firstKick || 'H', kickFrom:RU.kickFrom,
    spot:0, down:1, ltg:10, score:{A:0,H:0}, lines:{A:[0,0,0,0,0],H:[0,0,0,0,0]}, to:{A:3,H:3},
    ot:null, final:false, drive:null, fresh:false};
  let S = {team:{A:zeros(TEAM_KEYS), H:zeros(TEAM_KEYS)}, pl:{A:{}, H:{}}};
  let scoring = [], drives = [], clk = null, tags = [], curI = 0;   // curI: the play being replayed
  const log = [];

  const ab = s => T[s].abbr || s;
  const nm = (s, n) => {
    if (n === '' || n == null) return ab(s);
    if (n === 'team') return 'TEAM';
    const who = (T[s].roster || {})[n];
    return who ? `#${n} ${who.split(' ').slice(-1)[0]}` : `#${n}`;
  };
  const yl = (s, pos) => { pos = clamp(pos, 0, FL); if (pos === HALF) return String(HALF);
    return pos < HALF ? `${ab(s)} ${fy(pos)}` : `${ab(other(s))} ${fy(FL - pos)}`; };
  const yds = g => g > 0 ? `for ${fy(g)} yard${g === 1 ? '' : 's'}` : g < 0 ? `for a loss of ${fy(-g)}` : 'for no gain';
  const plural = (n, w) => `${fy(n)} ${w}${n === 1 ? '' : 's'}`;
  const pl = (s, n) => {
    if (n === '' || n == null) return null;
    const k = String(n);
    return S.pl[s][k] || (S.pl[s][k] = Object.assign({n:k}, zeros(PL_KEYS)));
  };
  const bump = (o, k, v = 1) => { if (o) o[k] += v; };
  const long = (o, k, v) => { if (o && v > o[k]) o[k] = v; };
  const list = a => (a || []).filter(x => x !== '' && x != null);
  const tackleTxt = (s, a) => { a = list(a); return a.length ? ` (${a.map(n => nm(s, n)).join(', ')})` : ''; };
  function tackles(s, a, gain){
    a = list(a);
    a.forEach(n => { const p = pl(s, n); if (a.length === 1) p.tk++; else p.ast++; if (gain < 0) p.tfl += 1 / a.length; });
  }

  function sit(){
    if (st.final) return 'Final';
    if (st.phase === 'kick') return `${st.kickKind === 'free' ? 'Free kick' : 'Kickoff'} · ${ab(st.poss)} from the ${yl(st.poss, st.kickFrom)}`;
    if (st.phase === 'try') return `Try · ${ab(st.poss)} at the ${yl(st.poss, st.spot)}`;
    return `${ab(st.poss)} · ${ord(st.down)} & ${st.ltg >= FL ? 'Goal' : fy(st.ltg - st.spot)} at ${yl(st.poss, st.spot)}`;
  }

  /* ---- series, possession, drives ---- */
  function newSeries(s, spot){
    st.poss = s; st.spot = spot; st.down = 1; st.ltg = Math.min(FL, spot + 10); st.phase = 'play'; st.fresh = true;
  }
  function kickoffBy(s, kind = 'kickoff'){
    st.phase = 'kick'; st.poss = s; st.kickKind = kind;
    st.kickFrom = kind === 'free' ? RU.safety : RU.kickFrom;
  }
  function driveTouch(){
    if (!st.drive || st.drive.team !== st.poss){
      closeDrive();
      st.drive = {team:st.poss, q:st.q, clk, start:st.spot, plays:0, last:st.spot, res:'', i0:curI};
    }
    st.drive.plays++;
  }
  function closeDrive(res, last){
    const d = st.drive; if (!d) return;
    if (last != null) d.last = last;
    d.res = res || d.res || '—'; d.endQ = st.q; d.endClk = clk; d.i1 = curI;
    if (d.clk != null && d.endClk != null && d.q <= 4 && d.endQ <= 4){
      d.time = Math.max(0, (d.endQ - d.q) * qSec + d.clk - d.endClk);
      S.team[d.team].top += d.time;
    }
    drives.push(d); st.drive = null;
  }
  function endGame(){ closeDrive(st.q > 4 ? 'End of OT' : 'End of game'); st.final = true; st.phase = 'final'; }

  /* ---- overtime (NFHS tiebreaker, Kansas plan: 10-yard line) ---- */
  function otSeries(s){ st.ot.cur = s; newSeries(s, otSpot); st.ltg = Math.min(FL, otSpot + 10); }
  function otEnd(){
    const o = st.ot; o.done[o.cur] = true;
    if (o.done.A && o.done.H){
      if (st.score.A !== st.score.H) return endGame();
      o.n++; st.q = 4 + o.n; o.first = other(o.first); o.done = {A:false, H:false}; st.to = {A:1, H:1};
      return otSeries(o.first);
    }
    otSeries(other(o.cur));
  }

  /* ---- scoring ---- */
  function score(s, pts, how, desc){
    st.score[s] += pts; st.lines[s][Math.min(st.q, 5) - 1] += pts;
    tags.push(['score', `${ab('A')} ${st.score.A} – ${ab('H')} ${st.score.H}`]);
    if (how === 'try'){
      const last = scoring[scoring.length - 1];
      if (last){ last.A = st.score.A; last.H = st.score.H; }
      return;
    }
    scoring.push({q:st.q, clk, side:s, how, desc, A:st.score.A, H:st.score.H, i:curI});
  }
  function amendTry(txt){ const last = scoring[scoring.length - 1]; if (last && last.how === 'TD') last.desc += ` (${txt})`; }
  function touchdown(s, desc, scorer){
    if (st.drive && st.drive.team === s) closeDrive('TD', FL); else closeDrive();
    if (scorer){ scorer.tds++; scorer.pts += 6; }
    score(s, 6, 'TD', desc);
    // A second overtime team that goes ahead wins without a try.
    if (st.ot && st.ot.done[other(s)] && st.score[s] > st.score[other(s)]) { st.ot.done[s] = true; endGame(); return ' TOUCHDOWN. Game over.'; }
    st.phase = 'try'; st.poss = s; st.spot = FL - NFHS.tryFrom; st.down = 1; st.ltg = FL;
    return ' TOUCHDOWN.';
  }
  function safety(defense){
    closeDrive('Safety', 0);
    score(defense, 2, 'Safety', `Safety`);
    if (st.ot) otEnd(); else kickoffBy(other(defense), 'free');
    return ' SAFETY.';
  }
  function afterTry(){ if (st.ot) otEnd(); else kickoffBy(st.poss); }

  // Offense keeps the ball and reaches `end`: touchdown, safety, first down, next down or turnover on downs.
  function progress(end, fdKind, tdDesc, scorer){
    const O = st.poss, D = other(O), t = S.team[O];
    if (end >= FL){ if (fdKind){ t.fd++; t['fd' + fdKind]++; } return touchdown(O, tdDesc, scorer); }
    if (end <= 0) return safety(D);
    if (end >= st.ltg){
      if (fdKind){ t.fd++; t['fd' + fdKind]++; }
      newSeries(O, end); tags.push(['fd', '1st down']); return ' First down.';
    }
    if (st.down >= 4){
      closeDrive('Downs', end); tags.push(['to', 'Downs']);
      if (st.ot) otEnd(); else newSeries(D, FL - end);
      return ' Turnover on downs.';
    }
    st.down++; st.spot = end; return '';
  }
  function conversion(end){
    const t = S.team[st.poss], made = end >= st.ltg;
    if (st.down === 3){ t.d3a++; if (made) t.d3m++; }
    if (st.down === 4){ t.d4a++; if (made) t.d4m++; }
  }

  // Carrier side `cs` loses a fumble at `pos` (cs frame).
  function fumbleLost(cs, cn, pos, f){
    const rs = other(cs);
    bump(pl(cs, cn), 'fum'); S.team[cs].fum++; S.team[cs].fumL++;
    bump(pl(rs, f.by), 'fr'); if (f.ff) bump(pl(rs, f.ff), 'ff');
    tags.push(['to', 'Fumble']);
    let txt = ` FUMBLE${f.ff ? ` forced by ${nm(rs, f.ff)}` : ''}, recovered by ${f.by ? nm(rs, f.by) : ab(rs)} at the ${yl(cs, pos)}`;
    if (st.drive && st.drive.team === cs) closeDrive('Fumble', pos);
    if (st.ot) { otEnd(); return txt + ' (ball dead).'; }
    const ry = +f.ry || 0, fin = FL - pos + ry;
    if (ry) txt += ry > 0 ? `, returned ${plural(ry, 'yard')}` : `, lost ${plural(-ry, 'yard')}`;
    if (fin >= FL) return txt + '.' + touchdown(rs, `${f.by ? nm(rs, f.by) : ab(rs)} fumble return`, pl(rs, f.by));
    if (fin <= 0){ newSeries(rs, RU.tb); return txt + '. Touchback.'; }
    newSeries(rs, fin); return txt + '.';
  }
  // The offense gets its own fumble back; a teammate's advance moves the ball but isn't the carrier's yardage.
  function fumbleKept(cs, cn, f, end){
    bump(pl(cs, cn), 'fum'); S.team[cs].fum++;
    const adv = end != null ? +f.ry || 0 : 0;
    return ` Fumble, recovered by ${f.by ? nm(cs, f.by) : ab(cs)}${adv ? `, ${adv > 0 ? 'advanced ' + plural(adv, 'yard') : 'lost ' + plural(-adv, 'yard')} to the ${yl(cs, clamp(end + adv, 0, FL))}` : ''}.`;
  }

  /* ---- penalties ---- */
  function enforce(pen){
    const off = pen.side === st.poss;
    let y = +pen.y || 0;
    const base = st.phase === 'kick' ? 'kickFrom' : 'spot';
    const room = off ? st[base] : FL - st[base];
    if (y > room / 2) y = room / 2;          // half the distance to the offender's goal
    st[base] += off ? -y : y;
    return y;
  }
  function penalize(pen, seriesNew){
    const side = pen.side, offFoul = side === st.poss;
    const from = st.phase === 'kick' ? st.kickFrom : st.spot;
    const full = +pen.y || 0, y = enforce(pen);
    S.team[side].pen++; S.team[side].penY += y;
    tags.push(['flag', 'Flag']);
    let txt = `PENALTY ${ab(side)} ${pen.name}${pen.n ? ` (${nm(side, pen.n)})` : ''}, ${plural(y, 'yard')}${y < full ? ' (half the distance)' : ''}`;
    if (st.phase === 'kick') return txt + `. Kick from the ${yl(st.poss, st.kickFrom)}.`;
    if (st.phase === 'try') return txt + `. Try from the ${yl(st.poss, st.spot)}.`;
    if (st.phase !== 'play') return txt + '.';
    txt += `, from the ${yl(st.poss, from)}`;
    if (seriesNew){ newSeries(st.poss, st.spot); return txt + '.'; }
    if (!offFoul && (pen.a || st.spot >= st.ltg)){
      S.team[st.poss].fd++; S.team[st.poss].fdX++;
      newSeries(st.poss, st.spot); tags.push(['fd', '1st down']);
      return txt + `${pen.a ? ', automatic first down' : ''}. First down.`;
    }
    if (offFoul && pen.l){
      txt += ', loss of down';
      if (st.down >= 4){
        closeDrive('Downs', st.spot); tags.push(['to', 'Downs']);
        if (st.ot) otEnd(); else newSeries(other(st.poss), FL - st.spot);
        return txt + '. Turnover on downs.';
      }
      st.down++;
    }
    return txt + '.';
  }

  /* ---- plays ---- */
  function run(p){
    const O = st.poss, D = other(O), t = S.team[O], r = pl(O, p.r);
    const g = clamp(+p.y || 0, -st.spot, FL - st.spot), end = st.spot + g, td = end >= FL;
    if (st.phase === 'try') return twoPoint(p, end >= FL, `${nm(O, p.r)} rush`);
    driveTouch(); t.plays++;
    t.rushN++; t.rushY += g; bump(r, 'ru'); bump(r, 'ry', g); long(r, 'rlg', g);
    tackles(D, p.tk, g); conversion(end);
    let txt = td ? `${nm(O, p.r)} ${fy(g)}-yard rush` : `${nm(O, p.r)} rush ${yds(g)} to the ${yl(O, end)}${tackleTxt(D, p.tk)}.`;
    if (p.fum){
      if (p.fum.lost) return txt + fumbleLost(O, p.r, end, p.fum);
      txt += fumbleKept(O, p.r, p.fum, end);
      if (+p.fum.ry) return txt + progress(clamp(end + +p.fum.ry, 0, FL), 'R');
    }
    if (td){ bump(r, 'rtd'); return txt + '.' + progress(end, 'R', `${nm(O, p.r)} ${fy(g)}-yard run`, r); }
    return txt + progress(end, 'R');
  }

  function pass(p){
    const O = st.poss, D = other(O), t = S.team[O], qb = pl(O, p.qb);
    if (st.phase === 'try'){
      const g = p.res === 'c' ? +p.y || 0 : -1;
      return twoPoint(p, p.res === 'c' && st.spot + g >= FL, `${nm(O, p.qb)} pass to ${nm(O, p.to)}`);
    }
    driveTouch(); t.plays++;
    if (p.res === 's'){
      const g = -clamp(+p.sy || 0, 0, st.spot), end = st.spot + g, by = list(p.by);
      t.sk++; t.skY -= g; t.rushN++; t.rushY += g;
      bump(qb, 'psk'); bump(qb, 'pskY', -g); bump(qb, 'ru'); bump(qb, 'ry', g);
      by.forEach(n => { const d = pl(D, n); d.sk += 1 / by.length; });
      tackles(D, by, g); conversion(end);
      let txt = `${nm(O, p.qb)} sacked${by.length ? ` by ${by.map(n => nm(D, n)).join(' and ')}` : ''} ${yds(g)} to the ${yl(O, end)}.`;
      if (p.fum){ if (p.fum.lost) return txt + fumbleLost(O, p.qb, end, p.fum); txt += fumbleKept(O, p.qb, p.fum, end); if (+p.fum.ry) return txt + progress(clamp(end + +p.fum.ry, 0, FL), null); }
      return txt + progress(end, null);
    }
    t.passA++; bump(qb, 'pa');
    if (p.res === 'i'){
      conversion(st.spot);
      if (p.pbu) bump(pl(D, p.pbu), 'pbu');
      return `${nm(O, p.qb)} pass incomplete${p.to ? `, intended for ${nm(O, p.to)}` : ''}${p.pbu ? ` (broken up by ${nm(D, p.pbu)})` : ''}.` + progress(st.spot, null);
    }
    if (p.res === 'x'){
      conversion(st.spot);
      t.passInt++; bump(qb, 'pint');
      const dp = pl(D, p.ib), at = clamp(st.spot + (+p.at || 0), 0, (FL + 10)), ry = st.ot ? 0 : (+p.ry || 0);
      bump(dp, 'dint'); bump(dp, 'dintY', ry); S.team[D].intN++; S.team[D].intY += ry;
      tags.push(['to', 'INT']);
      let txt = `${nm(O, p.qb)} pass intercepted by ${p.ib ? nm(D, p.ib) : ab(D)} at the ${at >= FL ? `${ab(D)} end zone` : yl(O, at)}`;
      closeDrive('INT', st.spot);
      if (st.ot){ otEnd(); return txt + ' (ball dead).'; }
      const fin = FL - at + ry;
      if (ry) txt += `, returned ${plural(ry, 'yard')}`;
      if (fin >= FL) return txt + '.' + touchdown(D, `${p.ib ? nm(D, p.ib) : ab(D)} interception return`, dp);
      if (fin <= 0){ newSeries(D, RU.tb); return txt + '. Touchback.'; }
      newSeries(D, fin); return txt + (ry ? ` to the ${yl(D, fin)}.` : '.');
    }
    // complete
    const rec = pl(O, p.to), g = clamp(+p.y || 0, -st.spot, FL - st.spot), end = st.spot + g, td = end >= FL;
    t.passC++; t.passY += g; bump(qb, 'pc'); bump(qb, 'py', g); long(qb, 'plg', g);
    bump(rec, 're'); bump(rec, 'rey', g); long(rec, 'relg', g);
    tackles(D, p.tk, g); conversion(end);
    let txt = td ? `${nm(O, p.qb)} ${fy(g)}-yard pass to ${nm(O, p.to)}`
                 : `${nm(O, p.qb)} pass complete to ${nm(O, p.to)} ${yds(g)} to the ${yl(O, end)}${tackleTxt(D, p.tk)}.`;
    if (p.fum){ if (p.fum.lost) return txt + fumbleLost(O, p.to, end, p.fum); txt += fumbleKept(O, p.to, p.fum, end); if (+p.fum.ry) return txt + progress(clamp(end + +p.fum.ry, 0, FL), 'P'); }
    if (td){ t.passTD++; bump(qb, 'ptd'); bump(rec, 'retd');
      return txt + '.' + progress(end, 'P', `${nm(O, p.to)} ${fy(g)}-yard pass from ${nm(O, p.qb)}`, rec); }
    return txt + progress(end, 'P');
  }

  // A kicked ball the receiving team R fields at `at` (R frame) and returns.
  function kickReturn(R, kind, p, at){
    const K = other(R), ret = pl(R, p.ret), ry = +p.ry || 0, fin = at + ry;
    const k1 = kind === 'kr' ? 'kr' : 'pr';
    bump(ret, k1); bump(ret, k1 + 'y', ry); long(ret, k1 + 'lg', ry);
    S.team[R][k1 === 'kr' ? 'krN' : 'prN']++; S.team[R][k1 === 'kr' ? 'krY' : 'prY'] += ry;
    tackles(K, p.tk, 1);
    let txt = `, ${nm(R, p.ret)} returns ${plural(ry, 'yard')}`;
    if (p.fum && p.fum.lost) return {txt: txt + fumbleLost(R, p.ret, clamp(fin, 1, (FL - 1)), p.fum), fin};
    if (fin >= FL){ bump(ret, k1 + 'td'); return {txt: txt + '.' + touchdown(R, `${nm(R, p.ret)} ${fy(ry)}-yard ${kind === 'kr' ? 'kickoff' : 'punt'} return`, ret), fin}; }
    if (fin <= 0){ newSeries(R, RU.tb); return {txt: txt + ', downed in the end zone. Touchback.', fin:RU.tb}; }
    if (p.fum) txt += `,${fumbleKept(R, p.ret, p.fum).slice(1, -1)}`;
    newSeries(R, fin); return {txt: txt + ` to the ${yl(R, fin)}${tackleTxt(K, p.tk)}.`, fin};
  }

  function kickoff(p){
    const K = st.poss, R = other(K), kf = st.kickFrom, k = pl(K, p.k), tk = S.team[K];
    // A kickoff typed with no distance ("ko") takes it from the spot typed next.
    const unknown = p.d == null && !['tb', 'oob', 'onside'].includes(p.res);
    let d = +p.d || 0;
    if (p.res === 'tb' && !d) d = FL - kf;
    bump(k, 'ko'); tk.koN++;
    if (!unknown && p.res !== 'oob'){ bump(k, 'koy', d); tk.koY += d; }
    const what = st.kickKind === 'free' ? 'free kick' : 'kickoff';
    let txt = unknown || (p.res === 'oob' && !p.d) ? `${nm(K, p.k)} ${what}` : `${nm(K, p.k)} ${what} ${plural(d, 'yard')}`;
    if (p.bs != null){ newSeries(R, clamp(+p.bs, 1, (FL - 1))); return `${nm(K, p.k)} ${what}. ${ab(R)} ball at the ${yl(R, st.spot)}.`; }
    if (unknown){ newSeries(R, FL - kf); return txt + '.'; }
    const at = FL - (kf + d);
    switch (p.res){
      case 'spot': {
        const s = at <= 0 ? RU.tb : at; newSeries(R, s);
        return txt + (at <= 0 ? ', into the end zone. Touchback.' : ` to the ${yl(R, s)}.`);
      }
      case 'tb': bump(k, 'ktb'); tk.koTB++; newSeries(R, RU.tb); return txt + `, touchback. ${ab(R)} ball at the ${yl(R, RU.tb)}.`;
      case 'oob': { const s = FL - (kf + NFHS.oobFreeKick); newSeries(R, s); return txt + `, out of bounds. ${ab(R)} ball at the ${yl(R, s)}.`; }
      case 'onside': { const s = kf + d; bump(pl(K, p.ret), 'fr'); newSeries(K, s); tags.push(['to', 'Onside']);
        return txt + `, onside, recovered by ${p.ret ? nm(K, p.ret) : ab(K)} at the ${yl(K, s)}.`; }
      case 'fc': case 'down': {
        const s = at <= 0 ? RU.tb : at; newSeries(R, s);
        return txt + (at <= 0 ? ', downed in the end zone. Touchback.' : p.res === 'fc' ? `, fair catch by ${nm(R, p.ret)} at the ${yl(R, s)}.` : `, downed at the ${yl(R, s)}.`);
      }
      default: return txt + ` to the ${at <= 0 ? `${ab(R)} end zone` : yl(R, at)}` + kickReturn(R, 'kr', p, at).txt;
    }
  }

  function punt(p){
    const O = st.poss, R = other(O), t = S.team[O], k = pl(O, p.k);
    driveTouch(); t.plays++; t.pnt++; bump(k, 'pu');
    closeDrive('Punt', st.spot);
    if (p.res === 'blk'){
      t.pntBlk++; bump(pl(R, p.by), 'bk'); tags.push(['to', 'Blocked']);
      const at = clamp(FL - (st.spot - (+p.b || 0)), 1, FL), ry = +p.ry || 0, fin = at + ry;
      let txt = `${nm(O, p.k)} punt BLOCKED${p.by ? ` by ${nm(R, p.by)}` : ''}, recovered by ${p.ret ? nm(R, p.ret) : ab(R)} at the ${yl(R, at)}`;
      if (ry) txt += `, returned ${plural(ry, 'yard')}`;
      if (fin >= FL) return txt + '.' + touchdown(R, `${p.ret ? nm(R, p.ret) : ab(R)} blocked punt return`, pl(R, p.ret));
      newSeries(R, fin); return txt + '.';
    }
    const unknown = p.d == null && p.res !== 'tb';
    let d = +p.d || 0;
    if (p.res === 'tb') d = FL - st.spot;
    if (unknown){ newSeries(R, FL - st.spot); return `${nm(O, p.k)} punt.`; }
    bump(k, 'puy', d); long(k, 'pulg', d); t.pntY += d;
    const at = FL - (st.spot + d);
    let txt = `${nm(O, p.k)} punt ${plural(d, 'yard')}`;
    if (p.res === 'tb' || at <= 0){ bump(k, 'ptb'); t.pntTB++; newSeries(R, RU.tb); return txt + `, touchback. ${ab(R)} ball at the ${yl(R, RU.tb)}.`; }
    if (p.res === 'ret'){
      const r = kickReturn(R, 'pr', p, at);
      if (r.fin < 20) bump(k, 'pi20');
      return txt + ` to the ${yl(R, at)}` + r.txt;
    }
    if (at < 20) bump(k, 'pi20');
    newSeries(R, at);
    return txt + ` to the ${yl(R, at)}` + ({fc:`, fair catch by ${nm(R, p.ret)}.`, down:', downed.', oob:', out of bounds.'}[p.res] || '.');
  }

  function fieldGoal(p){
    const O = st.poss, D = other(O), t = S.team[O], k = pl(O, p.k);
    const dist = +p.d || Math.round(FL - st.spot + NFHS.fgExtra);
    driveTouch(); t.plays++; bump(k, 'fga');
    if (p.res === 'good'){
      bump(k, 'fgm'); long(k, 'fglg', dist); if (k) k.pts += 3;
      closeDrive('FG', st.spot);
      score(O, 3, 'FG', `${nm(O, p.k)} ${dist}-yard field goal`);
      if (st.ot) otEnd(); else kickoffBy(O);
      return `${nm(O, p.k)} ${dist}-yard field goal is GOOD.`;
    }
    if (p.res === 'blk'){
      bump(pl(D, p.by), 'bk'); tags.push(['to', 'Blocked']);
      closeDrive('Blocked FG', st.spot);
      let txt = `${nm(O, p.k)} ${dist}-yard field goal BLOCKED${p.by ? ` by ${nm(D, p.by)}` : ''}`;
      if (st.ot){ otEnd(); return txt + '.'; }
      const at = clamp(FL - (st.spot - (+p.b || 0)), 1, FL), ry = +p.ry || 0, fin = at + ry;
      txt += `, recovered by ${p.ret ? nm(D, p.ret) : ab(D)} at the ${yl(D, at)}`;
      if (ry) txt += `, returned ${plural(ry, 'yard')}`;
      if (fin >= FL) return txt + '.' + touchdown(D, `${p.ret ? nm(D, p.ret) : ab(D)} blocked field goal return`, pl(D, p.ret));
      newSeries(D, fin); return txt + '.';
    }
    closeDrive('Missed FG', st.spot);
    if (st.ot){ otEnd(); return `${nm(O, p.k)} ${dist}-yard field goal is NO GOOD.`; }
    // NFHS: a missed field goal into the end zone is a touchback — no "spot of the kick" rule.
    newSeries(D, RU.tb);
    return `${nm(O, p.k)} ${dist}-yard field goal is NO GOOD. Touchback, ${ab(D)} ball at the ${yl(D, RU.tb)}.`;
  }

  function twoPoint(p, good, what){
    const O = st.poss, scorer = pl(O, p.res === 'c' ? p.to : p.r);
    if (good){ bump(scorer, 'two'); bump(scorer, 'pts', 2); score(O, 2, 'try'); amendTry(what); }
    else amendTry(`${p.t === 'pass' ? 'pass' : 'run'} failed`);
    const txt = `Two-point try: ${what} is ${good ? 'GOOD' : 'NO GOOD'}.`;
    afterTry(); return txt;
  }
  function tryPlay(p){
    const O = st.poss;
    if (p.kind === 'kick'){
      const k = pl(O, p.k); bump(k, 'xpa');
      const good = p.res === 'good';
      if (good){ bump(k, 'xpm'); bump(k, 'pts', 1); score(O, 1, 'try'); amendTry(`${nm(O, p.k)} kick`); }
      else amendTry(p.res === 'blk' ? 'kick blocked' : 'kick failed');
      const txt = `${nm(O, p.k)} kick is ${good ? 'GOOD' : p.res === 'blk' ? 'BLOCKED' : 'NO GOOD'}.`;
      afterTry(); return txt;
    }
    const good = p.res === 'good';
    if (p.kind === 'pass') return twoPoint({t:'pass', res:'c', to:p.to}, good, `${nm(O, p.qb)} pass to ${nm(O, p.to)}`);
    return twoPoint({t:'run', r:p.r}, good, `${nm(O, p.r)} rush`);
  }

  function endPeriod(p){
    const q = st.q;
    if (q === 1 || q === 3){ st.q++; return `End of the ${ord(q)} quarter.`; }
    if (q === 2){
      closeDrive('Half'); st.q = 3; st.to = {A:3, H:3};
      kickoffBy(p.kick || other(g.set.firstKick || 'H'));
      return `End of the 1st half. ${ab(st.poss)} kicks off to open the 2nd half.`;
    }
    if (q === 4){
      if (st.score.A === st.score.H){
        closeDrive('End of regulation');
        st.q = 5; st.to = {A:1, H:1};
        st.ot = {n:1, first:p.first || 'A', cur:null, done:{A:false, H:false}};
        otSeries(st.ot.first);
        return `End of regulation, tied ${st.score.A}–${st.score.H}. Overtime: ${ab(st.ot.first)} ball first at the ${yl(st.ot.first, otSpot)}.`;
      }
      endGame(); return 'End of the 4th quarter.';
    }
    return '';
  }

  const PLAY = {run:1, pass:1, punt:1, ko:1, fg:1};
  function core(p){
    switch (p.t){
      case 'run': return run(p);
      case 'pass': return pass(p);
      case 'punt': return punt(p);
      case 'ko': return kickoff(p);
      case 'fg': return fieldGoal(p);
      case 'try': return tryPlay(p);
      case 'pen': return p.pen.enf === 'off' ? (tags.push(['flag', 'Flag']), `Offsetting penalties${p.pen.name ? ` (${p.pen.name})` : ''}. Replay the down.`) : penalize(p.pen, false);
      case 'to': st.to[p.side] = Math.max(0, st.to[p.side] - 1); tags.push(['info', 'Timeout']);
        return `Timeout ${T[p.side].name || ab(p.side)} (${st.to[p.side]} left).`;
      case 'note': tags.push(['info', 'Note']); return p.text || '';
      case 'set': {   // "N ball at N35 1-10": the scorer states the situation outright
        if (st.drive && st.drive.team !== p.poss) closeDrive();
        st.poss = p.poss; st.spot = clamp(+p.spot, 0.5, (FL - .5)); st.down = clamp(+p.down || 1, 1, 4);
        st.ltg = p.goal ? FL : Math.min(FL, st.spot + (+p.togo || 10)); st.phase = 'play'; st.fresh = true;
        if (st.ot) st.ot.cur = p.poss;
        tags.push(['info', 'Spot']);
        return `${ab(p.poss)} ball, ${ord(st.down)} & ${st.ltg >= FL ? 'Goal' : fy(st.ltg - st.spot)} at the ${yl(p.poss, st.spot)}.`;
      }
      case 'endq': return endPeriod(p);
      case 'final': endGame(); return 'Game ended.';
    }
    return '';
  }
  // Describe a play on a throwaway copy, for flags that wipe it out.
  function dry(p){
    const keep = [st, S, scoring, drives, tags];
    st = structuredClone(st); S = {team:{A:zeros(TEAM_KEYS), H:zeros(TEAM_KEYS)}, pl:{A:{}, H:{}}};
    scoring = []; drives = []; tags = [];
    let t = '';
    try { t = core({...p, pen:null}); } finally { [st, S, scoring, drives, tags] = keep; }
    return t;
  }
  function apply(p){
    clk = p.clk ?? null; tags = [];
    const pen = p.pen && PLAY[p.t] ? p.pen : null;
    if (pen && (pen.enf === 'prev' || pen.enf === 'off')){
      const wiped = dry(p);
      if (pen.enf === 'off'){ tags.push(['flag', 'Flag']); return {text:'Offsetting penalties. Replay the down.', wiped}; }
      return {text:'No play. ' + penalize(pen, false), wiped};
    }
    st.fresh = false;
    const beforePoss = st.poss;
    let text = core(p);
    if (pen && pen.enf === 'end') text += ' ' + penalize(pen, st.fresh || st.poss !== beforePoss);
    else if (pen && pen.enf === 'dec'){ text += ` Penalty ${ab(pen.side)} ${pen.name}, declined.`; tags.push(['flag', 'Declined']); }
    if (st.drive && st.drive.team === st.poss && st.phase === 'play') st.drive.last = st.spot;
    return {text};
  }

  for (let i = 0; i < upto && i < g.plays.length; i++){
    let p = g.plays[i];
    // A punt typed without a distance takes it from the spot typed next ("S ball at S10").
    if (p.t === 'punt' && p.d == null && p.res !== 'tb' && p.res !== 'blk' && st.phase === 'play'){
      const nx = g.plays[i + 1];
      if (nx && nx.t === 'set' && nx.poss === other(st.poss)) p = {...p, d:Math.max(0, FL - nx.spot - st.spot + (+p.ry || 0))};
    }
    // "punt to I25" then "I ball at I35": the difference is the return.
    else if (p.t === 'punt' && p.d != null && (p.res === 'spot' || (p.res === 'ret' && p.ry == null)) && st.phase === 'play'){
      const nx = g.plays[i + 1];
      if (nx && nx.t === 'set' && nx.poss === other(st.poss)){
        const ry = nx.spot - (FL - (st.spot + p.d));
        if (ry > 0) p = {...p, res:'ret', ry};
      }
    }
    if (p.t === 'ko' && p.d == null && !['tb', 'oob', 'onside'].includes(p.res) && st.phase === 'kick'){
      const nx = g.plays[i + 1];
      if (nx && nx.t === 'set' && nx.poss === other(st.poss)) p = {...p, d:Math.max(0, FL - st.kickFrom - nx.spot + (+p.ry || 0))};
    }
    curI = i;
    const pre = {sit: sit(), q: st.q, poss: st.poss};
    const r = apply(p);
    log.push({i, q:pre.q, clk:p.clk, sit:pre.sit, poss:pre.poss, t:p.t, text:r.text, wiped:r.wiped, tags, src:p.q, A:st.score.A, H:st.score.H});
  }
  const open = st.drive ? [{...st.drive, res:'In progress', open:true}] : [];
  return {st, S, log, scoring, drives:drives.concat(open), sit:sit(), yl, nm, ab, FL, RU};
}
/* ================================================================
   UI: scoreboard, field, and the play-entry pad.
   ================================================================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STORE = 'pressbox.v1';
let db = {cur:null, games:{}}, g = null, R = null;
const ui = {type:null, draft:null, editing:null, ctx:null, tab:'gamecast', pbp:null, side:'A', open:null, confirm:null, ask:null,
  mode:(() => { try { return localStorage.getItem('pressbox.mode') || 'quick'; } catch (e) { return 'quick'; } })(),
  qtext:'', qedit:false, cheat:false};

const ab = s => g.teams[s].abbr || s;

/* ---------- game strip (scoreboard) ---------- */

        <div class="st-tos" title="${st.to[s]} timeout${st.to[s] === 1 ? '' : 's'} left">${dots(s)}</div></div></div>`;
  };
  const clockOn = !st.final && st.q <= 4;
  const per = st.final ? `Final${st.q > 4 ? '/OT' : ''}` : perShort(st.q);
  const go = g.clk.run

    else if (st.phase === 'kick'){ l2 = st.kickKind === 'free' ? 'Free kick' : 'Kickoff'; l3 = `${ab(st.poss)} from the ${R.yl(st.poss, st.kickFrom)}`; }

// The thin bar under the strip on phones: where the ball is, the line to gain, and this drive so far.
function driveBar(){
  const st = R.st; if (st.final || st.phase !== 'play') return '';
  const FL = R.FL, s = st.poss, X = pos => (s === 'A' ? pos : FL - pos) / FL * 100, d = openDrive();
  let ticks = ''; for (let y = 10; y < FL; y += 10) ticks += `<i class="dbar-tick" style="left:${y / FL * 100}%"></i>`;
  const from = d && d.team === s ? X(d.start) : X(st.spot), to = X(st.spot), lo = Math.min(from, to), hi = Math.max(from, to);

  return `<div class="dbar"><div class="dbar-track">${ticks}${ltg}<i class="dbar-line" style="left:${lo}%;width:${hi - lo}%"></i><i class="dbar-head ${s === 'A' ? 'r' : 'l'}" style="left:${to}%"></i></div><div class="dbar-lbl">${lbl}</div></div>`;

/* ---------- field: the light gamecast field, end zones in team colors ---------- */
function renderField(){
  const box = $('#field'); if (!box || !R) return;
  const st = R.st, T = g.teams, FL = R.FL, HALF = FL / 2;
  const W = 1200, H = 206, k = W / (FL + 20), X = y => (10 + y) * k, EZ = 10 * k;
  const top = 26, bot = 170, mid = (top + bot) / 2;
  const abs = (side, pos) => side === 'A' ? pos : FL - pos;   // yards from the visitors' goal (left)
  const cond = "'Roboto Condensed','Arial Narrow',sans-serif", sans = "-apple-system,system-ui,Roboto,Arial,sans-serif";
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Field position">`;
  for (let i = 0; i < FL / 10; i++) s += `<rect x="${X(i * 10)}" y="${top}" width="${10 * k}" height="${bot - top}" style="fill:var(${i % 2 ? '--fld-b' : '--fld-a'})"/>`;
  for (let y = 5; y < FL; y += 5) s += `<line x1="${X(y)}" y1="${top}" x2="${X(y)}" y2="${bot}" style="stroke:var(--fld-line);stroke-width:${y === HALF ? 3 : y % 10 === 0 ? 1.6 : .8}"/>`;
  const ez = (side, x, rot) => {
    const name = String(T[side].name || T[side].abbr).toUpperCase(), fs = Math.min(34, Math.max(15, 2.2 * (bot - top) / Math.max(4, name.length)));
    return `<rect x="${x}" y="${top}" width="${EZ}" height="${bot - top}" style="fill:${esc(T[side].color)}"/>`
      + `<text x="${x + EZ / 2}" y="${mid}" transform="rotate(${rot} ${x + EZ / 2} ${mid})" text-anchor="middle" dominant-baseline="central" style="fill:#fff;font:800 ${Math.round(fs)}px ${cond};letter-spacing:1px">${esc(name)}</text>`;
  };
  s += ez('A', 0, -90) + ez('H', W - EZ, 90);
  s += `<path d="M3 ${mid - 36} v72 M${W - 3} ${mid - 36} v72" style="stroke:var(--ltg);stroke-width:5;stroke-linecap:round"/>`;
  const lbl = (x, t) => `<text x="${x}" y="${H - 8}" text-anchor="middle" style="fill:var(--fld-num);font:500 19px ${sans}">${esc(t)}</text>`;
  s += lbl(X(0), T.A.abbr) + lbl(X(FL), T.H.abbr);
  for (let y = 10; y < FL; y += 10) s += lbl(X(y), y <= HALF ? y : FL - y);
  if (!st.final){
    const side = st.poss, pos = st.phase === 'kick' ? st.kickFrom : st.spot, bx = X(abs(side, pos)), dir = side === 'A' ? 1 : -1, d = openDrive();
    if (st.phase === 'play' && st.ltg < FL) s += `<line x1="${X(abs(side, st.ltg))}" y1="${top}" x2="${X(abs(side, st.ltg))}" y2="${bot}" style="stroke:var(--ltg);stroke-width:5"/>`;
    if (st.phase === 'play' && d && d.team === side && Math.abs(d.start - pos) > .5){
      const sx = X(abs(side, d.start)), ly = mid + 30;
      s += `<line x1="${sx}" y1="${ly}" x2="${bx - dir * 14}" y2="${ly}" style="stroke:var(--drive);stroke-width:4"/>`;
      s += `<path d="M${bx} ${ly} l${-dir * 16} -9 v18 z" style="fill:var(--drive)"/>`;
    }
    // The pin over the ball, carrying the team's mark.
    const cy = mid - 18, url = logoUrl(T[side]);
    s += `<path d="M${bx} ${cy + 44} L${bx - 13.3} ${cy + 20} A24 24 0 1 1 ${bx + 13.3} ${cy + 20} Z" style="fill:var(--card);stroke:var(--drive);stroke-width:2"/>`;
    s += url ? `<image href="${esc(url)}" x="${bx - 17}" y="${cy - 17}" width="34" height="34" preserveAspectRatio="xMidYMid meet"/>`
      : `<circle cx="${bx}" cy="${cy}" r="17" style="fill:${esc(T[side].color)}"/><text x="${bx}" y="${cy}" text-anchor="middle" dominant-baseline="central" style="fill:#fff;font:800 13px ${cond}">${esc(String(T[side].abbr).slice(0, 4))}</text>`;
  }
  box.innerHTML = s + '</svg>';
}

/* ---------- pad: drafts ---------- */
const TYPE_LABEL = {run:'Run', pass:'Pass', punt:'Punt', fg:'Field goal', ko:'Kickoff', try:'Try', pen:'Penalty', to:'Timeout', note:'Note'};
function typesFor(st){
  if (st.final) return [];
  if (st.phase === 'kick') return ['ko', 'pen', 'to', 'note'];
  if (st.phase === 'try') return ['try', 'pen', 'to', 'note'];
  return ['run', 'pass', 'punt', 'fg', 'pen', 'to', 'note'];
}
const ROLE = {rush:p => p.ru, qb:p => p.pa + p.psk, rec:p => p.re, kick:p => p.ko + p.fga + p.xpa, punt:p => p.pu,
  ret:p => p.kr + p.pr, def:p => p.tk + p.ast + p.sk + p.dint + p.pbu};
function recent(side, role){
  const f = ROLE[role]; if (!f) return [];
  return Object.values(ui.ctx.S.pl[side]).filter(p => p.n !== 'team' && f(p) > 0).sort((a, b) => f(b) - f(a)).slice(0, 5).map(p => p.n);
}
const first = (side, role) => recent(side, role)[0] || '';
function penBlank(side, enf){ return {side, name:'Holding', y:10, a:false, l:false, n:'', enf}; }
function blank(t, st){
  const O = st.poss, D = other(O);
  const fum = {lost:'lost', by:'', ff:'', ry:''};
  const base = {t, fumOn:false, fum, penOn:false, pen:penBlank(D, 'prev')};
  switch (t){
    case 'run': return {...base, r:'', y:'', yn:'gain', tk:['', '']};
    case 'pass': return {...base, qb:first(O, 'qb'), res:'c', to:'', y:'', yn:'gain', tk:['', ''], pbu:'', ib:'', at:'', ry:'', by:['', ''], sy:''};
    case 'punt': return {...base, k:first(O, 'punt'), d:'', res:'ret', ret:'', ry:'', tk:['', ''], by:'', b:''};
    case 'ko': return {...base, k:first(O, 'kick'), d:'', res:'ret', ret:'', ry:'', tk:['', '']};
    case 'fg': return {...base, k:first(O, 'kick'), d:'', res:'good', by:'', b:'', ret:'', ry:''};
    case 'try': return {t, kind:'kick', res:'good', k:first(O, 'kick'), r:'', qb:first(O, 'qb'), to:''};
    case 'pen': return {t, pen:penBlank(O, 'acc')};
    case 'note': return {t, text:''};
    default: return {t};
  }
}
function toDraft(p, st){
  const d = blank(p.t, st), str = v => v == null ? '' : String(v);
  for (const k of Object.keys(p)){
    if (k === 'fum'){ d.fumOn = true; d.fum = {lost:p.fum.lost ? 'lost' : 'kept', by:str(p.fum.by), ff:str(p.fum.ff), ry:str(p.fum.ry || '')}; }
    else if (k === 'pen'){ d.pen = {...p.pen, n:str(p.pen.n)}; if (p.t !== 'pen') d.penOn = true; }
    else if (k === 'y'){ d.y = p.y ? String(Math.abs(p.y)) : ''; d.yn = p.y < 0 ? 'loss' : 'gain'; }
    else if (k === 'tk' || k === 'by' && Array.isArray(p.by)){ const a = p[k].map(String); d[k] = [a[0] || '', a[1] || '']; }
    else if (k !== 'clk') d[k] = str(p[k]);
  }
  if (p.d === 0 && p.t !== 'fg') d.d = '';
  d.clkTxt = p.clk != null ? mmss(p.clk) : '';
  return d;
}
function cleanPen(x){ return {side:x.side, name:x.name, y:Number(x.y) || 0, a:!!x.a, l:!!x.l, n:String(x.n || '').replace(/\D/g, '') || undefined, enf:x.enf}; }
function buildPlay(d){
  const n = v => v === '' || v == null ? undefined : Number(String(v).replace(/[^\d.]/g, '')) || 0;
  const j = v => String(v ?? '').replace(/\D/g, '') || undefined;
  const js = a => (a || []).map(j).filter(Boolean);
  const yy = () => (d.yn === 'loss' ? -1 : 1) * (n(d.y) || 0);
  const p = {t:d.t};
  switch (d.t){
    case 'run': Object.assign(p, {r:j(d.r), y:yy(), tk:js(d.tk)}); break;
    case 'pass':
      Object.assign(p, {qb:j(d.qb), res:d.res});
      if (d.res === 'c') Object.assign(p, {to:j(d.to), y:yy(), tk:js(d.tk)});
      if (d.res === 'i') Object.assign(p, {to:j(d.to), pbu:j(d.pbu)});
      if (d.res === 'x') Object.assign(p, {ib:j(d.ib), at:n(d.at) || 0, ry:n(d.ry) || 0});
      if (d.res === 's') Object.assign(p, {by:js(d.by), sy:n(d.sy) || 0});
      break;
    case 'punt':
      Object.assign(p, {k:j(d.k), d:n(d.d), res:d.res});
      if (d.res === 'ret') Object.assign(p, {ret:j(d.ret), ry:n(d.ry) || 0, tk:js(d.tk)});
      if (d.res === 'fc') p.ret = j(d.ret);
      if (d.res === 'blk') Object.assign(p, {by:j(d.by), b:n(d.b) || 0, ret:j(d.ret), ry:n(d.ry) || 0});
      break;
    case 'ko':
      Object.assign(p, {k:j(d.k), d:n(d.d) || 0, res:d.res});
      if (d.res === 'ret') Object.assign(p, {ret:j(d.ret), ry:n(d.ry) || 0, tk:js(d.tk)});
      if (d.res === 'fc' || d.res === 'onside') p.ret = j(d.ret);
      break;
    case 'fg':
      Object.assign(p, {k:j(d.k), d:n(d.d), res:d.res});
      if (d.res === 'blk') Object.assign(p, {by:j(d.by), b:n(d.b) || 0, ret:j(d.ret), ry:n(d.ry) || 0});
      break;
    case 'try':
      Object.assign(p, {kind:d.kind, res:d.res});
      if (d.kind === 'kick') p.k = j(d.k);
      if (d.kind === 'run') p.r = j(d.r);
      if (d.kind === 'pass'){ p.qb = j(d.qb); p.to = j(d.to); }
      break;
    case 'pen': p.pen = cleanPen(d.pen); break;
    case 'note': p.text = d.text; break;
  }
  if (fumbleAllowed(d) && d.fumOn) p.fum = {lost:d.fum.lost === 'lost', by:j(d.fum.by), ff:j(d.fum.ff), ry:n(d.fum.ry) || 0};
  if (['run', 'pass', 'punt', 'ko', 'fg'].includes(d.t) && d.penOn) p.pen = cleanPen(d.pen);
  return JSON.parse(JSON.stringify(p));
}
const fumbleAllowed = d => d.t === 'run' || (d.t === 'pass' && (d.res === 'c' || d.res === 's')) || ((d.t === 'punt' || d.t === 'ko') && d.res === 'ret');
const getK = (o, path) => path.split('.').reduce((a, k) => a == null ? a : a[k], o);
function setK(o, path, v){ const ks = path.split('.'), last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; }

/* ---------- pad: field builders ---------- */
function fJ(k, label, side, role){
  const v = getK(ui.draft, k) ?? '';
  const nums = role ? recent(side, role) : [];
  return `<div class="fld"><label class="eyebrow" for="f-${k}">${label} · ${esc(ab(side))}</label>
    <input class="inp" id="f-${k}" data-k="${k}" data-side="${side}" inputmode="numeric" autocomplete="off" maxlength="2" placeholder="#" value="${esc(v)}">
