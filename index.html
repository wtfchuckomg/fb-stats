    const [appM, fsM, authM] = await Promise.all(['app', 'firestore', ...(admin ? ['auth'] : [])].map(m => import(base + m + '.js')));

function teamsIndexHtml(){
  document.title = 'Teams · Kansas Media Stats';
  // The teams the county plays, each with its whole schedule on the site (their own opponents aren't listed: the site
  // has only their games against these teams).
  const county = new Set(COUNTY.map(canonSchool));
  // Everyone else the site covers: the county's opponents, the AVCTL, and any school that turns up in a game
  // someone has kept — a school joins this list the moment its first game does.
  const named = new Map();
  const add = n => { const k = n && canonSchool(n); if (!k || county.has(k) || named.has(k)) return; named.set(k, schoolName(n)); };
  Object.keys(SCHOOL_INFO).forEach(add);
  AVCTL.forEach(add);
  (allGames.list || []).forEach(x => ['A', 'H'].forEach(sd => add(x.teams[sd] && x.teams[sd].name)));
  const others = [...named.values()].sort((a, b) => a.localeCompare(b));
  const card = (n, size) => { const r = recParts(shownRecord(n));
    return `<a class="tp-card" href="?team=${encodeURIComponent(n)}">${markFor({name:n, abbr:shortName(n), color:'#4A4B4D'}, size)}<b>${esc(n)}</b>${r.length ? `<span>${esc(r[0])}</span>` : ''}</a>`; };
  return `<section class="bcard bhead"><div class="bhead-top"><h1>Teams</h1></div><p class="h-note" style="margin:0">Each team’s record, schedule and results.</p></section>
    <section class="bcard"><h2 class="tp-h">Butler County</h2><div class="tp-grid">${COUNTY.map(n => card(n, 56)).join('')}</div></section>
    <section class="bcard"><h2 class="tp-h">Every other team</h2>${allGames.err ? `<p class="bempty">${esc(allGames.err)}</p>` : ''}
      <div class="tp-grid small">${others.map(n => card(n, 28)).join('')}</div></section>`;
}

            <button type="button" class="btn" data-tp-roster-cancel>Cancel</button></div></section>`;
      }
      if (!r) return ui.admin ? `<section class="bcard" id="roster"><h2 class="tp-h">Roster</h2>
        <p class="bempty">No roster for ${esc(name)} yet.</p>
        <div class="line"><button type="button" class="btn" data-tp-roster-edit>Add a roster</button></div></section>` : '';
      const list = r.players.map(p => `<div class="tp-p"><b>${p.num ? esc(p.num) : ''}</b><span>${esc(p.name || '#' + p.num)}</span></div>`).join('');
      const note = r.fromGames
        ? `${plural2(r.count, 'player')} from ${esc(name)}’s games on the site — a pasted box score gives names without numbers.
           Keep a game for them, or save their roster in Setup, and the numbers fill in for everyone.`
        : `${plural2(r.count, 'player')}, from a scorer who has kept a game for ${esc(name)}.
           Anyone starting a game with them can use it in Setup.`;
      return `<section class="bcard" id="roster"><h2 class="tp-h">Roster</h2><div class="tp-roster">${list}</div>
        <p class="h-note" style="margin:10px 0 0">${note}</p>
        ${ui.admin ? '<div class="line" style="margin-top:10px"><button type="button" class="btn" data-tp-roster-edit>Edit roster</button></div>' : ''}</section>`;
    })()}`;
}

// Type a roster for a school on its own page. It goes up as a shared roster, so every scorer gets it.
async function saveTeamRoster(name, text){
  // A school's page has no sync of its own — it signs the admin in beside the records, so use that handle.
  const api = sync.api || teamRecs.api, uid = (sync.user && sync.user.uid) || (ui.admin ? ADMIN_UID : null);
  if (!ui.admin || !api || !uid) return toast('Sign in on the Game Tracker first');
  const roster = parseRosterText(text), n = Object.keys(roster).length;
  const {fsM, fsdb} = api, id = `roster-${teamKey(name)}-${uid}`;
  const doc = n ? {owner:uid, updated:Date.now(), public:true, kind:'roster', title:`${name} roster`,
    json:JSON.stringify({name, roster, count:n, updated:Date.now()})}
    : {owner:uid, updated:Date.now(), public:true, kind:'roster', deleted:true, json:''};
  try {
    await fsM.setDoc(fsM.doc(fsdb, 'pressbox', id), doc);
    tpage.rosterEdit = null; renderTeamPage();
    toast(n ? `Roster saved — ${plural2(n, 'player')}` : 'Roster cleared');
  } catch (e) { toast('Couldn’t save that roster. Sign in on the Game Tracker, then try again.'); }
}

// Save a score fixed on a team page: the game's own document, which the admin's account owns (it loaded the schedule).
async function saveTeamScore(clear){
  const ed = tpage.editing, x0 = ed && (allGames.list || []).find(y => y.id === ed.id);
  if (!x0 || !teamRecs.api) return;
  const mine = parseInt(($('#tp-s-mine') || {}).value, 10), theirs = parseInt(($('#tp-s-opp') || {}).value, 10);
  if (!clear && (isNaN(mine) || isNaN(theirs))) return toast('Enter both scores');
  const x = JSON.parse(JSON.stringify(x0)), opp = ed.side === 'A' ? 'H' : 'A';
  if (clear) Object.assign(x, {A:0, H:0, per:'pre', clk:''});
  else Object.assign(x, {[ed.side]:clamp(mine, 0, 199), [opp]:clamp(theirs, 0, 199), per:'final', clk:''});
  x.updated = Date.now();
  allGames.list = allGames.list.map(y => y.id === x.id ? x : y);
  tpage.editing = null; tpage.sdraft = null; indexGames(); recordsChanged();
  const {fsM, fsdb} = teamRecs.api;
  try {
    await fsM.setDoc(fsM.doc(fsdb, 'pressbox', x.id), {owner:ADMIN_UID, updated:x.updated, public:true, week:gameWeek(x), kind:'score',
      title:`${x.teams.A.abbr} at ${x.teams.H.abbr}`, json:JSON.stringify(x)});
    toast(clear ? 'Back to not played' : 'Score saved');
  } catch (e) { toast('Couldn’t save that score. Sign in on the Game Tracker, then try again.'); }
}

/* ================================================================
   The 2026 schedules of the Butler County schools' opponents, from the
   KPreps week pages (OPP_SCHEDULE_2026 in 22-oppdata.js), loaded like
   the county schedule: a scheduled game, or the final score once
   played, each with a fixed id so a second device makes no duplicates
   and any later edit wins. The county's own games aren't in it; its
   schedule stands as it is. They fill the team pages, count toward
   records and show on the State Scoreboard; the BUCO Scoreboard, the
   scores strip and the tracker's start screen leave them out.
   ================================================================ */
const OPP_STAMP = Date.UTC(2026, 8, 14, 18);
function seedOppSchedule(){
  const lib = qsLib(); let added = false;
  // An earlier version loaded these from MaxPreps, which had some home teams and scores the wrong way round: those go.
  Object.values(lib).forEach(x => { if (x.id && x.id.startsWith('opp26-') && !x.deleted){ lib[x.id] = {id:x.id, kind:'score', deleted:true, updated:Date.now()}; added = true; } });
  const team = name => { const t = findTeam(name); return {name, abbr:(t && t.abbr) || shortName(name), color:(t && t.color) || '#4A4B4D'}; };
  OPP_SCHEDULE_2026.forEach(([date, A, H, a, h]) => {
    const id = `kp26-${date}-${teamKey(A)}-${teamKey(H)}`;
    if (lib[id]) return;
    const fin = a != null && h != null;
    lib[id] = {id, kind:'score', sched:true, opp:true, created:OPP_STAMP, updated:OPP_STAMP, date,
      teams:{A:team(A), H:team(H)}, A:fin ? a : 0, H:fin ? h : 0, per:fin ? 'final' : 'pre', clk:''};
    added = true;
  });
  if (added) persist();
}

/* ================================================================
   Shared rosters. When a signed-in scorer saves a team's roster (in a
   game's Setup, or in Saved teams), a copy goes up for everyone:
   "roster-<school>-<uid>", public, one per scorer per school. Anyone
   setting up a game with that school sees the others' copies under the
   roster box and can use one; nothing changes unless they tap Use it.
   Only numbers and names are shared, not who saved it.
   ================================================================ */
const sharedRosters = {list:null, unsub:null};
function watchRosters(api){
  if (sharedRosters.unsub || !api) return;
  const {fsM, fsdb} = api;
  const q = fsM.query(fsM.collection(fsdb, 'pressbox'), fsM.where('public', '==', true), fsM.where('kind', '==', 'roster'));
  sharedRosters.unsub = fsM.onSnapshot(q, snap => {
    const out = [];
    snap.forEach(d => {
      const v = d.data(); if (v.deleted || !v.json) return;
      try { const r = JSON.parse(v.json); if (r.name && r.roster) out.push(Object.assign(r, {id:d.id, owner:v.owner})); } catch (e) {}
    });
    sharedRosters.list = out; refreshRosterHints();
  }, () => { sharedRosters.unsub = null; });
}
// Other scorers' rosters for a school, newest first (your own is already in your saved teams).
function rostersFor(name){
  const k = name && canonSchool(name); if (!k) return [];
  return (sharedRosters.list || []).filter(r => canonSchool(r.name) === k && Object.keys(r.roster).length && !(sync.user && r.owner === sync.user.uid))
    .sort((a, b) => (b.updated || 0) - (a.updated || 0));
}
// The best copy of a school's roster for showing on its page: the fullest, then the newest, counting this
// device's saved team as well as everyone else's shared copies.
function rosterFor(name){
  const k = name && canonSchool(name); if (!k) return null;
  const all = (sharedRosters.list || []).filter(r => canonSchool(r.name) === k && Object.keys(r.roster || {}).length)
    .map(r => ({roster:r.roster, updated:r.updated || 0}));
  const mine = (typeof savedTeams === 'function' ? savedTeams() : []).find(t => canonSchool(t.name) === k && Object.keys(t.roster || {}).length);
  if (mine) all.push({roster:mine.roster, updated:mine.updated || 0});
  const best = all.map(r => Object.assign(r, {count:Object.keys(r.roster).length}))
    .sort((a, b) => b.count - a.count || b.updated - a.updated)[0];
  if (!best) return null;
  return {players:Object.entries(best.roster).map(([num, v]) => ({num:String(num), name:playerName(v)}))
    .sort((a, b) => (+a.num || 999) - (+b.num || 999)), count:best.count, fromGames:false};
}

// Failing a shared roster, the players a school's own games know: a pasted box score gives names with no
// numbers, a tracked game gives numbers and whatever names its roster had.
function rosterFromGames(name){
  const k = name && canonSchool(name); if (!k || !allGames.idx) return null;
  const out = new Map();                                   // key -> {num, name}
  schoolRows(name).forEach(r => {
    const x = r.x;
    // From season.json: the names that game knew, with no numbers.
    if (x.players){
      (x.players[r.side === 'A' ? 'a' : 'h'] || []).forEach(n => { if (n && !out.has(n)) out.set(n, {num:'', name:n}); });
      return;
    }
    if (!(x.kind !== 'score' && ((x.plays && x.plays.length) || x.box))) return;
    if (x.box){
      const b = boxData(x); if (!b) return;
      Object.keys(b.pl[r.side] || {}).forEach(n => { if (n !== 'team' && !out.has(n)) out.set(n, {num:'', name:n}); });
      return;
    }
    let rep; try { rep = replay(x); } catch (e) { return; }
    const roster = (x.teams[r.side] || {}).roster || {};
    Object.values(rep.S.pl[r.side] || {}).forEach(p => {
      if (p.n === 'team') return;
      const nm = playerName(roster[p.n]) || '';
      const key = nm || '#' + p.n;
      if (!out.has(key)) out.set(key, {num:String(p.n), name:nm});
    });
  });
  if (!out.size) return null;
  const list = [...out.values()].sort((a, b) => (+a.num || 999) - (+b.num || 999) || a.name.localeCompare(b.name));
  return {players:list, count:list.length, fromGames:true};
}

// Put a saved roster up for everyone (only when signed in, and only a real school with players on it).
function shareRoster(t){
  if (!sync.user || !sync.api || !t || !t.name || DEFAULT_TEAM_NAMES.includes(teamKey(t.name))) return;
  const n = Object.keys(t.roster || {}).length; if (!n) return;
  const {fsM, fsdb} = sync.api, r = {name:t.name, roster:t.roster, count:n, updated:Date.now()};
  fsM.setDoc(fsM.doc(fsdb, 'pressbox', `roster-${teamKey(t.name)}-${sync.user.uid}`),
    {owner:sync.user.uid, updated:r.updated, public:true, kind:'roster', title:`${t.name} roster`, json:JSON.stringify(r)}).catch(() => {});
}
// The line under a roster box in Setup: up to three others' copies, each with Use it.
function sharedHint(s, name){
  const day = r => new Date(r.updated).toLocaleDateString('en-US', {month:'short', day:'numeric'});
  return rostersFor(name).slice(0, 3).map(r => `Shared roster: ${plural2(r.count, 'player')}, updated ${day(r)}.
    <button type="button" class="linkbtn" data-use-shared="${esc(r.id)}" data-side="${s}">Use it</button>`).join('<br>');
}
function refreshRosterHints(){
  ['A', 'H'].forEach(s => { const el = $(`#s-${s}-shared`), nm = $(`#s-${s}-name`); if (el && nm) el.innerHTML = sharedHint(s, nm.value.trim()); });
  renderTeamPage();   // a school's page lists its roster too
}
document.addEventListener('input', e => { if (e.target.id && /^s-[AH]-name$/.test(e.target.id)) refreshRosterHints(); });
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-use-shared]'); if (!b || ui.viewer) return;
  const r = (sharedRosters.list || []).find(x => x.id === b.dataset.useShared), box = $(`#s-${b.dataset.side}-roster`);
  if (!r || !box) return;
  box.value = rosterToText(r.roster);
  toast(`Using the shared ${r.name} roster`);
});

/* ================================================================
   Others (admin only): every other scorer's games, shared or not, in
   their own window beside Games. Read-only: open one to watch it.
   The database lets only the admin's account read the unshared ones
   (fb stats/firestore.rules, isAdmin).
   ================================================================ */
const others = {list:null, err:'', unsub:null, show:'all'};
const agoText = ms => {
  const m = Math.max(0, Math.round((Date.now() - ms) / 60000));
  return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} hr ago` : `${Math.round(m / 1440)} days ago`;
};
// Every game another scorer keeps: tracked games, box scores and quick scores (not their saved rosters or team
// lists). Live, so a game in progress updates while the window is open.
function watchOthers(){
  if (others.unsub || !sync.api || !sync.user || sync.user.uid !== ADMIN_UID) return;
  const {fsM, fsdb} = sync.api;
  const redraw = () => { if (ui.dlg === 'others' && dlg().open) dlg().innerHTML = dlgOthers(); };
  others.unsub = fsM.onSnapshot(fsM.collection(fsdb, 'pressbox'), snap => {
    const list = [];
    snap.forEach(d => {
      const v = d.data();
      if (v.deleted || !v.json || v.owner === ADMIN_UID || ['roster', 'teams', 'hidden', 'records'].includes(v.kind)) return;
      try {
        const x = Object.assign(JSON.parse(v.json), {id:d.id});
        if (x.teams && x.teams.A && x.teams.H) list.push({x, owner:v.owner || '', shared:!!v.public, updated:v.updated || x.updated || 0});
      } catch (e) {}
    });
    others.list = list.sort((a, b) => b.updated - a.updated); others.err = ''; redraw();
  }, e => {
    others.unsub = null;   // opening the window again tries again
    others.err = String((e && e.code) || '').includes('permission')
      ? 'The database isn’t letting your account read other scorers’ unshared games yet. Paste the updated rules (fb stats/firestore.rules) into the Firebase console and Publish, then open this again.'
      : 'Can’t load other scorers’ games right now. Check your connection and try again.';
    redraw();
  });
}
function othersRow(o){
  const {x} = o, A = x.teams.A, H = x.teams.H;
  let m; try { m = summary(Object.assign({plays:[]}, x)); } catch (e) { m = {score:{A:0, H:0}, status:'—', pre:true}; }
  const how = x.kind === 'score' ? 'quick score' : x.box ? 'box score' : `${(x.plays || []).length} plays`;
  // A quick score is just a score: there's no game behind it to watch.
  const watch = x.kind === 'score' ? '' : `<a class="btn small" href="?game=${encodeURIComponent(x.id)}" target="_blank" rel="noopener">Watch</a>`;
  // A quick score is a score and nothing else; there are no plays to fix.
  const mine = db.games[x.id] && db.games[x.id].foreign;
  const edit = x.kind === 'score' ? '' : `<button class="btn small${mine ? ' primary' : ''}" data-adopt="${esc(x.id)}">${mine ? 'Back to editing' : 'Edit'}</button>`;
  return `<div class="gitem"><div><b>${esc(A.abbr || A.name)} ${m.pre ? '' : m.score.A} at ${esc(H.abbr || H.name)} ${m.pre ? '' : m.score.H}</b>`
    + `<span class="cur-tag"${o.shared ? '' : ' style="color:var(--flag-ink)"'}>${o.shared ? 'Shared' : 'Not shared'}</span>
    <div class="meta">${esc(A.name)} at ${esc(H.name)} · ${gameDay(x).toLocaleDateString()} · ${esc(m.status)} · ${how} · scorer ${esc(o.owner.slice(0, 6))} · updated ${agoText(o.updated)}</div></div>
    <div class="acts">${watch}${edit}</div></div>`;
}
function dlgOthers(){
  let body;
  if (!sync.user || sync.user.uid !== ADMIN_UID) body = '<p class="hint">Only the admin account can see other scorers’ games. Sign in with it under Games.</p>';
  else if (others.err) body = `<p class="hint">${esc(others.err)}</p>`;
  else if (!others.list){ watchOthers(); body = '<p class="hint">Loading every scorer’s games…</p>'; }
  else {
    const L = others.list, notShared = L.filter(o => !o.shared).length, scorers = new Set(L.map(o => o.owner)).size;
    const rows = L.filter(o => others.show === 'all' || (others.show === 'private' ? !o.shared : o.shared));
    const pick = (k, label) => `<button type="button" class="btn small${others.show === k ? ' primary' : ''}" data-others-show="${k}">${label}</button>`;
    body = `<p class="hint">${L.length} game${L.length === 1 ? '' : 's'} from ${scorers} other scorer${scorers === 1 ? '' : 's'}${notShared ? ` · ${notShared} not shared` : ''}. Only you can see this list.</p>
      <div class="line">${pick('all', 'All')}${pick('private', 'Not shared')}${pick('shared', 'Shared')}</div>
      <div class="glist">${rows.map(othersRow).join('') || '<p class="hint">None here.</p>'}</div>`;
  }
  return `${dlgHead('Others')}<div class="dlg-bd">${body}</div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-others-show]'); if (!b) return;
  others.show = b.dataset.othersShow; dlg().innerHTML = dlgOthers();
});

/* ---------- editing someone else's game ----------
   A game opened from this window is a copy on this device, marked with whose
   it is. It syncs nowhere on its own: the admin saves it back to the scorer's
   own record on purpose, and only after the database agrees that the scorer
   hasn't changed it in the meantime. */
function adoptGame(id){
  // Already editing it: go back to that copy rather than throwing away the work in it.
  if (db.games[id] && db.games[id].foreign){
    g = db.games[id]; resetUi(); setCurrent(); closeDialog(); refresh();
    return toast('Back to your copy of their game');
  }
  const o = (others.list || []).find(v => v.x.id === id);
  if (!o) return toast('That game isn’t loaded any more');
  let copy; try { copy = soundGame(JSON.parse(JSON.stringify(o.x))); } catch (e) { copy = null; }
  if (!copy) return toast('That game can’t be opened');
  copy.foreign = {uid:o.owner, base:o.updated || copy.updated || 0};
  db.games[id] = copy; g = copy; resetUi(); setCurrent(); closeDialog(); refresh();
  toast(`Editing ${scorerName(o.owner)}’s game`);
}
const scorerName = uid => `scorer ${String(uid || '').slice(0, 6)}`;

// Said plainly, above the game, the whole time it is open.
function renderForeign(){
  const el = $('#foreign'); if (!el) return;
  const f = !ui.viewer && g && g.foreign;
  el.hidden = !f;
  if (!f) return;
  const saved = (g.updated || 0) <= f.base;
  el.innerHTML = `<span>Editing <b>${esc(scorerName(f.uid))}</b>’s game. Changes stay on this device until you save them back.</span>`
    + `<button type="button" class="${saved ? 'done' : ''}" data-foreign="save">${ui.confirm === 'foreign' ? 'Save anyway' : saved ? 'Saved' : 'Save to their game'}</button>`
    + `<button type="button" class="done" data-foreign="drop">${ui.confirm === 'drop' ? 'Tap again to close' : 'Close their game'}</button>`;
}

async function saveForeign(force){
  const f = g && g.foreign; if (!f) return;
  if (!sync.api || !sync.user || sync.user.uid !== ADMIN_UID) return toast('Sign in with the admin account first');
  const {fsM, fsdb} = sync.api, game = g, ref = fsM.doc(fsdb, 'pressbox', game.id);
  try {
    const snap = await fsM.getDoc(ref);
    if (!snap.exists()) return toast('That game is no longer in the database');
    const d = snap.data();
    // The scorer has been at it since this copy was taken: say so rather than wiping their work.
    if (!force && (d.updated || 0) > f.base){
      ui.confirm = 'foreign'; renderForeign();
      return toast('They’ve changed this game since you opened it — Save anyway to replace theirs');

/* ================================================================
   Win Probability: after every play, an estimate of how often a team
   in that spot goes on to win. It combines the score margin with the
   time left, plus what having the ball is worth at that down and field
   position, and a small home edge that fades as the clock runs.
   Standard football numbers, tuned for high school: 48 minutes, and
   more big swings than college. Tap the chart to walk the game.
   ================================================================ */
// The chart is drawn for the width it actually gets (about 340 px, in the side column or on a phone),
// so its labels show at their real size: a 300-wide plot with room on the right for 100 / 50 / 100.
const WP = {sigma:18, hfa:2, cache:{}, W:300, H:170, top:8, vbW:334};
const wpErf = x => {
  const t = 1 / (1 + 0.3275911 * Math.abs(x));
  const y = 1 - ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
  return x >= 0 ? y : -y;
};
const wpPhi = z => 0.5 * (1 + wpErf(z / Math.SQRT2));
// Points the team with the ball can expect from here: about -0.5 backed up at its own goal, about 5.6 at the other.
const wpEP = (spot, FL, down) => (6.2 * Math.pow(Math.max(0, Math.min(1, spot / FL)), 1.2) - 0.5) * ({1:1, 2:0.95, 3:0.85, 4:0.6}[down] || 1);

// Seconds left in the quarter for each play. The clock a scorer types sticks until it's changed, so it's only a
// known time on the play where it changes (or the quarter's first play). Plays in between are spread evenly from
// that time to the next known one, or to the quarter's end; in a quarter still being played, about 25 seconds a play.
function wpClock(x, log, qSec, final){
  const n = log.length, est = new Array(n), known = new Array(n).fill(false);
  const raw = x.plays.map(p => typeof p.clk === 'number' ? p.clk : null);
  for (let i = 0; i < n; i++){
    const prev = i && log[i - 1].q === log[i].q ? raw[i - 1] : undefined;
    known[i] = raw[i] != null && raw[i] !== prev;
  }
  for (let i = 0; i < n;){
    let j = i; while (j < n && log[j].q === log[i].q) j++;          // this quarter is plays i .. j-1
    let lastT = qSec, lastK = i - 1;
    for (let k = i; k <= j; k++){
      if (k < j && !known[k]) continue;
      const open = k === j && j === n && !final;                     // the quarter being played now
      const t = Math.min(lastT, k < j ? raw[k] : open ? Math.max(0, lastT - 25 * (k - lastK)) : 0);
      for (let m = lastK + 1; m < k; m++) est[m] = lastT + (t - lastT) * (m - lastK) / (k - lastK);
      if (k < j){ est[k] = t; lastT = t; lastK = k; } else known.fill(false, lastK + 1, j);
    }
    i = j;
  }
  return {est, known};
}

// The visitors' chance after each play, with where that play falls on the game clock.
function wpSeries(x){
  const key = `${x.id}|${x.plays.length}|${x.updated || 0}`;
  if (WP.cache[key]) return WP.cache[key];
  const RU = rulesOf(x), FL = RU.len, qSec = (x.set.qtr || 12) * 60, total = 4 * qSec;
  const full = replay(x), log = full.log, pts = [];
  const {est, known} = wpClock(x, log, qSec, full.st.final);
  log.forEach((e, i) => {
    const st = replay(x, i + 1).st, q = Math.min(e.q || 1, 5), c = est[i];
    const elapsed = q > 4 ? total + (qSec - c) * 0.25 : (q - 1) * qSec + (qSec - c);
    const remain = st.final ? 0 : q > 4 ? 30 : Math.max(0, total - elapsed);
    const t = remain / total, m = st.score.A - st.score.H;
    let v = 0;
    if (st.phase === 'try') v = st.poss === 'A' ? 0.95 : -0.95;                       // the extra point to come
    else if (st.phase === 'kick') v = (other(st.poss) === 'A' ? 1 : -1) * wpEP(0.3 * FL, FL, 1);   // the receiving team's drive
    else v = (st.poss === 'A' ? 1 : -1) * wpEP(st.spot, FL, st.down);
    const wa = st.final ? (m > 0 ? 1 : m < 0 ? 0 : 0.5) : wpPhi((m + v - WP.hfa * t) / (WP.sigma * Math.sqrt(Math.max(t, 0.0025))));
    pts.push({i, x:Math.min(elapsed / total, 1.08), wa, e, clk:known[i] ? x.plays[i].clk : null});
  });
  const start = {i:-1, x:0, wa:wpPhi(-WP.hfa / WP.sigma), e:null};   // the opening kickoff, before a play
  return (WP.cache[key] = [start, ...pts]);
}

// Games with enough plays to say anything, and never a game entered from a box score.
const wpShow = x => !!x && !x.box && x.plays.length > 3;

      <defs><clipPath id="wp-top"><rect x="0" y="0" width="${W}" height="${mid}"/></clipPath><clipPath id="wp-bot"><rect x="0" y="${mid}" width="${W}" height="${H}"/></clipPath></defs>

// Tap or drag along the chart: the dot, the line and the play follow.
function wpBind(){
  const hit = $('#wp-hit'); if (!hit) return;

/* ================================================================
   Embed (?embed=1): the scoreboard, the stats pages or one game's
   gamecast running inside another site's page. The chrome comes off
   in CSS (1c-embed.html); here the frame is kept the height of the
   page so nothing scrolls inside a box, links stay in the frame
   instead of dropping the host's page into it, and the bottom is
   signed with a way back to the full site.
   ================================================================ */
const EMBEDDED = document.documentElement.classList.contains('is-embed');

// The host page listens for this and sets the iframe's height, so the embed
// grows with the week's games instead of scrolling inside a fixed box.
function embedSize(){
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
  if (!h || h === embedSize.last) return;
  embedSize.last = h;
  try { parent.postMessage({kms:'height', height:h}, '*'); } catch (e) {}
}

// A link inside the embed keeps the reader inside the embed: same page, still
// embedded. Anything off this site opens in a new tab, so the host never
// finds another site loaded inside its article.
function embedLinks(){
  document.addEventListener('click', e => {
    if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
    const a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    let url;
    try { url = new URL(a.getAttribute('href'), location.href); } catch (err) { return; }
    if (url.origin !== location.origin){ a.target = '_blank'; a.rel = 'noopener'; return; }
    if (a.hasAttribute('download') || a.target === '_blank') return;
    if (url.pathname === location.pathname && url.search === location.search && url.hash) return;  // same page
    if (url.searchParams.has('embed')) return;
    url.searchParams.set('embed', '1');
    a.href = url.toString();   // not preventDefault: the click follows the new address
  });
}

// Whatever is being shown, full size, in a new tab.
function embedFoot(){
  // Drop embed from the address without rewriting the rest of it: ?state stays
  // ?state, not ?state=.
  const url = new URL(location.href);
  url.search = url.search.replace(/([?&])embed(=[^&]*)?(?=&|$)/, '$1').replace(/[?&]$/, '');
  const what = BOARD ? 'scoreboard' : COUNTY_PAGE ? 'stats page' : TEAM_PAGE ? 'page' : 'game';
  const el = document.createElement('div');
  el.className = 'emb-foot';
  el.innerHTML = `<a href="${esc(url.toString())}" target="_blank" rel="noopener">`
    + `Open this ${what} at Kansas Media Stats &#8599;</a>`;
  document.body.appendChild(el);
}

function startEmbed(){
  if (!EMBEDDED) return;
  embedLinks();
  embedFoot();
  embedSize();
  addEventListener('load', embedSize);
  addEventListener('resize', embedSize);
  if (window.ResizeObserver) new ResizeObserver(embedSize).observe(document.body);
  // Scores arrive after the first paint, and a render can change the height
  // without resizing the body, so check on a slow beat as well.
  setInterval(embedSize, 1000);
}

    for (const [clk, line] of lines){
      const r = parseQuick(line, replay(s).st);
      if (r && r.play) s.plays.push(JSON.parse(JSON.stringify({...r.play, clk})));
    }
  } finally { g = keep; }
  return s;
}

/* ---------- boot ---------- */
if (HOME_PAGE) startHome();             // ?home: the front page, read-only
else if (AV_STAND) startStandings();    // ?standings: the AVCTL's four divisions
else if (BOARD) startScoreboard();      // ?scores: the week's scoreboard, read-only
else if (COUNTY_PAGE) startCounty();    // ?stats: the county's season stats, read-only
else if (TEAM_PAGE) startTeamPage();    // ?teams, ?team=<name>: the schools, and each one's record and schedule
// ?edit=<id> is the scorer coming back to their own game, and wins over ?game= — the preview page forwards both.
else if (LIVE_ID && !new URLSearchParams(location.search).has('edit')) startViewer(LIVE_ID); // a shared link: watch that game, read-only
else {
  load();
  if (db.games.sample && db.games.sample.sample !== 2) db.games.sample = sampleGame();
  seedTeamLibrary();
  seedSchedule();         // the 2026 Butler County schedule, loaded once as scheduled games
  seedOppSchedule();      // and the schedules of the teams they play
  // ?edit=<id>, from the Edit button on a game's own page: open that game here, then tidy the address.
  const EDIT_ID = new URLSearchParams(location.search).get('edit');
  g = (EDIT_ID && db.games[EDIT_ID]) || db.games[db.cur] || Object.values(db.games)[0];
  if (EDIT_ID) history.replaceState(null, '', `${location.pathname}?tracker`);
  if (!g) g = sampleGame();
  // No game under way (the last one is over, or there's only the sample or a box score): the start screen.
  ui.start = !EDIT_ID && idleGame(g);
  setCurrent();
  refresh();
  // ?tracker&open=games (or setup, export, share): from the scorer's buttons on the other pages.
  const OPEN = new URLSearchParams(location.search).get('open');
  if (['games', 'setup', 'export', 'share', 'others'].includes(OPEN)){ history.replaceState(null, '', `${location.pathname}?tracker`); openDialog(OPEN); }
  startSync();
}

startEmbed();   // ?embed=1: whatever page this is, it is inside someone else's
</script>
