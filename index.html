  el.innerHTML = last ? `<span class="eyebrow">Will read</span><div>${last.wiped ? `<s>${esc(last.wiped)}</s> ` : ''}${esc(last.text)}</div><div class="next">Then: ${esc(r.sit)}</div>` : '';
}
/* ================================================================
   Quick entry: one line of shorthand per play, e.g.
     N ball at N35 1-10 · 3-10 · 3--1 · 7-inc · 7-88-5 · 15-0-50-td
     N punt · S ball at S10 · 3-3-fumble S rec · pen S 15 pf · 15-xp
   ================================================================ */
const PEN_CODES = {fs:'False start', enc:'Encroachment', off:'Offside', os:'Offside', offside:'Offside',
  dog:'Delay of game', delay:'Delay of game', form:'Illegal formation', formation:'Illegal formation',
  motion:'Illegal motion', mot:'Illegal motion', shift:'Illegal shift', snap:'Illegal snap',
  sub:'Illegal substitution', too:'Too many players', idp:'Ineligible downfield', ineligible:'Ineligible downfield',
  ifp:'Illegal forward pass', ig:'Intentional grounding', grounding:'Intentional grounding', rik:'Running into the kicker',
  hold:'Holding', holding:'Holding', iuh:'Illegal use of hands', hands:'Illegal use of hands',
  ibb:'Illegal block in the back', bib:'Illegal block in the back', pi:'Pass interference', dpi:'Pass interference',
  opi:'Pass interference', kci:'Kick-catch interference', fm:'Facemask', face:'Facemask', facemask:'Facemask',
  hc:'Horse-collar', horse:'Horse-collar', pf:'Personal foul', ur:'Unnecessary roughness', late:'Late hit',
  target:'Targeting', targeting:'Targeting', clip:'Clipping', clipping:'Clipping', chop:'Chop block',
  blw:'Illegal block below the waist', trip:'Tripping', tripping:'Tripping', slap:'Head slap',
  ip:'Illegal participation', uc:'Unsportsmanlike conduct', unsport:'Unsportsmanlike conduct', usc:'Unsportsmanlike conduct',
  rtp:'Roughing the passer', rtk:'Roughing the kicker', rth:'Roughing the holder', rts:'Roughing the snapper'};
const NO_WORDS = ['no', 'miss', 'missed', 'nogood', 'ng', 'wide', 'short', 'fail', 'failed'];
const TD_WORDS = ['td', 'dtd', 'deftd', 'pick6', 'touchdown'];
const FILLER = ['for', 'yds', 'yards', 'yd', 'to', 'ran', 'run', 'rush', 'pass', 'complete', 'comp', 'caught', 'gain', 'the', 'a'];

// Team letters come from the short names in Setup: NOR → N, SOU → S.
function quickTeams(){
  const a = String(g.teams.A.abbr || 'V').toLowerCase(), h = String(g.teams.H.abbr || 'H').toLowerCase();
  let ka = a[0], kh = h[0];
  if (ka === kh){ ka = 'v'; kh = 'h'; }
  const map = {[a]:'A', [h]:'H', [ka]:'A', [kh]:'H'};
  if (!map.v) map.v = 'A';
  if (!map.h) map.h = 'H';
  return {map, key:{A:ka, H:kh}};
}

// Dashes separate; a dash right after a separator is a minus sign: 3-10 · 3--1 · 3-(-1) · 3 -1.
function tokenize(s){
  const out = []; let cur = '';
  const flush = () => { if (cur !== '' && cur !== '-') out.push(cur); cur = ''; };
  for (const ch of s.toLowerCase().replace(/#/g, '').replace(/&/g, ' ').replace(/\band\b/g, ' ')){
    if (/[\s,()\/]/.test(ch)){ flush(); continue; }
    if (ch === '-'){ if (cur === '') cur = '-'; else flush(); continue; }
    cur += ch;
  }
  flush(); return out;
}

/* ---------- plain English: "aug 15 runs for 15 yards tackled by indy 54 3:54" ----------
   A typed-out sentence is rewritten into the shorthand's own words before it's read, so either works,
   and both end up in the same parser. */
const PEN_PHRASES = [[/\bfalse start\b/g, 'fs'], [/\bpass interference\b/g, 'pi'], [/\bpersonal foul\b/g, 'pf'], [/\bdelay of game\b/g, 'dog'],
  [/\bface ?mask\b/g, 'fm'], [/\broughing the passer\b/g, 'rtp'], [/\broughing the kicker\b/g, 'rtk'], [/\bunsportsmanlike(?: conduct)?\b/g, 'uc'],
  [/\boffsides?\b/g, 'off'], [/\bhorse ?collar\b/g, 'hc'], [/\b(?:illegal )?block in the back\b/g, 'ibb'], [/\billegal motion\b/g, 'motion'],
  [/\billegal formation\b/g, 'form'], [/\bintentional grounding\b/g, 'ig'], [/\bunnecessary roughness\b/g, 'ur']];
function plainWords(line){
  const {map} = quickTeams(), team = w => !!w && !!map[w];
  let s = ' ' + String(line).toLowerCase().replace(/#/g, '') + ' ';
  // School names, longest first, become their short names: "andover central" → "ac".
  [g.teams.A, g.teams.H].map(t => [String(t.name || '').toLowerCase().trim(), String(t.abbr || '').toLowerCase()])
    .sort((x, y) => y[0].length - x[0].length)
    .forEach(([name, ab]) => { if (name && ab && name !== ab) s = s.replace(new RegExp(`\\b${name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'g'), ` ${ab} `); });
  PEN_PHRASES.forEach(([re, code]) => { s = s.replace(re, ` ${code} `); });
  const who = '(?:([a-z]+)\\s+)?', num = '(\\d+)';                // an optional team word, then a player number
  const keep = w => w && !team(w) ? w + ' ' : '';                  // a word that wasn't a team stays
  const two = (w1, n1, w2, n2) => `${keep(w1)}@${n1}${n2 ? ` ${keep(w2)}@${n2}` : ''}`;
  s = s
    .replace(/\b(?:for )?(?:a )?first down\b/g, ' ')
    // tacklers (always the defense): "tackled by indy 54 and 20" → @54 @20
    .replace(new RegExp(`\\b(?:tackled|tackle|stopped|brought down|dropped|wrapped up|hit)\\s+by\\s+(?:the\\s+)?${who}${num}(?:\\s*(?:and|&|,|with)\\s*${who}${num})?`, 'g'),
      (m, w1, n1, w2, n2) => ` ${two(w1, n1, w2, n2)} `)
    .replace(new RegExp(`\\bsacked\\s+by\\s+${who}${num}(?:\\s*(?:and|&|,)\\s*${who}${num})?`, 'g'), (m, w1, n1, w2, n2) => ` sack ${two(w1, n1, w2, n2)} `)
    .replace(new RegExp(`\\b(?:intercepted|picked off|picked)\\s+by\\s+${who}${num}`, 'g'), (m, w, n) => ` ${keep(w)}int ${n} `)
    // "recovered by indy 31" → rec indy31 (a team-lettered number is the recoverer)
    .replace(new RegExp(`\\b(?:recovered|recovers|recovery)\\s+by\\s+${who}${num}`, 'g'), (m, w, n) => team(w) ? ` rec ${w}${n} ` : ` rec ${keep(w)}${n} `)
    .replace(new RegExp(`\\breturned\\s+by\\s+${who}${num}`, 'g'), (m, w, n) => team(w) ? ` ${w}${n} return ` : ` ${keep(w)}${n} return `)
    // passes: "passes to 88", "throws a pass to aug 88", "complete to 88" → 88
    .replace(new RegExp(`\\b(?:complete[sd]?|throws?|threw|pass(?:es|ed)?|hits|finds|found|connects with)(?:\\s+(?:a|the))?(?:\\s+pass)?\\s+(?:to\\s+)?${who}${num}`, 'g'),
      (m, w, n) => ` ${keep(w)}${n} `)
    // yards: "for a loss of 3", "loses 3", "no gain", "a gain of 6"
    .replace(/\b(?:for\s+)?(?:a\s+)?loss\s+of\s+(\d+)/g, ' -$1 ')
    .replace(/\bloses\s+(\d+)/g, ' -$1 ')
    .replace(/\bno\s+gain\b/g, ' 0 ')
    .replace(/\b(?:for\s+)?(?:a\s+)?gain\s+of\s+(\d+)/g, ' $1 ')
    // a runner's verb, so "runs 12 yards for a touchdown" is never read as a pass
    .replace(/\b(?:runs?|ran|rushe[sd]|rush|carrie[sd]|carry|keeps|kept|scrambles|scrambled)\b/g, ' rn ')
    .replace(/\bspike[sd]?\b/g, ' inc ')            // a spike is an incompletion, and counts as one
    .replace(/\bpunt(?:s|ed)\b/g, ' punt ')
    .replace(/\bfield goal\b/g, ' fg ')
    .replace(/\b(?:extra point|pat)\b/g, ' xp ')
    .replace(/\bfair catch\b/g, ' fc ')
    .replace(/\btouchback\b/g, ' tb ')
    .replace(/\bout of bounds\b/g, ' oob ')
    .replace(/\b(?:kicks off|kicked off|kick off|kickoff)\b/g, ' ko ')
    .replace(/\btime ?out\b/g, ' timeout ')
    .replace(/\b(?:scores|scored|for a score)\b/g, ' td ')
    // a yard line said out loud: "at the indy 30" → indy30
    .replace(/\b(at|on|to|from|inside|past|near)\s+(?:the\s+)?([a-z]+)\s+(\d{1,2})\b(?!:)/g, (m, p, w, n) => team(w) ? ` ${p} ${w}${n} ` : m);
  return s.replace(/\s+/g, ' ').trim();
}

function parseQuick(raw, st){
  const line = String(raw || '').trim(); if (!line) return null;
  // "team" (or "tm") stands in for a player number: kneel-downs, snaps over the punter's head.
  let toks = tokenize(plainWords(line)).map(t => TD_WORDS.includes(t) ? 'td' : t === 'tm' ? 'team' : t);
  const {map, key} = quickTeams();
  const T = t => map[t], L = s => key[s].toUpperCase();
  // "N8 runs for 9", "aug8-9": a line that starts with a team stuck to a number is that team's player, not a yard line.
  const lead = (toks[0] || '').match(/^([a-z]+)(\d+)$/);
  if (lead && T(lead[1])) toks.splice(0, 1, lead[1], lead[2]);
  const FL = rulesOf(g).len, HALF = FL / 2;
  // "N5", "sou35": a yard line named by team.
  const spotOf = t => { const m = String(t).match(/^([a-z]+)(\d+(?:\.5)?)$/); return m && T(m[1]) ? {side:T(m[1]), n:+m[2]} : null; };
  const isNum = t => /^-?\d+(\.\d+)?$/.test(t);
  const has = (...w) => w.some(x => toks.includes(x));
  const O = st.poss, D = other(O);
  let clk;
  // A clock time can sit anywhere on the line: "8:40 3-10", "ko-c25-3:25".
  const ci = toks.findIndex(t => /^\d{1,2}:\d{2}$/.test(t));
  if (ci >= 0){ clk = parseClock(toks[ci]); toks.splice(ci, 1); }
  const tk = [];
  toks = toks.filter(t => { const m = t.match(/^(?:@|tk)(\d+)$/); if (m){ tk.push(m[1]); return false; } return true; });
  const bad = msg => ({error:msg});
  const ok = p => {
    if (clk != null) p.clk = clk;
    if (tk.length && ['run', 'pass', 'punt', 'ko'].includes(p.t) && !p.tk) p.tk = tk.slice(0, 2);
    p.q = line;
    return {play:p};
  };
  if (!toks.length) return bad('Type a play, like 3-10.');
  if (has('undo')) return {undo:true};

  /* ---- whose ball, where: "N ball at N35 1-10" ---- */
  if (has('ball') && !has('punt') && !has('fum', 'fumble', 'fumbled', 'fumbles')){
    const bi = toks.indexOf('ball');
    const side = T(toks[bi - 1]) || T(toks[bi + 1]);
    if (!side) return bad(`Start with the team letter, like ${L('A')} ball at ${L('A')}35.`);
    const rest = toks.slice(bi + 1).filter(t => !['at', 'on', 'the', 'own'].includes(t));
    if (T(rest[0]) === side && (rest[1] || '').match(/^[a-z]/)) rest.shift();
    let spotSide, n;
    const m = (rest[0] || '').match(/^([a-z]+)(\d+(?:\.5)?)$/);
    if (m && T(m[1])){ spotSide = T(m[1]); n = +m[2]; rest.shift(); }
    else if (T(rest[0]) && isNum(rest[1] || '')){ spotSide = T(rest[0]); n = +rest[1]; rest.splice(0, 2); }
    else if ([String(HALF), 'mid', 'midfield'].includes(rest[0])){ spotSide = side; n = HALF; rest.shift(); }
    else return bad(`Say whose yard line, like ${L(side)}35 or ${L(other(side))}35.`);
    if (!(n >= 1 && n <= HALF)) return bad(`Yard lines run from 1 to ${HALF}.`);
    const spot = spotSide === side ? n : FL - n;
    const dn = rest.map(t => t.replace(/(st|nd|rd|th)$/, ''));
    let down = 1, togo = 10, goal = false;
    if (dn.length){
      down = parseInt(dn[0], 10);
      if (!(down >= 1 && down <= 4)) return bad('Down should be 1 to 4, like 3-7.');
      if (dn[1] === 'g' || dn[1] === 'goal') goal = true;
      else if (dn[1] != null){ togo = +dn[1]; if (!(togo > 0)) return bad('Distance should be yards, like 3-7.'); }
    }
    if (spot + togo >= FL) goal = true;
    return ok({t:'set', poss:side, spot, down, ...(goal ? {goal:true} : {togo})});
  }

  /* ---- clock and game control ---- */
  // Only "to N", "N timeout" and the like: a "to" inside a play ("kick to N5") isn't a timeout.
  const nonTeam = toks.filter(t => !T(t));
  if (nonTeam.length && nonTeam.every(t => ['to', 'timeout', 'tmo'].includes(t))){
    const side = toks.map(T).find(Boolean);
    if (!side) return bad(`Whose timeout? Type to ${L('A')} or to ${L('H')}.`);
    return ok({t:'to', side});
  }
  // "end" ends the quarter — but not when the line is about the end zone.
  if (has('eoq', 'endq', 'half', 'halftime', 'eoh') || (has('end') && !has('zone', 'ez'))){
    const side = toks.map(T).find(Boolean);
    return ok({t:'endq', ...(side ? {kick:side, first:side} : {})});
  }
  if (has('final')) return ok({t:'final'});
  if (st.final) return bad('The game is final. Type undo to reopen it.');

  /* ---- penalties: alone, or after a play on the same line ---- */
  let pen = null;
  const pi = toks.findIndex(t => ['pen', 'penalty', 'flag'].includes(t));
  if (pi >= 0){
    const pt = toks.slice(pi + 1); toks = toks.slice(0, pi);
    const side = pt.map(T).find(Boolean);
    if (!side) return bad(`Which team? Like pen ${L('A')} 5 or pen ${L('H')} 15.`);
    const code = pt.find(t => PEN_CODES[t]);
    const preset = code && PENALTIES.find(x => x.name === PEN_CODES[code]);
    const nums = pt.filter(isNum).map(x => Math.abs(+x));
    const y = nums.length ? nums[0] : preset ? preset.y : null;
    if (y == null) return bad('How many yards? Like pen S 15, or add a code like hold.');
    pen = {side, name:preset ? preset.name : 'Penalty', y, a:preset ? preset.a : false, l:preset ? preset.l : false};
    if (nums[1] != null) pen.n = String(nums[1]);
    if (pt.some(t => ['1st', 'auto', 'af'].includes(t))) pen.a = true;
    if (pt.includes('lod')) pen.l = true;
    const offset = pt.some(t => ['offset', 'offsetting', 'offsets'].includes(t));
    const declined = pt.some(t => ['dec', 'declined'].includes(t));
    if (!toks.length) return ok({t:'pen', pen:{...pen, enf:offset ? 'off' : declined ? 'dec' : 'acc'}});
    pen.enf = offset ? 'off' : pt.some(t => ['np', 'noplay', 'nullified', 'replay'].includes(t)) ? 'prev'
      : declined ? 'dec' : 'end';
  }
  let fumErr = null;                       // set when a fumble's "ball on" spot can't be right
  const flag = p => { if (fumErr) return bad(fumErr); if (pen) p.pen = pen; return ok(p); };
  // Drop filler words, but never a team letter: for Augusta, "a" is the team, not the article.
  // A kickoff reads its yard lines off the words "caught at the 8 … to the 20", and those words are filler
  // everywhere else, so keep a copy of the line before they go.
  const rawToks = toks.slice();
  if (toks.some(isNum)) toks = toks.filter(t => !FILLER.includes(t) || T(t));

  // "muffed by 44, recovered by 22": who dropped it, and who fell on it. Anything before the word is
  // the kick itself, so the distance is never mistaken for a jersey number.
  const muffOf = list => {
    const i = list.findIndex(t => ['muff', 'muffed', 'muffs'].includes(t));
    if (i < 0) return null;
    const tail = list.slice(i + 1), ri = tail.findIndex(t => ['rec', 'recovered', 'recovers'].includes(t));
    const nums = (ri >= 0 ? tail.slice(0, ri) : tail).filter(isNum);
    const by = nums[0];
    // "…muff-44-22" with no word between them: the second number is whoever fell on it.
    const ret = ri >= 0 ? tail.slice(ri + 1).filter(isNum)[0] : nums[1];
    return {i, by:by != null ? by : null, ret:ret != null ? ret : null, before:list.slice(0, i).filter(isNum)};
  };

  /* ---- kickoffs ---- */
  const kickWord = toks.findIndex(t => ['ko', 'kickoff', 'kicks', 'kicked', 'onside'].includes(t) || (t === 'kick' && st.phase === 'kick'));
  if (st.phase === 'kick' && kickWord < 0){
    const R = L(other(st.poss));
    return bad(`${L(st.poss)} is kicking off. Type the kick (15-ko-tb, 15-ko-55-28-21, or just ko) or where the ball ends up: ${R} ball at ${R}25.`);
  }
  if (kickWord >= 0){
    if (st.phase === 'try') return bad('Extra point first: 15-xp (or 15-xp-no, or 3 / 7-88 for a two-point try). Then the kickoff.');
    if (st.phase !== 'kick') return bad(`No kickoff is due — ${L(O)} has the ball. If there was one, type where it ended: ${L(O)} ball at ${L(O)}25.`);
    const Rk = other(st.poss), rest = toks.slice(kickWord + 1);
    // Nobody at the game measures a kickoff: they see it caught and they see where it ends. Both yard lines
    // are the receiving team's, so "caught at the 8 and returned to the 20" needs no team on either number.
    const AT = ['at', 'to', 'on', 'inside', 'near'], CAUGHT = ['caught', 'catch', 'catches', 'fielded', 'fields'];
    const KICK = ['ko', 'kickoff', 'kicks', 'kicked', 'onside'];
    const rk0 = rawToks.findIndex(t => KICK.includes(t) || (t === 'kick' && st.phase === 'kick'));
    const rawRest = rk0 >= 0 ? rawToks.slice(rk0 + 1) : rest;
    const bare = [];
    rawRest.forEach((t, i) => {
      if (!isNum(t) || +t < 0 || +t > FL / 2) return;
      let j = i - 1; while (j >= 0 && rawRest[j] === 'the') j--;
      if (j >= 0 && AT.includes(rawRest[j])) bare.push(+t);
    });
    const tagged = rest.map(spotOf).filter(Boolean);
    const spots = tagged.concat(bare.filter(n => !tagged.some(x => x.side === Rk && x.n === n)).map(n => ({side:Rk, n})));
    const caught = rawToks.some(t => CAUGHT.includes(t));
    const before = toks.slice(0, kickWord).filter(isNum);
    const left = bare.slice();                     // a number already read as a yard line isn't a player
    const after = rest.filter(t => {
      if (!isNum(t) || spotOf(t)) return false;
      const k = left.indexOf(+t); if (k >= 0){ left.splice(k, 1); return false; }
      return true;
    });
    const muff = muffOf(rest);
    if (muff) after.length = 0, muff.before.forEach(n => after.push(n));   // only the kick's own numbers left
    const sp = spots[0] || null, endSp = spots[1] || null;   // where it was caught, and where the return ended
    const pos = x => x.side === Rk ? FL - x.n : x.n;         // a yard line as the kicking team sees it
    const p = {t:'ko', res:'spot'};
    if (sp) p.d = Math.max(0, pos(sp) - st.kickFrom);
    else if (after[0] != null) p.d = Math.abs(+after[0]);
    const nx = sp ? after : after.slice(1);                // then the returner and return yards
    // "1 caught the kickoff at the 8": with no number after the word, the one before it is the returner.
    const retNo = nx[0] != null ? nx[0] : (caught && before[0] != null ? before[0] : null);
    if (before[0] != null && retNo !== before[0]) p.k = before[0];
    // "ko-C25": no kick details, just where the receiving team's drive starts.
    if (sp && !endSp && !nx.length && !caught && !has('tb', 'oob', 'onside', 'fc')){ delete p.d; p.bs = sp.side === Rk ? sp.n : FL - sp.n; return flag(p); }
    if (has('tb')) p.res = 'tb';
    else if (has('oob')) p.res = 'oob';
    else if (has('onside')){ p.res = 'onside'; if (retNo != null) p.ret = retNo; if (p.d == null) p.d = 10; }
    else if (muff){ p.res = 'muff'; if (muff.by != null) p.by = muff.by; if (muff.ret != null) p.ret = muff.ret; }
    else if (has('fc')){ p.res = 'fc'; if (retNo != null) p.ret = retNo; }
    else if (retNo != null || endSp){
      p.res = 'ret';
      if (retNo != null) p.ret = retNo;
      p.ry = endSp ? pos(sp) - pos(endSp) : Math.abs(+(nx[1] || 0));
      if (p.ry < 0) return bad(`Those don’t add up: caught at the ${sp.n} and returned to the ${endSp.n}.`);
    }
    if (p.res === 'ret' && p.d == null) return bad('Say where it was caught (ko 28 caught at the 8) or how far it was kicked: 15-ko-55-28-21.');
    if (p.res === 'ret' && has('td')) p.ry = st.kickFrom + p.d;
    return flag(p);
  }

  /* ---- the try after a touchdown ---- */
  if (st.phase === 'try'){
    const nums = toks.filter(isNum), no = has(...NO_WORDS);
    if (has('fg', 'punt', 'sack', 'sacked', 'sk', 'int', 'fum', 'fumble'))
      return bad('This is the try after the touchdown: 15-xp for the kick (15-xp-no if missed), 3 for a two-point run, 7-88 for a two-point pass.');
    if (has('xp', 'pat', 'kick', '1pt')) return ok({t:'try', kind:'kick', ...(nums[0] != null ? {k:nums[0]} : {}), res:has('blk', 'blocked') ? 'blk' : no ? 'miss' : 'good'});
    const need = FL - st.spot;
    if (has('inc')) return ok({t:'pass', qb:nums[0], res:'i', ...(nums[1] != null ? {to:nums[1]} : {})});
    if (nums.length === 1) return ok({t:'run', r:nums[0], y:no ? 0 : need});
    if (nums.length >= 2) return ok({t:'pass', qb:nums[0], to:nums[1], res:'c', y:no ? 0 : need});
    return bad('After a touchdown: 15-xp for the kick (15-xp-no if missed), 3 for a 2-point run, 7-88 for a 2-point pass.');
  }

  /* ---- punts and field goals ---- */
  if (has('punt')){
    const i = toks.indexOf('punt'), before = toks.slice(0, i);
    const kickSide = before.map(T).find(Boolean);
    if (kickSide && kickSide !== O) return bad(`The log has ${L(O)} with the ball. Set it first: ${L(kickSide)} ball at …`);
    const p = {t:'punt'};
    const kicker = before.filter(isNum)[0];
    if (kicker != null) p.k = kicker;
    const toR = s => s.side === D ? s.n : FL - s.n;              // a yard line as the receiving team sees it
    let rest = toks.slice(i + 1);
    // "… I ball at I35": where the receiving team's drive starts.
    let start = null;
    const bi = rest.indexOf('ball');
    if (bi >= 0){
      const tail = rest.slice(bi + 1);
      start = tail.map(spotOf).find(Boolean) || (tail.includes(String(HALF)) ? {side:D, n:HALF} : null);
      if (!start) return bad(`Say where the drive starts, like ${L(D)} ball at ${L(D)}35.`);
      rest = rest.slice(0, bi).filter(t => !T(t));
    }
    if (has('blk', 'blocked')){
      const after = rest.filter(isNum);
      p.res = 'blk'; if (after[0] != null) p.by = after[0]; if (after[1] != null) p.ret = after[1];
      if (has('td')) p.ry = st.spot;          // picked up at the line and returned the whole way
      return flag(p);
    }
    if (has('tb')){ p.res = 'tb'; return flag(p); }
    // "I2 return 10", "return-10", "return to I40": who returned it and how far.
    // A team-lettered number right before "return" is the returner, not a yard line.
    let retNo = null, retYds = null, retEnd = null;
    const ri = rest.findIndex(t => ['return', 'returned', 'returns', 'ret', 'rt'].includes(t));
    if (ri >= 0){
      const prev = rest[ri - 1], ps = prev != null ? spotOf(prev) : null, ahead = rest.slice(ri + 1);
      const n = ahead.find(isNum), s = ahead.map(spotOf).find(Boolean);
      if (s) retEnd = s; else if (n != null) retYds = Math.abs(+n);
      // Where the drive starts is given, so the distance comes from that: a number before "return" is a player.
      const kickNamed = start || rest.slice(0, Math.max(0, ri - 1)).some(t => isNum(t) || spotOf(t));
      if (ps && ps.side === D) retNo = String(ps.n);
      else if (prev != null && isNum(prev) && kickNamed) retNo = prev;
      rest = rest.slice(0, retNo != null ? ri - 1 : ri);
    }
    const muffP = muffOf(rest);
    const after = muffP ? muffP.before : rest.filter(isNum), sp = rest.map(spotOf).find(Boolean);   // "punt to I25" or a distance
    if (sp) p.d = Math.max(0, (FL - toR(sp)) - st.spot);
    else if (after[0] != null) p.d = Math.abs(+after[0]);
    else if (start && retYds != null){
      // "5 punt 15 return 5 ball at SOU35": the ball was fielded retYds short of where the drive starts,
      // and the punt is however far that is from the line of scrimmage.
      const land = toR(start) - retYds, d = FL - land - st.spot;
      if (land < 0 || d < 0) return bad(`Those don’t add up: a ${retYds}-yard return ending at ${L(start.side)} ${start.n}.`);
      p.d = d;
    }
    else if (start && retYds == null && !retEnd) p.d = Math.max(0, (FL - toR(start)) - st.spot);   // no return
    const nx = sp ? after : after.slice(1);                  // the older "19-punt-40-11-6" form
    const landR = p.d != null ? FL - (st.spot + p.d) : null;  // where the receiving team fielded it
    if (muffP){ p.res = 'muff'; if (muffP.by != null) p.by = muffP.by; if (muffP.ret != null) p.ret = muffP.ret; }
    else if (has('fc')){ p.res = 'fc'; const r = retNo ?? nx[0]; if (r != null) p.ret = r; }
    else if (has('oob')) p.res = 'oob';
    else if (has('down', 'downed')) p.res = 'down';
    else {
      if (retEnd && landR != null) retYds = toR(retEnd) - landR;
      if (start && landR != null && retYds == null){ const r = toR(start) - landR; if (r > 0) retYds = r; }
      if (retNo == null && nx[0] != null){ retNo = nx[0]; if (retYds == null && nx[1] != null) retYds = Math.abs(+nx[1]); }
      if (retNo != null || retYds != null || ri >= 0){ p.res = 'ret'; if (retNo != null) p.ret = retNo; if (retYds != null) p.ry = retYds; }
      else p.res = 'spot';
      if (has('td') && p.d != null){ p.res = 'ret'; p.ry = st.spot + p.d; }
    }
    return flag(p);
  }
  if (has('fg')){
    const i = toks.indexOf('fg'), bi = toks.findIndex(t => t === 'blk' || t === 'blocked');
    const before = toks.slice(0, i).filter(isNum), after = toks.slice(i + 1, bi > i ? bi : undefined).filter(isNum);
    const p = {t:'fg', res:bi >= 0 ? 'blk' : has(...NO_WORDS) ? 'miss' : 'good'};
    if (before[0] != null) p.k = before[0];
    if (after[0] != null) p.d = Math.abs(+after[0]);
    if (bi >= 0){
      const bn = toks.slice(bi + 1).filter(isNum);
      if (bn[0] != null) p.by = bn[0];
      if (bn[1] != null) p.ret = bn[1];
      if (has('td')) p.ry = st.spot;
    }
    return flag(p);
  }

  /* ---- a jersey change: "5 is now 35", "N 5 changes to 35" ---- */
  if (has('jersey') || (has('now', 'changes', 'changed', 'switches', 'switched') && toks.filter(isNum).length >= 2)){
    const nums = toks.filter(isNum), side = toks.map(T).find(Boolean) || O;
    if (nums.length < 2) return bad('Which numbers? Like 5 is now 35.');
    return ok({t:'jersey', side, from:nums[0], to:nums[1]});
  }

  /* ---- a safety said as one: "3 tackled in the end zone", "7 sacked for a safety" ---- */
  if (has('safety', 'saf') && st.phase === 'play'){
    const nums = toks.filter(isNum);
    if (has('sack', 'sacked', 'sk')) return flag({t:'pass', qb:nums[0], res:'s', sy:st.spot, ...(nums[1] != null ? {by:nums[1]} : {})});
    return flag({t:'run', r:nums[0], y:-st.spot});
  }

  /* ---- a lateral: "8-5 lateral 11-35" is #8 for 5, then #11 for 35 more ---- */
  const li = toks.findIndex(t => ['lateral', 'laterals', 'lateraled', 'lat', 'pitch', 'pitches', 'pitched'].includes(t));
  if (li >= 0 && st.phase === 'play'){
    const a = toks.slice(0, li).filter(isNum), b = toks.slice(li + 1).filter(isNum);
    if (a.length < 2 || !b.length) return bad('A lateral takes both: 8-5 lateral 11-35 is #8 for 5, then #11 for 35 more.');
    return flag({t:'run', r:a[0], y:+a[1], lat:{r:b[0], y:+(b[1] || 0)}});
  }

  /* ---- runs and passes ---- */
  let fum = null;
  const fi = toks.findIndex(t => ['fum', 'fumble', 'fumbled', 'fumbles'].includes(t));
  if (fi >= 0){
    let ft = toks.slice(fi + 1); toks = toks.slice(0, fi);
    // "… ball on I24": where the next snap is; the advance is the difference.
    let endSpot = null;
    const bi = ft.indexOf('ball');
    if (bi >= 0){
      const tail = ft.slice(bi + 1);
      endSpot = tail.map(spotOf).find(Boolean) || (tail.includes(String(HALF)) ? {side:null, n:HALF} : null);
      if (!endSpot) return bad(`Say where the ball ended up, like ball on ${L(D)}24.`);
      ft = ft.slice(0, bi);
    }
    // "A31" is team A's #31 recovering; a bare "A" is just the team.
    const who = ft.map(spotOf).find(Boolean), fn = ft.filter(isNum);
    const side = who ? who.side : ft.map(T).find(Boolean), lost = !side || side !== O;
    const by = who ? String(who.n) : fn[0], adv = who ? fn[0] : fn[1];
    // td anywhere on a lost-fumble line is the defense's score; on a kept fumble it's the offense's.
    const tdLine = ft.includes('td') || toks.includes('td');
    if (lost) toks = toks.filter(t => t !== 'td'); else if (tdLine && !toks.includes('td')) toks.push('td');
    fum = {lost, by, ry:Math.abs(+(adv || 0)), td:lost && tdLine, endSpot};
  }
  const withFum = p => {
    if (!fum) return p;
    // Where the ball came loose, in the offense's frame.
    const y = p.res === 's' ? -Math.min(p.sy, st.spot) : (+p.y || 0), at = clamp(st.spot + y, 0, FL);
    let ry = fum.ry;
    if (fum.endSpot){
      const mine = fum.lost ? D : O, e = fum.endSpot;
      const endPos = e.side == null ? HALF : e.side === mine ? e.n : FL - e.n;   // in the recovering team's frame
      ry = endPos - (fum.lost ? FL - at : at);
      // Far behind the recovery is almost always the wrong team letter on the yard line.
      if (ry < -10){
        const recPos = fum.lost ? FL - at : at;
        // Team short names, not letters: "where I recovered it" reads like the pronoun.
        const nameOf = s => g.teams[s].abbr || L(s);
        const ylq = pos => pos === HALF ? String(HALF) : pos < HALF ? `${nameOf(mine)} ${fy(pos)}` : `${nameOf(other(mine))} ${fy(FL - pos)}`;
        fumErr = `That's ${fy(-ry)} yards backward from where ${nameOf(mine)} recovered it (the ${ylq(recPos)}). Check the yard line${e.side ? `: ball on ${L(other(e.side))}${e.n}?` : '.'}`;
      }
    }
    if (fum.td) ry = at;                     // the recovering team runs it back the whole way
    p.fum = {lost:fum.lost, ...(fum.by != null ? {by:fum.by} : {}), ry};
    return p;
  };
  // "aug 15 …": the runner or passer named with his team, which has to be the team with the ball.
  if (toks.length > 1 && T(toks[0]) && isNum(toks[1])){
    const s = T(toks[0]);
    if (s !== O) return bad(`The log has ${g.teams[O].abbr || L(O)} with the ball. If ${g.teams[s].abbr || L(s)} has it, set that first: ${L(s)} ball at ${L(s)}__.`);
    toks = toks.slice(1);
  }
  const runV = toks.includes('rn'); toks = toks.filter(t => t !== 'rn');   // said "runs", so it's a run
  const nums = toks.filter(t => isNum(t) || t === 'team'), td = has('td'), toGoal = FL - st.spot;
  // A kneel-down is TEAM's, never the quarterback's: "kneel" loses 1 unless told otherwise.
  if (has('kneel', 'kneels', 'kneeled', 'kn', 'victory')){
    const n = nums.find(x => x !== 'team');
    return flag(withFum({t:'run', r:'team', y:-Math.abs(n != null ? +n : 1)}));
  }
  if (has('inc', 'incomplete', 'incomp')) return flag({t:'pass', qb:nums[0], res:'i', ...(nums[1] != null ? {to:nums[1]} : {}), ...(tk[0] ? {pbu:tk[0]} : {})});
  if (has('int', 'pick', 'picked', 'intercepted')){
    const p = {t:'pass', qb:nums[0], res:'x', at:0, ry:nums[2] != null ? Math.abs(+nums[2]) : 0};
    if (nums[1] != null) p.ib = nums[1];
    // "2-int-2-S10": where it was picked off ("ez" = in the end zone); a second yard line is where the return ended.
    const spots = toks.map(spotOf).filter(Boolean), ez = has('ez', 'endzone');
    const posO = s => s.side === O ? s.n : FL - s.n;              // yards from the passing team's goal
    if (ez) p.at = FL - st.spot; else if (spots[0]) p.at = posO(spots[0]) - st.spot;
    const endAt = spots[ez ? 0 : 1], caught = st.spot + p.at;
    if (endAt) p.ry = caught - posO(endAt);                        // the defense runs back toward the passer's goal
    if (td) p.ry = caught;
    return flag(p);
  }
  if (has('sack', 'sacked', 'sk')){
    const by = nums.slice(2).length ? nums.slice(2) : tk.slice(0, 2);
    return flag(withFum({t:'pass', qb:nums[0], res:'s', sy:Math.abs(+(nums[1] || 0)), by}));
  }
  if (nums.length === 1 && td) return flag(withFum({t:'run', r:nums[0], y:toGoal}));
  if (nums.length === 2){
    const [a, b] = nums;
    // "15-0-td": a TD whose second number isn't the distance to the goal is a pass to that player.
    if (td && !runV && Math.abs(+b - toGoal) > 1) return flag({t:'pass', qb:a, res:'c', to:b, y:toGoal});
    return flag(withFum({t:'run', r:a, y:td ? toGoal : +b}));
  }
  if (nums.length === 3){ const [a, b, c] = nums; return flag(withFum({t:'pass', qb:a, res:'c', to:b, y:td ? toGoal : +c})); }
  if (nums.length === 1) return bad(`Add the yards: ${nums[0]}-5 is #${nums[0]} running for 5.`);
  return bad(`Didn't catch that. Try 3-10 (run), 7-88-5 (pass), 7-inc, ${L(O)} punt, or ${L(D)} ball at ${L(D)}20.`);
}

// Parse a line against the situation before it, and hold "td" to its word: it must score one.
function quickResult(line){

  const r = parseQuick(line, st);
  if (!r || r.error || r.undo) return {r};
  const rr = replay({...g, plays:[...g.plays.slice(0, idx), r.play]});
  if (st.phase !== 'try' && tokenize(line).some(t => TD_WORDS.includes(t)) && !rr.scoring.slice(ui.ctx.scoring.length).some(e => e.how === 'TD')){
    const msg = st.ot ? 'In overtime the ball is dead as soon as the defense takes it, so it can’t be returned for a score.'

function recordQuick(){
  const {r} = quickResult(ui.qtext);

  if (r.error){ const el = $('#qprev'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); return; }
  ui.qtext = '';
  if (r.undo){ undo(); return focusQuick(); }
  const p = JSON.parse(JSON.stringify(r.play));
  if (ui.editing != null){
    const old = g.plays[ui.editing];
    if (p.clk == null && old.clk != null) p.clk = old.clk;
    g.plays[ui.editing] = p; ui.editing = null; ui.qedit = false; ui.open = null;
    save(); refresh(); return toast('Play updated');
  }
  if (p.t === 'endq'){ endq(p.kick, p.q); return focusQuick(); }
  // A time typed on the line also resets the scoreboard clock to it.
  if (p.clk != null && R.st.q <= 4) g.clk = {s:p.clk, run:g.clk.run, at:Date.now()};
  if (p.clk == null && R.st.q <= 4) p.clk = Math.ceil(clockNow());
  if (p.t === 'to' || p.t === 'final') g.clk = {s:clockNow(), run:false, at:Date.now()};
  g.plays.push(p); save(); refresh(); focusQuick();

}

function summaryText(){
  const st = R.st, T = g.teams, lp = (s, n) => String(s).padStart(n), rp = (s, n) => String(s).padEnd(n);

  ['A', 'H'].forEach(s => out += rp(T[s].abbr, 8) + cols.map(i => lp(qCell(st, s, i), 4)).join('') + lp(st.score[s], 5) + '\n');
  out += '\nSCORING\n' + (R.scoring.map(e => `${perLabel(e.q)} ${e.clk != null ? mmss(e.clk) : ''}  ${ab(e.side)} – ${e.desc}  (${T.A.abbr} ${e.A}, ${T.H.abbr} ${e.H})`).join('\n') || 'None') + '\n';
  out += '\n' + rp('TEAM STATS', 28) + lp(T.A.abbr, 10) + lp(T.H.abbr, 10) + '\n';

  ['A', 'H'].forEach(s => {

    const line = (label, arr) => arr.length ? `${label}: ${arr.join('; ')}\n` : '';
    out += `\n${T[s].name.toUpperCase()}\n`;
    out += line('Passing', P.filter(p => p.pa).sort((a, b) => b.py - a.py).map(p => `${nmx(p)} ${p.pc}-${p.pa}-${p.pint}, ${p.py} yds${p.ptd ? `, ${p.ptd} TD` : ''}`));
    out += line('Rushing', P.filter(p => p.ru).sort((a, b) => b.ry - a.ry).map(p => `${nmx(p)} ${p.ru}-${p.ry}${p.rtd ? `, ${p.rtd} TD` : ''}`));
    out += line('Receiving', P.filter(p => p.re).sort((a, b) => b.rey - a.rey).map(p => `${nmx(p)} ${p.re}-${p.rey}${p.retd ? `, ${p.retd} TD` : ''}`));
    out += line('Tackles', P.filter(p => p.tk + p.ast).sort((a, b) => (b.tk + b.ast) - (a.tk + a.ast)).map(p => `${nmx(p)} ${p.tk + p.ast}`));

  });
  return out;
}

function saveSetup(isNew){
  const v = id => $('#' + id).value.trim();

  // Both schools come from the list, so a game can't be started against a school that doesn't exist.
  if (!v('s-A-name') || !v('s-H-name')) return toast('Pick both schools from the list');
  const team = (s, def) => {
    const name = v(`s-${s}-name`) || def;
    return {name, mascot:v(`s-${s}-mascot`), abbr:(v(`s-${s}-abbr`) || name.replace(/[^A-Za-z]/g, '').slice(0, 4)).toUpperCase(), color:$(`#s-${s}-color`).value, roster:parseRoster($(`#s-${s}-roster`).value),
      rec:recValue('s', s, 'rec'), hrec:recValue('s', s, 'hrec')};
  };
  const kick = $('#s-kick [aria-pressed="true"]');

  const set = {qtr:clamp(parseInt(v('s-qtr')) || 12, 1, 20), men, firstKick:kick ? kick.dataset.kick : 'H'};
  const teams = {A:team('A', 'Visitors'), H:team('H', 'Home')};
  const keptA = rememberTeam(teams.A), keptH = rememberTeam(teams.H);
  shareRoster(teams.A); shareRoster(teams.H);   // up for everyone to use, when signed in
  if (keptA || keptH) syncTeams();
  const date = /^\d{4}-\d\d-\d\d$/.test(v('s-date')) ? v('s-date') : ymd(new Date());
  // New games go live by default: on the scoreboard, with a link fans can follow (its card opens once plays come in).

}

function importText(txt){
  let x; try { x = JSON.parse(txt); } catch (e) {
    // Not a backup: a newspaper box score pasted here goes to the box-score window, ready to save.
    if (parseBox(txt).ok){ ui.boxFrom = ui.boxGame = null; openDialog('box'); $('#bx-txt').value = txt; $('#bx-prev').innerHTML = boxPreview(parseBox(txt)); return; }
    toast('That isn’t a backup or a box score. A box score needs its line score, like “Andover 7 7 8 10 — 32”.'); return;
  }
  if (!x || !x.teams || !Array.isArray(x.plays)){ toast('That backup is missing its teams or plays'); return; }
  x.id = 'g' + Date.now().toString(36); x.clk = x.clk || {s:(x.set?.qtr || 12) * 60, run:false, at:0}; x.set = x.set || {qtr:12, ot:10, firstKick:'H'};
  g = x; resetUi(); save(); closeDialog(); refresh(); toast('Game imported');
}
function printAll(){

/* ---------- storage ---------- */
// Everything downstream assumes a game has two teams, a list of plays and a clock. One record saved half-written —
// or arrived part-way from another device — used to take the whole page down on the way in, so they're dropped or
// patched up here, where games enter memory, instead of guarding every place that reads one.
function soundGame(x){
  if (!x || typeof x !== 'object' || !x.teams || !x.teams.A || !x.teams.H) return null;
  if (!Array.isArray(x.plays)) x.plays = [];
  if (!x.set || typeof x.set !== 'object') x.set = {qtr:12, men:11, firstKick:'H'};
  if (!x.clk || typeof x.clk !== 'object') x.clk = {s:(x.set.qtr || 12) * 60, run:false, at:0};
  return x;
}
function load(){
  try {
    const d = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (!d || !d.games) return;
    const games = {}, dropped = [];
    Object.entries(d.games).forEach(([id, x]) => { const ok = soundGame(x); if (ok) games[id] = ok; else dropped.push(id); });
    d.games = games; db = d;
    if (dropped.length) persist();   // don't let a bad record come back on the next load
  } catch (e) {}
}
function persist(){ try { localStorage.setItem(STORE, JSON.stringify(db)); } catch (e) {} }
// An edit: stamp the game, keep it here, and send it to the account when signed in.
function save(){ if (!g) return; g.updated = Date.now(); db.games[g.id] = g; db.cur = g.id; persist(); syncPush(g); }
// Opening a game isn't an edit, so it mustn't look newer than another device's copy.
function setCurrent(){ if (!g) return; db.games[g.id] = g; db.cur = g.id; persist(); }
function resetUi(){ Object.assign(ui, {type:null, draft:null, editing:null, ctx:null, open:null, confirm:null, ask:null, qtext:'', qedit:false, start:false}); }
function refresh(){
  R = replay(g);
  // The game just went final (its last play, or End game): on to the start screen for the next one.
  if (!ui.viewer && R.st.final && ui.seen && ui.seen.id === g.id && !ui.seen.final) ui.start = true;
  ui.seen = {id:g.id, final:!!R.st.final};
  ui.ctx = ui.editing != null ? Object.assign(replay(g, ui.editing), {}) : R;
  $('#sample').hidden = !g.sample || !!ui.viewer;
  const sb = $('#sharebtn');
  if (sb){ sb.classList.toggle('live', !!g.share); sb.innerHTML = g.share ? '<i></i>Live' : 'Private'; }
  renderBoard(); renderPad(); renderView(); renderRail(); renderLive(); renderScores(); loadLogos(); renderStart(); renderForeign();
}
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1700); }

/* ---------- actions ---------- */
function record(){
  const p = buildPlay(ui.draft);
  if (ui.editing != null){
    const c = parseClock(ui.draft.clkTxt || ''); if (c != null) p.clk = c;
    g.plays[ui.editing] = p; ui.editing = null; ui.open = null; toast('Play updated');
  } else {
    if (R.st.q <= 4) p.clk = Math.ceil(clockNow());
    g.plays.push(p); toast('Recorded');
  }
  if (!['run', 'pass'].includes(ui.type)) ui.type = null;
  ui.draft = null; save(); refresh();
}
function undo(){ if (!g.plays.length) return; g.plays.pop(); resetUi(); save(); refresh(); toast('Last play removed'); }
function endq(v, src){
  const q = R.st.q, p = {t:'endq', clk:0};
  if (src) p.q = src;
  if (q === 2) p.kick = v; if (q === 4) p.first = v;
  g.plays.push(p); ui.ask = null; ui.type = null; ui.draft = null;
  if (q < 4) g.clk = {s:g.set.qtr * 60, run:false, at:0}; else g.clk.run = false;
  save(); refresh(); toast(q === 4 ? 'End of regulation' : `End of the ${ord(q)} quarter`);
}
function startEdit(i){
  const p = g.plays[i]; ui.editing = i; ui.ctx = replay(g, i); ui.type = p.t; ui.open = null;
  // A play typed in shorthand is edited by retyping its line; others use the form.
  ui.qedit = !!p.q; ui.qtext = p.q || ''; ui.draft = p.q ? null : toDraft(p, ui.ctx.st);
  renderPad(); renderView(); $('#pad').scrollIntoView({behavior:'smooth', block:'start'});
  if (p.q) focusQuick();
}
function editClock(){
  const b = $('#clk'), inp = document.createElement('input');
  inp.className = 'st-clock num'; inp.inputMode = 'numeric'; inp.value = mmss(clockNow()); inp.setAttribute('aria-label', 'Game clock, minutes:seconds');
  b.replaceWith(inp); inp.focus(); inp.select();
  let done = false;
  const finish = keep => { if (done) return; done = true; const s = keep ? parseClock(inp.value) : null; if (s != null) setClock(Math.min(s, g.set.qtr * 60), false); renderBoard(); };
  inp.addEventListener('blur', () => finish(true));
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); });
}

document.addEventListener('click', e => {
  if (e.target === dlg()){ closeDialog(); return; }
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (ui.viewer && !d.tab && !d.pbp) return;     // viewers can switch tabs and nothing else
  if ('xlsx' in d) return downloadXlsx();
  if (d.share){
    g.share = d.share === 'on'; save(); refresh(); toast(g.share ? 'Live on the scoreboard' : 'Private: off the scoreboard');
    dlg().innerHTML = dlgShare();
    return toast(g.share ? 'Live link on' : 'Live link off');
  }
  if (t.id === 'clk') return editClock();
  if (t.id === 'clkgo'){ setClock(clockNow(), !g.clk.run); return renderBoard(); }
  if (t.id === 'rec') return record();
  if (t.id === 'qrec') return recordQuick();
  if (d.qkey) return insertKey(d.qkey);
  if (d.mode){
    ui.mode = d.mode; ui.draft = null;
    try { localStorage.setItem('pressbox.mode', d.mode); } catch (e) {}
    renderPad(); if (d.mode === 'quick') focusQuick(); return;
  }
  if (d.open) return openDialog(d.open);
  if ('close' in d) return closeDialog();
  if (d.tab){ ui.tab = d.tab; return renderView(); }
  if (d.pbp){ ui.pbp = d.pbp; return renderView(); }
  if (d.type){ ui.type = d.type; ui.draft = null; return renderPad(); }
  if (d.seg){ setK(ui.draft, d.seg, d.v); return renderPad(); }
  if (d.tog){ setK(ui.draft, d.tog, !getK(ui.draft, d.tog)); return renderPad(); }
  if (d.chip){ setK(ui.draft, d.chip, d.v); return renderPad(); }
  if ('td' in d){ ui.draft.y = String(Math.ceil(ui.ctx.FL - ui.ctx.st.spot)); ui.draft.yn = 'gain'; return renderPad(); }
  if (d.men){
    t.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === t)));
    $('#s-rulehint').textContent = ruleHint(+d.men); return;
  }
  if ('undo' in d) return undo();
  if ('cancelEdit' in d){ ui.editing = null; ui.draft = null; ui.type = null; ui.qedit = false; ui.qtext = ''; return refresh(); }
  if (d.timeout){
    g.plays.push({t:'to', side:d.timeout, ...(R.st.q <= 4 ? {clk:Math.ceil(clockNow())} : {})});
    g.clk = {s:clockNow(), run:false, at:Date.now()}; ui.type = null; ui.draft = null;
    save(); refresh(); return toast(`Timeout ${ab(d.timeout)}`);
  }
  if ('endqAsk' in d){
    const st = R.st;
    if (st.q === 2) ui.ask = 'half'; else if (st.q === 4 && st.score.A === st.score.H) ui.ask = 'ot'; else return endq();
    return renderPad();
  }
  if (d.endq) return endq(d.endq);
  if ('ask' in d){ ui.ask = d.ask || null; return renderPad(); }
  if ('final' in d){ g.plays.push({t:'final'}); g.clk.run = false; ui.ask = null; save(); refresh(); return toast('Game ended'); }
  if (d.row){ const i = +d.row; ui.open = ui.open === i ? null : i; ui.confirm = null; return renderView(); }
  if (d.edit) return startEdit(+d.edit);
  if (d.del){
    const i = +d.del;

/* ================================================================

// This site's own logos folder first (stats.kansasmediarankings.com/logos), then the Pick 'ems library for the rest.
const LOGO_SRC = [{base:'logos/', list:[]}, {base:'https://picks.kansasmediarankings.com/logos/', list:[]}];
const logoLib = {list:null, busy:false};   // list: every school from both, for the school-name suggestions
const logoSlug = s => String(s || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
function loadLogos(){
  if (logoLib.list || logoLib.busy || typeof fetch !== 'function') return;
  logoLib.busy = true;
  // Check for a newer list every time (a changed school name or logo shows right away, not after the browser's cache).
  Promise.all(LOGO_SRC.map(src => fetch(src.base + 'teams.json', {cache:'no-cache'}).then(r => r.ok ? r.json() : []).catch(() => [])
    .then(list => { src.list = Array.isArray(list) ? list : []; })))
    .then(() => {
      logoLib.list = LOGO_SRC.flatMap(src => src.list);
      // Two names for one school only merge once the library is here, so anything already filed under the
      // other name has to be filed again — or a school's page finds none of its own games.
      schoolIdx = null;          // keyed by canonical name as well, so it is built again
      if (allGames.list) indexGames();
      if (g && R) refresh(); else { renderScoreboard(); renderCounty(); renderTeamPage(); renderStandings(); }
    });
}
/* ---------- the school list, for picking a school instead of typing one ----------
   Every school the logo library knows, so a game can't be started against a school that doesn't exist (a typo
   leaves a game with no logo, no roster and its own row in the stats). The list is fetched at runtime, so when
   it hasn't arrived — a cold load on a bad connection — fall back to the schools saved on this device plus
   whatever the game already says, rather than showing an empty list nobody can get past. */
// What this site calls a school, whatever a paste or a paper called it: "Haysville Campus" is Campus.
const schoolName = n => {
  const k = canonSchool(n), t = (logoLib.list || []).find(v => logoSlug(v.name) === k);
  return t ? t.name : n;
};
function schoolList(...keep){
  // This site's own list (logos/teams.json) as the admin keeps it — not the Pick 'Em library, which carries
  // schools that don't belong in these pickers.
  const names = new Set(typeof schoolsAll === 'function' ? schoolsAll() : (LOGO_SRC[0].list || []).map(t => t.name).filter(Boolean));
  if (!names.size) (typeof savedTeams === 'function' ? savedTeams() : []).forEach(t => names.add(t.name));
  keep.filter(Boolean).forEach(n => names.add(n));   // whatever the game already says, so it is never lost
  return [...names].sort((a, b) => a.localeCompare(b));
}
// A school's short name: the admin's own (Schools window), then logos/teams.json ("ArkC" for Arkansas City).
function listAbbr(name){
  const own = typeof schoolAbbr === 'function' ? schoolAbbr(name) : '';
  if (own) return own;
  const k = logoSlug(name);
  const hit = (logoLib.list || []).find(t => t.abbr && (logoSlug(t.name) === k || t.slug === k || (t.aliases || []).some(a => logoSlug(a) === k)));
  return hit ? hit.abbr : '';
}
// A school picker: the whole list, with what the game already has kept selected even if the list is still coming.
function schoolPicker(id, value, label){

// Every place a school's logo might be, best first: the logo map (checked ahead of time across the three sites),
// then the logo lists, then, for a school neither knows, its own name in this site's logos folder. An address
// that failed to load once is skipped from then on.
const LOGO_MISS = new Set();
const STATS_LOGOS = 'https://stats.kansasmediarankings.com/logos/';
function logoUrls(team){
  if (!team) return [];
  const keys = [logoSlug(team.name), logoSlug(team.abbr)].filter(Boolean), out = [];
  keys.forEach(k => { if (LOGO_MAP[k]) out.push(LOGO_MAP[k]); });
  if (logoLib.list){
    const want = new Set(keys);
    LOGO_SRC.forEach(src => {
      const hit = src.list.find(t => t.file && (want.has(t.slug) || want.has(logoSlug(t.name)) || (t.aliases || []).some(a => want.has(logoSlug(a)))));
      if (hit) out.push(src.base + encodeURIComponent(hit.file));   // some file names have spaces
    });
  }
  if (!out.length && team.name) out.push(STATS_LOGOS + encodeURIComponent(String(team.name).trim()) + '.png', STATS_LOGOS + logoSlug(team.name) + '.png');
  return [...new Set(out)].filter(u => !LOGO_MISS.has(u));
}
// A logo that won't load gives way to the next place it might be, then to the monogram: never a broken image.
function logoMiss(img){
  LOGO_MISS.add(img.getAttribute('src'));
  const rest = (img.dataset.alts || '').split('|').filter(u => u && !LOGO_MISS.has(u));
  if (rest.length){ img.dataset.alts = rest.slice(1).join('|'); img.src = rest[0]; }
  else { img.nextElementSibling.hidden = false; img.remove(); }
}
const logoUrl = team => logoUrls(team)[0] || '';
function teamMark(s, size){ return markFor(g.teams[s], size); }
// Any team's mark, for places that show other games (the scoreboard).
function markFor(t, size){
  const [url, ...alts] = logoUrls(t);
  const txt = String(t.abbr || t.name || '?').slice(0, size >= 40 ? 4 : 3);
  const fs = Math.max(8, Math.round(size * (txt.length > 3 ? .28 : .36)));
  const mono = hide => `<span class="tmono" aria-hidden="true"${hide ? ' hidden' : ''} style="--tc:${esc(t.color)};width:${size}px;height:${size}px;font-size:${fs}px">${esc(txt)}</span>`;
  if (!url) return mono(false);
  return `<img class="tlogo" src="${esc(url)}" data-alts="${esc(alts.join('|'))}" alt="" width="${size}" height="${size}" style="width:${size}px;height:${size}px"`
    + ` onerror="logoMiss(this)">${mono(true)}`;
}
/* ================================================================

// Players go by name, number if none; a box score's players are keyed by their names.
const PT = (s, n) => n === 'team' ? 'Team' : rosterName(s, n) || (/^\d+$/.test(n) ? `#${n}` : playerName(n));
const whenTxt = (q, clk) => clk != null && q <= 4 ? `${mmss(clk)} - ${perShort(q)}` : q <= 4 ? `${ord(q)} Quarter` : perShort(q);
const openDrive = () => { const d = R.drives[R.drives.length - 1]; return d && d.open ? d : null; };
const plural2 = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const driveSum = d => `${plural2(d.plays, 'play')}, ${plural2(Math.round(d.last - d.start), 'yard')}`;
function lastPlay(){ for (let k = R.log.length - 1; k >= 0; k--) if (R.log[k].t !== 'set') return R.log[k]; return null; }

// A headline for a play, the way a gamecast names it: "19-yd Pass", "Touchdown", "Punt".
function playTitle(e){
  const p = g.plays[e.i] || {}, txt = e.text || '', tg = e.tags.map(t => t[1]);
  if (/TOUCHDOWN/.test(txt)) return 'Touchdown';
  if (/SAFETY/.test(txt)) return 'Safety';
  if (/^Two-point try/.test(txt)) return 'Two-Point Try';
  if (e.wiped || p.t === 'pen') return 'Penalty';
  if (tg.includes('INT')) return 'Interception';
  if (tg.includes('Fumble')) return 'Fumble';
  switch (p.t){
    case 'run': {
      if (p.r === 'team' && /kn|kneel|victory/i.test(p.q || '')) return 'Kneel Down';
      const y = +p.y || 0; return y > 0 ? `${y}-yd Run` : y < 0 ? `${-y}-yd Loss` : 'No Gain';
    }
    case 'pass': return p.res === 'c' ? `${+p.y || 0}-yd Pass` : p.res === 'i' ? 'Incomplete Pass' : p.res === 's' ? 'Sack' : 'Pass';
    case 'punt': return 'Punt';
    case 'ko': return 'Kickoff';
    case 'fg': return /BLOCKED/.test(txt) ? 'Blocked Field Goal' : /NO GOOD/.test(txt) ? 'Missed Field Goal' : 'Field Goal';
    case 'try': return p.kind === 'kick' ? 'Extra Point' : 'Two-Point Try';
    case 'to': return 'Timeout';
    case 'endq': return 'End of Period';
    case 'final': return 'Final';
    case 'note': return 'Note';
  }
  return 'Play';
}

// One quarter's cell in a line score: blank while the game hasn't reached it, and an X in a finished game for a
// quarter that was never played (8-man ends at 45 points from the half on; weather and forfeits do the same).
// The columns a line score shows: four quarters, then one for each overtime the game went to — OT, 2OT, 3OT…
// Everywhere that draws a line score asks this, so the card, the strip, the scoreboard and the exports agree.
function lineCols(st){
  const A = st.lines.A || [], H = st.lines.H || [];
  // The last overtime the game actually reached: whoever scored in it, or the clock having got there. A scoreless
  // overtime still gets its column — leaving it out would shift 4OT's points under 3OT.
  let last = 3;
  for (let i = 4; i < Math.max(A.length, H.length); i++) if (A[i] || H[i]) last = i;   // 0 alone isn't an overtime
  if (st.q > 4) last = Math.max(last, st.q - 1);                                       // the clock reached it

}

  if (st.typed) return v;                                           // typed by hand: show it, reached or not

/* ---------- Box Score tab: each stat group, both teams side by side ---------- */
const BOX_CATS = [
  ['Passing', ['C/Att', 'Yds', 'TD', 'Int', 'Lng', 'Sack'], p => p.pa || p.psk, p => [`${p.pc}/${p.pa}`, p.py, p.ptd, p.pint, p.plg, p.psk], 'py'],

  ['Defense', ['Tot', 'Solo', 'Ast', 'TFL', 'Sack', 'Int', 'PBU', 'FF', 'FR'], p => p.tk || p.ast || p.sk || p.dint || p.pbu || p.ff || p.fr || p.bk,

  ['Kicking', ['FG', 'Lng', 'XP', 'KO', 'TB', 'Pts'], p => p.fga || p.xpa || p.ko, p => [`${p.fgm}/${p.fga}`, p.fglg || '—', `${p.xpm}/${p.xpa}`, p.ko, p.ktb, p.fgm * 3 + p.xpm], 'fga'],
  ['Punting', ['No', 'Yds', 'Avg', 'Lng', 'In 20', 'TB'], p => p.pu, p => [p.pu, p.puy, avg(p.puy, p.pu), p.pulg, p.pi20, p.ptb], 'pu'],
  ['Returns', ['KR', 'Yds', 'Lng', 'PR', 'Yds', 'Lng', 'TD'], p => p.kr || p.pr, p => [p.kr, p.kry, p.krlg, p.pr, p.pry, p.prlg, p.krtd + p.prtd], 'kry']];

  const pick = (s, keep, key) => Object.values(R.S.pl[s]).filter(keep).sort((a, b) => (a.n === 'team') - (b.n === 'team') || val(b, key) - val(a, key));

      : `<div class="muted" style="font-size:13px;padding:6px 0">No ${title.toLowerCase()} stats</div>`}</div>`;
    h += `<section class="card"><div class="card-hd"><h2 class="card-title">${title}</h2></div><div class="bx2">${table('A')}${table('H')}</div></section>`;
  }
  return h || '<section class="card"><div class="empty">No player stats yet.</div></section>';
}

/* ---------- Team Stats: bars in team colors ---------- */
function cmpRows(full){
  const S = R.S.team, frac = (m, a) => a ? m / a : 0, conv = (m, a) => `${m}-${a}`;
  const rows = [
    ['Total Yards', s => S[s].rushY + S[s].passY],
    ['1st Downs', s => S[s].fd],
    ['Passing Yards', s => S[s].passY],
    ['Rushing Yards', s => S[s].rushY],
    ['Turnovers', s => S[s].fumL + S[s].passInt],
    ['Penalties', s => S[s].pen, s => `${S[s].pen}-${fy(S[s].penY)}`],
    ['3rd Down', s => frac(S[s].d3m, S[s].d3a), s => conv(S[s].d3m, S[s].d3a)],
    ['4th Down', s => frac(S[s].d4m, S[s].d4a), s => conv(S[s].d4m, S[s].d4a)]];
  if (S.A.top || S.H.top) rows.push(['Possession', s => S[s].top, s => mmss(S[s].top)]);
  // A box score carries whatever the paper printed: show the rows it filled in, and nothing it left out.
  const any = r => ['A', 'H'].some(s => { const v = r[1](s); return typeof v === 'number' ? v > 0 : !!v; });
  const keep = R.box ? rows.filter(any)
    : full ? rows : rows.filter(r => ['Total Yards', '1st Downs', 'Turnovers', 'Penalties', '3rd Down', 'Possession'].includes(r[0]));
  const T = g.teams;
  return keep.map(([label, v, show]) => {
    const a = Math.max(0, v('A')), h = Math.max(0, v('H')), tot = a + h, wa = tot ? a / tot * 100 : 50;
    return `<div class="cmp"><div class="cmp-top"><b>${show ? show('A') : v('A')}</b><span>${label}</span><b>${show ? show('H') : v('H')}</b></div>
      <div class="cmp-bar"><i style="width:${wa}%;background:${tot ? esc(T.A.color) : 'var(--line)'}"></i><i style="width:${100 - wa}%;background:${tot ? esc(T.H.color) : 'var(--line)'}"></i></div></div>`;
  }).join('');
}

/* ---------- Drive chart (Play-by-Play): every drive in order, how it began and ended, and what it used ---------- */
// The clock a scorer types sticks until it's changed, so a time counts only on the play where it was set.
// A drive's start is the last clock set from the previous drive's last play through this drive's first;
// its end is the first clock set from its last play through the next drive's first. Otherwise, a dash.
function driveChart(){
  const D = R.drives, L = R.log, P = g.plays, qSec = (g.set.qtr || 12) * 60;
  if (!D.length) return '<div class="empty">No drives yet.</div>';
  const set = i => typeof P[i].clk === 'number' && (!i || L[i - 1].q !== L[i].q || P[i].clk !== P[i - 1].clk);
  const clockIn = (a, b, q, last) => {
    let hit = null;
    for (let i = Math.max(0, a); i <= Math.min(b, L.length - 1); i++) if (L[i].q === q && set(i)){ hit = P[i].clk; if (!last) break; }
    return hit;
  };
  // How the ball was obtained: a kickoff between the two drives, or how the other team's drive ended.
  const how = (d, prev) => {
    if (d.q > 4) return 'OT';
    if (!prev) return 'Kickoff';
    for (let i = prev.i1 + 1; i < d.i0; i++) if (P[i] && P[i].t === 'ko') return P[i].res === 'onside' ? 'Onside' : 'Kickoff';
    // After a score or the half the ball comes by a kick, even when the scorer only typed where the drive began.
    if (['TD', 'FG', 'Half'].includes(prev.res)) return 'Kickoff';
    if (prev.res === 'Safety') return 'Free kick';
    return ['Punt', 'Downs', 'INT', 'Fumble', 'Missed FG', 'Blocked FG'].includes(prev.res) ? prev.res : '—';
  };
  const badge = r => ['TD', 'FG'].includes(r) ? 'score' : ['INT', 'Fumble', 'Downs', 'Safety'].includes(r) ? 'to' : '';
  let rows = '', dash = false, endAt = null;
  const tm = v => { if (v == null){ dash = true; return '—'; } return mmss(v); };
  D.forEach((d, k) => {
    const prev = D[k - 1], next = D[k + 1];
    if (prev && d.q > 2 && d.q <= 4 && prev.q <= 2) rows += '<tr class="dc-half"><td colspan="12">2nd Half</td></tr>';
    if (d.q > 4 && (!prev || prev.q <= 4)) rows += '<tr class="dc-half"><td colspan="12">Overtime</td></tr>';
    // The clock can't run back up within a quarter, so a start later than the last drive's end takes that end,
    // and an end later than its own start is a mistyped clock, left out.
    let t0 = d.q <= 4 ? clockIn(prev ? prev.i1 : 0, d.i0, d.q, true) : null;
    if (t0 != null && endAt && endAt.q === d.q && t0 > endAt.t) t0 = endAt.t;
    let t1 = d.open || d.endQ > 4 ? null : clockIn(d.i1, next ? next.i0 : L.length - 1, d.endQ, false);
    if (t1 != null && t0 != null && d.endQ === d.q && t1 > t0) t1 = null;
    endAt = t1 != null ? {q:d.endQ, t:t1} : null;
    const top = t0 != null && t1 != null ? Math.max(0, (d.endQ - d.q) * qSec + t0 - t1) : null;
    // A drive left open in a game that's already over says nothing: a dash, not "In progress".
    const res = d.open ? (R.st.final ? '—' : 'In progress') : d.res, b = badge(res), ot = d.q > 4;
    rows += `<tr><td><span class="dc-tm">${teamMark(d.team, 22)}${esc(ab(d.team))}</span></td>
      <td class="sep">${esc(R.yl(d.team, d.start))}</td><td>${perShort(d.q)}</td><td>${ot ? '' : tm(t0)}</td><td>${esc(how(d, prev))}</td>
      <td class="sep">${esc(R.yl(d.team, d.last))}</td><td>${d.open ? '' : perShort(d.endQ)}</td><td>${d.open || ot ? '' : tm(t1)}</td>
      <td class="sep dc-res">${b ? `<span class="tag ${b}">${esc(res)}</span>` : esc(res)}</td><td class="num">${d.plays}</td><td class="num">${Math.round(d.last - d.start)}</td>
      <td class="num">${d.open || ot ? '' : top != null ? mmss(top) : '—'}</td></tr>`;
  });
  return `<div class="tbl-wrap"><table class="st dc">
    <thead><tr><th></th><th class="dc-grp sep" colspan="4">Drive Started</th><th class="dc-grp sep" colspan="3">Drive Ended</th><th class="dc-grp sep" colspan="4">Consumed</th></tr>
      <tr><th>Team</th><th class="sep">Spot</th><th>Qtr</th><th>Time</th><th>Obtained</th><th class="sep">Spot</th><th>Qtr</th><th>Time</th>
      <th class="sep">Result</th><th class="num">Plays</th><th class="num">Yds</th><th class="num">TOP</th></tr></thead>
    <tbody>${rows}</tbody></table></div>${dash ? '<p class="hint dc-note">A dash means the clock wasn’t entered at that point in the game.</p>' : ''}`;
}
const cardDriveChart = () => R.drives.length ? `<section class="card"><div class="card-hd"><h2 class="card-title">Drive Chart</h2></div>${driveChart()}</section>` : '';

/* ================================================================
   Excel export: a real .xlsx workbook built in the browser — a zip
   of spreadsheet XML, one sheet per stat group — with no library.
   ================================================================ */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(b){ let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

// An uncompressed ("stored") zip: exactly what Excel expects inside an .xlsx.
function zipStore(files){
  const enc = new TextEncoder(), parts = [], central = [];
  const d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  let offset = 0;
  for (const f of files){
    const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, time, true); h.setUint16(12, date, true); h.setUint32(14, crc, true);
    h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
    parts.push(new Uint8Array(h.buffer), name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, time, true); c.setUint16(14, date, true); c.setUint32(16, crc, true);
    c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true);
    c.setUint32(42, offset, true);
    central.push(new Uint8Array(c.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const size = central.reduce((n, p) => n + p.length, 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, size, true); e.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

const xesc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c]))
  .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');   // characters XML can't hold
const colName = i => { let s = ''; for (i++; i; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s; return s; };
const XL_NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
const XL_REL = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
const XL_HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
const XL_STYLES = `${XL_HEAD}<styleSheet xmlns="${XL_NS}"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>`
  + '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>'
  + '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'
  + '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
  + '<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>'
  + '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';

// rows: arrays of cells (numbers stay numbers so Excel can sort and sum); a row marked .bold is a header.
function sheetXml(rows){
  const widths = [];
  const body = rows.map((row, r) => `<row r="${r + 1}">${(row || []).map((v, c) => {
    if (v === '' || v == null) return '';
    widths[c] = Math.max(widths[c] || 0, String(v).length);
    const ref = colName(c) + (r + 1), s = row.bold ? ' s="1"' : '';
    return typeof v === 'number' && isFinite(v) ? `<c r="${ref}"${s}><v>${v}</v></c>`
      : `<c r="${ref}" t="inlineStr"${s}><is><t xml:space="preserve">${xesc(v)}</t></is></c>`;
  }).join('')}</row>`).join('');
  const cols = Array.from(widths, (w, i) => `<col min="${i + 1}" max="${i + 1}" width="${Math.min(70, Math.max(6, (w || 0) + 2))}" customWidth="1"/>`).join('');
  return `${XL_HEAD}<worksheet xmlns="${XL_NS}">${cols ? `<cols>${cols}</cols>` : ''}<sheetData>${body}</sheetData></worksheet>`;
}
function xlsxBlob(sheets){
  const used = new Set();
  sheets.forEach(s => { let n = s.name.replace(/[\[\]:*?\/\\]/g, '').slice(0, 31) || 'Sheet'; while (used.has(n)) n = n.slice(0, 29) + '_'; used.add(n); s.name = n; });
  const files = [
    {name:'[Content_Types].xml', data:`${XL_HEAD}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">`
      + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>'
      + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
      + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
      + sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')
      + '</Types>'},
    {name:'_rels/.rels', data:`${XL_HEAD}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${XL_REL}/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml', data:`${XL_HEAD}<workbook xmlns="${XL_NS}" xmlns:r="${XL_REL}"><sheets>${sheets.map((s, i) => `<sheet name="${xesc(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels', data:`${XL_HEAD}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`
      + sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="${XL_REL}/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')
      + `<Relationship Id="rId${sheets.length + 1}" Type="${XL_REL}/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml', data:XL_STYLES},
    ...sheets.map((s, i) => ({name:`xl/worksheets/sheet${i + 1}.xml`, data:sheetXml(s.rows)}))
  ];
  return zipStore(files);
}

// The open game as sheets: summary, team stats, each player stat group, drives, play-by-play.
function gameSheets(){
  const st = R.st, T = g.teams, S = R.S, both = ['A', 'H'];
  const hdr = a => Object.assign(a, {bold:true});

  const cell = v => typeof v === 'number' ? v : /^-?\d+(\.\d+)?$/.test(String(v)) ? Number(v) : String(v);
  const avg1 = (y, n) => n ? Math.round(y / n * 10) / 10 : 0;
  const P = (name, heads, keep, row, key) => ({name, rows:[hdr(['Team', '#', 'Name', ...heads]),
    ...both.flatMap(s => Object.values(S.pl[s]).filter(keep).sort((a, b) => (b[key] || 0) - (a[key] || 0))
      .map(p => [T[s].abbr, p.n === 'team' ? '' : num(p.n), p.n === 'team' ? 'TEAM' : rosterName(s, p.n), ...row(p)]))]});
  const cols = lineCols(st);
  const summary = [
    hdr([`${T.A.name} at ${T.H.name}`]),
    ['Date', new Date(g.created).toLocaleDateString()],
    ['Game', rulesOf(g).men === 8 ? '8-man' : '11-man'],
    ['Status', st.final ? 'Final' : `In progress, ${perLabel(st.q)}`],
    [],
    hdr(['Team', ...cols.map(i => i < 4 ? `Q${i + 1}` : colLabel(i)), 'Total']),
    ...both.map(s => [T[s].name, ...cols.map(i => qCell(st, s, i)), st.score[s]]),
    [],
    hdr(['Scoring plays']),
    hdr(['Qtr', 'Clock', 'Team', 'Play', T.A.abbr, T.H.abbr]),
    ...R.scoring.map(e => [perLabel(e.q), e.clk != null ? mmss(e.clk) : '', T[e.side].abbr, e.desc, e.A, e.H])];
  return [
    {name:'Summary', rows:summary},
    {name:'Team stats', rows:[hdr(['Team stats', T.A.abbr, T.H.abbr]), ...teamRows().map(([l, f]) => [l, cell(f('A')), cell(f('H'))])]},
    P('Passing', ['Comp', 'Att', 'Yds', 'TD', 'Int', 'Long', 'Sacked', 'Sack yds'], p => p.pa || p.psk, p => [p.pc, p.pa, p.py, p.ptd, p.pint, p.plg, p.psk, p.pskY], 'py'),
    P('Rushing', ['Car', 'Yds', 'Avg', 'TD', 'Long'], p => p.ru, p => [p.ru, p.ry, avg1(p.ry, p.ru), p.rtd, p.rlg], 'ry'),
    P('Receiving', ['Rec', 'Yds', 'Avg', 'TD', 'Long'], p => p.re, p => [p.re, p.rey, avg1(p.rey, p.re), p.retd, p.relg], 'rey'),

   AVCTL — the Ark Valley-Chisholm Trail League and its four
   divisions, with the pages Butler County has: a scoreboard,
   standings, and player and team stats, all of it the league's own
   schools only. The alignment is KPreps' (its league pages, 2026);

const AVCTL_DIV = {
  I:   ['Campus', 'Derby', 'Hutchinson', 'Maize', 'Maize South', 'Salina South', 'Valley Center'],
  II:  ['Andover', 'Andover Central', 'Arkansas City', 'Eisenhower', 'Goddard', 'Newton', 'Salina Central'],

};
// What KPreps and the schools themselves call some of them.
const AVCTL_ALIASES = {Campus:['Haysville Campus'], Eisenhower:['Goddard-Eisenhower'], Circle:['Towanda-Circle']};
const AVCTL = Object.keys(AVCTL_DIV).reduce((all, d) => all.concat(AVCTL_DIV[d]), []);

const avctlOf = name => AVCTL.find(c => [c, ...(AVCTL_ALIASES[c] || [])].some(a => logoSlug(a) === logoSlug(name))) || null;
const avctlDiv = name => { const s = avctlOf(name); return s ? AV_NAMES.find(d => AVCTL_DIV[d].indexOf(s) > -1) : null; };

// A team's league season: every final on the site, with the division games counted apart from the rest,
// and home and away kept apart the way a standings table shows them.
function avRecord(name){
  const div = avctlDiv(name);
  const r = {gp:0, w:0, l:0, t:0, pf:0, pa:0, dgp:0, dw:0, dl:0, dt:0, dpf:0, dpa:0, hw:0, hl:0, ht:0, aw:0, al:0, at:0};
  schoolRows(name).forEach(row => {
    const f = finalOf(row.x); if (!f.fin) return;
    const us = f.score[row.side], them = f.score[row.opp];
    const i = us > them ? 'w' : us < them ? 'l' : 't';
    r.gp++; r.pf += us; r.pa += them; r[i]++;
    r[(row.side === 'H' ? 'h' : 'a') + i]++;
    if (avctlDiv(row.x.teams[row.opp].name) === div){ r.dgp++; r.dpf += us; r.dpa += them; r['d' + i]++; }
  });
  return r;
}
const avPct = r => r.dw + r.dl + r.dt ? (r.dw + r.dt / 2) / (r.dw + r.dl + r.dt) : -1;
const avRec = (w, l, t) => `${w}-${l}${t ? '-' + t : ''}`;

function standingsRows(div){
  return AVCTL_DIV[div].map(name => ({name, r:avRecord(name), rec:shownRecord(name)}))
    .sort((a, b) => avPct(b.r) - avPct(a.r) || (b.r.dw - a.r.dw) || (b.r.w - a.r.w) || a.name.localeCompare(b.name));
}

function standingsHtml(){

      return `<tr><td class="rk">${cMark(o.name)}</td><td class="nm"><a class="tlink" href="?team=${encodeURIComponent(o.name)}">${esc(o.name)}</a></td>
        <td class="num gsep">${avRec(r.dw, r.dl, r.dt)}</td><td class="num">${r.dpf}</td><td class="num">${r.dpa}</td>
        <td class="num gsep">${esc(overall)}</td><td class="num">${r.pf}</td><td class="num">${r.pa}</td>
        <td class="num">${esc(home)}</td><td class="num">${esc(away)}</td></tr>`;
    }).join('');
    return `<section class="bcard ccard"><div class="ccard-hd"><h2>Division ${div}</h2></div>
      <div class="tbl-wrap"><table class="ctbl av-st"><thead>
        <tr class="cgrp"><th class="rk"></th><th class="nm"></th><th colspan="3">League</th><th colspan="5">Overall</th></tr>
        <tr><th class="rk"></th><th class="nm"></th><th class="num gsep">W-L</th><th class="num">PF</th><th class="num">PA</th>
          <th class="num gsep">W-L</th><th class="num">PF</th><th class="num">PA</th><th class="num">Home</th><th class="num">Away</th></tr></thead>
      <tbody>${rows}</tbody></table></div></section>`;
  };
  const head = `<section class="bcard bhead"><div class="bhead-top"><h1 class="c-title">AVCTL Standings</h1></div>
    <p class="hint">League records count each team’s games against its own division, as they’re kept here. Overall is each team’s record as the site has it.</p></section>`;

  if (waiting) return head + '<section class="bcard"><p class="bempty">Loading the league…</p></section>';
  return head + AV_NAMES.map(card).join('');
}

const newestGame = () => Object.values(db.games).filter(x => !x.sample && !x.foreign).sort((a, b) => (b.updated || 0) - (a.updated || 0))[0];

function listen(){
  const {fsM, fsdb} = sync.api;
  const q = fsM.query(fsM.collection(fsdb, 'pressbox'), fsM.where('owner', '==', sync.user.uid));
  sync.unsub = fsM.onSnapshot(q, snap => {
    let changed = false, current = null;
    snap.docChanges().forEach(ch => {
      if (ch.type === 'removed' || ch.doc.metadata.hasPendingWrites) return;
      const id = ch.doc.id, d = ch.doc.data(), local = db.games[id];
      if (id === teamsDocId()) return mergeTeams(d.json);        // the saved-teams library, not a game
      if (id === HIDE_DOC || id === RECS_DOC || d.kind === 'roster') return;   // hidden games, team records, shared rosters: not games
      if (d.kind === 'score') return mergeScore(id, d);           // a quick score, not a game
      const lu = local ? local.updated || 0 : -1, ru = d.updated || 0;
      if (ru > lu){
        if (d.deleted){ if (local){ delete db.games[id]; changed = true; if (g && g.id === id) current = 'gone'; } return; }
        let remote; try { remote = JSON.parse(d.json); } catch (e) { return; }
        const sound = soundGame(remote); if (!sound) return;   // a half-written record from another device
        db.games[id] = sound; changed = true;
        if (g && g.id === id) current = 'updated';
      } else if (local && lu > ru) syncPush(local, 0);
      // A game saved before the scoreboard existed gets its week, so fans' scoreboards can find it.
      else if (local && !d.deleted && !d.week) syncPush(local, 0);
    });
    if (sync.first){
      sync.first = false;
      // Games made on this device before signing in go up to the account.
      const remoteIds = new Set(snap.docs.map(x => x.id));
      Object.values(db.games).forEach(x => { if (!x.sample && !x.foreign && !remoteIds.has(x.id)) syncPush(x, 0); });
      Object.values(qsLib()).forEach(x => { if (!remoteIds.has(x.id)) pushScore(x); });
      if (!remoteIds.has(teamsDocId()) && savedTeams().length) syncTeams(0);
      // A device still showing the sample opens the latest real game instead.
      if (g && g.sample && newestGame()){ g = newestGame(); resetUi(); ui.start = idleGame(g); current = 'opened'; changed = true; }
    }
    if (current === 'updated') g = db.games[g.id];
    if (current === 'gone'){ g = newestGame() || sampleGame(); resetUi(); ui.start = idleGame(g); }
    if (changed){ db.games[g.id] = g; db.cur = g.id; persist(); }
    if (current){
      if (ui.editing != null && ui.editing >= g.plays.length) resetUi();
      refresh();
      toast(current === 'opened' ? (ui.start ? 'Your games are synced' : 'Opened your latest game') : current === 'gone' ? 'That game was deleted on another device' : 'Updated from another device');
    }
    if (ui.dlg === 'games') dlg().innerHTML = dlgGames();
    if (!sync.pending && !Object.keys(sync.timers).length && !sync.err) sync.state = 'on';
    renderSync();
  }, err => { sync.state = 'error'; sync.err = friendlySync(err); renderSync(); });
}

// The one-line score a shared link shows on social media ("Independence 14, Augusta 28" · "Final · Fri, Sep 11").
// The preview-page job in the site's repo (.github/previews.py) reads it from each shared game.
function shareCard(game){
  const A = game.teams.A.name, H = game.teams.H.name;
  try {
    const m = summary(game), day = gameDay(game).toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
    if (m.pre) return {t:`${A} at ${H}`, s:day};
    // The higher score first ("Augusta 28, Independence 14"); a tie keeps visitors first.
    const [hi, lo] = m.score.H > m.score.A ? [[H, m.score.H], [A, m.score.A]] : [[A, m.score.A], [H, m.score.H]];
    return {t:`${hi[0]} ${hi[1]}, ${lo[0]} ${lo[1]}`, s:`${m.status} · ${day}`};
  } catch (e) { return {t:`${A} at ${H}`, s:''}; }
}

function syncPush(game, delay = 700){
  // Another scorer's game (the admin editing it) is saved back to them by hand, in saveForeign.
  if (!sync.user || !game || game.sample || game.foreign) return;
  clearTimeout(sync.timers[game.id]);
  sync.timers[game.id] = setTimeout(() => pushNow(game.id), delay);
  sync.state = 'saving'; renderSync();
}
async function pushNow(id){
  delete sync.timers[id];

  if (!game || !sync.user) return;
  const {fsM, fsdb} = sync.api;
  sync.pending++;
  try {
    await fsM.setDoc(fsM.doc(fsdb, 'pressbox', id), {owner:sync.user.uid, updated:game.updated || Date.now(), public:!!game.share, week:gameWeek(game),
      title:`${game.teams.A.abbr} at ${game.teams.H.abbr}`, card:shareCard(game), json:JSON.stringify(game)});
    sync.err = '';
  } catch (e) { sync.err = friendlySync(e); }

}

async function signIn(){
  if (!sync.api) return openDialog('games');
  if (IN_APP_BROWSER) return toast('Open this page in Safari or Chrome to sign in');
  const {authM, auth} = sync.api, provider = new authM.GoogleAuthProvider();
  // Embedded browsers may block IndexedDB; walk down to whatever storage this one allows.
  for (const p of [authM.indexedDBLocalPersistence, authM.browserLocalPersistence, authM.browserSessionPersistence, authM.inMemoryPersistence]){
    try { await authM.setPersistence(auth, p); break; } catch (e) { /* try the next */ }
  }
  try { await authM.signInWithPopup(auth, provider); }
  catch (err){
    let e = err;
    // Phones routinely block the popup; a redirect works where it doesn't.
    if (/popup-blocked|popup-closed-by-user|operation-not-supported/.test(err?.code || '')){
      try { await authM.signInWithRedirect(auth, provider); return; } catch (e2) { e = e2; }
    }
    sync.err = friendlySync(e); if (sync.err) toast(sync.err); renderSync();
  }
}
async function signOutSync(){
  if (!sync.api) return;
  try { await sync.api.authM.signOut(sync.api.auth); toast('Signed out. Games stay on this device.'); } catch (e) { toast(friendlySync(e)); }

function friendlySync(e){
  const code = e?.code || '';
  if (code.includes('permission-denied')) return 'Firebase turned the save down. The Press Box rules may not be published yet.';
  if (code.includes('not-found') || /database .*does not exist/i.test(e?.message || '')) return 'The stats project has no Firestore database yet. Create one in the Firebase console.';
  if (code.includes('operation-not-allowed')) return 'Google sign-in isn’t switched on in the stats project yet (Authentication → Sign-in method).';
  if (code.includes('unauthorized-domain')) return 'Google sign-in isn’t allowed at this address yet. Add it in the stats Firebase project under Authentication → Settings → Authorized domains.';
  if (code.includes('disallowed-useragent') || code.includes('operation-not-supported')) return 'This browser can’t complete Google sign-in. Open the page in Safari or Chrome.';
  if (code.includes('web-storage-unsupported')) return 'This browser is blocking site storage, which sign-in needs. Open the page in Safari or Chrome.';
  if (code.includes('unavailable') || code.includes('network')) return 'Can’t reach the server. Your games are still saved on this device.';
  if (code.includes('cancelled') || code.includes('popup-closed')) return '';
  return e?.message || 'Something went wrong with sync.';
}
