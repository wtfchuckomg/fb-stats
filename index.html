        let q = ls[2].split(' ').map(Number), tot = ls[3] != null ? +ls[3] : null;
        if (tot == null && q.length >= 5 && q[q.length - 1] === q.slice(0, -1).reduce((a, b) => a + b, 0)) tot = q.pop();
        if (q.length > 5) q = [...q.slice(0, 4), q.slice(4).reduce((a, b) => a + b, 0)];   // every overtime together
        const s = out.names.length ? 'H' : 'A', name = ls[1].replace(/[\s:,.—–-]+$/, ''), sum = q.reduce((a, b) => a + b, 0);
        out.names.push(name); out.lines[s] = q; out.total[s] = tot ?? sum;
        if (tot != null && tot !== sum) out.warn.push(`${name}’s quarters add up to ${sum}, but the total says ${tot}. Using ${tot}.`);
        sec = null; continue;
      }
    }
    const qh = l.match(QTR);
    if (qh){ curQ = qh[2] ? 5 : QN[qh[1].toLowerCase()]; sec = null; continue; }
    const sc = out.names.length === 2 && l.match(/^([A-Za-z][A-Za-z.'& ]{0,24}?)\s*[—–:-]\s+(.+)$/);
    const side = sc && sideOf(sc[1]);
    if (side){ out.scoring.push({side, label:sc[1].trim(), desc:sc[2].trim(), q:curQ, ...scoreLine(sc[2])}); sec = null; continue; }
    if (sec) sec.body += ' ' + l;
  }
  if (out.names.length < 2){
    out.error = 'Couldn’t find the line score: each team’s name, its quarter scores and the total, like “Andover 7 7 8 10 — 32”.';
    return out;
  }

  // Full names from the scoring summary, so "Vega" in the stat lines reads as "Pete Vega". A "first name"
  // that is some other player's last name ("from Quinn Vega kick", with a "(" missing) isn't one.
  const full = {A:{}, H:{}};
  out.scoring.forEach(e => (e.desc.match(/\b[A-Z][a-zA-Z'’.-]+(?: [A-Z][a-zA-Z'’.-]+)+/g) || []).forEach(n => {
    const m = full[e.side], k = lastName(n); (m[k] = m[k] || {})[n] = (m[k][n] || 0) + 1; }));
  ['A', 'H'].forEach(s => Object.values(full[s]).forEach(opts => Object.keys(opts).forEach(n => {
    if (full[s][n.split(' ')[0].toLowerCase()]) delete opts[n]; })));
  const display = (s, raw) => {
    const opts = full[s][lastName(raw)];
    if (raw.includes(' ') || !opts || !Object.keys(opts).length) return raw;
    return Object.entries(opts).sort((a, b) => b[1] - a[1])[0][0];
  };
  // A player by name. Full names stay apart ("Mason Rush", "Brody Rush"); a bare last name ("Vega") joins the one
  // player with that last name; and a full name takes over a bare one met earlier.
  const player = (s, raw) => {
    raw = raw.trim();
    if (/^team$/i.test(raw)) return out.pl[s].team || (out.pl[s].team = {});
    const name = display(s, raw), k = lastName(name), keys = Object.keys(out.pl[s]).filter(n => n !== 'team');
    const exact = keys.find(n => n.toLowerCase() === name.toLowerCase()), same = keys.filter(n => lastName(n) === k);
    if (exact) return out.pl[s][exact];
    if (!name.includes(' ')) return same.length === 1 ? out.pl[s][same[0]] : (out.pl[s][name] = {});
    const bare = same.find(n => !n.includes(' '));
    if (bare){ out.pl[s][name] = out.pl[s][bare]; delete out.pl[s][bare]; return out.pl[s][name]; }
    return (out.pl[s][name] = {});
  };
  // Kickers go by last name, sometimes with a stray word ("from Quinn Vega kick)"): the one player with that last name.
  const kicker = (s, raw) => {
    const k = lastName(raw), same = Object.keys(out.pl[s]).filter(n => n !== 'team' && lastName(n) === k);
    return same.length === 1 ? out.pl[s][same[0]] : player(s, raw);
  };
  const add = (o, k, v) => { o[k] = (o[k] || 0) + v; };
  // Numbers in "14-94", "3--5", "2-(-33)" or "1-(4)"; a number in parentheses is a loss.
  const nums = s => [...s.replace(/(\d)\s*-\s*-(\d+)/g, '$1-(-$2)').matchAll(/\((-?\d+)\)|(\d+)/g)].map(m => m[1] != null ? -Math.abs(+m[1]) : +m[2]);
  const tds = rest => { const m = rest.match(/(\d+)?\s*TDs?\b/i); return m ? +(m[1] || 1) : 0; };
  // A section's body, split at each team's name: "Andover — …. Hutchinson — …".
  const splitTeams = body => {
    // One-letter labels ("W", "C") mark scoring plays but are too short to split a stat line on.
    const alts = [...new Set([...out.names, ...out.scoring.map(e => e.label)])].filter(a => a && a.length > 1).sort((a, b) => b.length - a.length);
    const re = new RegExp(`(?:^|[.;:)]\\s*)(${alts.map(escRe).join('|')})\\s*(?:[—–:,]|\\s-)\\s*`, 'gi'), hits = [...body.matchAll(re)];
    return hits.map((h, i) => [sideOf(h[1]), body.slice(h.index + h[0].length, i + 1 < hits.length ? hits[i + 1].index : undefined)]).filter(x => x[0]);
  };
  for (const sc of sections){
    const kind = /^RUSH/.test(sc.kind) ? 'rush' : /^PASS/.test(sc.kind) ? 'pass' : /^REC/.test(sc.kind) ? 'rec' : '';
    if (!kind){ out.warn.push(`${sc.kind[0]}${sc.kind.slice(1).toLowerCase()} lines aren’t read yet, so they’re left out.`); continue; }
    // Passing columns follow the heading's "(cmp-att-yds-td-int)" when it has one; otherwise see passOrder.
    const order = kind === 'pass' ? ((sc.head.match(/\(([a-z-]+)\)/i) || [])[1] || '').toLowerCase().split('-').filter(Boolean) : null;
    for (const [s, part] of splitTeams(sc.body)){
      // Players are split by semicolons, or by commas when the next thing is another player ("Chattam 16-133, Bergeson
      // 10-124"); a comma before "TD" or "3 TD" stays with its player.
      part.split(/;\s*|\.\s+(?=totals?\b)/i).flatMap(x => x.split(/,\s*(?=[A-Za-z][A-Za-z.'’ -]*\s\(?-?\d+\)?\s*-\s*\(?-?\d)/))
        .map(x => x.trim().replace(/\.$/, '')).filter(Boolean).forEach(item => {
        const tot = item.match(/^totals?:?\s*(.*)$/i);
        if (tot){ const v = nums(tot[1]); if (kind === 'rush' && v.length >= 2) Object.assign(out.team[s], {rushN:v[0], rushY:v[1]}); return; }
        const m = item.match(/^(.+?)\s+(\(?-?\d+\)?(?:\s*-\s*\(?-?\d+\)?)+)(.*)$/);
        if (!m) return;
        const v = nums(m[2]), p = player(s, m[1]), td = tds(m[3]);
        if (kind === 'rush'){ add(p, 'ru', v[0] || 0); add(p, 'ry', v[1] || 0); add(p, 'rtd', td); }
        if (kind === 'rec'){ add(p, 're', v[0] || 0); add(p, 'rey', v[1] || 0); add(p, 'retd', td); }
        if (kind === 'pass'){
          const f = {}; (order.length ? order : passOrder(v)).forEach((k, i) => { f[k] = v[i] || 0; });
          add(p, 'pc', f.cmp || f.c || 0); add(p, 'pa', f.att || f.a || 0); add(p, 'py', f.yds || f.y || 0); add(p, 'ptd', f.td || 0); add(p, 'pint', f.int || f.i || 0);
        }
      });
    }
  }
  // Stat lines that don't mark touchdowns get them from the scoring summary, written either way round: "Bergeson 48 run",
  // "Cosby 17 pass from Wilbur", "1 yd run Carter Green", "26 yd pass Kane Ast to Ryan Stiner". Whatever the stat lines
  // do mark ("Quinn 14-92, TD", or a TD column in the passing line) is left as it is.
  const YD = String.raw`\d+\s*(?:-?\s*(?:yd|yard)s?\.?)?`;
  const RUN = [new RegExp(String.raw`^(.+?)\s+${YD}\s+run\b`, 'i'), new RegExp(String.raw`^${YD}\s+run\s+(?:by\s+)?(.+)$`, 'i')];
  const PASS = [[new RegExp(String.raw`^(.+?)\s+${YD}\s+pass\s+from\s+(.+)$`, 'i'), 1, 2],        // receiver, passer
                [new RegExp(String.raw`^${YD}\s+pass\s+(?:from\s+)?(.+?)\s+to\s+(.+)$`, 'i'), 2, 1]];  // passer, receiver
  const RETS = String.raw`(?:fumble|interception|int|kickoff|kick|punt|blocked\s+(?:punt|kick|field\s+goal|fg))`;
  const RET = [new RegExp(String.raw`^(.+?)\s+${YD}\s+${RETS}\s+return\b`, 'i'), new RegExp(String.raw`^${YD}\s+${RETS}\s+return\s+(?:by\s+)?(.+)$`, 'i')];
  ['A', 'H'].forEach(s => {
    const has = k => Object.values(out.pl[s]).some(p => p[k]), noR = !has('rtd'), noRe = !has('retd'), noP = !has('ptd');
    out.scoring.filter(e => e.side === s && e.how === 'TD').map(e => e.desc.split('(')[0].trim()).forEach(d => {
      const r = RUN.map(re => d.match(re)).find(Boolean);
      if (r){ if (noR) add(player(s, r[1]), 'rtd', 1); return; }
      for (const [re, ri, qi] of PASS){
        const m = d.match(re);
        if (m){ if (noRe) add(player(s, m[ri]), 'retd', 1); if (noP) add(player(s, m[qi]), 'ptd', 1); return; }
      }
      // Return touchdowns ("Higgins 4 fumble return", "22 yd punt return Smith"); no stat line carries these.
      const t = RET.map(re => d.match(re)).find(Boolean);
      if (t) add(player(s, t[1]), 'rettd', 1);
    });
  });
  // Kickers, from the scoring summary: "Vega 29 FG", "(Pete Vega kick)".
  out.scoring.forEach(e => {
    if (e.how === 'FG'){
      // "Vega 29 FG" or "29 yd FG Vega"
      const m = e.desc.match(/^(.+?)\s+(\d+)\s*(?:-?\s*(?:yd|yard)s?\.?)?\s*(?:FG|field goal)/i);
      const m2 = e.desc.match(/^(\d+)\s*(?:-?\s*(?:yd|yard)s?\.?)?\s*(?:FG|field goal)\s+(?:by\s+)?([A-Z][^(]*?)\s*(?:\(|$)/i);
      const who = m && !/^\d+$/.test(m[1]) ? [m[1], m[2]] : m2 ? [m2[2], m2[1]] : null;
      if (who){ const p = kicker(e.side, who[0]); add(p, 'fga', 1); add(p, 'fgm', 1); p.fglg = Math.max(p.fglg || 0, +who[1]); }
    }
    if (e.how === 'TD'){
      const i = e.desc.lastIndexOf('('), km = (i >= 0 ? e.desc.slice(i + 1) : e.desc).match(/([A-Z][\w'’.-]*(?: [A-Z][\w'’.-]*)?)\s+kick\b(.*)$/);
      if (km){ const p = kicker(e.side, km[1]); add(p, 'xpa', 1); if (!/fail|no good|miss|block/i.test(km[2])) add(p, 'xpm', 1); }
      // A good two-point try goes to whoever scored it: "(Ecot pass from Meeker)", "(Ast pass to Green)", "(Carter Green run)".
      if (e.pts === 8){
        const j = e.desc.lastIndexOf('('), t = j >= 0 ? e.desc.slice(j + 1).replace(/\)\s*$/, '').trim() : '';
        const m2 = t.match(/^(.+?)\s+pass\s+from\b/i) || t.match(/\bto\s+(.+)$/i) || t.match(/^(.+?)\s+(?:run|rush)\b/i);
        if (m2) add(player(e.side, m2[1]), 'two', 1);
      }
    }
  });
  ['A', 'H'].forEach(s => {
    const t = out.team[s], ps = Object.values(out.pl[s]), sum = k => ps.reduce((a, p) => a + (p[k] || 0), 0);
    if (t.rushN == null){ t.rushN = sum('ru'); t.rushY = sum('ry'); }
    Object.assign(t, {passC:sum('pc'), passA:sum('pa'), passY:sum('py'), passTD:sum('ptd'), passInt:sum('pint')});
  });
  // Quarters for the scoring plays, when the summary has no quarter headings: each team's running score
  // against its line score, quarter by quarter.
  if (!out.scoring.some(e => e.q)){
    const nq = Math.max(out.lines.A.length, out.lines.H.length), run = {A:0, H:0}, thru = (s, i) => out.lines[s].slice(0, i + 1).reduce((a, b) => a + b, 0);
    let q = 0;
    out.scoring.forEach(e => { run[e.side] += e.pts; while (q < nq - 1 && thru(e.side, q) < run[e.side]) q++; e.q = q + 1; });
  }
  ['A', 'H'].forEach((s, i) => {
    const pts = out.scoring.filter(e => e.side === s).reduce((a, e) => a + e.pts, 0);
    if (out.scoring.length && pts !== out.total[s]) out.warn.push(`The scoring plays add up to ${pts} for ${out.names[i]}, but the line score says ${out.total[s]}. The line score is what counts.`);
  });
  out.ok = true;
  return out;
}
// The scoreboard entry a pasted box score belongs to when it wasn't opened from one: a scheduled game or quick
// score between the same two schools, in the week of the game date (or the only such game there is).
const samePair = (p, x) => !!x.teams && ((sameSchool(p.names[0], x.teams.A.name) && sameSchool(p.names[1], x.teams.H.name))
  || (sameSchool(p.names[0], x.teams.H.name) && sameSchool(p.names[1], x.teams.A.name)));
const weekOfDate = date => /^\d{4}-\d\d-\d\d$/.test(date || '') ? weekKey(fromYmd(date).getTime()) : null;
function boxMatch(p, date){
  if (!p.ok) return null;
  const all = Object.values(qsLib()).filter(x => !x.deleted && samePair(p, x)), wk = weekOfDate(date);
  return all.find(x => gameWeek(x) === wk) || (all.length === 1 ? all[0] : null);
}
// A box score this device already has for the same two schools that week: pasting again updates it.
function boxPrior(p, date){
  if (!p.ok) return null;
  const wk = weekOfDate(date);
  return Object.values(db.games).find(y => y.box && samePair(p, y) && gameWeek(y) === wk) || null;
}
function swapBox(p){
  const sw = o => { const a = o.A; o.A = o.H; o.H = a; };
  [p.lines, p.total, p.pl, p.team].forEach(sw); p.names.reverse();
  p.scoring.forEach(e => { e.side = e.side === 'A' ? 'H' : 'A'; });
}

// A saved box score is read again from its pasted text each time it's shown, so a fix to the reader reaches games
// already saved, for everyone. The game's own team order wins over the paper's.
const boxCache = new Map();
function boxData(game){
  const b = game.box, T = game.teams;
  if (!b.src || !T) return b;
  const key = `${T.A.name}|${T.H.name}|${b.src}`;
  if (!boxCache.has(key)){
    const p = parseBox(b.src);
    if (p.ok && !sameSchool(p.names[0], T.A.name) && sameSchool(p.names[0], T.H.name) && sameSchool(p.names[1], T.A.name)) swapBox(p);
    boxCache.set(key, p.ok ? {lines:p.lines, total:p.total, scoring:p.scoring, pl:p.pl, team:p.team} : b);
  }
  return boxCache.get(key);
}
// The replay's totals for a box-score game (called from replay).
function boxInto(game, st, S, scoring){
  const b = boxData(game);
  ['A', 'H'].forEach(s => {
    const q = b.lines[s] || [];
    st.lines[s] = [0, 1, 2, 3, 4].map(i => +q[i] || 0);
    st.score[s] = b.total && b.total[s] != null ? +b.total[s] : st.lines[s].reduce((a, v) => a + v, 0);
    Object.assign(S.team[s], b.team[s] || {});
    S.pl[s] = {};
    // Longest gains and sacks aren't in a box score: blank, not zero.
    Object.entries(b.pl[s] || {}).forEach(([k, p]) => { S.pl[s][k] = Object.assign(zeros(PL_KEYS), {plg:'', rlg:'', relg:'', psk:''}, p, {n:k}); });
  });
  Object.assign(st, {final:true, phase:'final', q:Math.max(b.lines.A.length, b.lines.H.length) > 4 ? 5 : 4, drive:null});
  const run = {A:0, H:0};
  (b.scoring || []).forEach(e => { run[e.side] += e.pts || 0; scoring.push({q:e.q || 4, clk:null, side:e.side, how:e.how, desc:e.desc, A:run.A, H:run.H, i:-1}); });
}

/* ---------- the paste-a-box-score window ---------- */
function boxPreview(p){
  if (!p.names.length) return '<p class="hint" style="margin:0">Paste the box score above. It needs at least the line score: each team, its quarter scores and the total.</p>';
  if (!p.ok) return `<p class="hint bx-warn" style="margin:0">${esc(p.error)}</p>`;
  const players = ['A', 'H'].reduce((a, s) => a + Object.keys(p.pl[s]).filter(k => k !== 'team').length, 0);
  // Say where it goes: over an earlier box score for the same game, over its scoreboard card, or in as a new game.
  const dateNow = ($('#bx-date') || {}).value, from = ui.boxGame ? null : ui.boxFrom ? qsLib()[ui.boxFrom] : boxMatch(p, dateNow);
  const prior = ui.boxGame ? null : boxPrior(p, (from && from.date) || dateNow);
  const where = w => `${esc(w.teams.A.name)} at ${esc(w.teams.H.name)}, ${esc(weekLabel(gameWeek(w)))}`;
  const goes = ui.boxGame || (ui.boxFrom && !prior) ? '' : `<div class="muted">${prior ? `Updates your earlier box score for ${where(prior)}.`
    : from ? `Replaces ${where(from)} on the scoreboard.` : 'Goes on the scoreboard as a new game.'}</div>`;
  return `<div class="bx-sum"><b>${esc(p.names[0])} ${p.total.A}, ${esc(p.names[1])} ${p.total.H}</b> · Final
      <div class="muted">${p.scoring.length} scoring plays · ${players} players with stats</div>${goes}</div>
    ${p.warn.map(w => `<p class="hint bx-warn">${esc(w)}</p>`).join('')}`;
}
function dlgBox(){
  const old = ui.boxGame && db.games[ui.boxGame], from = !old && ui.boxFrom ? qsLib()[ui.boxFrom] : null, who = old || from;
  const src = old && old.box ? old.box.src || '' : '', date = who ? ymd(gameDay(who)) : scoreDefaultDate();

function saveBox(){

}

/* ================================================================
   BUCO Stats (?stats, or ?stats=rushing etc.): season stats for the
   Butler County schools, laid out like ESPN's stats pages, from every
   game that's been statted, live or entered from a box score. Quick
   scores have no stats, so they aren't counted. Built from the shared
   games, like the scoreboard, so everyone sees the same page.
   No defense: tackles and sacks are never complete (box scores don't
   carry them). Nor first downs, third downs, penalties or fumbles,
   which only live-statted games have.

const COUNTY_PAGE = new URLSearchParams(location.search).has('stats');
const COUNTY = ['Andover', 'Andover Central', 'Augusta', 'Bluestem', 'Circle', 'Douglass', 'El Dorado', 'Flinthills', 'Remington', 'Rose Hill'];
const COUNTY_ALIASES = {Bluestem:['Leon-Bluestem'], Circle:['Towanda-Circle'], Remington:['Whitewater-Remington']};

const C_VIEWS = ['passing', 'rushing', 'receiving', 'scoring', 'kicking', 'team'];
const county = {games:null, err:'', team:'all', season:new Date().getFullYear(), view:'passing', sort:{}};

async function startCounty(){
  ui.viewer = true; ui.county = true; document.body.classList.add('viewer', 'board');
  $('#board').hidden = false; $('#gtitle').textContent = '';

  const want = new URLSearchParams(location.search).get('stats');
  if (C_VIEWS.includes(want)) county.view = want;
  loadLogos(); renderCounty();
  try {
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-`;
    const [appM, fsM] = await Promise.all([import(base + 'app.js'), import(base + 'firestore.js')]);
    const fsdb = fsM.getFirestore(appM.initializeApp(firebaseConfig));
    fsM.onSnapshot(fsM.query(fsM.collection(fsdb, 'pressbox'), fsM.where('public', '==', true)), snap => {
      const games = [];
      snap.forEach(d => {
        const v = d.data(); if (v.deleted || v.kind === 'score' || !v.json) return;

/* ---------- the numbers ---------- */
const seasonOf = x => fromYmd(gameWeek(x)).getFullYear();
function countySeasons(){
  const ys = new Set([new Date().getFullYear()]);
  (county.games || []).forEach(x => ys.add(seasonOf(x)));
  return [...ys].sort((a, b) => b - a);
}
// The season's statted games, one per matchup a week: a game entered twice counts once, the newest copy.
function countyGames(){
  const season = new Set(seasonKeys(county.season)), pick = {};
  (county.games || []).forEach(x => {
    if (!season.has(gameWeek(x))) return;
    const k = gameWeek(x) + '|' + [x.teams.A.name, x.teams.H.name].map(canonSchool).sort().join('|');
    if (!pick[k] || (x.updated || 0) > (pick[k].updated || 0)) pick[k] = x;
  });
  return Object.values(pick);
}
const T_KEYS = ['rushN', 'rushY', 'passC', 'passA', 'passY', 'passTD', 'passInt'];
const C_KEYS = ['pc', 'pa', 'py', 'ptd', 'pint', 'ru', 'ry', 'rtd', 're', 'rey', 'retd', 'ret', 'two', 'fgm', 'fga', 'xpm', 'xpa'];
function countyStats(games){
  // Each team's own offense and, from the other side of the same games, what opponents did against it ('o' keys).
  const blank = c => Object.assign({name:c, gp:0, w:0, l:0, t:0, pf:0, pa:0, qf:[0, 0, 0, 0, 0], qa:[0, 0, 0, 0, 0], ot:false},
    zeros(T_KEYS), zeros(T_KEYS.map(k => 'o' + k)));
  const teams = Object.fromEntries(COUNTY.map(c => [c, blank(c)])), players = {};
  for (const x of games){
    const r = replay(x), st = r.st;
    ['A', 'H'].forEach(s => {
      const c = countyOf(x.teams[s].name); if (!c) return;
      const o = other(s), T = teams[c], S = r.S.team[s], O = r.S.team[o];
      T.gp++; T.pf += st.score[s]; T.pa += st.score[o];
      T_KEYS.forEach(k => { T[k] += +S[k] || 0; T['o' + k] += +O[k] || 0; });
      for (let i = 0; i < 5; i++){ T.qf[i] += +st.lines[s][i] || 0; T.qa[i] += +st.lines[o][i] || 0; }
      if (st.q > 4 || st.lines[s][4] || st.lines[o][4]) T.ot = true;
      if (st.final) T[st.score[s] > st.score[o] ? 'w' : st.score[s] < st.score[o] ? 'l' : 't']++;
      Object.values(r.S.pl[s]).forEach(p => {
        if (p.n === 'team') return;
        // A statted game keys players by number (named from its roster); a box score keys them by name.
        const name = /^\d+$/.test(p.n) ? (x.teams[s].roster || {})[p.n] || `#${p.n}` : p.n;
        // Return touchdowns: a box score's own count, or a statted game's touchdowns that weren't runs or catches.
        const row = Object.assign({}, p, {ret:(+p.rettd || 0) + Math.max(0, (+p.tds || 0) - (+p.rtd || 0) - (+p.retd || 0)), two:+p.two || 0});
        if (!C_KEYS.some(k => +row[k])) return;
        const key = `${c}|${name.toLowerCase()}`;
        const P = players[key] || (players[key] = Object.assign({name, team:c, gp:0}, zeros(C_KEYS)));
        P.gp++; C_KEYS.forEach(k => { P[k] += +row[k] || 0; });
      });
    });
  }
  // A bare last name from one box score ("Vega") joins the one full name on that team with it ("Pete Vega").
  Object.values(players).forEach(P => {
    if (P.name.includes(' ') || P.name.startsWith('#')) return;
    const k = P.name.toLowerCase(), full = Object.values(players).filter(Q => Q !== P && Q.team === P.team && Q.name.includes(' ') && lastName(Q.name) === k);
    if (full.length !== 1) return;
    const Q = full[0]; Q.gp += P.gp; C_KEYS.forEach(n => { Q[n] += P[n]; });
    delete players[`${P.team}|${k}`];
  });
  // One player spelled two ways in different box scores ("Kirchhoff-Jones", "Kirchoff-Jones"): same team, same first
  // name, last names one letter apart. The one with more games keeps the spelling.
  const oneOff = (a, b) => {
    if (a === b || Math.abs(a.length - b.length) > 1) return a === b;
    let i = 0; while (i < a.length && a[i] === b[i]) i++;
    return a.slice(i + (a.length >= b.length ? 1 : 0)) === b.slice(i + (b.length >= a.length ? 1 : 0));
  };
  const split = n => { const p = n.toLowerCase().split(/\s+/); return [p[0], p.slice(1).join(' ')]; };
  const list = Object.entries(players);
  list.forEach(([k1, P]) => list.forEach(([k2, Q]) => {
    if (k1 === k2 || !players[k1] || !players[k2] || P.team !== Q.team || !P.name.includes(' ') || !Q.name.includes(' ')) return;
    const [f1, l1] = split(P.name), [f2, l2] = split(Q.name);
    if (f1 !== f2 || l1 === l2 || Math.min(l1.length, l2.length) < 5 || !oneOff(l1, l2)) return;
    const [keep, drop, dk] = P.gp >= Q.gp ? [P, Q, k2] : [Q, P, k1];
    keep.gp += drop.gp; C_KEYS.forEach(n => { keep[n] += drop[n]; }); delete players[dk];
  }));
  return {teams:Object.values(teams), players:Object.values(players)};
}

/* ---------- views. A column is [heading, value to sort by (null: none), decimals, text to show instead] ---------- */
const num = v => v == null || Number.isNaN(v) ? null : v;
const per = (a, b) => b ? a / b : null;
const tdAll = p => p.rtd + p.retd + p.ret;
const ptsOf = p => 6 * tdAll(p) + 3 * p.fgm + p.xpm + 2 * p.two;
// Passer rating, the NFL formula: four parts, each held between 0 and 2.375, so it runs 0 to 158.3.
const rating = p => {
  if (!p.pa) return null;
  const part = v => Math.max(0, Math.min(2.375, v));
  return (part((p.pc / p.pa - 0.3) * 5) + part((p.py / p.pa - 3) * 0.25) + part(p.ptd / p.pa * 20) + part(2.375 - p.pint / p.pa * 25)) / 6 * 100;
};
const P_VIEWS = {
  passing:{label:'Passing', keep:p => p.pa > 0, def:3, cols:[['CMP', p => p.pc], ['ATT', p => p.pa], ['CMP%', p => per(100 * p.pc, p.pa), 1], ['YDS', p => p.py],
    ['AVG', p => per(p.py, p.pa), 1], ['TD', p => p.ptd], ['INT', p => p.pint], ['RTG', rating, 1]]},
  rushing:{label:'Rushing', keep:p => p.ru > 0, def:1, cols:[['ATT', p => p.ru], ['YDS', p => p.ry], ['AVG', p => per(p.ry, p.ru), 1], ['TD', p => p.rtd]]},
  receiving:{label:'Receiving', keep:p => p.re > 0 || p.rey !== 0, def:1, cols:[['REC', p => p.re], ['YDS', p => p.rey], ['AVG', p => per(p.rey, p.re), 1], ['TD', p => p.retd]]},
  scoring:{label:'Scoring', keep:p => ptsOf(p) > 0, def:7, groups:[['TOUCHDOWNS', 4], ['SCORING', 5]], cols:[['RUSH', p => p.rtd], ['REC', p => p.retd], ['RET', p => p.ret], ['TD', tdAll],
    ['FG', p => p.fgm], ['XP', p => p.xpm], ['2PT', p => p.two], ['PTS', ptsOf], ['PTS/G', p => per(ptsOf(p), p.gp), 1]]},
  kicking:{label:'Kicking', keep:p => p.fga > 0 || p.xpa > 0, def:6, cols:[['FGM', p => p.fgm], ['FGA', p => p.fga], ['FG%', p => per(100 * p.fgm, p.fga), 1],
    ['XPM', p => p.xpm], ['XPA', p => p.xpa], ['XP%', p => per(100 * p.xpm, p.xpa), 1], ['PTS', p => 3 * p.fgm + p.xpm]]}};
const C_TABS = [['offense', 'Offense', 'passing'], ['scoring', 'Scoring', 'scoring'], ['special', 'Special Teams', 'kicking'], ['team', 'Team Stats', 'team']];
const tabOf = v => ({passing:'offense', rushing:'offense', receiving:'offense', scoring:'scoring', kicking:'special', team:'team'})[v];
const signed = v => `${v > 0 ? '+' : ''}${v.toFixed(1)}`;
const T_COLS = [['GP', t => t.gp], ['W-L', t => t.gp ? (t.w + t.t / 2) / t.gp + t.w / 1000 : null, 0, t => `${t.w}-${t.l}${t.t ? `-${t.t}` : ''}`],
  ['PF', t => t.pf], ['PA', t => t.pa], ['PF/G', t => per(t.pf, t.gp), 1], ['PA/G', t => per(t.pa, t.gp), 1],
  ['MARGIN/G', t => per(t.pf - t.pa, t.gp), 1, t => signed((t.pf - t.pa) / t.gp)]];
// The same columns for a team's own offense (p '') and for what its opponents did against it (p 'o').
function yardCols(p){
  const k = (t, n) => t[p + n], ry = t => k(t, 'rushY'), py = t => k(t, 'passY'), plays = t => k(t, 'rushN') + k(t, 'passA');
  return [['RUSH', t => k(t, 'rushN')], ['RUSH YDS', ry], ['RUSH/G', t => per(ry(t), t.gp), 1], ['YDS/CAR', t => per(ry(t), k(t, 'rushN')), 1],
    ['C/ATT', t => k(t, 'passC'), 0, t => `${k(t, 'passC')}/${k(t, 'passA')}`], ['PASS YDS', py], ['PASS/G', t => per(py(t), t.gp), 1], ['PASS TD', t => k(t, 'passTD')],
    [p ? 'INT MADE' : 'INT', t => k(t, 'passInt')], ['TOTAL YDS', t => ry(t) + py(t)], ['YDS/G', t => per(ry(t) + py(t), t.gp), 1], ['YDS/PLAY', t => per(ry(t) + py(t), plays(t)), 1]];
}
// Points for and against each quarter ("21-7"), sorted by the margin; halves after, and OT once there's been one.
function quarterCols(ot){
  const q = (t, i) => [i.reduce((a, n) => a + t.qf[n], 0), i.reduce((a, n) => a + t.qa[n], 0)];
  const col = (label, ...i) => [label, t => { const [f, a] = q(t, i); return f - a; }, 0, t => q(t, i).join('-')];
  return [col('1ST', 0), col('2ND', 1), col('3RD', 2), col('4TH', 3), ...(ot ? [col('OT', 4)] : []), col('1ST HALF', 0, 1), col('2ND HALF', 2, 3)];

/* ---------- the table, ESPN style: rank, name, then numbers; the sorted column shaded ---------- */
function statTable(id, rows, cols, def, o){
  const s = county.sort[id] || {i:def, desc:!o.asc}, key = r => num(cols[s.i][1](r));
  // A team with no games yet always sorts to the bottom, whichever way the column runs; so do blanks.
  const sorted = rows.slice().sort((a, b) => {
    if ((a.gp === 0) !== (b.gp === 0)) return a.gp === 0 ? 1 : -1;
    const x = key(a), y = key(b);
    if (x == null || y == null) return (x == null) - (y == null) || a.name.localeCompare(b.name);
    return (s.desc ? y - x : x - y) || a.name.localeCompare(b.name);
  });
  let rank = 0, prev;   // ties share a rank
  const rk = sorted.map((r, i) => { const v = key(r); if (i === 0 || v !== prev) rank = i + 1; prev = v; return rank; });
  const cell = (c, r) => {
    if (r.gp === 0 && c[0] !== 'GP') return '—';
    if (c[3]) return c[3](r);
    const v = num(c[1](r)); return v == null ? '—' : c[2] ? v.toFixed(c[2]) : Math.round(v * 10) / 10;
  };

  return `<div class="tbl-wrap"><table class="ctbl"><thead>${groups}<tr><th class="rk">RK</th><th class="nm">${o.first || 'NAME'}</th>
      ${cols.map((c, i) => `<th class="num${i === s.i ? ' on' : ''}" data-csort="${id}:${i}"><span>${c[0]}</span>${i === s.i ? `<i>${s.desc ? '▾' : '▴'}</i>` : ''}</th>`).join('')}</tr></thead>
    <tbody>${sorted.map((r, j) => `<tr${o.hi && o.hi(r) ? ' class="hi"' : ''}><td class="rk">${rk[j]}</td><td class="nm"><div class="cn-in">${o.name(r)}</div></td>
      ${cols.map((c, i) => `<td class="num${i === s.i ? ' on' : ''}">${esc(String(cell(c, r)))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const cMark = name => markFor({name, abbr:shortName(name), color:'#4A4B4D'}, 33);

      const qcols = quarterCols(teams.some(t => t.ot));
      body = card('Team Totals', 'team', T_COLS, 1) + card('Offense', 'off', yardCols(''), 10) + card('Defensive Team Stats', 'allow', yardCols('o'), 10, true)
        + card('Scoring by Quarter (for-against)', 'qtr', qcols, qcols.length - 2);
    } else {
      const V = P_VIEWS[v], rows = players.filter(p => V.keep(p) && (county.team === 'all' || p.team === county.team));
      const name = p => `${cMark(p.team)}<span class="c-pl"><b>${esc(p.name)}</b><small>${esc(shortName(p.team))}</small></span>`;
      body = `<section class="bcard ccard">${rows.length ? statTable(v, rows, V.cols, V.def, {name, groups:V.groups})
        : `<p class="bempty" style="padding:4px 20px 10px">No ${V.label.toLowerCase()} stats yet${county.team === 'all' ? '' : ` for ${esc(county.team)}`}.</p>`}</section>`;
    }
  }
  box.innerHTML = head + body;
}
document.addEventListener('click', e => {
  if (!ui.county || !e.target.closest) return;
  const vb = e.target.closest('[data-cview]');
  if (vb){ county.view = vb.dataset.cview; history.replaceState(null, '', `?stats=${county.view}`); return renderCounty(); }
  const th = e.target.closest('[data-csort]'); if (!th) return;
  const [id, i] = th.dataset.csort.split(':'), cur = county.sort[id];
  county.sort[id] = {i:+i, desc:cur && cur.i === +i ? !cur.desc : true};
  renderCounty();
});
document.addEventListener('change', e => {
  if (!ui.county) return;
  if (e.target.id === 'cteam'){ county.team = e.target.value; renderCounty(); }
  if (e.target.id === 'cseason'){ county.season = +e.target.value; renderCounty(); }
});

/* ---------- sample game: made-up teams and plays, typed in shorthand ---------- */
function sampleGame(){
  const A = {name:'North Eagles', mascot:'Eagles', abbr:'NOR', color:'#1F4E9C', roster:{7:'Cole Brandt', 22:'Mason Ortiz', 11:'Tyler Reyes', 84:'Jace Miller', 15:'Luke Dean', 54:'Gavin Hart', 24:'Eli Novak', 90:'Owen Pratt', 72:'Sam Keller'}};
  const H = {name:'South Rams', mascot:'Rams', abbr:'SOU', color:'#8A1C2B', roster:{3:'Brody Kemp', 28:'Isaiah Ford', 1:'Kade Sims', 80:'Nolan Beck', 19:'Ryan Kast', 44:'Drew Lang', 5:'Cam Ward', 97:'Trey Hale'}};
  const s = {id:'sample', sample:2, created:Date.now(), teams:{A, H}, set:{qtr:12, ot:10, firstKick:'H'}, plays:[], clk:{s:156, run:false, at:0}};
  const lines = [
    [720, 'N ball at N32 1-10'], [712, '22-5 @44'], [688, '7-11-14 @5'], [655, '22--2 @97'], [630, '7-inc-84 @5'],
    [624, '7-84-16 @44'], [590, '22-9 @44 @5'], [561, '7-3'], [535, '7-11-23-td'], [535, '15-xp'],
    [535, 'S ball at S20'], [520, '28-4 @54'], [489, '3-sack-7-90'], [470, 'to S'], [470, '3-1-9 @24'],
    [441, 'S punt'], [441, 'N ball at N39'], [418, '22-12 @5 pen N 10 hold 72 np'], [396, '7-int-5-12'],
    [396, 'S ball at N35'], [370, '28-7 @54'], [352, 'pen S 5 fs'], [350, '3-80-12 @24'], [318, '28-21-td'],
    [318, '3-1-no'], [318, 'N ball at N28'], [300, '22-6 @97'], [276, '7-11-31 @5'], [250, '22--1 @44'],
    [226, '7-inc'], [220, '7-84-8 @44'], [185, '15-fg'], [185, 'S ball at S26'], [171, '28-3 @90 @54']];
  const keep = g; g = s;
  try {
    for (const [clk, line] of lines){
      const r = parseQuick(line, replay(s).st);
      if (r && r.play) s.plays.push(JSON.parse(JSON.stringify({...r.play, clk})));
    }
  } finally { g = keep; }
  return s;
}

/* ---------- boot ---------- */
if (BOARD) startScoreboard();           // ?scores: the week's scoreboard, read-only
else if (COUNTY_PAGE) startCounty();    // ?stats: the county's season stats, read-only
else if (LIVE_ID) startViewer(LIVE_ID); // a shared link: watch that game, read-only
else {
  load();
  if (db.games.sample && db.games.sample.sample !== 2) db.games.sample = sampleGame();
  seedTeamLibrary();
  seedSchedule();         // the 2026 Butler County schedule, loaded once as scheduled games
  // ?edit=<id>, from the Edit button on a game's own page: open that game here, then tidy the address.
  const EDIT_ID = new URLSearchParams(location.search).get('edit');
  g = (EDIT_ID && db.games[EDIT_ID]) || db.games[db.cur] || Object.values(db.games)[0];
  if (EDIT_ID) history.replaceState(null, '', location.pathname);
  if (!g) g = sampleGame();
  setCurrent();
  refresh();
  startSync();
}
