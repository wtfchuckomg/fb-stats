    if (!d || d.deleted || (!d.public && !asAdmin)) return gone();
    if (!d.public && !noted){ noted = true; toast('Private game: only you, as the admin, can see it'); }
    // On the site itself the address becomes the game's preview link (/g/<id>/), so copying it and posting it shows
    // this game on social media. Only once that page exists: a brand-new game's link stays ?game=, which previews
    // as the site. The base keeps the page's own links pointing at the site.
    if (d.public && location.hostname === 'stats.kansasmediarankings.com' && !location.pathname.startsWith('/g/') && !startViewer.checked){
      startViewer.checked = true;
      fetch(`/g/${encodeURIComponent(id)}/`, {method:'HEAD'}).then(r => {
        if (!r.ok || location.pathname.startsWith('/g/')) return;
        if (!document.querySelector('base')){ const b = document.createElement('base'); b.href = '/'; document.head.prepend(b); }
        const tab = new URLSearchParams(location.search).get('tab');
        history.replaceState(null, '', `/g/${encodeURIComponent(id)}/${tab ? `?tab=${encodeURIComponent(tab)}` : ''}`);
      }).catch(() => {});
    }
    let game; try { game = soundGame(JSON.parse(d.json)); } catch (e) { return; }
    if (!game) return gone();   // a half-written copy: nothing to show, and it must not break the page
    g = game; $('#tabs').hidden = false;
    refresh(); viewerTools(id);
    const [hi, lo] = R.st.score.H > R.st.score.A ? ['H', 'A'] : ['A', 'H'];   // the higher score first, like the link's preview
    document.title = `${g.teams[hi].name} ${R.st.score[hi]}, ${g.teams[lo].name} ${R.st.score[lo]} · Kansas Media Stats`;
  }, gone);
  setInterval(renderLive, 5000);
}

/* ================================================================
   Saved teams: each school's short name, color and roster, kept so a

   to the account as one private "teams-<uid>" document in the same
   pressbox collection (so the existing Firestore rules already cover it).

const teamKey = s => String(s || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

const teamLib = () => db.teams || (db.teams = {});
const savedTeams = () => Object.values(teamLib()).filter(t => !t.deleted && t.name).sort((a, b) => a.name.localeCompare(b.name));
function findTeam(name){ const t = teamLib()[teamKey(name)]; return t && !t.deleted ? t : null; }

function parseRosterText(txt){
  const o = {};
  // "35 /50 Nathan Miller SR": the first number is the player's, the second rides along in the name — drop it.
  String(txt || '').split('\n').forEach(l => { const m = l.match(/^\s*#?(\d{1,2})\s*[-–,.:)]?\s*(.+?)\s*$/); if (m) o[m[1]] = m[2].replace(/^[\/,&]?\s*\d{1,2}\s+(?=\D)/, ''); });

}
// From a game's Setup. A newer save wins, and an empty roster or mascot never wipes out a saved one.
function rememberTeam(t, when = Date.now()){
  const k = teamKey(t.name); if (DEFAULT_TEAM_NAMES.includes(k)) return false;
  const cur = teamLib()[k];
  if (cur && (cur.updated || 0) > when) return false;
  const keep = cur && !cur.deleted ? cur : {};
  teamLib()[k] = {name:t.name, mascot:t.mascot || keep.mascot || '', abbr:t.abbr, color:t.color,
    roster:{...(Object.keys(t.roster || {}).length ? t.roster : keep.roster)}, updated:when};
  return true;
}
function forgetTeam(k){ teamLib()[k] = {deleted:true, name:'', updated:Date.now()}; }
// First run: teams from games already set up go into the library (never over a deletion).
function seedTeamLibrary(){

    // A record saved without teams (a half-finished game, or one that arrived from another device mid-write) must
    // not take the whole page down on the way in.
    if (!x || x.sample || !x.teams || !x.teams.A || !x.teams.H) return;
    ['A', 'H'].forEach(s => { if (!teamLib()[teamKey(x.teams[s].name)]) added = rememberTeam(x.teams[s], x.updated || x.created || 0) || added; });
  });

/* ---------- sync: one document per account ---------- */
const teamsDocId = () => 'teams-' + (sync.user ? sync.user.uid : '');

function syncTeams(delay = 700){
  if (!sync.user || !sync.api) return;
  clearTimeout(teamTimer);
  teamTimer = setTimeout(() => {
    const {fsM, fsdb} = sync.api;
    fsM.setDoc(fsM.doc(fsdb, 'pressbox', teamsDocId()), {owner:sync.user.uid, updated:Date.now(), public:false, kind:'teams', json:JSON.stringify(teamLib())})
      .catch(e => { sync.err = friendlySync(e); sync.state = 'error'; renderSync(); });
  }, delay);
}
// Team by team, whichever copy was saved last wins.
function mergeTeams(json){
  let remote; try { remote = JSON.parse(json || '{}') || {}; } catch (e) { return; }
  const lib = teamLib(); let changed = false, mineNewer = false;
  for (const k of new Set([...Object.keys(lib), ...Object.keys(remote)])){
    const a = lib[k], b = remote[k];
    if (b && (!a || (b.updated || 0) > (a.updated || 0))){ lib[k] = b; changed = true; }
    else if (a && (!b || (a.updated || 0) > (b.updated || 0))) mineNewer = true;
  }
  // Teams arriving from another device refresh whichever window is showing them.
  if (changed){ persist(); if (dlg().open && (ui.dlg === 'teams' || ui.dlg === 'games')) dlg().innerHTML = ui.dlg === 'teams' ? dlgTeams() : dlgGames(); }
  if (mineNewer) syncTeams(0);
}

/* ================================================================
   Scoreboard: the week's games across the top, the way ESPN runs its
   scores strip. The scorer sees every game on this device plus anyone's
   shared games; fans on a live link see the shared ones (the Firestore
   rules let anyone read a game whose live link is on). Quick scores —
   a score and nothing else, for games nobody is keeping stats on — ride
   along and are always on everyone's scoreboard.
   Weeks follow the Kansas high school calendar: Week 1 is the first
   Friday in September, and a week runs Tuesday through Monday so a
   Monday make-up game stays with its Friday. A game's week comes from
   the day it was set up.
   ================================================================ */
const WEEK_MS = 7 * 864e5;
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fromYmd = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
// The Tuesday that starts the week holding time t, as "YYYY-MM-DD".
function weekKey(t){ const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 5) % 7); return ymd(d); }
// Week 1's Tuesday: three days before the first Friday in September.
function week1(y){ const d = new Date(y, 8, 1); d.setDate(1 + (12 - d.getDay()) % 7 - 3); return d; }
const weekNum = k => { const d = fromYmd(k); return Math.round((d - week1(d.getFullYear())) / WEEK_MS) + 1; };
// Nine regular-season weeks, then the four playoff rounds.
const PLAYOFFS = ['Regionals', 'Sectionals', 'Sub-State', 'State Championship'];
function weekLabel(k){
  const n = weekNum(k);
  if (n >= 1 && n <= 9) return `Week ${n}`;
  if (n >= 10 && n <= 13) return PLAYOFFS[n - 10];
  const f = fromYmd(k); f.setDate(f.getDate() + 3);   // that week's Friday
  return 'Week of ' + f.toLocaleDateString(undefined, {month:'short', day:'numeric'});
}
// A game's date: the one set in Setup or on the score form, else the day it was set up. Its week follows.
const gameDay = x => x.date ? fromYmd(x.date) : new Date(x.created || x.updated || Date.now());
const gameWeek = x => weekKey(gameDay(x).getTime());

/* ---------- quick scores: a game's score and nothing else ---------- */
// Kept apart from the games (db.scores), synced as their own documents (kind 'score'), always public.
const qsLib = () => db.scores || (db.scores = {});
const QS_PER = [['pre', 'Pre'], ['1', '1st'], ['2', '2nd'], ['half', 'Half'], ['3', '3rd'], ['4', '4th'], ['ot', 'OT'], ['final', 'Final'], ['ff', 'Forfeit']];
const QS_STATUS = {pre:'Pregame', half:'Halftime', ot:'OT', final:'Final', ff:'Forfeit'};
// A forfeit is a 2-0 win, the way KSHSAA records it.
const FORFEIT = 2;
const dayShort = d => `${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()]} ${d.getMonth() + 1}/${d.getDate()}`;
const inQuarter = per => /^[1-4]$/.test(String(per));
// A short name for a school with none saved: initials for two or more words, else the first letters.
function shortName(name){
  const listed = typeof listAbbr === 'function' ? listAbbr(name) : '';   // the logo list's own short name wins
  if (listed) return listed;
  const w = String(name).replace(/[^A-Za-z ]+/g, ' ').trim().split(/\s+/).filter(Boolean);
  if (w.length > 1) return w.map(x => x[0]).join('').slice(0, 4).toUpperCase();
  const one = w[0] || '?'; return (one.length <= 4 ? one : one.slice(0, 3)).toUpperCase();
}
function pushScore(x){
  // The tracker signs in through sync; a school's page signs the admin in beside the records. Either will do.
  const api = sync.api || teamRecs.api, uid = (sync.user && sync.user.uid) || (ui.admin ? ADMIN_UID : null);
  if (!x || !api || !uid) return;

    : {owner:uid, updated:x.updated, public:true, week:gameWeek(x), kind:'score', title:`${x.teams.A.abbr} at ${x.teams.H.abbr}`, json:JSON.stringify(x)};
  fsM.setDoc(fsM.doc(fsdb, 'pressbox', x.id), doc).catch(e => {
    // A schedule entry another account already put up can't be written from this one; that's expected.
    if (x.sched && /permission/.test(e?.code || '')) return;

}
// A score added where the tracker's sync isn't running can be left sitting on the device. Once the admin is
// signed in and the shared list has arrived, put up anything of theirs that isn't in it — once per load.

function saveScore(id){
  const nm = s => $(`#qs-${s}-name`).value.trim(), A = nm('A'), H = nm('H');

/* ---------- games the admin has hidden from the scoreboards ---------- */
// One shared list, in a document only the admin's account can change (the rules let only a document's owner write
// it) and anyone can read, since it's public. Hidden games are left off both scoreboards, the strip and BUCO Stats;
// the admin still sees them on the scoreboards, faded, with Show to bring one back.
const ADMIN_UID = '2lbD7tPuufPdkBPtxbgSYnZwizp2';
const HIDE_DOC = 'hidden-games';
const hideList = {ids:new Set(), shown:new Set(), api:null, unsub:null};
// Off the scoreboards: a game the admin hid, or a game between two other schools (an opponent's own game) that the
// admin hasn't shown. Those still count toward records and team schedules; only a game the admin hid doesn't.
const isHidden = x => !!x && (hideList.ids.has(x.id) || (!!x.opp && !hideList.shown.has(x.id)));
function watchHidden(api){
  hideList.api = api;
  if (hideList.unsub) return;
  const {fsM, fsdb} = api;
  // Until the admin first hides something there is no list, and reading it is refused: then nothing is hidden.
  hideList.unsub = fsM.onSnapshot(fsM.doc(fsdb, 'pressbox', HIDE_DOC), snap => {
    const d = snap.exists() ? snap.data() : null;
    let ids = [], shown = [];
    if (d && d.owner === ADMIN_UID && !d.deleted){ try { const j = JSON.parse(d.json); ids = j.ids || []; shown = j.shown || []; } catch (e) {} }
    hideList.ids = new Set(ids); hideList.shown = new Set(shown); hiddenChanged();
  }, () => { hideList.unsub = null; });
}

// Hide a game, or show it again. An opponent's own game starts hidden, so showing it puts it on the shown list.
async function toggleHide(id, opp){
  if (!ui.admin || !hideList.api) return;
  const ids = new Set(hideList.ids), shown = new Set(hideList.shown);
  const hide = !(ids.has(id) || (opp && !shown.has(id)));
  if (hide){ if (opp) shown.delete(id); else ids.add(id); }
  else { ids.delete(id); if (opp) shown.add(id); }
  hideList.ids = ids; hideList.shown = shown; hiddenChanged();
  const {fsM, fsdb} = hideList.api;

      title:'Hidden from the scoreboards', json:JSON.stringify({ids:[...ids], shown:[...shown]})});

// Shared copies first; this device's own copy wins, since it's the working copy.
// The admin's hidden games are left out, unless asked for (the admin's own view of a scoreboard); so are the
// opponents' own games (the State Scoreboard asks for those).
function weekGames(key, withHidden, withOpp){
  const out = {};
  Object.entries(scores.docs).forEach(([id, x]) => { if (x && x.teams) out[id] = Object.assign(x, {id}); });
  if (!ui.viewer){
    Object.values(db.games).forEach(x => { if (x && x.teams && x.teams.A && x.teams.H && !x.sample && gameWeek(x) === key) out[x.id] = x; });
    Object.values(qsLib()).forEach(x => { if (x.deleted) delete out[x.id]; else if (x.teams && gameWeek(x) === key) out[x.id] = x; });
  }
  if (g && !g.sample && gameWeek(g) === key) out[g.id] = g;
  // A game someone is keeping stats on takes the place of its schedule entry or quick score.
  const pair = x => [x.teams.A.name, x.teams.H.name].map(canonSchool).sort().join('|');
  // (A hidden game doesn't take its schedule entry's place.)
  const statted = new Set(Object.values(out).filter(x => x.kind !== 'score' && !isHidden(x)).map(pair));
  Object.values(out).forEach(x => { if ((x.kind === 'score' && statted.has(pair(x))) || (!withHidden && isHidden(x)) || (x.opp && !withOpp)) delete out[x.id]; });
  return Object.values(out).sort((a, b) => gameDay(a) - gameDay(b) || (a.created || 0) - (b.created || 0));
}
// Every week of this season, plus any week this device has a game or score in.

  }
  seasonKeys(new Date().getFullYear()).forEach(k => ks.add(k));   // the whole season, so a game or score can go in any week
  return [...ks].sort();

/* ---------- the scores strip scrolls itself like a ticker, and stops while someone's over it ---------- */
const TICK_PX = 28;                                    // pixels a second: about one game every 6-7 seconds
const ticker = {raf:0, last:0, pos:0, until:0};
// Off while we see whether the constant scrolling was costing anything: it writes scrollLeft every animation
// frame and doubles the cards in the strip to loop them. Set TICKER_ON back to true to bring it back.
const TICKER_ON = false;
function tickerSetup(list){
  if (!TICKER_ON) return;
  if (!list || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (list.scrollWidth <= list.clientWidth + 24) return;          // everything fits: nothing to scroll
  // A second copy of the cards right after the first, so it loops without jumping back. Screen readers and
  // the Tab key skip the copies.
  [...list.children].forEach(c => {
    const d = c.cloneNode(true);
    d.classList.add('sc-dup'); d.setAttribute('aria-hidden', 'true'); d.setAttribute('tabindex', '-1');
    list.appendChild(d);
  });
  ticker.pos = list.scrollLeft;
  // A swipe or a wheel nudge takes over for a few seconds.
  const pause = () => { ticker.until = Date.now() + 4000; };
  list.addEventListener('touchstart', pause, {passive:true});
  list.addEventListener('wheel', pause, {passive:true});
  if (!ticker.raf) ticker.raf = requestAnimationFrame(tickerStep);
}
function tickerStep(t){
  ticker.raf = requestAnimationFrame(tickerStep);
  const dt = ticker.last ? Math.min(100, t - ticker.last) : 0; ticker.last = t;
  const list = $('#scores .sc-list'), dup = list && list.querySelector('.sc-dup');
  if (!dup) return;
  const wrap = list.parentElement, sel = $('#scweek');
  // Held: the mouse is over it, something in it has focus, the week picker is open, the tab is hidden, or a swipe just happened.
  if (wrap.matches(':hover') || wrap.contains(document.activeElement) || document.activeElement === sel || document.hidden || Date.now() < ticker.until){
    ticker.pos = list.scrollLeft; return;
  }
  const loop = dup.offsetLeft - list.firstElementChild.offsetLeft;   // one full set of games
  ticker.pos += TICK_PX * dt / 1000;
  if (ticker.pos >= loop) ticker.pos -= loop;
  list.scrollLeft = ticker.pos;                                       // kept as a fraction in pos, so slow speeds still move
}
// The week picker only as wide as the week showing ("Week 2"), not its longest choice ("State Championship").
function fitSelect(sel){

  ctx.font = `${c.fontWeight} ${c.fontSize} ${c.fontFamily}`;
  const px = k => parseFloat(c[k]) || 0;
  sel.style.width = Math.ceil(ctx.measureText(sel.options[sel.selectedIndex].text).width
    + px('paddingLeft') + px('paddingRight') + px('borderLeftWidth') + px('borderRightWidth') + 2) + 'px';
}
function scoreArrows(){

}

  pret: {order:['no', 'yds', 'td'], keys:{no:'pr', yds:'pry', lng:'prlg', td:'prtd'}},
  kret: {order:['no', 'yds', 'td'], keys:{no:'kr', yds:'kry', lng:'krlg', td:'krtd'}},
  int:  {order:['no', 'yds', 'td'], keys:{no:'dint', yds:'dintY'}}
};

// Points and kind for one scoring-summary line, e.g. "Will Quinn 79 run (Pete Vega kick)".
function scoreLine(d){
  const main = d.split('(')[0];
  if (/\bFG\b|field goal/i.test(main)) return {how:'FG', pts:3};
  if (/\bsafety\b/i.test(main)) return {how:'Safety', pts:2};
  // The try is in the last parentheses, or a trailing "Vega kick)" when the "(" went missing.
  const i = d.lastIndexOf('('), pat = i >= 0 ? d.slice(i + 1) : /\bkick\)?\s*$/i.test(d) ? 'kick' : '';
  // "(Smith run)", "(Jones pass from Smith)" and "(Jones to Goentzel)" are two-point tries.
  const extra = /fail|no good|miss|block|incomplete|no try|stopped|short/i.test(pat) ? 0 : /kick|good/i.test(pat) ? 1 : /\b(run|rush|pass|catch|to)\b/i.test(pat) ? 2 : 0;
  return {how:'TD', pts:6 + extra};
}

// Passing numbers with no column heading. AP style is cmp-att-int-yds(-td), "Meeker 4-7-1-93"; others write
// cmp-att-yds-td-int, "Quinn 6-8-87-1-0". Yardage is nearly always the biggest number, which tells them apart.
function passOrder(v){
  const tail = v.slice(2), big = 2 + tail.indexOf(Math.max(...tail));
  return big === 3 ? ['cmp', 'att', 'int', 'yds', 'td'] : ['cmp', 'att', 'yds', 'td', 'int'];
}

function parseBox(txt){
  const out = {ok:false, error:'', names:[], lines:{A:[], H:[]}, total:{A:0, H:0}, scoring:[], pl:{A:{}, H:{}}, team:{A:{}, H:{}}, warn:[]};
  const rows = String(txt || '').replace(/\r/g, '').split('\n').map(l => l.replace(/[ \t]+/g, ' ').trim()).filter(Boolean);
  // "RUSHING: Andover — …", "RUSHING – Winfield: …", "RUSHING—Winfield, …", "PASSING (cmp-att-yds-td-int): …",
  // "Passing: (cmp-att-yds-td-int): Douglass – …"
  const SEC = /^(RUSHING|PASSING|RECEIVING|KICKING|FIELD GOALS|MISSED FIELD GOALS|MISSED FGS?|FIELD GOAL ATTEMPTS|BLOCKED KICKS|INTERCEPTIONS|TACKLES|DEFENSE|DEFENSIVE|PUNTING|PUNT RETURNS|KICKOFF RETURNS|KICK RETURNS|FUMBLES|SACKS|TEAM STATS|TEAM STATISTICS)\b\s*[:—–-]?\s*(\([^)]*\))?\s*[:—–-]?\s*(.*)$/i;
  const QTR = /^(?:(first|second|third|fourth|1st|2nd|3rd|4th)\s+(?:quarter|qtr)|(ot|overtime))\b/i;
  const QN = {first:1, '1st':1, second:2, '2nd':2, third:3, '3rd':3, fourth:4, '4th':4};
  // Which team a label like "And", "Hutch" or "Andover" means.
  const sideOf = label => {
    const k = logoSlug(label); if (!k) return null;
    const score = ['A', 'H'].map((s, i) => { const n = logoSlug(out.names[i] || ''), ini = n.split('-').map(w => w[0]).join('');
      return !n ? 0 : n === k ? 3 : ini === k ? 2 : n.startsWith(k) || k.startsWith(n) ? 1 : 0; });
    return score[0] > score[1] ? 'A' : score[1] > score[0] ? 'H' : null;
  };
  const sections = [];
  let sec = null, curQ = 0;
  for (const l of rows){
    const m = l.match(SEC);
    if (m){ sec = {kind:m[1].toUpperCase(), head:m[2] || '', body:m[3]}; sections.push(sec); continue; }
    // A stat section can run onto the next line ("Hutchinson — McCuan 12-56; …").
    if (sec && /\d+\s*-\s*\(?-?\d+/.test(l)){ sec.body += ' ' + l; continue; }
    if (out.names.length < 2){
      // A quarter is a number, or an X (or a bare dash) for one that was never played — how a mercy-rule game is
      // posted: "Flinthills 44 14 X X — 58". The dash before the total is often jammed against that last column.
      // Up to twelve columns: four quarters and as many overtimes as the game went to.
      const ls = l.match(/^(.*?[A-Za-z][^\d]*?)\s+((?:(?:\d+|[Xx]|[—–-])\s*[ ]\s*){2,11}(?:\d+|[Xx]|[—–-]))\s*(?:[—–-]+\s*(\d+))?$/);
      if (ls){
        const cell = v => /^[Xx]$/.test(v) || /^[—–-]$/.test(v) ? null : Number(v);
        let q = ls[2].trim().split(/\s+/).map(cell), tot = ls[3] != null ? +ls[3] : null;
        const add = a => a.reduce((t, v) => t + (v || 0), 0);
        if (tot == null && q.length >= 5 && q[q.length - 1] != null && q[q.length - 1] === add(q.slice(0, -1))) tot = q.pop();
        // Each overtime keeps its own column, however many there were: "10 10 0 7 0 6 0 6 0 — 39".
        const s = out.names.length ? 'H' : 'A', name = ls[1].replace(/[\s:,.—–-]+$/, ''), sum = add(q);
        out.names.push(name); out.lines[s] = q; out.total[s] = tot ?? sum;
        if (tot != null && tot !== sum) out.warn.push(`${name}’s quarters add up to ${sum}, but the total says ${tot}. Using ${tot}.`);
        sec = null; continue;
      }
    }
    const qh = l.match(QTR);
    if (qh){ curQ = qh[2] ? 5 : QN[qh[1].toLowerCase()]; sec = null; continue; }
    const sc = out.names.length === 2 && l.match(/^([A-Za-z][A-Za-z.'& ]{0,24}?)\s*[—–:-]\s+(.+)$/);
    const side = sc && sideOf(sc[1]);
    if (side){
      const t = pullTime(sc[2]);
      out.scoring.push({side, label:sc[1].trim(), desc:t.desc, time:t.time, q:curQ, ...scoreLine(t.desc)});
      sec = null; continue;
    }
    if (sec) sec.body += ' ' + l;
  }
  if (out.names.length < 2){
    out.error = 'Couldn’t find the line score: each team’s name, its quarter scores and the total, like “Andover 7 7 8 10 — 32”.';
    return out;
  }

  // Full names from the scoring summary, so "Vega" in the stat lines reads as "Pete Vega". A "first name"
  // that is some other player's last name ("from Quinn Vega kick", with a "(" missing) isn't one.
  const full = {A:{}, H:{}};
  out.scoring.forEach(e => (e.desc.match(/\b[A-Z][a-zA-Z'’.-]+(?: [A-Z][a-zA-Z'’.-]+)+/g) || []).forEach(n => {
    const m = full[e.side], k = lastName(n); (m[k] = m[k] || {})[n] = (m[k][n] || 0) + 1; }));
  ['A', 'H'].forEach(s => Object.values(full[s]).forEach(opts => Object.keys(opts).forEach(n => {
    if (full[s][n.split(' ')[0].toLowerCase()]) delete opts[n]; })));
  const display = (s, raw) => {
    const opts = full[s][lastName(raw)];
    if (raw.includes(' ') || !opts || !Object.keys(opts).length) return raw;
    return Object.entries(opts).sort((a, b) => b[1] - a[1])[0][0];
  };
  // A player by name. Full names stay apart ("Mason Rush", "Brody Rush"); a bare last name ("Vega") joins the one
  // player with that last name; and a full name takes over a bare one met earlier.
  const player = (s, raw) => {
    raw = raw.trim();
    if (/^team$/i.test(raw)) return out.pl[s].team || (out.pl[s].team = {});
    const name = display(s, raw), k = lastName(name), keys = Object.keys(out.pl[s]).filter(n => n !== 'team');
    const exact = keys.find(n => n.toLowerCase() === name.toLowerCase()), same = keys.filter(n => lastName(n) === k);
    if (exact) return out.pl[s][exact];
    if (!name.includes(' ')) return same.length === 1 ? out.pl[s][same[0]] : (out.pl[s][name] = {});
    const bare = same.find(n => !n.includes(' '));
    if (bare){ out.pl[s][name] = out.pl[s][bare]; delete out.pl[s][bare]; return out.pl[s][name]; }
    return (out.pl[s][name] = {});
  };
  // Kickers go by last name, sometimes with a stray word ("from Quinn Vega kick)"): the one player with that last name.
  const kicker = (s, raw) => {
    const k = lastName(raw), same = Object.keys(out.pl[s]).filter(n => n !== 'team' && lastName(n) === k);
    return same.length === 1 ? out.pl[s][same[0]] : player(s, raw);
  };
  const add = (o, k, v) => { o[k] = (o[k] || 0) + v; };
  // A name with no team on it: whichever side already knows him — from a stat line, or from the scoring
  // summary, where a kicker turns up as "(McFadden kick)". Only when exactly one side does.
  function whoseName(raw){
    const k = lastName(raw), re = new RegExp(`\\b${escRe(String(raw).trim())}\\b`, 'i');
    const sides = ['A', 'H'].filter(s =>
      Object.keys(out.pl[s]).some(n => lastName(n) === k)
      || out.scoring.some(e => e.side === s && re.test(e.desc)));
    return sides.length === 1 ? sides[0] : null;
  }
  // Numbers in "14-94", "3--5", "2-(-33)" or "1-(4)"; a number in parentheses is a loss.
  const nums = s => [...s.replace(/(\d)\s*-\s*-(\d+)/g, '$1-(-$2)').matchAll(/\((-?\d+)\)|(\d+)/g)].map(m => m[1] != null ? -Math.abs(+m[1]) : +m[2]);
  const tds = rest => { const m = rest.match(/(\d+)?\s*TDs?\b/i); return m ? +(m[1] || 1) : 0; };
  // A section's body, split at each team's name: "Andover — …. Hutchinson — …".
  const splitTeams = body => {
    // One-letter labels ("W", "C") mark scoring plays but are too short to split a stat line on.
    const alts = [...new Set([...out.names, ...out.scoring.map(e => e.label)])].filter(a => a && a.length > 1).sort((a, b) => b.length - a.length);
    // A heading on its own line leaves the body starting with a space, so the first team's name sits at ^\s*.
    const re = new RegExp(`(?:^\\s*|[.;:)]\\s*)(${alts.map(escRe).join('|')})\\s*(?:[—–:,]|\\s-)\\s*`, 'gi'), hits = [...body.matchAll(re)];
    return hits.map((h, i) => [sideOf(h[1]), body.slice(h.index + h[0].length, i + 1 < hits.length ? hits[i + 1].index : undefined)]).filter(x => x[0]);
  };
  const kicked = new Set(), missed = new Set();   // kickers a section has already counted
  for (const sc of sections){
    const K = sc.kind.toUpperCase();
    const kind = /^RUSH/.test(K) ? 'rush' : /^PASS/.test(K) ? 'pass' : /^REC/.test(K) ? 'rec'
      : /^PUNT RET/.test(K) ? 'pret' : /^KICK(OFF)? RET/.test(K) ? 'kret'
      : /^MISSED|^BLOCKED KICKS|^FIELD GOAL ATTEMPTS/.test(K) ? 'miss'
      : /^DEF|^TACKL|^SACK|^FUMBLE/.test(K) ? 'def' : /^KICKING|^FIELD GOAL/.test(K) ? 'kick'
      : /^PUNTING/.test(K) ? 'punt' : /^INTERCEPT/.test(K) ? 'int' : /^TEAM/.test(K) ? 'team' : '';
    if (!kind){ out.warn.push(`${sc.kind[0]}${sc.kind.slice(1).toLowerCase()} lines aren’t read yet, so they’re left out.`); continue; }
    // "Mulvane — 333 total yards, 62 plays, 243 rushing, 90 passing, 17 first downs, 2-10 penalties"
    if (kind === 'team'){
      for (const [s, part] of splitTeams(sc.body)){
        // The full block a game book prints, one phrase to a semicolon:
        // "First downs 14, rushing 6, passing 6, penalty 2; third downs 4-11; rushing 34-141; passing 15-29-1;
        //  sacks-yards lost 3-14; punts 4-27.5; penalties 9-73; time of possession 25:03."
        const T = out.team[s], put = (k, v) => { if (v != null && !Number.isNaN(v)) T[k] = v; };
        part.split(/;/).map(x => x.trim()).filter(Boolean).forEach(chunk => {
          const n = re => { const m = chunk.match(re); return m ? m.slice(1).map(v => v == null ? null : +v) : null; };
          let m;
          if ((m = n(/first downs?\s+(\d+)/i))){
            put('fd', m[0]);
            const sub2 = (re, k) => { const x = chunk.match(re); if (x) put(k, +x[1]); };
            sub2(/rushing\s+(\d+)/i, 'fdR'); sub2(/passing\s+(\d+)/i, 'fdP'); sub2(/penalt(?:y|ies)\s+(\d+)/i, 'fdX');
            return;
          }
          if ((m = n(/third downs?\D+(\d+)\D+(\d+)/i))){ put('d3m', m[0]); put('d3a', m[1]); return; }
          if ((m = n(/fourth downs?\D+(\d+)\D+(\d+)/i))){ put('d4m', m[0]); put('d4a', m[1]); return; }
          if ((m = n(/rushing\s+(\d+)\s*-\s*(-?\d+)/i))){ put('rushN', m[0]); put('rushY', m[1]); return; }
          if ((m = n(/passing\s+(\d+)\s*-\s*(\d+)\s*-\s*(\d+)/i))){ put('passC', m[0]); put('passA', m[1]); put('passInt', m[2]); return; }
          if ((m = n(/passing\s+(-?\d+)\s*$/i))){ put('passY', m[0]); return; }
          if ((m = n(/sacks?\b[^\d]*(\d+)\s*-\s*(\d+)/i))){ put('sk', m[0]); put('skY', m[1]); return; }
          if ((m = n(/interception returns?\s+(\d+)\s*-\s*(-?\d+)/i))){ put('intN', m[0]); put('intY', m[1]); return; }
          if ((m = n(/fumbles?\s*-\s*lost\s+(\d+)\s*-\s*(\d+)/i))){ put('fum', m[0]); put('fumL', m[1]); return; }
          if ((m = n(/kickoffs?\b[^\d]*(\d+)\s*-\s*(\d+)/i)) && !/return/i.test(chunk)){ put('koN', m[0]); put('koTB', m[1]); return; }
          if ((m = n(/kickoff returns?\s+(\d+)\s*-\s*(-?\d+)/i))){ put('krN', m[0]); put('krY', m[1]); return; }
          if ((m = n(/punt returns?\s+(\d+)\s*-\s*(-?\d+)/i))){ put('prN', m[0]); put('prY', m[1]); return; }
          if ((m = chunk.match(/punts\s+(\d+)\s*-\s*([\d.]+)/i))){ put('pnt', +m[1]); put('pntY', Math.round(+m[1] * +m[2])); return; }
          if ((m = n(/penalt(?:ies|y)\s+(\d+)\s*-\s*(\d+)/i))){ put('pen', m[0]); put('penY', m[1]); return; }
          if ((m = chunk.match(/time of possession\D*(\d{1,2}):(\d{2})/i))){ put('top', +m[1] * 60 + +m[2]); return; }
          if ((m = n(/(\d+)\s*(?:total\s*)?plays\b/i))) put('plays', m[0]);
        });
        const one = re => { const m = part.match(re); return m ? +m[1] : null; };
        const set = (k, v) => { if (v != null && T[k] == null) out.team[s][k] = v; };
        set('plays', one(/(\d+)\s*(?:total\s*)?plays\b/i));
        set('rushY', one(/(\d+)\s*(?:yards\s*)?rushing\b/i) ?? one(/rushing[^\d]{0,12}(\d+)/i));
        set('passY', one(/(\d+)\s*(?:yards\s*)?passing\b/i) ?? one(/passing[^\d]{0,12}(\d+)/i));
        set('fd', one(/(\d+)\s*first downs\b/i));
        const pen = part.match(/(\d+)\s*-\s*(\d+)\s*penalt/i);
        if (pen){ out.team[s].pen = +pen[1]; out.team[s].penY = +pen[2]; }
      }
      continue;
    }
    // "MISSED FIELD GOALS: Newton — Oswald 39 (blocked), 45." Each distance is an attempt and no make;
    // a blocker who is named gets the block.
    if (kind === 'miss'){
      const teamed = splitTeams(sc.body);
      // Often written with no team and no distance at all — "Missed field goals: McFadden".
      for (const [s0, part] of (teamed.length ? teamed : [[null, sc.body]])){
        part.split(/;\s*|,\s*(?=[A-Za-z])|\.\s+/).map(x => x.trim().replace(/\.$/, '')).filter(Boolean).forEach(item => {
          // "McFadden 39", "McFadden, 36", "McFadden – 36 (blocked)": a name, then however it is separated
          // from the distances, if there are any.
          const m = item.match(/^([A-Za-z][A-Za-z.'’ -]*?)\s*[,;:–—-]?\s*(\d[\s\S]*)?$/);
          if (!m || !m[1].trim()) return;
          const who = m[1].trim(), s = s0 || whoseName(who);
          if (!s){ out.warn.push(`Couldn’t tell which team ${who} kicks for, so that missed kick was left out. Put the team in front of it.`); return; }
          const p = kicker(s, who), dist = ((m[2] || '').match(/\d+/g) || []).map(Number);
          missed.add(s + '|' + lastName(who));
          (dist.length ? dist : [0]).forEach(() => add(p, 'fga', 1));
          const by = item.match(/blocked\s+by\s+([A-Za-z][A-Za-z.'’ -]*)/i);
          if (by) add(player(s === 'A' ? 'H' : 'A', by[1]), 'bk', 1);
        });
      }
      continue;
    }
    // Columns follow the heading when it names them — "(cmp-att-yds-td-int)", "(punts-yards-average-I20)".
    const named = ((sc.head.match(/\(([^)]*)\)/) || [])[1] || '').toLowerCase().split(/[-–,]/).map(x => x.trim()).filter(Boolean);
    const order = kind === 'pass' ? named
      : KIND_COLS[kind] ? (named.map(w => COL_WORDS[w] || w).filter(w => w) .length ? named.map(w => COL_WORDS[w] || w) : KIND_COLS[kind].order)
      : null;
    for (const [s, part] of splitTeams(sc.body)){
      // Players are split by semicolons, or by commas when the next thing is another player ("Chattam 16-133, Bergeson
      // 10-124"); a comma before "TD" or "3 TD" stays with its player.
      part.split(/;\s*|\.\s+(?=totals?\b)/i).flatMap(x => x.split(/,\s*(?=[A-Za-z][A-Za-z.'’ -]*\s\(?-?\d+\)?\s*-\s*\(?-?\d)/))
        .map(x => x.trim().replace(/\.$/, '')).filter(Boolean).forEach(item => {
        const tot = item.match(/^totals?:?\s*(.*)$/i);
        if (tot){ const v = nums(tot[1]); if (kind === 'rush' && v.length >= 2) Object.assign(out.team[s], {rushN:v[0], rushY:v[1]}); return; }
        const m = item.match(/^(.+?)\s+(\(?-?\d+\)?(?:\s*-\s*\(?-?\d+\)?)+)(.*)$/);
        if (!m) return;
        const v = nums(m[2]), p = player(s, m[1]), td = tds(m[3]);
        if (kind === 'rush'){ add(p, 'ru', v[0] || 0); add(p, 'ry', v[1] || 0); add(p, 'rtd', td); }
        if (kind === 'rec'){ add(p, 're', v[0] || 0); add(p, 'rey', v[1] || 0); add(p, 'retd', td); }
        if (kind === 'pass'){
          const f = {}; (order.length ? order : passOrder(v)).forEach((k, i) => { f[k] = v[i] || 0; });
          add(p, 'pc', f.cmp || f.c || 0); add(p, 'pa', f.att || f.a || 0); add(p, 'py', f.yds || f.y || 0); add(p, 'ptd', f.td || 0); add(p, 'pint', f.int || f.i || 0);
        }
        if (KIND_COLS[kind]){
          const {keys} = KIND_COLS[kind], f = {};
          order.forEach((c, i) => { if (c && v[i] != null) f[c] = v[i]; });
          // Tackles are printed as total-solo-assists; the book keeps solo and assists and adds them back up.
          if (kind === 'def'){
            if (f.tk == null && f.tot != null) f.tk = f.ast != null ? Math.max(0, f.tot - f.ast) : f.tot;
            if (f.ast == null && f.tot != null && f.tk != null && f.tot > f.tk) f.ast = f.tot - f.tk;
          }
          Object.entries(f).forEach(([c, n]) => { const k = keys[c]; if (k && n) add(p, k, n); });
          if (kind === 'kick') kicked.add(s + '|' + lastName(m[1]));
          // An extra point made is an extra point tried, unless the paper counted the tries itself.
          if (kind === 'kick' && f.xp && f.xpa == null) add(p, 'xpa', f.xp);
        }
      });
    }
  }
  // Stat lines that don't mark touchdowns get them from the scoring summary, written either way round: "Bergeson 48 run",
  // "Cosby 17 pass from Wilbur", "1 yd run Carter Green", "26 yd pass Kane Ast to Ryan Stiner". Whatever the stat lines
  // do mark ("Quinn 14-92, TD", or a TD column in the passing line) is left as it is.
  const YD = String.raw`\d+\s*(?:-?\s*(?:yd|yard)s?\.?)?`;
  const RUN = [new RegExp(String.raw`^(.+?)\s+${YD}\s+run\b`, 'i'), new RegExp(String.raw`^${YD}\s+run\s+(?:by\s+)?(.+)$`, 'i')];
  const PASS = [[new RegExp(String.raw`^(.+?)\s+${YD}\s+pass\s+from\s+(.+)$`, 'i'), 1, 2],        // receiver, passer
                [new RegExp(String.raw`^${YD}\s+pass\s+(?:from\s+)?(.+?)\s+to\s+(.+)$`, 'i'), 2, 1]];  // passer, receiver
  const RETS = String.raw`(?:fumble|interception|int|kickoff|kick|punt|blocked\s+(?:punt|kick|field\s+goal|fg))`;
  const RET = [new RegExp(String.raw`^(.+?)\s+${YD}\s+${RETS}\s+return\b`, 'i'), new RegExp(String.raw`^${YD}\s+${RETS}\s+return\s+(?:by\s+)?(.+)$`, 'i')];
  ['A', 'H'].forEach(s => {
    const has = k => Object.values(out.pl[s]).some(p => p[k]), noR = !has('rtd'), noRe = !has('retd'), noP = !has('ptd');
    out.scoring.filter(e => e.side === s && e.how === 'TD').map(e => e.desc.split('(')[0].trim()).forEach(d => {
      const r = RUN.map(re => d.match(re)).find(Boolean);
      if (r){ if (noR) add(player(s, r[1]), 'rtd', 1); return; }
      for (const [re, ri, qi] of PASS){
        const m = d.match(re);
        if (m){ if (noRe) add(player(s, m[ri]), 'retd', 1); if (noP) add(player(s, m[qi]), 'ptd', 1); return; }
      }
      // Return touchdowns ("Higgins 4 fumble return", "22 yd punt return Smith"); no stat line carries these.
      const t = RET.map(re => d.match(re)).find(Boolean);
      if (t) add(player(s, t[1]), 'rettd', 1);
    });
  });
  // Kickers, from the scoring summary: "Vega 29 FG", "(Pete Vega kick)". A kicking section counted those men
  // already, so they are left alone; a missed-kicks section only counted what didn't go through.
  const counted = (s, raw) => kicked.has(s + '|' + lastName(raw));
  out.scoring.forEach(e => {
    if (e.how === 'FG'){
      // "Vega 29 FG" or "29 yd FG Vega"
      const m = e.desc.match(/^(.+?)\s+(\d+)\s*(?:-?\s*(?:yd|yard)s?\.?)?\s*(?:FG|field goal)/i);
      const m2 = e.desc.match(/^(\d+)\s*(?:-?\s*(?:yd|yard)s?\.?)?\s*(?:FG|field goal)\s+(?:by\s+)?([A-Z][^(]*?)\s*(?:\(|$)/i);

    const q = b.lines[s] || [];

    const cols = Math.max(5, q.length, (b.lines[s === 'A' ? 'H' : 'A'] || []).length);

  // Each team's own offense and, from the other side of the same games, what opponents did against it ('o' keys).

    zeros(T_KEYS), zeros(T_KEYS.map(k => 'o' + k)));
  const teams = Object.fromEntries((STATE_STATS ? [] : GROUP).map(c => [c, blank(c)])), players = {};
  // Whose side counts: in Butler County only its ten schools, by their proper names; statewide every school, one row
  // each however its name was typed (the first spelling seen names the row).
  const names = {}, sideOf = n => STATE_STATS ? (names[canonSchool(n)] || (names[canonSchool(n)] = n)) : groupOf(n);
  for (const x of games){
    const g = gameNumbers(x); if (!g) continue;
    ['A', 'H'].forEach(s => {
      const c = sideOf(g[s].name); if (!c) return;
      const o = other(s), T = teams[c] || (teams[c] = blank(c)), S = g[s].team, O = g[o].team;
      T.gp++; T.pf += g[s].score; T.pa += g[o].score;
      T_KEYS.forEach(k => { T[k] += +S[k] || 0; T['o' + k] += +O[k] || 0; });
      // Four quarters of their own; every overtime a game went to adds into the one OT column.
      const mine = g[s].lines || [], theirs = g[o].lines || [];
      for (let i = 0; i < Math.max(5, mine.length); i++){
        const j = Math.min(i, 4);
        T.qf[j] += +mine[i] || 0; T.qa[j] += +theirs[i] || 0;
      }
      if (g.q > 4 || mine[4] || theirs[4]) T.ot = true;
      if (g.fin) T[g[s].score > g[o].score ? 'w' : g[s].score < g[o].score ? 'l' : 't']++;
      g[s].pl.forEach(row => {
        if (!C_KEYS.some(k => +row[k])) return;
        const key = `${c}|${row.name.toLowerCase()}`;
        const P = players[key] || (players[key] = Object.assign({name:row.name, team:c, gp:0}, zeros(C_KEYS)));
        P.gp++; C_KEYS.forEach(k => { P[k] += +row[k] || 0; });
      });
    });
  }
  // A bare last name from one box score ("Vega") joins the one full name on that team with it ("Pete Vega").
  Object.values(players).forEach(P => {
    if (P.name.includes(' ') || P.name.startsWith('#')) return;
    const k = P.name.toLowerCase(), full = Object.values(players).filter(Q => Q !== P && Q.team === P.team && Q.name.includes(' ') && lastName(Q.name) === k);
    if (full.length !== 1) return;
    const Q = full[0]; Q.gp += P.gp; C_KEYS.forEach(n => { Q[n] += P[n]; });
    delete players[`${P.team}|${k}`];
  });
  // One player spelled two ways in different box scores ("Kirchhoff-Jones", "Kirchoff-Jones"): same team, same first
  // name, last names one letter apart. The one with more games keeps the spelling.
  const oneOff = (a, b) => {
    if (a === b || Math.abs(a.length - b.length) > 1) return a === b;
    let i = 0; while (i < a.length && a[i] === b[i]) i++;
    return a.slice(i + (a.length >= b.length ? 1 : 0)) === b.slice(i + (b.length >= a.length ? 1 : 0));
  };
  const split = n => { const p = n.toLowerCase().split(/\s+/); return [p[0], p.slice(1).join(' ')]; };
  const list = Object.entries(players);
  list.forEach(([k1, P]) => list.forEach(([k2, Q]) => {
    if (k1 === k2 || !players[k1] || !players[k2] || P.team !== Q.team || !P.name.includes(' ') || !Q.name.includes(' ')) return;
    const [f1, l1] = split(P.name), [f2, l2] = split(Q.name);
    if (f1 !== f2 || l1 === l2 || Math.min(l1.length, l2.length) < 5 || !oneOff(l1, l2)) return;
    const [keep, drop, dk] = P.gp >= Q.gp ? [P, Q, k2] : [Q, P, k1];
    keep.gp += drop.gp; C_KEYS.forEach(n => { keep[n] += drop[n]; }); delete players[dk];
  }));
  return {teams:Object.values(teams), players:Object.values(players)};
}
// 2025: players' season totals from the leaderboard, with no games behind them; each team's offense is its players
// added up. Games played aren't known, so gp stays blank (per-game columns show a dash).
function countyStats2025(){
  const players = STATS_2025.map(r => Object.assign({gp:undefined, ret:0, two:0, fgm:0, fga:0, xpm:0, xpa:0}, r));
  const teams = COUNTY.map(c => {
    const T = Object.assign({name:c, gp:undefined, w:0, l:0, t:0, pf:0, pa:0, qf:[0, 0, 0, 0, 0], qa:[0, 0, 0, 0, 0], ot:false},
      zeros(T_KEYS), zeros(T_KEYS.map(k => 'o' + k)));
    players.filter(p => p.team === c).forEach(p => {
      T.rushN += p.ru; T.rushY += p.ry; T.passC += p.pc; T.passA += p.pa; T.passY += p.py; T.passTD += p.ptd; T.passInt += p.pint;
    });
    return T;
  });
  return {teams, players};
}

/* ---------- views. A column is [heading, value to sort by (null: none), decimals, text to show instead] ---------- */
const num = v => v == null || Number.isNaN(v) ? null : v;
const per = (a, b) => b ? a / b : null;
const tdAll = p => p.rtd + p.retd + p.ret;
const ptsOf = p => 6 * tdAll(p) + 3 * p.fgm + p.xpm + 2 * p.two;
// Passer rating, the NFL formula: four parts, each held between 0 and 2.375, so it runs 0 to 158.3.
const rating = p => {
  if (!p.pa) return null;
  const part = v => Math.max(0, Math.min(2.375, v));
  return (part((p.pc / p.pa - 0.3) * 5) + part((p.py / p.pa - 3) * 0.25) + part(p.ptd / p.pa * 20) + part(2.375 - p.pint / p.pa * 25)) / 6 * 100;
};
const P_VIEWS = {
  passing:{label:'Passing', keep:p => p.pa > 0, def:3, cols:[['CMP', p => p.pc], ['ATT', p => p.pa], ['CMP%', p => per(100 * p.pc, p.pa), 1], ['YDS', p => p.py],
    ['AVG', p => per(p.py, p.pa), 1], ['TD', p => p.ptd], ['INT', p => p.pint], ['RTG', rating, 1]]},
  rushing:{label:'Rushing', keep:p => p.ru > 0, def:1, cols:[['ATT', p => p.ru], ['YDS', p => p.ry], ['AVG', p => per(p.ry, p.ru), 1], ['TD', p => p.rtd]]},
  receiving:{label:'Receiving', keep:p => p.re > 0 || p.rey !== 0, def:1, cols:[['REC', p => p.re], ['YDS', p => p.rey], ['AVG', p => per(p.rey, p.re), 1], ['TD', p => p.retd]]},
  scoring:{label:'Scoring', keep:p => ptsOf(p) > 0, def:7, groups:[['TOUCHDOWNS', 4], ['SCORING', 5]], cols:[['RUSH', p => p.rtd], ['REC', p => p.retd], ['RET', p => p.ret], ['TD', tdAll],
    ['FG', p => p.fgm], ['XP', p => p.xpm], ['2PT', p => p.two], ['PTS', ptsOf], ['PTS/G', p => per(ptsOf(p), p.gp), 1]]},
  kicking:{label:'Kicking', keep:p => p.fga > 0 || p.xpa > 0, def:6, cols:[['FGM', p => p.fgm], ['FGA', p => p.fga], ['FG%', p => per(100 * p.fgm, p.fga), 1],
    ['XPM', p => p.xpm], ['XPA', p => p.xpa], ['XP%', p => per(100 * p.xpm, p.xpa), 1], ['PTS', p => 3 * p.fgm + p.xpm]]}};
// 2025's Scoring: the leaderboard has rushing and receiving touchdowns, no kicks or two-point tries.
const SCORING_25 = {label:'Scoring', keep:p => p.rtd + p.retd > 0, def:2, groups:[['TOUCHDOWNS', 3]],
  cols:[['RUSH', p => p.rtd], ['REC', p => p.retd], ['TD', p => p.rtd + p.retd]]};
const C_TABS = [['offense', 'Offense', 'passing'], ['scoring', 'Scoring', 'scoring'], ['special', 'Special Teams', 'kicking'], ['team', 'Team Stats', 'team']];
const tabOf = v => ({passing:'offense', rushing:'offense', receiving:'offense', scoring:'scoring', kicking:'special', team:'team'})[v];
const signed = v => `${v > 0 ? '+' : ''}${v.toFixed(1)}`;
const T_COLS = [['GP', t => t.gp], ['W-L', t => t.gp ? (t.w + t.t / 2) / t.gp + t.w / 1000 : null, 0, t => `${t.w}-${t.l}${t.t ? `-${t.t}` : ''}`],
  ['PF', t => t.pf], ['PA', t => t.pa], ['PF/G', t => per(t.pf, t.gp), 1], ['PA/G', t => per(t.pa, t.gp), 1],
  ['MARGIN/G', t => per(t.pf - t.pa, t.gp), 1, t => signed((t.pf - t.pa) / t.gp)]];
// The same columns for a team's own offense (p '') and for what its opponents did against it (p 'o').
function yardCols(p){
  const k = (t, n) => t[p + n], ry = t => k(t, 'rushY'), py = t => k(t, 'passY'), plays = t => k(t, 'rushN') + k(t, 'passA');
  return [['RUSH', t => k(t, 'rushN')], ['RUSH YDS', ry], ['RUSH/G', t => per(ry(t), t.gp), 1], ['YDS/CAR', t => per(ry(t), k(t, 'rushN')), 1],
    ['C/ATT', t => k(t, 'passC'), 0, t => `${k(t, 'passC')}/${k(t, 'passA')}`], ['PASS YDS', py], ['PASS/G', t => per(py(t), t.gp), 1], ['PASS TD', t => k(t, 'passTD')],
    [p ? 'INT MADE' : 'INT', t => k(t, 'passInt')], ['TOTAL YDS', t => ry(t) + py(t)], ['YDS/G', t => per(ry(t) + py(t), t.gp), 1], ['YDS/PLAY', t => per(ry(t) + py(t), plays(t)), 1]];
}
// Points for and against each quarter ("21-7"), sorted by the margin; halves after, and OT once there's been one.
function quarterCols(ot){
  const q = (t, i) => [i.reduce((a, n) => a + t.qf[n], 0), i.reduce((a, n) => a + t.qa[n], 0)];
  const col = (label, ...i) => [label, t => { const [f, a] = q(t, i); return f - a; }, 0, t => q(t, i).join('-')];
  return [col('1ST', 0), col('2ND', 1), col('3RD', 2), col('4TH', 3), ...(ot ? [col('OT', 4)] : []), col('1ST HALF', 0, 1), col('2ND HALF', 2, 3)];
}

/* ---------- the table, ESPN style: rank, name, then numbers; the sorted column shaded ---------- */
function statTable(id, rows, cols, def, o){
  const s = county.sort[id] || {i:def, desc:!o.asc}, key = r => num(cols[s.i][1](r));
  // A team with no games yet always sorts to the bottom, whichever way the column runs; so do blanks.
  const sorted = rows.slice().sort((a, b) => {
    if ((a.gp === 0) !== (b.gp === 0)) return a.gp === 0 ? 1 : -1;
    const x = key(a), y = key(b);
    if (x == null || y == null) return (x == null) - (y == null) || a.name.localeCompare(b.name);
    return (s.desc ? y - x : x - y) || a.name.localeCompare(b.name);
  });
  let rank = 0, prev;   // ties share a rank
  const rk = sorted.map((r, i) => { const v = key(r); if (i === 0 || v !== prev) rank = i + 1; prev = v; return rank; });
  const cell = (c, r) => {
    if (r.gp === 0 && c[0] !== 'GP') return '—';
    if (c[3]) return c[3](r);
    const v = num(c[1](r)); return v == null ? '—' : c[2] ? v.toFixed(c[2]) : Math.round(v * 10) / 10;
  };
  const groups = o.groups ? `<tr class="cgrp"><th class="rk"></th><th class="nm"></th>${o.groups.map(([g, n]) => `<th colspan="${n}">${g}</th>`).join('')}</tr>` : '';
  return `<div class="tbl-wrap"><table class="ctbl"><thead>${groups}<tr><th class="rk">RK</th><th class="nm">${o.first || 'NAME'}</th>
      ${cols.map((c, i) => `<th class="num${i === s.i ? ' on' : ''}" data-csort="${id}:${i}"><span>${c[0]}</span>${i === s.i ? `<i>${s.desc ? '▾' : '▴'}</i>` : ''}</th>`).join('')}</tr></thead>
    <tbody>${sorted.map((r, j) => `<tr${o.hi && o.hi(r) ? ' class="hi"' : ''}><td class="rk">${rk[j]}</td><td class="nm"><div class="cn-in">${o.name(r)}</div></td>
      ${cols.map((c, i) => `<td class="num${i === s.i ? ' on' : ''}">${esc(String(cell(c, r)))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const cMark = name => markFor({name, abbr:shortName(name), color:'#4A4B4D'}, 26);   // phones: 22 (1-head.html)
// "Will Quinn" -> "W. Quinn"; one-word names and numbers ("#12") stay as they are.
const plShort = n => { const p = String(n).trim().split(/\s+/); return p.length < 2 || p[0].startsWith('#') ? n : `${p[0][0]}. ${p.slice(1).join(' ')}`; };
// Statewide: every school in the season's games, once each, by the first spelling seen (as countyStats names them).
// One entry per school, under the name this site uses, however the games spell it.
const sameTeamName = (a, b) => !!a && !!b && canonSchool(a) === canonSchool(b);
function stateTeamList(games){
  const seen = {};
  games.forEach(x => ['A', 'H'].forEach(s => { const k = canonSchool(x.teams[s].name); if (!seen[k]) seen[k] = schoolName(x.teams[s].name); }));
  return Object.values(seen).sort((a, b) => a.localeCompare(b));
}
function renderCounty(){
  if (!ui.county) return;
  const box = $('#board'), v = county.view, tab = tabOf(v), games = countyGames();
  const allLabel = STATE_STATS ? 'All Kansas Teams' : AV_STATS ? 'All AVCTL Teams' : 'All County Teams', teamList = STATE_STATS ? stateTeamList(games) : GROUP;
  const who = county.team === 'all' ? allLabel : county.team;
  const title = v === 'team' ? `${who} Team Stats ${county.season}` : `${who} Player ${P_VIEWS[v].label} Stats ${county.season}`;
  document.title = `${title} · ${groupName()} Stats`;
  const head = `<section class="bcard bhead"><div class="bhead-top"><h1 class="c-title">${esc(title)}</h1></div>
    <nav class="c-tabs">${C_TABS.map(([k, label, first]) => `<button type="button"${k === tab ? ' class="on"' : ''} data-cview="${first}">${label}</button>`).join('')}</nav>
    ${tab === 'offense' ? `<div class="c-pills">${['passing', 'rushing', 'receiving'].map(k => `<button type="button"${k === v ? ' class="on"' : ''} data-cview="${k}">${P_VIEWS[k].label}</button>`).join('')}</div>` : ''}
    <div class="c-filters"><select class="c-sel" id="cseason" aria-label="Season">${countySeasons().map(y => `<option value="${y}"${y === county.season ? ' selected' : ''}>${y}</option>`).join('')}</select>
      <select class="c-sel" id="cteam" aria-label="Team">${['all', ...teamList].map(c => `<option value="${esc(c)}"${county.team === c ? ' selected' : ''}>${c === 'all' ? allLabel : esc(c)}</option>`).join('')}</select></div></section>`;
  // 2025 comes from the season leaderboard, not games: passing, rushing, receiving and touchdowns, and nothing to load.
  const y25 = county.season === 2025 && !STATE_STATS && !AV_STATS, note = t => `<section class="bcard"><p class="bempty">${esc(t)}</p></section>`;
  let body;
  if (county.err && !y25) body = note(county.err);
  else if (!county.games && !y25) body = note('Loading stats…');
  else {
    const {teams, players} = y25 ? countyStats2025() : countyStats(games);
    if (v === 'team'){
      const o = {first:'TEAM', name:t => `${cMark(t.name)}<b>${esc(t.name)}</b>`, hi:t => sameTeamName(t.name, county.team)};
      const card = (title, id, cols, def, asc) => `<section class="bcard ccard"><div class="ccard-hd"><h2>${title}</h2></div>${statTable(id, STATE_STATS ? teams.filter(t => t.gp) : teams, cols, def, {...o, asc})}</section>`;
      if (y25){
        const cols = yardCols('').filter(c => !c[0].endsWith('/G'));
        body = card('Offense', 'off25', cols, cols.findIndex(c => c[0] === 'TOTAL YDS'))
          + note('The 2025 leaderboard has each player’s season totals, so these are the players added up. Records, points and defense aren’t in it.');
      } else {
        const qcols = quarterCols(teams.some(t => t.ot));
        body = card('Team Totals', 'team', T_COLS, 1) + card('Offense', 'off', yardCols(''), 10) + card('Defensive Team Stats', 'allow', yardCols('o'), 10, true)
          + card('Scoring by Quarter (for-against)', 'qtr', qcols, qcols.length - 2);
      }
    } else if (y25 && v === 'kicking') body = note('The 2025 leaderboard has no kicking stats.');
    else {
      const V = y25 && v === 'scoring' ? SCORING_25 : P_VIEWS[v], rows = players.filter(p => V.keep(p) && (county.team === 'all' || sameTeamName(p.team, county.team)));
      // Phones show the short form, like ESPN's ("W. Quinn").
      const name = p => `${cMark(p.team)}<span class="c-pl"><b><span class="pl-full">${esc(p.name)}</span><span class="pl-short">${esc(plShort(p.name))}</span></b><small>${esc(shortName(p.team))}${p.yr ? `<span class="pl-yr"> · ${esc(p.yr)}</span>` : ''}</small></span>`;
      // 2025's tables keep their own sort (its Scoring has fewer columns than this season's).
      body = `<section class="bcard ccard">${rows.length ? statTable(y25 ? v + '25' : v, rows, V.cols, V.def, {name, groups:V.groups})
        : `<p class="bempty" style="padding:4px 20px 10px">No ${V.label.toLowerCase()} stats yet${county.team === 'all' ? '' : ` for ${esc(county.team)}`}.</p>`}</section>`;
    }
  }

}

/* ================================================================
   Home page (?home): what Kansas Media Stats is and how to keep stats
   on a game, laid out like ESPN's front page: quick links on the left,
   the guide in the middle, what every tracked game gets on the right.
   ================================================================ */
// The front door: the site's plain address opens here. The Game Tracker has its own, ?tracker (and ?edit=<id>).
const PAGE_Q = new URLSearchParams(location.search);
const TRACKER_PAGE = PAGE_Q.has('tracker') || PAGE_Q.has('edit');
const HOME_PAGE = PAGE_Q.has('home') || (!TRACKER_PAGE && !['scores', 'state', 'stats', 'statestats', 'avctl', 'avstats', 'standings', 'game', 'live', 'team', 'teams'].some(k => PAGE_Q.has(k)));

// On a scorer's device (signed in on the Game Tracker), the menu bar's scorer buttons show on every page too. Away
// from the tracker they open it, with that window up: ?tracker&open=games, setup, export or share.
function scorerBar(){
  let signedIn = false, live = false;
  try {
    // A scorer's device: signed in on the Game Tracker (it notes that at sign-in and clears it at sign-out). Signed
    // out, the bar is just the site's pages, even with games kept here; the Game Tracker link still gets to them.
    signedIn = localStorage.getItem('pressbox.scorer') === '1';
    const d = JSON.parse(localStorage.getItem(STORE) || 'null'), cur = d && d.games && d.games[d.cur];
    live = !!(cur && cur.share && !cur.sample);
  } catch (e) {}
  const go = k => `?tracker&amp;open=${k}`;
  // Signed out: just a Sign in link, to the tracker's Games window with its Sign in with Google button.
  if (!signedIn){
    document.body.classList.add('signin');
    $('#sync').innerHTML = `<a class="abtn" href="${go('games')}" title="Sign in to keep stats and put your games on the scoreboard">Sign in</a>`;
    return;
  }
  document.body.classList.add('scorer');
  $('#sync').innerHTML = `<a class="abtn syncbtn ok" href="${go('games')}" title="Your games are kept in your account"><i></i>Synced</a>`;
  document.querySelector('.navtools .abtns').innerHTML = `<a class="abtn${live ? ' live' : ''}" href="${go('share')}">${live ? '<i></i>Live' : 'Private'}</a>`
    + `<a class="abtn" href="${go('games')}">Games</a>`
    + (localStorage.getItem('pressbox.admin') === '1' ? `<a class="abtn" href="${go('others')}">Others</a>` : '')   // the admin's devices only
    + `<a class="abtn" href="${go('setup')}">Setup</a><a class="abtn" href="${go('export')}">Export</a>`;
}
if (!TRACKER_PAGE) scorerBar();

async function startHome(){
  ui.viewer = true; ui.home = true; document.body.classList.add('viewer', 'bpage');
  $('#board').hidden = false;
  document.title = 'Kansas Media Stats · Track high school football live';
  renderHome();
  try {
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-`;
    const [appM, fsM] = await Promise.all([import(base + 'app.js'), import(base + 'firestore.js')]);
    const fsdb = fsM.getFirestore(appM.initializeApp(firebaseConfig));
    scoresReady({fsM, fsdb});   // the week's scores strip
  } catch (e) {}
}

      <div class="h-hero-bd"><span class="h-eyebrow">Kansas Media Stats</span>
        <h1>Track any high school football game, live</h1>
        <p class="h-dek">Log each play from the press box or the stands. The Gamecast, box score and stats build themselves as you go, and fans follow along with one link.</p>
        <div class="h-btns"><a class="h-btn primary" href="${esc(tracker)}">Start tracking</a><a class="h-btn" href="#how">How it works</a><a class="h-btn" href="?state">Scoreboard</a></div></div>
    </section>

    <div class="h-main">
      <section class="hcard" id="how"><span class="h-eyebrow">How it works</span>
        <h2 class="h-sec">How to track a game</h2>
        <p class="h-p">Anyone can keep stats. All it takes is a phone or a laptop, a roster if you can get one, and a view of the field. You log what happened on each play; the site does the math.</p>
        <p class="h-p"><b>You keep stats on both teams, not just yours.</b> One person tracks the whole game — every snap by either side — and that one game gives both schools their box score, their team stats and their season numbers. Two people tracking the same game from opposite sides would make two half-games, not one good one.</p>
        <ol class="h-steps">
          <li><b>Sign in.</b> Open the <a href="${esc(tracker)}">Game Tracker</a> and tap <b>Sign in to sync</b>, so your games follow you to every device and can go live.</li>
          <li><b>Start the game.</b> Open <b>Games</b> and choose <b>New game</b>, or tap a scheduled game in the scores strip and choose <b>Keep stats on this game</b>. Enter both schools, 11-man or 8-man, and the rosters if you have them (a number and a name on each line).</li>
          <li><b>Type the school’s full name, not initials.</b> “Free State”, not “FS”. The name box suggests schools as you type — take the suggestion, and the school’s helmet or logo and any roster already saved for it fill in on their own. Initials leave the game with a plain monogram and no roster. Use the same spelling when you paste a box score, so its stat lines land on the right team.</li>
          <li><b>It goes live on its own.</b> Once you're signed in, a new game is on the scoreboard, with a link fans can follow. To keep one to yourself, check <b>Keep this game private</b> when you set it up, or tap <b>Live</b> → <b>Make private</b> later.</li>
          <li><b>Log every play by both teams</b>, typing shorthand or tapping buttons — whoever has the ball. The tracker follows possession for you, so you just record what happened. The Gamecast, box score, drives and stats build themselves as you go, for both schools.</li>
          <li><b>Finish.</b> End each quarter as it happens (<code>eoq</code> in shorthand, or the button under the play). When the fourth quarter ends, the game goes Final on every scoreboard.</li>
        </ol>
        <div class="h-modes">
          <div class="h-mode"><span class="h-tag">Fastest</span><h3>Shorthand</h3>
            <p>Type each play as one short line and press Enter. It’s built for a laptop in the press box: once you know it, you can keep up with a hurry-up offense. The line under the box shows how each play will read before you record it.</p>
            <table class="h-codes"><tbody>${HOME_CODES.map(([c, m]) => `<tr><td><code>${esc(c)}</code></td><td>${esc(m)}</td></tr>`).join('')}</tbody></table>
            <p class="h-note">Teams go by a letter of their short name (here A for Augusta and E for El Dorado); the tracker shows which letters right under the box. <b>td</b> always means somebody scored. The full list is under <b>Shorthand</b> in the tracker.</p></div>
          <div class="h-mode"><span class="h-tag blue">Easiest to learn</span><h3>Buttons</h3>
            <p>Tap through each play instead of typing. It’s the best fit on a phone, and a good way to learn the game flow before switching to shorthand.</p>
            <ol>
              <li>Under <b>Next play</b>, tap the kind of play: <b>Run</b>, <b>Pass</b>, <b>Punt</b>, <b>Field Goal</b>, <b>Penalty</b>, <b>Timeout</b> or <b>Note</b> (<b>Kickoff</b> when a team kicks off).</li>
              <li>Fill in the numbers: the ball carrier, or the passer and the receiver; the yards gained or lost; and the tackler if you saw it. The roster chips (#28, #22…) fill in a number with one tap.</li>
              <li>Check the preview, which says exactly how the play will read, then tap <b>Record play</b>.</li>
              <li>Made a mistake? <b>Undo last</b> takes back the latest play, and <b>Edit</b> on any play in the Play-by-Play fixes an older one. Everything after it updates.</li>
            </ol>
            <p class="h-note">In the tracker, <b>Use the full form instead</b> switches to buttons and <b>Back to quick entry</b> switches back. It remembers your choice, and you can switch in the middle of a drive.</p></div>
          <div class="h-mode"><span class="h-tag">Type it how you'd say it</span><h3>Plain English</h3>
            <p>The same box takes a sentence. Write the play the way you’d say it out loud and the tracker works it out — numbers for the players, words for the rest. It’s longer than shorthand but nothing to memorize, and you can mix the two on one line.</p>
            <table class="h-codes h-say"><tbody>${[
              ['3 runs for 9 yards tackled by 55', '#3 rush for 9 yards (#55)'],
              ['3 sacked for 10 yards by 54 3:55', '#3 sacked by #54 for a loss of 10, at 3:55'],
              ['7 pass complete to 88 for 15 yards', 'Completion to #88, first down if it gets there'],
              ['7 incomplete to 88', 'Incomplete, intended for #88'],
              ['7 intercepted by 24', 'Picked off by #24'],
              ['3 runs it in for a touchdown', 'Touchdown from wherever the ball is'],
              ['8 for 9 yards tackled by 55', 'Shortest of all: a number, the yards, the tackler'],
              ['19 punts, 11 returns 5, ball at E35', '#19 punts, #11 returns it 5 — you never work out how far the punt went'],
              ['1 caught the kickoff at the 8 and ran it to the 20', 'Same for kickoffs: the yard lines are the receiving team’s, and the kick’s distance fills itself in'],
              ['3 tackled in the end zone for a safety', 'A safety said plainly (7 sacked in the end zone works too)'],
              ['pen aug 15 personal foul', 'A penalty in words; add 1st for an automatic first down'],
              ['pen aug 5 false start declined', 'Declined: it goes on the log and nothing moves. Offsetting replays the down']
            ].map(([c, m]) => `<tr><td><code>${esc(c)}</code></td><td>${esc(m)}</td></tr>`).join('')}</tbody></table>
            <p class="h-note">Put the clock anywhere on the line (<code>3:55</code>) and the tackler after the play. A few things stay short because there’s no sentence for them: the extra point is <code>15 xp</code> or <code>15 kick good</code>, and a drive starts with <code>A ball at A35</code>.</p></div>
          <div class="h-mode"><span class="h-tag gray">After the game</span><h3>Paste a box score</h3>
            <p>No one at the game to keep stats? Copy the box score from the newspaper or the school and paste it in: tap the game in the scores strip and choose <b>Paste box score</b>, or tap <b>+ Score</b>, then <b>Paste a box score instead</b>.</p>
            <p>The line score, scoring summary and player stats fill in, the game opens to its Box Score, and its stats count toward the season totals.</p></div>
        </div>
      </section>
    </div>

    <aside class="h-right">
      <section class="hcard"><h2 class="h-rail">${icon(I.shield)}Every game you track gets</h2>
        <ul class="h-gets">${[['Gamecast', 'The live field, drive by drive, with each play drawn on it'], ['Box Score', 'Passing, rushing, receiving, kicking and scoring for both teams'],
          ['Play-by-Play', 'Every snap, grouped into drives'], ['Team Stats', 'The two teams side by side: yards, first downs, turnovers and more'],
          ['Its own link', 'Fans follow it live on any phone, with no app or sign-in']].map(([t, d]) => `<li><b>${t}</b><span>${d}</span></li>`).join('')}</ul></section>
    </aside>
  </div>`;
}

/* ================================================================
   Game Tracker start screen. When no game is under way (the last one
   just went final, or there's only the sample or a pasted box score),
   the tracker opens here instead of on the old game: start a new one,
   pick one off the schedule, or reopen a recent game to fix a play.
   ================================================================ */
// A game that isn't under way: the sample, a pasted box score, or one that's over.
const idleGame = x => !x || !!x.sample || !!x.box || replay(x).st.final;

// This week's games still to come that nobody is keeping stats on yet; next week's once this week's are played.
function startSchedule(){
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const pick = k => weekGames(k).filter(x => x.kind === 'score' && x.per !== 'final' && gameDay(x) >= today);
  const wk = weekKey(Date.now()), next = weekKey(fromYmd(wk).getTime() + WEEK_MS + 3 * 864e5);
  const now = pick(wk);
  return now.length ? {k:wk, list:now} : {k:next, list:pick(next)};
}

function renderStart(){
  const on = !!ui.start && !ui.viewer;
  document.body.classList.toggle('starting', on);
  const box = $('#start'); if (!box) return;
  box.hidden = !on;
  if (!on) return;
  const sched = startSchedule();
  // Each school's logo stays with its name, so a long name wraps between the teams, not away from its logo.
  const matchup = T => `<span class="s-t">${markFor(T.A, 24)}${esc(T.A.name)}</span><em>at</em><span class="s-t">${markFor(T.H, 24)}${esc(T.H.name)}</span>`;
  const schedRows = sched.list.map(x => {
    const m = summary(x), when = `${dayShort(gameDay(x))}${x.time ? ' · ' + x.time : ''}`;
    return `<li><div class="s-teams"><b>${matchup(x.teams)}</b><span>${esc(when)}${m.pre ? '' : ' · ' + esc(m.status)}</span></div>
      <button type="button" class="s-go primary" data-qs-stats="${esc(x.id)}">Keep stats</button></li>`;
  }).join('');
  const mine = Object.values(db.games).filter(x => !x.sample).sort((a, b) => (b.updated || 0) - (a.updated || 0)).slice(0, 6);
  const mineRows = mine.map(x => {
    const st = replay(x).st, T = x.teams;
    const status = x.box ? 'Box score' : st.final ? (st.q > 4 ? 'Final/OT' : 'Final') : x.plays.length ? `In progress · ${perLabel(st.q)}` : 'Not started';
    const line = x.plays.length || x.box ? `${T.A.name} ${st.score.A}, ${T.H.name} ${st.score.H}` : `${T.A.name} at ${T.H.name}`;
    const date = gameDay(x).toLocaleDateString('en-US', {month:'short', day:'numeric'});
    return `<li><div class="s-teams"><b><span>${esc(line)}</span>${x.id === g.id ? '<i class="s-tag">Last game</i>' : ''}</b><span>${esc(date)} · ${esc(status)}</span></div>
      <button type="button" class="s-go" data-start-open="${esc(x.id)}">Open</button></li>`;
  }).join('');
  box.innerHTML = `<div class="s-main">
      <section class="hcard s-hero"><span class="h-eyebrow">Game Tracker</span>
        <h1>Start a new game</h1>
        <p>Set one up from scratch, pick a game off the schedule below, or enter one that’s already been played.</p>
        <div class="h-btns"><button type="button" class="h-btn primary" data-open="new">New game</button>
          <button type="button" class="h-btn" data-box-new>Paste a box score</button>
          <button type="button" class="h-btn" data-qs-new>Add a score</button></div>
      </section>
      <section class="hcard"><h2 class="h-rail">On the schedule · ${esc(weekLabel(sched.k))}</h2>
        ${schedRows ? `<ul class="s-list">${schedRows}</ul>` : `<p class="h-note">Nothing left on the schedule for ${esc(weekLabel(sched.k))}. Start a new game, or add one with <b>Add a score</b>.</p>`}
      </section>
    </div>
    <aside class="s-side"><section class="hcard"><h2 class="h-rail">Your games</h2>
      ${mineRows ? `<ul class="s-list">${mineRows}</ul><p class="h-note">Open a game to look it over or fix a play. Every game is under <b>Games</b> too.</p>` : '<p class="h-note">Games you track show up here.</p>'}
    </section></aside>`;
}

// Open one of your games from the start screen.
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-start-open]'); if (!b) return;
  const x = db.games[b.dataset.startOpen]; if (!x) return;
  g = x; resetUi(); setCurrent(); refresh(); scrollTo(0, 0);
});

/* ================================================================
   Teams: an index of every school (?teams) and a page for each one
   (?team=<name>) with its record, schedule and results. The admin
   sets each team's record here once; from then on every final on the
   site adds to it, and the scoreboards show it on the team's games
   still to come.
   ================================================================ */
const TEAM_PAGE = (PAGE_Q.has('team') || PAGE_Q.has('teams')) && !PAGE_Q.has('stats');
const tpage = {edit:false, draft:null, sug:null, name:''};

/* ---------- every shared game, for the schools' schedules and their records ---------- */
// The home page and BUCO Stats don't need it; the scoreboards, game pages, tracker and team pages do.
//
// History comes from season.json, a file the site serves itself: every shared game boiled down to who played,
// the score and whether it's final. It costs no database reads at all, which matters because this used to ask
// for every game on every page — 370-odd reads a visit, growing with the season. This week's games arrive live
// on top of it (watchWeek), so a score still moves the moment it changes.
const allGames = {list:null, idx:null, err:'', unsub:null, built:0};
function watchAllGames(api){
  if (allGames.unsub || ui.home || ui.county) return;
  allGames.unsub = () => {};
  loadSeason(api);
}
// A snapshot game, shaped like the real thing so everything downstream reads it the same way.
function seasonGame(e){
  return {id:e.id, teams:{A:e.a, H:e.h}, date:e.date || '', kind:e.kind || '', wk:e.wk,
    opp:e.opp, sched:e.sched, per:e.per, clk:e.clk, time:e.time, updated:e.updated || 0,
    box:!!e.box, stats:!!e.stats, players:e.pl || null,
    snap:{fin:!!e.fin, live:!!e.live, status:e.status || '', q:e.q || 0, score:{A:+e.A || 0, H:+e.H || 0}}};
}
async function loadSeason(api){
  try {
    const r = await fetch('/season.json', {cache:'no-cache'});
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (!d || !Array.isArray(d.games) || !d.games.length) throw new Error('empty');
    allGames.list = d.games.map(seasonGame); allGames.built = d.built || 0; allGames.err = '';
    indexGames(); recordsChanged();
    watchSince(api, allGames.built);   // and whatever has changed since the file was written
  } catch (e) {
    // No file, or it can't be read: ask the database for the games, the way this used to work.
    allGames.unsub = null;
    watchAllGamesLive(api);
  }
}
// Anything saved since the snapshot was built — a box score pasted for an old week, a score corrected — read
// live and laid over it. It asks only for documents newer than the file, which on a normal day is a handful.
function watchSince(api, built){
  if (!api || !built) return;
  const {fsM, fsdb} = api;
  try {
    const q = fsM.query(fsM.collection(fsdb, 'pressbox'), fsM.where('public', '==', true), fsM.where('updated', '>', built));
    allGames.since = fsM.onSnapshot(q, snap => {
      let changed = false;
      snap.forEach(d => {
        const v = d.data();
        if (!v || v.public !== true) return;
        const at = allGames.list.findIndex(x => x.id === d.id);
        if (v.deleted || !v.json){ if (at >= 0){ allGames.list.splice(at, 1); changed = true; } return; }
        let x; try { x = JSON.parse(v.json); } catch (e) { return; }
        if (!x.teams || !x.teams.A || !x.teams.H) return;
        x = Object.assign(x, {id:d.id});
        if (at >= 0) allGames.list[at] = x; else allGames.list.push(x);
        changed = true;
      });
      if (changed){ indexGames(); recordsChanged(); }
    }, e => {
      // The query needs a composite index (public + updated). Until it exists, read every game the way this used
      // to: dearer, but a box score pasted for an old week still shows the moment it's saved.
      console.warn('Kansas Media Stats: catch-up query refused, reading every game instead.', e && e.code);
      allGames.since = null; allGames.unsub = null; watchAllGamesLive(api);
    });
  } catch (e) { allGames.unsub = null; watchAllGamesLive(api); }
}

function watchAllGamesLive(api){
  if (allGames.unsub || !api) return;
  const {fsM, fsdb} = api;
  allGames.unsub = fsM.onSnapshot(fsM.query(fsM.collection(fsdb, 'pressbox'), fsM.where('public', '==', true)), snap => {
    const out = [];
    snap.forEach(d => {
      const v = d.data(); if (v.deleted || !v.json) return;
      try { const x = JSON.parse(v.json); if (x.teams && x.teams.A && x.teams.H) out.push(Object.assign(x, {id:d.id})); } catch (e) {}
    });
    allGames.list = out; allGames.err = ''; indexGames(); recordsChanged();
  }, () => { allGames.err = 'Can’t load the games right now. Reload to try again.'; allGames.list = allGames.list || []; renderTeamPage(); });
}
// Each school's games, one per week and opponent: the one with stats if there is one, else the newest copy.
function indexGames(){
  const idx = new Map();
  // The week showing is watched live, so its games are the current word on themselves: they replace the
  // snapshot's copy, which may have been written before tonight's result.
  const live = Object.entries(scores.docs || {}).map(([id, x]) => Object.assign({}, x, {id}));
  const byId = new Map();
  (allGames.list || []).forEach(x => byId.set(x.id, x));
  live.forEach(x => { if (x && x.teams && x.teams.A && x.teams.H) byId.set(x.id, x); });
  [...byId.values()].forEach(x => {
    // Only a game the admin hid is left out; the other schools' games count even though they're off the scoreboards.
    if (hideList.ids.has(x.id)) return;
    const stats = x.stats != null ? !!x.stats : (x.kind !== 'score' && ((x.plays && x.plays.length) || !!x.box)), wk = x.wk || gameWeek(x);
    ['A', 'H'].forEach(side => {
      const opp = side === 'A' ? 'H' : 'A', k = canonSchool(x.teams[side].name), key = wk + '|' + canonSchool(x.teams[opp].name);
      let m = idx.get(k); if (!m) idx.set(k, m = {});
      const was = m[key];
      if (!was || (stats && !was.stats) || (stats === was.stats && (x.updated || 0) > (was.x.updated || 0))) m[key] = {x, side, opp, wk, stats, key};
    });
  });
  allGames.idx = idx; recCache.clear();
  pushLocalScores();   // anything added on this device that never went up
}
const schoolRows = name => Object.values((allGames.idx && allGames.idx.get(canonSchool(name))) || {}).sort((a, b) => gameDay(a.x) - gameDay(b.x));
// Whether a game is final and its score, worked out once per version of the game (a replay isn't free).
const finMemo = new Map();
function finalOf(x){
  // A snapshot game carries its result, so nothing is replayed to find it again.
  if (x.snap) return {fin:x.snap.fin, live:x.snap.live, score:x.snap.score, status:x.snap.status, q:x.snap.q};
  const k = `${x.id}:${x.updated || 0}`;
  let v = finMemo.get(k);
  if (!v){ const m = summary(x); v = {fin:m.fin, live:m.live, score:m.score, status:m.status, q:m.q}; finMemo.set(k, v); }
  return v;
}

/* ---------- team records, kept by the admin ---------- */
// One shared list, like the hidden games: only the admin's account can change it, and anyone can read it.
const RECS_DOC = 'team-records';
const teamRecs = {map:{}, api:null, unsub:null};
function watchTeamRecs(api){
  teamRecs.api = api;
  if (teamRecs.unsub) return;
  const {fsM, fsdb} = api;
  // Until the first record is saved there is no list, and reading it is refused: then there are no records.
  teamRecs.unsub = fsM.onSnapshot(fsM.doc(fsdb, 'pressbox', RECS_DOC), snap => {
    const d = snap.exists() ? snap.data() : null;
    let map = {}; if (d && d.owner === ADMIN_UID && !d.deleted){ try { map = JSON.parse(d.json).teams || {}; } catch (e) {} }
    teamRecs.map = map; recCache.clear(); recordsChanged();
  }, () => { teamRecs.unsub = null; });
}
function recordsChanged(){ renderScores(); renderScoreboard(); renderTeamPage(); renderStandings(); if (g && R && !ui.board) renderBoard(); }

// "3-1" or "3-1-1" as numbers, or null when it's something else (left as typed).
const parseRec = s => { const m = String(s || '').trim().match(/^(\d+)\s*-\s*(\d+)(?:\s*-\s*(\d+))?$/); return m ? [+m[1], +m[2], +(m[3] || 0)] : null; };
const fmtRec = ([w, l, t]) => `${w}-${l}${t ? '-' + t : ''}`;
// The record as shown: what the admin saved, plus every final on the site since. Saving notes the finals already on
// the site (those are in what was typed); after that a final counts if it's dated on or after the day it was saved.
const recCache = new Map();
function shownRecord(name, thru){
  const k0 = name && canonSchool(name); if (!k0) return null;
  const k = thru ? `${k0}|${thru}` : k0;
  if (recCache.has(k)) return recCache.get(k);
  // A game already played shows the record as it stood that week, so a Week 1 final doesn't read Week 3's record.
  const upTo = r => !thru || r.wk <= thru;
  const base = teamRecs.map[k0]; let out = null;
  if (base){
    out = {rec:base.rec || '', home:base.home || '', away:base.away || ''};
    if (allGames.idx){
      const seen = new Set(base.seen || []), from = new Date(base.asOf || base.updated || 0); from.setHours(0, 0, 0, 0);
      const P = {rec:parseRec(base.rec), home:parseRec(base.home), away:parseRec(base.away)};
      schoolRows(name).forEach(r => {
        if (seen.has(r.key) || gameDay(r.x) < from || !upTo(r)) return;
        const f = finalOf(r.x); if (!f.fin) return;
        const a = f.score[r.side], b = f.score[r.opp], i = a > b ? 0 : a < b ? 1 : 2;
        [P.rec, r.side === 'H' ? P.home : P.away].forEach(p => { if (p) p[i]++; });
      });
      ['rec', 'home', 'away'].forEach(kk => { if (P[kk]) out[kk] = fmtRec(P[kk]); });
    }
  } else if (allGames.idx){
    // No record set: tally every final on the site, overall and home or away. A pasted box score is a final
    // like any other, so it counts. For a school whose whole schedule isn't here this is the record as far as
    // the site knows, and its page says so.
    const T = {rec:[0, 0, 0], home:[0, 0, 0], away:[0, 0, 0]}; let n = 0;
    schoolRows(name).forEach(r => {
      const f = finalOf(r.x); if (!f.fin || !upTo(r)) return;
      const a = f.score[r.side], b = f.score[r.opp], i = a > b ? 0 : a < b ? 1 : 2;
      T.rec[i]++; (r.side === 'H' ? T.home : T.away)[i]++; n++;
    });
    if (n) out = {rec:fmtRec(T.rec), home:fmtRec(T.home), away:fmtRec(T.away)};
  }
  recCache.set(k, out);
  return out;
}
async function saveTeamRecord(name, rec){
  if (!ui.admin || !teamRecs.api) return toast('Sign in on the Game Tracker to edit records');
  const map = Object.assign({}, teamRecs.map), k = canonSchool(name);
  if (rec.rec || rec.home || rec.away){
    const seen = schoolRows(name).filter(r => finalOf(r.x).fin).map(r => r.key);
    map[k] = Object.assign({name}, rec, {asOf:Date.now(), seen, updated:Date.now()});
  } else delete map[k];
  teamRecs.map = map; recCache.clear(); recordsChanged();
  const {fsM, fsdb} = teamRecs.api;
  try {
    await fsM.setDoc(fsM.doc(fsdb, 'pressbox', RECS_DOC), {owner:ADMIN_UID, updated:Date.now(), public:true, kind:'records',
      title:'Team records', json:JSON.stringify({teams:map})});
    toast('Record saved');
    if (!teamRecs.unsub) watchTeamRecs(teamRecs.api);   // the first save makes the list: follow it from now on
  } catch (e) { toast('Couldn’t save that. Sign in on the Game Tracker, then try again.'); }
}
// Wipe the typed records: from then on every school's record is the finals the site has, which is what a
// pasted box score feeds. Nothing else is touched — the games, their scores and their stats stay as they are.
async function clearTeamRecords(){
  if (!ui.admin || !teamRecs.api) return toast('Sign in on the Game Tracker first');
  const n = Object.keys(teamRecs.map || {}).length;
  if (!n) return toast('No typed records to clear');
  if (ui.confirm !== 'recs'){ ui.confirm = 'recs'; if (ui.dlg === 'schools') dlg().innerHTML = dlgSchools(); return toast(`Clear ${n} typed record${n === 1 ? '' : 's'}? Tap again`); }
  ui.confirm = null;
  const {fsM, fsdb} = teamRecs.api;
  try {
    // Save first, then forget them here: a refused write must not leave the screen saying they are gone.
    await fsM.setDoc(fsM.doc(fsdb, 'pressbox', RECS_DOC), {owner:ADMIN_UID, updated:Date.now(), public:true, kind:'records',
      title:'Team records', json:JSON.stringify({teams:{}})});
    teamRecs.map = {}; recCache.clear(); recordsChanged();
    toast(`Cleared ${n} typed record${n === 1 ? '' : 's'}`);
  } catch (e) { toast('Couldn’t clear those. Sign in on the Game Tracker, then try again.'); }
  if (ui.dlg === 'schools') dlg().innerHTML = dlgSchools();
}
const recParts = r => r ? [r.rec, r.home && `${r.home} Home`, r.away && `${r.away} Away`].filter(Boolean) : [];

  ui.viewer = true; ui.teamPage = true; document.body.classList.add('viewer', 'bpage');
  $('#board').hidden = false;
  loadLogos();   // the school list: without it "Haysville Campus" and "Campus" are two different schools
