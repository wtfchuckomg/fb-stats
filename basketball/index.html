      subj = p; handle(kind, suf); continue;
    }
    if (isNum(tok)){
      if (cur && cur.t === 'shot' && cur.v == null && (tok === '2' || tok === '3') && !subj){ cur.v = +tok; continue; }
      if (tok === '1' && cur && cur.t === 'shot' && cur.made && !subj){ cur.and1 = true; continue; }
      if (tok === '1' && subj && !cur){ handle('made', tok); continue; }
      if (subj && (tok === '2' || tok === '3')){ handle('made', tok); continue; }
      if (tok === '2' || tok === '3'){ handle('made', tok); continue; }
      if (tok === '1' && cur && cur.t === 'ft' && !subj) continue;   // "1 and 1"
      err = `"${tok}": a number needs a team in front of it, like ${Q.key.A}${tok} or ${Q.abbr.A} ${tok}.`; break;
    }
    const kind = ACT_OF[tok];
    if (!kind){ err = `Don't know what "${tok}" means.`; break; }
    handle(kind, tok);
  }
  if (err) return {error:err};
  if (pendTeam) give({s:pendTeam, n:'team'});
  if (subj){
    if (pendRole) give(subj), subj = null;
    else if (cur && fillBare(cur, subj)) subj = null;
    else if (!cur) return {error:`What did ${subj.n === 'team' ? g.teams[subj.s].abbr : '#' + subj.n} do? Add it: ${Q.key[subj.s]}${subj.n === 'team' ? '' : subj.n}-2, -miss2, r, a, s, b, to, f, ft.`};
    else return {error:`What did #${subj.n} do?`};
  }
  if (pendRole) return {error:roleName[pendRole.field] || 'Who?'};
  if (!events.length) return {error:'Nothing to record on that line.'};
  // tidy each event into a play
  const plays = [];
  for (const ev of events){
    if (ev.t === 'blk' && ev.n == null) return {error:'Who blocked the shot?'};
    if (ev.t === 'held' && ev.s == null){ plays.push({t:'held'}); continue; }
    if (ev.s == null || (ev.n == null && !['tmo', 'jump', 'poss', 'arrow', 'held'].includes(ev.t))) return {error:roleName[ev.t === 'shot' || ev.t === 'ft' ? 'shooter' : ev.t === 'tmo' || ev.t === 'jump' || ev.t === 'poss' || ev.t === 'arrow' ? 'team' : 'actor']};
    if (ev.t === 'shot'){
      if (ev.made == null) return {error:`Made or missed? ${Q.key[ev.s]}${ev.n}-2 or ${Q.key[ev.s]}${ev.n}-miss2`};
      if (ev.v == null) ev.v = 2;
      if (ev.reb && ev.rebKind && !ev.reb.kind) ev.reb.kind = ev.rebKind;
      const p = {t:'shot', s:ev.s, n:ev.n, v:ev.v, made:!!ev.made};
      if (ev.ast) p.ast = pl(ev.ast); if (ev.blk) p.blk = pl(ev.blk); if (ev.reb) p.reb = pl(ev.reb, true); if (ev.foul) p.foul = pl(ev.foul);
      if (ev.and1) p.and1 = true; if (ev.blocked) p.blocked = true; if (ev.how && ev.how !== '3-pt shot') p.how = ev.how;
      if (ev.paint) p.paint = true; if (ev.fb) p.fb = true; if (ev.gt) p.gt = true;
      if (p.n === 'team') return {error:'A shot needs a player number.'};
      plays.push(p);
    } else if (ev.t === 'ft'){
      const p = {t:'ft', s:ev.s, n:ev.n, seq:ev.seq.map(x => !!x.made)};
      if (ev.reb) p.reb = pl(ev.reb, true);
      if (p.n === 'team') return {error:'A free throw needs a player number.'};
      plays.push(p);
    } else if (ev.t === 'reb') plays.push({t:'reb', s:ev.s, n:ev.n, kind:ev.kind || null});
    else if (ev.t === 'ast' || ev.t === 'blk') plays.push({t:ev.t, s:ev.s, n:ev.n});
    else if (ev.t === 'stl'){ const p = {t:'stl', s:ev.s, n:ev.n}; if (ev.to) p.to = pl(ev.to); plays.push(p); }
    else if (ev.t === 'to'){ const p = {t:'to', s:ev.s, n:ev.n, kind:ev.kind || null}; if (ev.stl) p.stl = pl(ev.stl); plays.push(p); }
    else if (ev.t === 'foul'){ const p = {t:'foul', s:ev.s, n:ev.n, kind:ev.kind || 'p'}; if (ev.on) p.on = pl(ev.on); if (ev.how) p.how = ev.how; plays.push(p); }
    else if (ev.t === 'tmo') plays.push({t:'tmo', s:ev.s, kind:ev.kind || '60'});
    else if (ev.t === 'jump' || ev.t === 'poss' || ev.t === 'arrow') plays.push({t:ev.t, s:ev.s});
    else if (ev.t === 'held') plays.push({t:'held', s:ev.s});
    else if (ev.t === 'own' || ev.t === 'eject'){ if (ev.n === 'team') return {error:'That needs a player number.'}; plays.push({t:ev.t, s:ev.s, n:ev.n}); }
    else if (ev.t === 'viol') plays.push({t:'viol', s:ev.s, n:ev.n, kind:ev.kind});
  }
  return {plays, clk};
  function pl(x, withKind){ const o = {s:x.s, n:x.n}; if (withKind && x.kind) o.kind = x.kind; return o; }
}
</script>
<script>
/* ================================================================
   UI: state, the game strip, the entry pad, dialogs, storage.
   ================================================================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c]));
const STORE = 'hoops.v1';
let db = {cur:null, games:{}}, g = null, R = null;
const ui = {editing:null, ctx:null, tab:'gamecast', pbp:null, open:null, confirm:null, qtext:'', cheat:false, dlg:null, viewer:false, start:false, teamKey:null, printing:false};

const ab = s => g.teams[s].abbr || s;
const rosterName = (s, n) => (g.teams[s].roster || {})[String(n)] || '';
const PT = (s, n) => n === 'team' ? 'Team' : rosterName(s, n) || (/^\d+$/.test(String(n)) ? `#${n}` : String(n));
const mmss = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const plural2 = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const gameDay = x => x.date ? new Date(x.date + 'T12:00:00') : new Date(x.created);
function parseClock(v){
  v = String(v).trim(); if (!v) return null;
  if (v.includes(':')){ const [m, s] = v.split(':'); return (+m || 0) * 60 + (+s || 0); }
  const d = v.replace(/\D/g, ''); if (!d) return null;
  return d.length <= 2 ? +d * 60 : +d.slice(0, -2) * 60 + +d.slice(-2);
}
function clockNow(){ const c = g.clk; return c.run ? Math.max(0, c.s - (Date.now() - c.at) / 1000) : c.s; }
function setClock(s, run){ g.clk = {s:Math.max(0, s), run:!!run && s > 0, at:Date.now()}; save(); }
function perSeconds(per){ const ru = rulesOf(g); return (per > ru.n ? ru.ot : ru.per) * 60; }
// The clock on the strip ticks on its own; everything else redraws when a play is recorded.
setInterval(() => {
  if (!g || !g.clk || !g.clk.run) return;
  const el = $('#clk'); if (el && el.tagName === 'BUTTON') el.textContent = mmss(clockNow());
  if (clockNow() <= 0){ g.clk.run = false; g.clk.s = 0; save(); renderBoard(); }
}, 500);

/* ---------- game strip (scoreboard) ---------- */
function renderBoard(){
  const st = R.st, T = g.teams, ru = R.ru;
  // timeouts left: big dots for 60s, small for 30s
  const dots = s => { const t = st.tos[s]; return Array.from({length:Math.max(0, 3 - t.f)}, () => '<i class="full"></i>').join('') + Array.from({length:Math.max(0, t.f)}, () => '<i class="on full"></i>').join('')
    + Array.from({length:Math.max(0, 2 - t.s)}, () => '<i></i>').join('') + Array.from({length:Math.max(0, t.s)}, () => '<i class="on"></i>').join(''); };
  const won = st.final && st.score.A !== st.score.H ? (st.score.A > st.score.H ? 'A' : 'H') : null;
  const fullName = t => t.mascot && !String(t.name).toLowerCase().endsWith(t.mascot.toLowerCase()) ? `${t.name} ${t.mascot}` : t.name;
  const side = s => {
    const has = !st.final && st.poss === s, b = R.bonusOf(s);
    return `<div class="st-side ${s === 'H' ? 'home' : 'away'}${won && won !== s ? ' lose' : ''}" style="--tc:${esc(T[s].color)}">
      <div class="st-logo">${teamMark(s, 64)}</div>
      <div class="st-id"><div class="st-name">${esc(fullName(T[s]))}</div><div class="st-rec">${esc(T[s].rec ? T[s].rec : s === 'A' ? 'Away' : 'Home')}</div></div>
      <div class="st-scorebox"><div class="st-score"><span>${st.score[s]}</span>${has ? '<span class="st-poss" title="Has the ball"></span>' : ''}${won === s ? '<i class="st-win" title="Won"></i>' : ''}</div>
        ${st.final ? '' : `<div class="st-fouls ${b ? 'bonus' : ''}" title="Team fouls this ${ru.n === 2 ? 'half' : 'quarter'}">${st.fouls[s]} ${st.fouls[s] === 1 ? 'foul' : 'fouls'}${b ? ' · ' + b : ''}</div>
        <div class="st-tos" title="${st.tos[s].f} full and ${st.tos[s].s} thirty-second timeouts left">${dots(s)}</div>`}</div></div>`;
  };
  const per = st.final ? `Final${st.per > ru.n ? '/OT' : ''}` : perShort(st.per, ru);
  const go = g.clk.run
    ? '<svg viewBox="0 0 12 12"><rect x="1" y="1" width="3.6" height="10"/><rect x="7.4" y="1" width="3.6" height="10"/></svg>'
    : '<svg viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z"/></svg>';
  const line1 = !st.final
    ? `<button class="st-clock num ${g.clk.run ? 'run' : ''}" id="clk" title="Tap to set the clock">${mmss(clockNow())}</button><span>-</span><span>${per}</span>${ui.viewer ? '' : `<button class="clk-go" id="clkgo" aria-label="${g.clk.run ? 'Stop' : 'Start'} the clock">${go}</button>`}`
    : `<span>${per}</span>`;
  const l2 = st.final ? '' : st.poss ? `${ab(st.poss)} ball` : '';
  const l3 = st.final || !st.arrow ? '' : `Arrow: ${ab(st.arrow)}`;
  $('#sb').innerHTML = `<div class="strip-in">${side('A')}
    <div class="st-mid"><div class="st-line1">${line1}</div>${l2 ? `<div class="st-sit">${esc(l2)}</div>` : ''}${l3 ? `<div class="st-sit st-arrow">${esc(l3)}</div>` : ''}${st.final ? stripLines() : ''}</div>
    ${side('H')}</div>`;
}
function stripLines(){
  const st = R.st, L = st.lines, ru = R.ru;
  const cols = Array.from({length:ru.n + (st.per > ru.n ? 1 : 0)}, (_, i) => i);
  const pts = (s, i) => i < ru.n ? L[s][i] || 0 : L[s].slice(ru.n).reduce((a, b) => a + (b || 0), 0);
  const row = s => `<tr><td>${esc(ab(s))}</td>${cols.map(i => `<td>${pts(s, i)}</td>`).join('')}<td>${st.score[s]}</td></tr>`;
  return `<table class="st-ls"><thead><tr><th></th>${cols.map(i => `<th>${i < ru.n ? i + 1 : 'OT'}</th>`).join('')}<th>T</th></tr></thead><tbody>${row('A')}${row('H')}</tbody></table>`;
}
function editClock(){
  const b = $('#clk'); if (!b || b.tagName !== 'BUTTON' || ui.viewer) return;
  const inp = document.createElement('input');
  inp.className = 'st-clock num'; inp.id = 'clk'; inp.value = mmss(clockNow()); inp.inputMode = 'numeric';
  b.replaceWith(inp); inp.focus(); inp.select();
  const done = ok => { const s = ok ? parseClock(inp.value) : null; if (s != null) setClock(s, false); renderBoard(); };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') done(true); if (e.key === 'Escape') done(false); });
  inp.addEventListener('blur', () => done(true));
}

/* ---------- the entry pad: the typed line, tap keys that build it, period controls ---------- */
function padHtml(){
  const st = R.st, ru = R.ru, editing = ui.editing != null;
  if (g.box) return `<div class="final-card"><b>Final</b><div>${esc(g.teams.A.name)} ${st.score.A}, ${esc(g.teams.H.name)} ${st.score.H}</div><p class="hint">Entered from a box score.</p>
    <div class="line"><button class="btn" data-open="boxedit">Edit the box score</button><button class="btn" data-open="export">Export</button><button class="btn primary" data-open="new">New game</button></div></div>`;
  if (st.final && !editing) return `<div class="final-card"><b>Final</b><div>${esc(g.teams.A.name)} ${st.score.A}, ${esc(g.teams.H.name)} ${st.score.H}</div>
    <div class="line"><button class="btn" data-open="export">Export</button><button class="btn" data-reopen>Reopen the game</button><button class="btn primary" data-open="new">New game</button></div></div>`;
  const {key} = quickTeams(), a = key.A, h = key.H;
  // the possession arrow: who won the tip to start, and who inbounds to start each period
  const last = g.plays[g.plays.length - 1];
  let arrowBox = '';
  if (!editing && !g.plays.length) arrowBox = `<div class="arrowbox"><span class="eyebrow">Jump ball</span><div class="tobtns"><button class="btn" data-line="jump ${esc(a)}">${esc(ab('A'))} won the tip</button><button class="btn" data-line="jump ${esc(h)}">${esc(ab('H'))} won the tip</button></div></div>`;
  else if (!editing && last && last.t === 'endq' && st.per <= ru.n){
    arrowBox = st.poss ? `<div class="arrowbox"><span class="eyebrow">Possession arrow</span><div class="line"><span>${esc(ab(st.poss))} inbounds to start the ${esc(perLong(st.per, ru))}.</span><button class="btn small" data-line="${esc(key[other(st.poss)])} ball">${esc(ab(other(st.poss)))} inbounds instead</button></div></div>`
      : `<div class="arrowbox"><span class="eyebrow">Possession arrow</span><div class="tobtns"><button class="btn" data-line="${esc(a)} ball">${esc(ab('A'))} inbounds</button><button class="btn" data-line="${esc(h)} ball">${esc(ab('H'))} inbounds</button></div></div>`;
  } else if (!editing && st.per > ru.n && last && last.t === 'endq') arrowBox = `<div class="arrowbox"><span class="eyebrow">Overtime jump ball</span><div class="tobtns"><button class="btn" data-line="jump ${esc(a)}">${esc(ab('A'))} won the tip</button><button class="btn" data-line="jump ${esc(h)}">${esc(ab('H'))} won the tip</button></div></div>`;
  const chips = s => {
    const nums = Object.keys(g.teams[s].roster || {}).map(Number).filter(n => n >= 0).sort((x, y) => x - y);
    const list = nums.length ? nums : [0, 1, 2, 3, 4, 5, 10, 11, 12, 13, 14, 15, 20, 21, 22, 23, 24, 25, 30, 31, 32, 33, 34, 35, 40, 41, 42, 43, 44, 45, 50, 52, 54, 55];
    return `<div class="krow"><span class="kl" style="--tc:${esc(g.teams[s].color)}" title="${esc(g.teams[s].name)}">${esc(key[s])}</span>
      ${list.map(n => `<button type="button" class="qkey" data-qkey="${esc(key[s])}${n}" title="${esc(rosterName(s, n) || '#' + n)}">${n}</button>`).join('')}</div>`;
  };
  const acts = [['2', 'made', '2'], ['miss2', 'miss', 'miss2'], ['3', 'made', '3'], ['miss3', 'miss', 'miss3'], ['ft', 'made', 'ft'], ['ftm', 'miss', 'ftm'],
    ['r', 'act', 'r'], ['a', 'act', 'a'], ['s', 'act', 's'], ['b', 'act', 'b'], ['to', 'act', 'to'], ['f', 'act', 'f'], ['tf', 'act', 'tf']];
  const nextPer = st.per >= ru.n ? (st.score.A === st.score.H ? 'Tied: go to overtime' : `End of ${st.per > ru.n ? 'overtime' : 'regulation'}, final`) : `End of the ${perLong(st.per, ru)}`;
  return `<div class="pad-hd"><span class="sit">${esc(ui.ctx.sit)}</span>${editing ? '' : `<span class="muted num">${mmss(clockNow())}</span>`}</div>
    ${editing ? `<div class="editing-bar"><span>Editing play ${ui.editing + 1}. Retype the line, then save.</span><button class="linkbtn" data-cancel-edit>Cancel</button></div>` : ''}${arrowBox}
    <div class="quick">
      <input id="qk" class="qk" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done"
        aria-label="Type the play" placeholder="${esc(a)}3-2 · ${esc(a)}3-miss2-${esc(h)}10b-${esc(h)}13r · ${esc(a)}3ft" value="${esc(ui.qtext || '')}">
      <div class="qprev" id="qprev" aria-live="polite"></div>
      <div class="actions"><button class="btn primary" id="qrec">${editing ? 'Save changes' : 'Record'}</button>
        ${editing ? '<button class="btn" data-cancel-edit>Cancel</button>' : `<button class="btn" data-undo ${g.plays.length ? '' : 'disabled'}>Undo last</button>`}</div>
      <div class="keys">${chips('A')}${chips('H')}
        <div class="krow">${acts.map(([k, c, v]) => `<button type="button" class="qkey ${c}" data-qkey="${v}">${k}</button>`).join('')}<button type="button" class="qkey act wide" data-qkey="tmo">tmo</button><button type="button" class="qkey act" data-qkey="bksp" aria-label="Delete">⌫</button></div></div>
      <p class="hint"><b>${esc(a)}</b> = ${esc(g.teams.A.name)} · <b>${esc(h)}</b> = ${esc(g.teams.H.name)} · Enter records the play. You can also write it out: <i>${esc(a)} 3 blocked by ${esc(h)} 10 reb by ${esc(h)} 13</i></p>
      <details class="cheat" ${ui.cheat ? 'open' : ''}><summary>Shorthand</summary>${cheatHtml(a, h)}</details>
    </div>
    ${editing ? '' : `<div class="period"><span class="eyebrow">Timeouts</span>
      <div class="tobtns">${['A', 'H'].map(s => `<button class="btn" data-tmo="${s}:60" ${tosLeft(st.tos[s]) ? '' : 'disabled'}>${esc(ab(s))} 60 <small>(${st.tos[s].f})</small></button><button class="btn" data-tmo="${s}:30" ${tosLeft(st.tos[s]) ? '' : 'disabled'}>${esc(ab(s))} 30 <small>(${st.tos[s].s})</small></button>`).join('')}</div>
      <span class="eyebrow">Period</span><button class="btn" data-endq>${esc(nextPer)}</button></div>`}`;
}
function cheatHtml(a, h){
  const rows = [
    [`${a}3-2 · ${a}3-3`, `${g.teams.A.name}'s #3 makes a 2-pointer / a 3-pointer`],
    [`${a}3-miss2 · ${a}3-miss3`, 'Misses a 2 / a 3'],
    [`${a}2 layup · ${a}2 put back · ${a}2 dunk`, 'A made 2 (layup, putback, dunk, tip in). Add miss for a miss: ' + a + '2 layup miss'],
    [`${a}3-2-${a}12a`, 'Made shot, assist by #12 (a bare number after a make is the assist: ' + a + '3-2-' + a + '12)'],
    [`${a}3-miss2-${h}10b-${h}13r`, `Missed shot blocked by ${h}'s #10, rebounded by ${h}'s #13`],
    [`${a}3 blocked by ${h}10 reb ${h}13`, 'The same, written out. ' + a + '3-3 blocked by ' + h + '10 for a blocked three.'],
    [`${a}3-miss2-${a}5r`, 'Missed shot, #5 gets the offensive rebound (a bare number after a miss is the rebounder)'],
    [`${a}3-miss2-${h} r`, `Team rebound for ${h}`],
    [`${a}3ft · ${a}3ftm`, 'Made free throw / missed free throw'],
    [`${a}3ft-ftm · ${a}3ftm-${h}13r`, 'Two shots: made, missed / missed, rebounded by #13'],
    [`${a}3-2-${h}10f`, `Made shot, fouled by ${h}'s #10 (and one). Then ${a}3ft on the next line.`],
    [`${a}3-miss2-${h}10f`, 'Missed shot, shooting foul on #10'],
    [`${a}3r · ${a}3a · ${a}3s · ${a}3b`, 'Rebound / assist / steal / block on its own'],
    [`${a}3to · ${a}3to-${h}7s`, 'Turnover / turnover, stolen by #7. Also ' + a + '3-travel, ' + a + '3-charge'],
    [`${a}3ft1of2 · ${a}3ft2of2 · ${a}3ft0of2`, 'Free throws by the count: 1 of 2 made, 2 of 2, 0 of 2 (a miss goes last, so -' + h + '13r can follow)'],
    [`${a}3f · ${a}3f-${h}10 · ${a}3tf`, 'Personal foul / foul on #10 / technical. Bench technical: ' + a + ' tf'],
    [`${a}3ff · ${a}3f intentional · ${a}3 ejected`, 'Flagrant (ejects) / intentional / ejection. The 5th foul, a 2nd technical or a flagrant marks the player out.'],
    [`${a}3to-3sec · ${a}3to-backcourt`, 'Turnover kinds: travel, double, oob, 3sec, 5sec, 10sec, backcourt, lane, carry, badpass, shotclock. Plain ' + a + '3to is fine.'],
    [`${a}3-2 paint · ${a}3-2 fb`, 'Points in the paint (layup, dunk, putback, tip-in count on their own) / a fast-break basket'],
    [`${a}3-2 goaltend`, 'Goaltending: the basket counts as a made shot. ' + a + '3 own basket = 2 points for ' + h + ', no player credited'],
    [`${a} to · ${a} r`, 'Team turnover / team rebound'],
    [`${a} 60-time · ${a} 30-time`, `${g.teams.A.name} full (60-second) / 30-second timeout. Three 60s and two 30s a game, one more 60 in each overtime.`],
    ['held ball · arrow ' + a + ' · ' + a + ' ball', 'Held ball goes to the arrow team and flips it / set the arrow by hand / ' + g.teams.A.name + ' has the ball (at a period start, that flips the arrow)'],
    [`${a}3-2 4:31`, 'A clock time anywhere on the line stamps the play and sets the game clock'],
    ['eoq · half · final', 'End of the period / halftime / end the game'],
    ['jump ' + a, `${g.teams.A.name} wins the tip (sets who has the ball)`],
    ['undo', 'Remove the last play'],
    [`${a} 2 blocked by ${h} 3 reb by ${a} 10 shot by ${a} 10 miss reb by ${h} 10`, 'Written out: several plays on one line. Teams by letter, short name or the start of the school name.']];
  return `<div class="tbl-wrap"><table><tbody>${rows.map(([c, m]) => `<tr><td><code>${c}</code></td><td>${esc(m)}</td></tr>`).join('')}</tbody></table></div>`;
}
function renderPad(){
  const el = $('#pad'); if (!el) return;
  if (ui.viewer){ el.hidden = true; return; }
  el.hidden = false; el.innerHTML = padHtml(); quickPreview();
}
// Parse the line against the situation before it (the play being edited, or the end of the game).
function quickResult(line){
  const idx = ui.editing ?? g.plays.length, st = ui.ctx.st;
  const r = parseQuick(line, st);
  if (!r || r.error || r.undo) return {r};
  const plays = r.plays.map(p => ({...p}));

// Each player's line to numbers. Pairs (5-11) are FG, 3P, FT in that order (one pair alone is FT, two are FG and FT);
// plain numbers before a pair are made field goals; the numbers after the pairs end in points, with rebounds,
// assists, steals, blocks, turnovers and fouls in front of it when given.
function parseBoxPlayers(txt){
  const players = [], threes = [], team = {};
  for (let raw of String(txt || '').split('\n')){
    const line = raw.trim().replace(/[.,;:]+$/, ''); if (!line) continue;
    const m3 = line.match(/^(?:3[- ]?(?:pt|point|pointers?)(?:\s*goals?|\s*fgs?)?|threes?|three[- ]?pointers?)\s*[:\-–—]\s*(.*)$/i);
    if (m3){ m3[1].split(/[,;]/).forEach(x => { const mm = x.trim().match(/^(.+?)\s+(\d+)$/); if (mm) threes.push([mm[1].trim().toLowerCase(), +mm[2]]); }); continue; }
    const toks = line.replace(/,/g, ' ').split(/\s+/);
    let n = null, i = 0;
    if (/^#?\d{1,2}$/.test(toks[0]) && toks[1] && !/^\d/.test(toks[1])){ n = String(+toks[0].replace('#', '')); i = 1; }
    const nameW = [];
    while (i < toks.length && !/^\d+(-\d+)?$/.test(toks[i])) nameW.push(toks[i++]);
    const name = nameW.join(' ').trim(); if (!name && n == null) continue;
    const nums = toks.slice(i).filter(t => /^\d+(-\d+)?$/.test(t));
    const pairs = nums.filter(t => t.includes('-')).map(t => t.split('-').map(Number)), before = [], after = [];
    let seen = false; nums.forEach(t => { if (t.includes('-')) seen = true; else (seen ? after : before).push(+t); });
    const p = zeros(PL_KEYS);
    if (pairs.length >= 3){ [p.fgm, p.fga] = pairs[0]; [p.tpm, p.tpa] = pairs[1]; [p.ftm, p.fta] = pairs[2]; }
    else if (pairs.length === 2){ [p.fgm, p.fga] = pairs[0]; [p.ftm, p.fta] = pairs[1]; }
    else if (pairs.length === 1){ [p.ftm, p.fta] = pairs[0]; }
    if (before.length && pairs.length < 3){ p.fgm = before[0]; if (before[1] != null && pairs.length === 0){ p.ftm = before[1]; p.fta = before[1]; } }
    const tail = [...after]; if (!pairs.length && before.length > 1) tail.push(...before.slice(pairs.length ? 0 : 2));
    const pts = tail.length ? tail.pop() : null;
    ['reb', 'ast', 'stl', 'blk', 'to', 'pf'].forEach((k, j) => { if (tail[j] != null) p[k] = tail[j]; });
    if (pairs.length === 3 && after.length >= 8){ p.oreb = after[0]; p.dreb = after[1]; p.reb = after[2]; p.ast = after[3]; p.stl = after[4]; p.blk = after[5]; p.to = after[6]; p.pf = after[7]; }
    p.pts = pts != null ? pts : p.fgm * 2 + p.tpm + p.ftm;
    if (!p.fga) p.fga = p.fgm; if (!p.fta) p.fta = p.ftm; if (!p.tpa) p.tpa = p.tpm;
    if (!p.reb) p.reb = p.oreb + p.dreb; else if (!p.oreb && !p.dreb) p.dreb = p.reb;
    if (/^(team|totals?)$/i.test(name)){ Object.assign(team, p); continue; }
    players.push(Object.assign(p, {n:n != null ? n : name, name}));
  }
  // "3-point goals: Brandt 2" lands on the matching name
  threes.forEach(([who, k]) => { const p = players.find(x => x.name.toLowerCase() === who || x.name.toLowerCase().split(/\s+/).pop() === who.split(/\s+/).pop()); if (p){ p.tpm = k; if (p.tpa < k) p.tpa = k; } });
  return {players, team:Object.keys(team).length ? team : null};
}

      <p class="hint">${g.share ? 'Anyone with the link can watch the score, play-by-play and stats update as you enter plays. They can’t change anything.'
        : 'Turn it on to get a link people can watch this game from. They can’t change anything.'}</p></div>
      <button class="btn small ${g.share ? '' : 'primary'}" data-share="${g.share ? 'off' : 'on'}">${g.share ? 'Turn off' : 'Turn on'}</button></div>
    ${g.share ? `<div class="fld"><label class="eyebrow" for="x-link">Link to share</label><input class="inp" id="x-link" readonly value="${esc(link)}" style="font:500 15px/1.2 var(--sans)"></div>
      <div class="line"><button class="btn small" data-copy="x-link">Copy link</button><a class="btn small" href="${esc(link)}" target="_blank" rel="noopener">Open the viewer</a></div>
      <p class="hint">Viewers see any roster names you’ve entered. Turning the link off stops it working right away.</p>` : ''}`;
  return `${dlgHead('Share live')}<div class="dlg-bd">${body}</div>`;
}
function dlgExport(){
  return `${dlgHead('Export')}<div class="dlg-bd">
    <div class="grp"><h3>Excel workbook</h3><p class="hint">Line score, scoring plays, both box scores, team stats and the full play-by-play, one sheet each.</p>
      <div class="line">${framed ? '<span class="hint">Excel downloads work on your own site.</span>' : '<button class="btn small primary" data-xlsx>Download Excel file</button>'}</div></div>
    <div class="grp"><h3>Box score and play-by-play</h3><textarea class="inp num" id="x-txt" rows="8" readonly style="font:13px/1.35 var(--mono)">${esc(summaryText())}</textarea>
      <div class="line"><button class="btn small" data-copy="x-txt">Copy text</button><button class="btn small" data-print>Print</button></div></div>
    <div class="grp"><h3>Back up this game</h3><p class="hint">A backup restores the game on any device through Import below.</p>
      <div class="line">${framed ? '' : '<button class="btn small" data-download>Download backup</button>'}<button class="btn small" data-copy="x-json">Copy backup text</button></div>
      <textarea class="inp" id="x-json" rows="3" readonly hidden>${esc(JSON.stringify(g))}</textarea></div>
    <div class="grp"><h3>Import a game</h3><textarea class="inp" id="x-imp" rows="3" placeholder="Paste a backup here"></textarea>
      <div class="line"><button class="btn small" data-import>Import pasted text</button><label class="btn small">Choose file<input type="file" id="x-file" accept=".json,application/json" hidden></label></div></div></div>`;
}
function copyFrom(id){
  const el = $('#' + id), text = el.value;
  const fallback = () => { el.hidden = false; el.focus(); el.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} toast(ok ? 'Copied' : 'Text selected — copy it from the box'); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('Copied'), fallback); else fallback();
}
function download(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(g, null, 1)], {type:'application/json'}));
  a.download = `${g.teams.A.abbr}-at-${g.teams.H.abbr}-${ymd(gameDay(g))}.json`.toLowerCase();
  document.body.appendChild(a); a.click(); a.remove();
  toast('Backup saved');
}
function importText(txt){
  let x; try { x = JSON.parse(txt); } catch (e) { toast('That isn’t a Press Box backup.'); return; }
  if (!x || !x.teams || !Array.isArray(x.plays)){ toast('That backup is missing its teams or plays'); return; }
  x.id = 'g' + Date.now().toString(36); x.set = x.set || {fmt:'q', per:8, ot:4}; x.clk = x.clk || {s:rulesOf(x).per * 60, run:false, at:0};
  g = x; resetUi(); save(); closeDialog(); refresh(); toast('Game imported');
}
function printAll(){
  closeDialog(); ui.printing = true; renderView();
  try { window.print(); } finally { setTimeout(() => { ui.printing = false; renderView(); }, 300); }
}
// A plain-text box score for pasting into a story.
function summaryText(){
  const st = R.st, T = g.teams, ru = R.ru, S = R.S;
  const cols = Array.from({length:ru.n + (st.per > ru.n ? 1 : 0)}, (_, i) => i);
  const line = s => `${T[s].name.padEnd(22)} ${cols.map(i => String(i < ru.n ? st.lines[s][i] || 0 : st.lines[s].slice(ru.n).reduce((a, b) => a + (b || 0), 0)).padStart(3)).join(' ')} — ${st.score[s]}`;
  const box = s => {
    const rows = Object.values(S.pl[s]).sort((a, b) => b.pts - a.pts || b.reb - a.reb);
    const t = S.team[s];
    return `${T[s].name.toUpperCase()} (${st.score[s]})\n` + rows.map(p => `${PT(s, p.n).padEnd(22)} ${String(p.pts).padStart(3)} pts, ${p.fgm}-${p.fga} FG, ${p.tpm}-${p.tpa} 3PT, ${p.ftm}-${p.fta} FT, ${p.reb} reb, ${p.ast} ast, ${p.stl} stl, ${p.blk} blk, ${p.to} to, ${p.pf} pf`).join('\n')
      + `\nTotals: ${t.fgm}-${t.fga} FG, ${t.tpm}-${t.tpa} 3PT, ${t.ftm}-${t.fta} FT, ${t.reb} reb (${t.oreb} off), ${t.ast} ast, ${t.stl} stl, ${t.blk} blk, ${t.to} to, ${t.pf} fouls`;
  };
  return `${T.A.name} at ${T.H.name} · ${gameDay(g).toLocaleDateString()}${st.final ? ' · Final' : ''}\n\n${line('A')}\n${line('H')}\n\n${box('A')}\n\n${box('H')}\n\nPLAY-BY-PLAY\n`
    + R.log.map(e => `${perShort(e.per, ru).padEnd(4)} ${e.clk != null ? mmss(e.clk).padStart(5) : '     '}  ${e.text}  (${e.A}-${e.H})`).join('\n');
}

/* ---------- storage ---------- */
function load(){ try { const d = JSON.parse(localStorage.getItem(STORE) || 'null'); if (d && d.games) db = d; } catch (e) {} }
function persist(){ try { localStorage.setItem(STORE, JSON.stringify(db)); } catch (e) {} }
function save(){ if (!g) return; g.updated = Date.now(); db.games[g.id] = g; db.cur = g.id; persist(); syncPush(g); }
function setCurrent(){ if (!g) return; db.games[g.id] = g; db.cur = g.id; persist(); }
function resetUi(){ Object.assign(ui, {editing:null, ctx:null, open:null, confirm:null, qtext:'', start:false}); }
const idleGame = x => !x || !!x.sample || replay(x).st.final;
function refresh(){
  R = replay(g);
  ui.ctx = ui.editing != null ? replay(g, ui.editing) : R;
  $('#sample').hidden = !g.sample || !!ui.viewer;
  const sb = $('#sharebtn');
  if (sb){ sb.classList.toggle('live', !!g.share); sb.innerHTML = g.share ? '<i></i>Live' : 'Share'; }
  document.body.classList.toggle('starting', !!ui.start && !ui.viewer);
  renderBoard(); renderPad(); renderView(); renderRail(); renderLive(); loadLogos(); renderStart();
  document.title = `${g.teams.A.abbr} ${R.st.score.A}, ${g.teams.H.abbr} ${R.st.score.H} · Kansas Media Stats Basketball`;
}
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1700); }

/* ---------- actions ---------- */
function undo(){
  if (!g.plays.length) return;
  const last = g.plays.length - 1, grp = g.plays[last].grp;
  let from = last; if (grp) while (from > 0 && g.plays[from - 1].grp === grp) from--;
  g.plays.splice(from); resetUi(); save(); refresh(); toast(last - from ? 'Last line removed' : 'Last play removed');
}
function endq(){
  const per = R.st.per;
  g.plays.push({t:'endq', clk:0, q:'eoq'});
  const fin = replay(g).st;
  g.clk = fin.final ? {s:0, run:false, at:0} : {s:perSeconds(fin.per), run:false, at:0};
  save(); refresh(); toast(fin.final ? 'Final' : `End of the ${perLong(per, R.ru)}`);
}
function timeout(s, kind = '60'){ g.plays.push({t:'tmo', s, kind, clk:Math.ceil(clockNow()), q:`${quickTeams().key[s]} ${kind}-time`}); g.clk = {s:clockNow(), run:false, at:Date.now()}; save(); refresh(); toast(`${g.teams[s].name} ${kind}-second timeout`); }
// A play typed for the scorer by a button (the jump ball, who inbounds).
function recordLine(line){ ui.qtext = line; recordQuick(); }
function startEdit(i){
  const p = g.plays[i]; ui.editing = i; ui.ctx = replay(g, i); ui.open = null;
  ui.qtext = p.q || lineFor(p);
  renderPad(); renderView(); $('#pad').scrollIntoView({behavior:'smooth', block:'start'}); focusQuick();
}
// Shorthand for a play that has none of its own (a button-made timeout or period end, or one imported from a backup).
function lineFor(p){
  const {key} = quickTeams(), k = s => key[s], pl = x => x ? `${k(x.s)}${x.n === 'team' ? '' : x.n}` : '';
  switch (p.t){
    case 'shot': return `${pl(p)}-${p.made ? '' : 'miss'}${p.v}${p.ast ? `-${pl(p.ast)}a` : ''}${p.blk ? `-${pl(p.blk)}b` : ''}${p.foul ? `-${pl(p.foul)}f` : ''}${p.reb ? `-${pl(p.reb)}r` : ''}${p.how && !/3-pt/.test(p.how) ? ' ' + p.how.split(' ')[0] : ''}${p.paint ? ' paint' : ''}${p.fb ? ' fb' : ''}${p.gt ? ' goaltend' : ''}`;
    case 'ft': return `${pl(p)}${p.seq.map(m => m ? 'ft' : 'ftm').join('-')}${p.reb ? `-${pl(p.reb)}r` : ''}`;
    case 'own': return `${pl(p)} own basket`; case 'eject': return `${pl(p)} ejected`; case 'viol': return `${pl(p)} kicked ball`;
    case 'poss': return `${k(p.s)} ball`; case 'arrow': return `arrow ${k(p.s)}`; case 'held': return p.s ? `held ball ${k(p.s)}` : 'held ball';
    case 'reb': return `${pl(p)}${p.n === 'team' ? ' r' : 'r'}`;
    case 'ast': return `${pl(p)}a`; case 'stl': return `${pl(p)}s${p.to ? `-${pl(p.to)}to` : ''}`; case 'blk': return `${pl(p)}b`;
    case 'to': return `${pl(p)}${p.n === 'team' ? ' to' : 'to'}${p.stl ? `-${pl(p.stl)}s` : ''}`;
    case 'foul': return `${pl(p)}${p.n === 'team' ? ' ' : ''}${p.kind === 't' ? 'tf' : p.kind === 'o' ? 'of' : p.kind === 'f' ? 'ff' : 'f'}${p.kind === 'i' ? ' intentional' : ''}${p.how ? ' ' + p.how.split(' ')[0].replace('-', '') : ''}${p.on ? `-${pl(p.on)}` : ''}`;
    case 'tmo': return `${k(p.s)} ${p.kind || '60'}-time`; case 'jump': return `jump ${k(p.s)}`; case 'endq': return 'eoq'; case 'final': return 'final'; case 'note': return `note ${p.text || ''}`;
  }
  return '';
}
function deletePlay(i){
  const to = editEnd(i);
  g.plays.splice(i, to - i); ui.open = null; ui.confirm = null;
  if (ui.editing != null) ui.editing = null;
  save(); refresh(); toast('Play deleted');
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button, a[data-tab]'); if (!b) return;
  const d = b.dataset;
  if (d.tab){ ui.tab = d.tab; renderView(); if (b.classList.contains('linkbtn2')) window.scrollTo({top:0, behavior:'smooth'}); return; }
  if (d.pbp){ ui.pbp = d.pbp; renderView(); return; }
  if ('close' in d) return closeDialog();
  if (d.filter || d.freset) return;   // the play-by-play filters, handled with the views
  if (ui.viewer) return;
  if (d.open){ if (d.open === 'new' && g.sample && !ui.start){ /* fine */ } return openDialog(d.open); }
  if (d.qkey) return insertKey(d.qkey);
  if (b.id === 'qrec') return recordQuick();
  if ('undo' in d) return undo();
  if ('cancelEdit' in d){ ui.editing = null; ui.qtext = ''; ui.ctx = R; renderPad(); renderView(); return; }
  if ('endq' in d) return endq();
  if (d.tmo){ const [s, k] = d.tmo.split(':'); return timeout(s, k || '60'); }
  if (b.id === 'clk') return editClock();
  if (b.id === 'clkgo'){ setClock(clockNow(), !g.clk.run); renderBoard(); return; }
  if ('reopen' in d){
    // take off the final marker (or the last period end) so the game can go on
    const last = g.plays[g.plays.length - 1];
    if (last && (last.t === 'final' || last.t === 'endq')){ g.plays.pop(); g.clk = {s:0, run:false, at:0}; save(); refresh(); toast('Game reopened'); }
    return;
  }
  if (d.row != null){ ui.open = ui.open === +d.row ? null : +d.row; ui.confirm = null; renderView(); return; }
  if (d.edit != null) return startEdit(+d.edit);
  if (d.del != null){ const i = +d.del; if (ui.confirm !== i){ ui.confirm = i; renderView(); return; } return deletePlay(i); }
  if ('saveSetup' in d) return saveSetup(d.saveSetup === '1');
  if ('saveBox' in d) return saveBox(d.saveBox);
  if (d.line) return recordLine(d.line);
  if (d.fmt){ $('#s-fmt').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); if (!d.nohint){ $('#s-per').value = FORMATS[d.fmt].per; $('#s-rulehint').textContent = ruleHint(d.fmt); } return; }
  if (d.openGame){ g = db.games[d.openGame]; resetUi(); setCurrent(); closeDialog(); refresh(); return toast('Game opened'); }
  if (d.delGame){
    const id = d.delGame;
    if (ui.confirm !== 'g:' + id){ ui.confirm = 'g:' + id; dlg().innerHTML = dlgGames(); return; }
    delete db.games[id]; syncDelete(id); ui.confirm = null;
    if (g.id === id){ g = Object.values(db.games).sort((a, b) => (b.updated || 0) - (a.updated || 0))[0] || sampleGame(); resetUi(); ui.start = idleGame(g); setCurrent(); refresh(); }
    persist(); dlg().innerHTML = dlgGames(); return toast('Game deleted');
  }
  if (d.copy) return copyFrom(d.copy);
  if ('download' in d) return download();
  if ('xlsx' in d) return downloadXlsx();
  if ('print' in d) return printAll();
  if ('import' in d) return importText($('#x-imp').value);
  if (d.share){ g.share = d.share === 'on'; save(); refresh(); dlg().innerHTML = dlgShare(); return toast(g.share ? 'Live link is on' : 'Live link is off'); }
  if ('signin' in d) return signIn();
  if ('signout' in d) return signOutSync();
  if ('sync' in d) return openDialog('games');
  if ('startNew' in d) return openDialog('new');
  if (d.resume){ g = db.games[d.resume]; resetUi(); setCurrent(); refresh(); return; }
  if ('sample' in d){ g = db.games.sample || sampleGame(); db.games.sample = g; resetUi(); setCurrent(); refresh(); return; }
});
document.addEventListener('input', e => {
  if (e.target.id === 'qk'){ ui.qtext = e.target.value; quickPreview(); }
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'qk' && e.key === 'Enter'){ e.preventDefault(); recordQuick(); }
  if (e.target.id === 'qk' && e.key === 'Escape' && ui.editing != null){ ui.editing = null; ui.qtext = ''; ui.ctx = R; renderPad(); renderView(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'x-file'){ const f = e.target.files[0]; if (f) f.text().then(importText); }
});
document.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('cheat')) ui.cheat = e.target.open; }, true);
dlg().addEventListener('close', () => { ui.dlg = null; });
</script>
<script>
/* ================================================================
   Gamecast views: the situation and last play, line score, scoring
   flow, play-by-play, box score, team stats and the side rail.
   Shared by the scorer and viewers.
   ================================================================ */
const whenTxt = (per, clk) => clk != null ? `${mmss(clk)} - ${perShort(per, R.ru)}` : perName(per, R.ru);
const pct = (m, a) => a ? (m / a * 100).toFixed(1) : '0.0';
function lastPlay(){ return R.log.length ? R.log[R.log.length - 1] : null; }
function tagHtml(tags){ return tags.map(([c, t]) => `<span class="tag ${c}">${esc(t)}</span>`).join(''); }
function playTitle(e){
  const p = g.plays[e.i] || {};
  switch (p.t){
    case 'shot': return p.made ? `${p.v}-pt shot` : p.blk ? 'Blocked shot' : `Missed ${p.v}-pt shot`;
    case 'ft': return 'Free throw'; case 'reb': return 'Rebound'; case 'ast': return 'Assist'; case 'stl': return 'Steal'; case 'blk': return 'Block';
    case 'to': return 'Turnover'; case 'foul': return p.kind === 't' ? 'Technical Foul' : 'Foul'; case 'tmo': return 'Timeout'; case 'jump': return 'Possession';
    case 'endq': return 'End of Period'; case 'final': return 'Final'; case 'note': return 'Note';
  }
  return 'Play';
}

/* ---------- Gamecast tab ---------- */
function cardSituation(){
  const st = R.st, ru = R.ru, lp = lastPlay(), T = g.teams;
  const title = st.final ? 'Final' : perName(st.per, ru);
  const bon = s => { const b = R.bonusOf(s); return `${st.fouls[s]} team ${st.fouls[s] === 1 ? 'foul' : 'fouls'}${b ? `, ${b}` : ''}`; };
  return `<section class="card">
    <div class="card-hd">${st.poss && !st.final ? teamMark(st.poss, 34) : ''}<div><h2 class="card-title">${title}</h2>${st.final ? '' : `<div class="card-sub">${st.poss ? `${esc(T[st.poss].name)} ball` : 'Ball in play'} · ${mmss(clockNow())} left</div>`}</div></div>
    ${st.final ? `<div class="cd-split"><div><div class="cd-lbl">${esc(T.A.name)}</div><div class="cd-val">${st.score.A}</div></div><i></i><div><div class="cd-lbl">${esc(T.H.name)}</div><div class="cd-val">${st.score.H}</div></div></div>`
      : `<div class="cd-split"><div><div class="cd-lbl">${esc(ab('A'))}</div><div class="cd-val">${esc(bon('A'))}</div></div><i></i><div><div class="cd-lbl">${esc(ab('H'))}</div><div class="cd-val">${esc(bon('H'))}</div></div></div>`}
    ${lp ? `<div class="inner lp"><div class="lp-hd"><div class="lp-title">${esc(playTitle(lp))}</div><span class="pill">Last Play</span></div>
      <div class="lp-txt">${esc(lp.text)}</div>
      <div class="lp-sit">${esc(whenTxt(lp.per, lp.clk))} · ${esc(ab('A'))} ${lp.A}, ${esc(ab('H'))} ${lp.H}</div></div>` : '<div class="empty">No plays yet. Type the first one above.</div>'}
  </section>`;
}
/* ---------- Offense boxes and Current Trends, in the style of StatBroadcast's ---------- */
const atTxt = (per, clk) => `${perShort(per, R.ru)}-${clk != null ? mmss(clk).padStart(5, '0') : '--:--'}`;
function offenseFacts(){
  const F = {A:{}, H:{}}, sc = R.scoring;
  let big = {A:0, H:0};
  for (const e of sc){
    const p = g.plays[e.i];
    if (p.t === 'shot') F[e.s].lastFG = e;
    const lead = e.A > e.H ? 'A' : e.H > e.A ? 'H' : null;
    if (lead){ F[lead].lastLead = e; const m = Math.abs(e.A - e.H); if (m > big[lead]){ big[lead] = m; F[lead].bigLead = {m, e}; } }
  }
  return F;
}
function cardOffense(){
  if (R.box) return '';
  const T = g.teams, F = offenseFacts();
  const own = (s, e) => s === 'A' ? `${e.A}-${e.H}` : `${e.H}-${e.A}`;
  const box = s => {
    const f = F[s], fg = f.lastFG, p = fg && g.plays[fg.i];
    const rows = [
      ['Last FG', fg ? `${fg.clk != null ? mmss(fg.clk).padStart(5, '0') : ''} ${(p.how || `${p.v}-pt shot`).toUpperCase()} #${p.n} ${rosterName(s, p.n).toUpperCase()} (${own(s, fg)})` : '-'],
      ['Last Lead', f.lastLead ? `${own(s, f.lastLead)} @ ${atTxt(f.lastLead.per, f.lastLead.clk)}` : '- @ -'],
      ['Largest Lead', f.bigLead ? `${f.bigLead.m} @ ${atTxt(f.bigLead.e.per, f.bigLead.e.clk)} (${own(s, f.bigLead.e)})` : '0 @ - (-)'],
      ['Largest Run', `${R.X.bigRun[s]}-0`]];
    return `<section class="card ob" style="--tc:${esc(T[s].color)}"><div class="ob-hd">${teamMark(s, 34)}<h2>${esc(ab(s))} Offense</h2></div>
      <div class="ob-rows">${rows.map(([k, v]) => `<div class="ob-row"><span>${k}</span><b>${esc(v)}</b></div>`).join('')}</div></section>`;
  };
  return `<div class="ob2">${box('A')}${box('H')}</div>`;
}
// Shooting streaks and droughts: "FGs: 0 of last 5", "No FGs last 3:25".
function cardTrends(){
  if (R.box) return '';
  const T = g.teams, D = flowData(), rows = [];
  const now = R.st.final ? D.total : (D.pts.length ? D.pts[D.pts.length - 1].x : 0);
  for (const s of ['A', 'H']){
    const fgs = R.log.filter(e => e.s === s && g.plays[e.i].t === 'shot').map(e => ({made:!!g.plays[e.i].made, x:D.pts[e.i].x}));
    if (!fgs.length) continue;
    // a streak: misses or makes in a row at the end, three or more; otherwise the last seven
    let k = fgs.length - 1, run = 1; while (k > 0 && fgs[k - 1].made === fgs[k].made){ run++; k--; }
    const lastMade = fgs[fgs.length - 1].made;
    if (run >= 3) rows.push([s, lastMade ? `FGs: ${run} of last ${run}` : `FGs: 0 of last ${run}`, lastMade]);
    else { const w = fgs.slice(-7); rows.push([s, `FGs: ${w.filter(f => f.made).length} of last ${w.length}`, w.filter(f => f.made).length / w.length >= .5]); }
    const lastFG = [...fgs].reverse().find(f => f.made);
    const gap = now - (lastFG ? lastFG.x : 0);
    if (gap >= 120) rows.push([s, `No FGs last ${mmss(gap)}`, false]);
  }
  if (!rows.length) return '';
  return `<section class="card tr"><div class="card-hd"><h2 class="card-title">Current Trends</h2></div>
    <div class="tr-rows">${rows.map(([s, txt, hot]) => `<div class="tr-row ${hot ? 'hot' : ''}" style="--tc:${esc(T[s].color)}">${teamMark(s, 30)}<span>${esc(txt)}</span></div>`).join('')}</div></section>`;
}
function cardLinescore(){
  const st = R.st, T = g.teams, ru = R.ru;
  const cols = Array.from({length:ru.n + (st.per > ru.n ? 1 : 0)}, (_, i) => i);
  const val = (s, i) => i < ru.n ? (st.per > i || st.final ? st.lines[s][i] || 0 : '') : st.lines[s].slice(ru.n).reduce((a, b) => a + (b || 0), 0);
  return `<section class="card"><div class="tbl-wrap"><table class="ls">
    <thead><tr><th></th>${cols.map(i => `<th>${i < ru.n ? i + 1 : 'OT'}</th>`).join('')}<th>T</th></tr></thead>

/* ---------- Game Flow: both teams' running scores over game time, like ESPN's, with a cursor on the scoring plays ---------- */
// Seconds into the game for each period's start, and each play's place on that line.
function flowData(){
  const ru = R.ru, st = R.st, lens = [], starts = [0, 0];   // starts[q] = seconds into the game when period q begins
  const last = Math.max(ru.n, st.per);
  for (let q = 1; q <= last; q++){ lens[q] = (q > ru.n ? ru.ot : ru.per) * 60; starts[q + 1] = starts[q] + lens[q]; }
  const total = starts[last + 1];
  let clk = null, per = 0;
  const pts = R.log.map(e => {
    if (e.per !== per){ per = e.per; clk = lens[per]; }
    if (e.clk != null) clk = Math.min(clk ?? lens[per], e.clk);
    return {x:starts[per] + lens[per] - (clk ?? lens[per]), A:e.A, H:e.H, i:e.i, per, clk};
  });
  const scoring = R.scoring.map(sc => ({...sc, x:pts[sc.i].x}));
  return {lens, starts, total, last, pts, scoring};
}
function cardFlow(){
  const T = g.teams, st = R.st;
  if (!R.scoring.length) return '';
  const leg = s => `<span class="gf-leg ${s === 'A' ? 'dash' : ''}" style="--tc:${esc(T[s].color)}"></span>`;
  return `<section class="card gf" id="gf"><div class="card-hd"><h2 class="card-title">Game Flow</h2></div>
    <div class="gf-hd"><div class="gf-team">${teamMark('A', 40)}<div><b class="gf-sc">${st.score.A}</b><div class="gf-ab">${leg('A')}${esc(ab('A'))}</div></div></div>
      <div class="gf-team home"><div><b class="gf-sc">${st.score.H}</b><div class="gf-ab">${esc(ab('H'))}${leg('H')}</div></div>${teamMark('H', 40)}</div></div>
    <div class="gf-chart" id="gf-chart"></div>
    <div class="flow-lbl"><span>${esc(ab('A'))} led by ${R.X.lead.A}</span><span>${R.X.ties} ties · ${R.X.leadChanges} lead changes</span><span>${esc(ab('H'))} led by ${R.X.lead.H}</span></div>
    <div class="inner gf-detail" id="gf-detail"></div></section>`;
}
const gf = {i:null, w:0};
function drawFlow(){
  const box = $('#gf-chart'); if (!box || !g || !R) return;
  const D = flowData(), T = g.teams, ru = R.ru;
  const W = Math.max(280, box.clientWidth || 600), narrow = W < 560, H = narrow ? 200 : 270;
  const L = 8, Rm = narrow ? 34 : 44, Tp = 12, B = 30, iw = W - L - Rm, ih = H - Tp - B;
  const maxPts = Math.max(R.st.score.A, R.st.score.H), top = Math.max(50, Math.ceil((maxPts + 1) / 25) * 25);
  const X = x => L + x / D.total * iw, Y = v => Tp + ih - v / top * ih;
  const step = key => {
    let d = `M${X(0)} ${Y(0)}`, cur = 0;
    for (const p of D.pts){ if (p[key] !== cur){ d += ` H${X(p.x).toFixed(1)} V${Y(p[key]).toFixed(1)}`; cur = p[key]; } }
    const lastX = R.st.final ? D.total : Math.max(D.pts.length ? D.pts[D.pts.length - 1].x : 0, 0);
    d += ` H${X(lastX).toFixed(1)}`;
    return d;
  };
  const grid = [];
  for (let v = 0; v <= top; v += 25) grid.push(`<line x1="${L}" x2="${L + iw}" y1="${Y(v)}" y2="${Y(v)}" class="gf-grid"/><text x="${W - 4}" y="${Y(v) + 4}" class="gf-ax" text-anchor="end">${v}</text>`);
  const pers = [];
  for (let q = 1; q <= D.last; q++){
    const x0 = X(D.starts[q]), x1 = X(D.starts[q + 1]);
    if (q > 1) pers.push(`<line x1="${x0}" x2="${x0}" y1="${Tp}" y2="${Tp + ih}" class="gf-grid v"/>`);
    pers.push(`<text x="${(x0 + x1) / 2}" y="${H - 8}" class="gf-ax" text-anchor="middle">${esc(perShort(q, ru))}</text>`);
  }
  if (gf.i == null || !D.scoring.some(s => s.i === gf.i)) gf.i = D.scoring[D.scoring.length - 1].i;
  const sc = D.scoring.find(s => s.i === gf.i), cx = X(sc.x);
  box.innerHTML = `<svg class="gf-svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Game flow: each team's score through the game">
    ${grid.join('')}${pers.join('')}
    <path d="${step('A')}" class="gf-line dash" style="stroke:${esc(T.A.color)}"/>
    <path d="${step('H')}" class="gf-line" style="stroke:${esc(T.H.color)}"/>
    <g id="gf-cur"><line x1="${cx}" x2="${cx}" y1="${Tp}" y2="${Tp + ih}" class="gf-cursor"/>
      <circle cx="${cx}" cy="${Y(sc.A)}" r="5" style="fill:${esc(T.A.color)}"/><circle cx="${cx}" cy="${Y(sc.H)}" r="5" style="fill:${esc(T.H.color)}"/></g></svg>`;
  gf.w = W; gf.D = D; gf.X = X; gf.Y = Y;
  flowDetail(sc);
}
function flowDetail(sc){
  const el = $('#gf-detail'); if (!el || !sc) return;
  const T = g.teams;
  el.innerHTML = `<div class="gf-d1"><div><b>+${sc.pts} Point${sc.pts === 1 ? '' : 's'}</b><div class="muted">${esc(whenTxt(sc.per, sc.clk))}</div></div>
    <div class="gf-score"><b>${esc(ab('A'))} ${sc.A}, ${esc(ab('H'))} ${sc.H}</b><div class="muted">Score</div></div></div>
    <div class="gf-desc">${esc(ab(sc.s))} - ${esc(sc.desc)}</div>`;
}
// Hover or drag across the chart: the cursor snaps to the nearest scoring play.
function flowPoint(ev){
  const svg = ev.target.closest && ev.target.closest('.gf-svg'); if (!svg || !gf.D) return;
  const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * gf.w;
  let best = null, bd = Infinity;
  for (const s of gf.D.scoring){ const d = Math.abs(gf.X(s.x) - x); if (d < bd){ bd = d; best = s; } }
  if (!best || best.i === gf.i) return;
  gf.i = best.i;
  const cx = gf.X(best.x), cur = svg.querySelector('#gf-cur');
  cur.innerHTML = `<line x1="${cx}" x2="${cx}" y1="${cur.firstElementChild.getAttribute('y1')}" y2="${cur.firstElementChild.getAttribute('y2')}" class="gf-cursor"/>
    <circle cx="${cx}" cy="${gf.Y(best.A)}" r="5" style="fill:${esc(g.teams.A.color)}"/><circle cx="${cx}" cy="${gf.Y(best.H)}" r="5" style="fill:${esc(g.teams.H.color)}"/>`;
  flowDetail(best);
}

function scoringList(){
  if (!R.scoring.length) return '<div class="empty">No scores yet.</div>';

      <div class="sc-score"><b>${e.A}</b><b>${e.H}</b><span>${esc(ab('A'))}</span><span>${esc(ab('H'))}</span></div>
      <div class="sc-desc">${esc(e.desc)}</div></div>`;

/* ---------- play-by-play filters: quarters, play types and players, like ESPN's ---------- */
const PLAY_TYPES = [['2m', '2PT FG Made'], ['2x', '2PT FG Missed'], ['3m', '3PT Made'], ['3x', '3PT Missed'], ['ftm', 'FT Made'], ['ftx', 'FT Missed'],
  ['reb', 'Rebounds'], ['ast', 'Assists'], ['stl', 'Steals'], ['blk', 'Blocks'], ['to', 'Turnovers'], ['foul', 'Fouls'], ['tmo', 'Timeouts']];
const pbf = () => ui.pbf || (ui.pbf = {per:new Set(), type:new Set(), pl:new Set()});
// What a logged play counts as, and who was in it (team:number), for the filters.
function playFacets(e){
  const p = g.plays[e.i] || {}, types = new Set(), who = new Set();
  const add = x => { if (x && x.n != null && x.n !== 'team') who.add(`${x.s}:${x.n}`); };
  add(p);
  switch (p.t){
    case 'shot': types.add(p.made ? (p.v === 3 ? '3m' : '2m') : (p.v === 3 ? '3x' : '2x')); if (p.reb) types.add('reb'); if (p.blk) types.add('blk'); if (p.ast) types.add('ast'); if (p.foul) types.add('foul');
      add(p.reb); add(p.blk); add(p.ast); add(p.foul); break;
    case 'ft': if (p.seq.some(m => m)) types.add('ftm'); if (p.seq.some(m => !m)) types.add('ftx'); if (p.reb){ types.add('reb'); add(p.reb); } break;
    case 'reb': types.add('reb'); break;
    case 'ast': types.add('ast'); break;
    case 'stl': types.add('stl'); types.add('to'); add(p.to); break;
    case 'blk': types.add('blk'); break;
    case 'to': types.add('to'); if (p.stl){ types.add('stl'); add(p.stl); } break;
    case 'foul': types.add('foul'); if (p.kind === 'o') types.add('to'); add(p.on); break;
    case 'tmo': types.add('tmo'); break;
    case 'own': types.add('2m'); break;
    case 'eject': types.add('foul'); break;
  }
  return {types, who};
}
function filteredLog(){
  const f = pbf(), any = f.per.size || f.type.size || f.pl.size;
  if (!any) return R.log;
  return R.log.filter(e => {
    if (f.per.size && !f.per.has(e.per)) return false;
    const {types, who} = playFacets(e);
    if (f.type.size && ![...f.type].some(t => types.has(t))) return false;
    if (f.pl.size && ![...f.pl].some(k => who.has(k))) return false;
    return true;
  });
}
function filterPills(){
  const f = pbf(), ru = R.ru;
  const lbl = (set, all, one, word) => set.size === 0 ? all : set.size === 1 ? one([...set][0]) : `${set.size} ${word}`;
  const plName = k => { const [s, n] = k.split(':'); return PT(s, n); };
  const pill = (kind, text, on) => `<button type="button" class="fpill ${on ? 'on' : ''}" data-filter="${kind}">${esc(text)}<svg viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>`;
  return `<div class="fpills">${pill('per', lbl(f.per, ru.n === 2 ? 'All Halves' : 'All Quarters', q => perName(q, ru), ru.n === 2 ? 'Halves' : 'Quarters'), f.per.size)}
    ${pill('type', lbl(f.type, 'All Play Types', t => (PLAY_TYPES.find(x => x[0] === t) || [])[1] || t, 'Play Types'), f.type.size)}
    ${pill('pl', lbl(f.pl, 'All Players', plName, 'Players'), f.pl.size)}</div>`;
}
function dlgFilter(kind){
  const f = pbf(), ru = R.ru, st = R.st;
  let title, rows;
  if (kind === 'per'){
    title = ru.n === 2 ? 'Halves' : 'Quarters';
    rows = Array.from({length:Math.max(st.per, ru.n)}, (_, i) => [i + 1, perName(i + 1, ru) + (i + 1 > ru.n ? '' : ru.n === 2 ? '' : '')]).map(([v, l]) => [v, l.replace(' Qtr', ' Quarter')]);
  } else if (kind === 'type'){ title = 'Play Types'; rows = PLAY_TYPES; }
  else {
    title = 'Players';
    // every player who has shown up in the log, grouped by team
    const seen = {A:new Set(), H:new Set()};
    R.log.forEach(e => playFacets(e).who.forEach(k => { const [s, n] = k.split(':'); seen[s].add(n); }));
    rows = [];
    ['A', 'H'].forEach(s => { const list = [...seen[s]].sort((a, b) => a - b); if (list.length) rows.push(['__hd', g.teams[s].name]); list.forEach(n => rows.push([`${s}:${n}`, `${rosterName(s, n) ? rosterName(s, n) + ' ' : ''}#${n}`])); });

      : `<label class="flt-row"><span>${esc(l)}</span><input type="checkbox" data-fchk="${kind}" value="${esc(v)}" ${set.has(kind === 'per' ? +v : v) ? 'checked' : ''}></label>`).join('')}</div>`;
}

/* ================================================================
   Sync. Games follow a Google sign-in through the stats project's own
   Firebase (fb-stats, kept apart from the Pick 'ems pool): collection
   "hoops", one document per game, private to its owner. The copy in
   this browser stays the working copy, so the page keeps running with
   no signal; when two copies meet, whichever was edited last wins.
   Rules live in firestore.rules beside this file.
   ================================================================ */
const FIREBASE_VERSION = '10.14.1';
const COLL = 'hoops';

  apiKey:            'AIzaSyBnIdA4E1hhAOCIR51bjXHJKoAQ4kBIr3Q',
  authDomain:        'fb-stats-dc058.firebaseapp.com',
  projectId:         'fb-stats-dc058',

  if (location.protocol === 'file:'){ sync.state = 'unavailable'; return renderSync(); }
  try {
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-`;
    const load = Promise.all(['app', 'auth', 'firestore'].map(m => import(base + m + '.js')));
    const [appM, authM, fsM] = await Promise.race([load, new Promise((_, no) => setTimeout(() => no(new Error('timeout')), 12000))]);

      try { await authM.signInWithRedirect(auth, provider); return; } catch (e2) { e = e2; }

async function signOutSync(){

function friendlySync(e){
  const code = e?.code || '';
  if (code.includes('permission-denied')) return 'Firebase turned the save down. The basketball rules may not be published yet.';
  if (code.includes('not-found') || /database .*does not exist/i.test(e?.message || '')) return 'The stats project has no Firestore database yet. Create one in the Firebase console.';
  if (code.includes('operation-not-allowed')) return 'Google sign-in isn’t switched on in the stats project yet (Authentication → Sign-in method).';
  if (code.includes('unauthorized-domain')) return 'Google sign-in isn’t allowed at this address yet. Add it in the stats Firebase project under Authentication → Settings → Authorized domains.';
  if (code.includes('disallowed-useragent') || code.includes('operation-not-supported')) return 'This browser can’t complete Google sign-in. Open the page in Safari or Chrome.';
  if (code.includes('web-storage-unsupported')) return 'This browser is blocking site storage, which sign-in needs. Open the page in Safari or Chrome.';
  if (code.includes('unavailable') || code.includes('network')) return 'Can’t reach the server. Your games are still saved on this device.';
  if (code.includes('cancelled') || code.includes('popup-closed')) return '';

}

const LIVE_ID = new URLSearchParams(location.search).get('game') || new URLSearchParams(location.search).get('live');
async function startViewer(id){
  ui.viewer = true; document.body.classList.add('viewer');

<script>
/* ================================================================
   Saved teams: each school's short name, color and basketball roster,
   kept so a new game fills itself in. Saved in this browser and, when
   signed in, to the account as one private "teams-<uid>" document in
   the hoops collection (its own library, apart from football's).
   ================================================================ */
const teamKey = s => String(s || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const DEFAULT_TEAM_NAMES = ['', 'visitors', 'home'];
const teamLib = () => db.teams || (db.teams = {});
const savedTeams = () => Object.values(teamLib()).filter(t => !t.deleted && t.name).sort((a, b) => a.name.localeCompare(b.name));
function findTeam(name){ const t = teamLib()[teamKey(name)]; return t && !t.deleted ? t : null; }
const rosterToText = r => Object.entries(r || {}).sort((a, b) => a[0] - b[0]).map(([n, v]) => `${n} ${v}`).join('\n');
function parseRosterText(txt){
  const o = {};
  String(txt || '').split('\n').forEach(l => { const m = l.match(/^\s*#?(\d{1,2})\s*[-–,.:)]?\s*(.+?)\s*$/); if (m) o[String(+m[1])] = m[2]; });
  return o;
}
// From a game's Setup. A newer save wins, and an empty roster or mascot never wipes out a saved one.
function rememberTeam(t, when = Date.now()){
  const k = teamKey(t.name); if (DEFAULT_TEAM_NAMES.includes(k)) return false;
  const cur = teamLib()[k];
  if (cur && (cur.updated || 0) > when) return false;
  const keep = cur && !cur.deleted ? cur : {};
  teamLib()[k] = {name:t.name, mascot:t.mascot || keep.mascot || '', abbr:t.abbr, color:t.color,
    roster:{...(Object.keys(t.roster || {}).length ? t.roster : keep.roster)}, updated:when};
  return true;
}
function forgetTeam(k){ teamLib()[k] = {deleted:true, name:'', updated:Date.now()}; }
function seedTeamLibrary(){
  let added = false;
  Object.values(db.games).forEach(x => {
    if (x.sample) return;
    ['A', 'H'].forEach(s => { if (!teamLib()[teamKey(x.teams[s].name)]) added = rememberTeam(x.teams[s], x.updated || x.created || 0) || added; });
  });
  if (added) persist();
}
const teamsDocId = () => 'teams-' + (sync.user ? sync.user.uid : '');
let teamTimer = null;
function syncTeams(delay = 700){
  if (!sync.user || !sync.api) return;
  clearTimeout(teamTimer);
  teamTimer = setTimeout(() => {
    const {fsM, fsdb} = sync.api;
    fsM.setDoc(fsM.doc(fsdb, COLL, teamsDocId()), {owner:sync.user.uid, updated:Date.now(), public:false, kind:'teams', json:JSON.stringify(teamLib())})
      .catch(e => { sync.err = friendlySync(e); sync.state = 'error'; renderSync(); });
  }, delay);
}
function mergeTeams(json){
  let remote; try { remote = JSON.parse(json || '{}') || {}; } catch (e) { return; }
  const lib = teamLib(); let changed = false, mineNewer = false;
  for (const k of new Set([...Object.keys(lib), ...Object.keys(remote)])){
    const a = lib[k], b = remote[k];
    if (b && (!a || (b.updated || 0) > (a.updated || 0))){ lib[k] = b; changed = true; }
    else if (a && (!b || (a.updated || 0) > (b.updated || 0))) mineNewer = true;
  }
  if (changed){ persist(); if (ui.dlg === 'games' && dlg().open) dlg().innerHTML = dlgGames(); }
  if (mineNewer) syncTeams(0);
}
function teamsBlock(){
  const list = savedTeams();

}

    <div class="fld"><label class="eyebrow" for="t-roster">Roster · one player per line, number then name</label>
      <textarea class="inp" id="t-roster" rows="10" placeholder="3 Cole Brandt&#10;12 Mason Ortiz">${esc(rosterToText(t.roster))}</textarea></div></div></div>
    <div class="dlg-ft"><button type="button" class="btn" data-open="games">Back</button><button type="button" class="btn primary" data-team-save="${esc(key || '')}">Save team</button></div>`;
}
function saveTeamDialog(oldKey){

  if (!name) return toast('Give the team a name');
  const t = {name, mascot:$('#t-mascot').value.trim(), abbr:($('#t-abbr').value.trim() || name.replace(/[^A-Za-z]/g, '').slice(0, 4)).toUpperCase(), color:$('#t-color').value, roster:parseRosterText($('#t-roster').value)};

<script>
/* ---------- sample game: made-up teams and plays, so the page shows how it works ---------- */
function sampleGame(){
  const A = {name:'North Eagles', mascot:'Eagles', abbr:'NOR', color:'#1F4E9C', rec:'6-2', roster:{3:'Cole Brandt', 12:'Mason Ortiz', 5:'Tyler Reyes', 24:'Jace Miller', 32:'Luke Dean', 15:'Gavin Hart', 10:'Eli Ward', 44:'Reed Kohl'}};
  const H = {name:'South Rams', mascot:'Rams', abbr:'SOU', color:'#8A1C2B', rec:'5-3', roster:{1:'Brody Kemp', 2:'Isaiah Ford', 11:'Kade Sims', 23:'Nolan Beck', 33:'Ryan Kast', 20:'Drew Lang', 4:'Cam Ward', 42:'Trey Voss'}};
  const s = {id:'sample', sample:2, created:Date.now(), teams:{A, H}, set:{fmt:'q', per:8, ot:4}, plays:[], clk:{s:171, run:false, at:0}};
  const lines = [
    [480, 'jump s'], [462, 's1-2-s11a'], [441, 'n3-miss3-s23r'], [430, 's2-miss2-n32b-n32r'], [418, 'n12-3-n3a'], [401, 's11to-n5s'], [395, 'n5-2'],
    [372, 's23-2-s1a'], [355, 'n3-miss2-n24r'], [352, 'n24-2'], [330, 's33f-n12'], [330, 'n12ft-ft'], [305, 's1-3-s2a'], [288, 'n32-miss2-s33r'],
    [270, 's11-2'], [255, 'n12-miss3-n32r'], [250, 'n32-2-s20f'], [250, 'n32ftm-s23r'], [228, 's2-2-s1a'], [210, 'n3-3-n12a'], [190, 's23to-n3s'], [184, 'n3-2'],
    [160, 's1-miss3-s11r'], [155, 's11-2'], [131, 'n24-miss2-s33r'], [110, 's2-3-s1a'], [92, 'n5f-s1'], [92, 's1ft-ftm-n32r'], [70, 'n12-2-n3a'], [48, 's11-miss2-n24r'],
    [30, 'n3-miss3-s23r'], [8, 's1-2'], [0, 'eoq'],
    [480, 'n12-3'], [455, 's23-miss2-n32r'], [440, 'n24-2-n12a'], [420, 'tmo s'], [415, 's1-2-s2a'], [390, 'n3-miss2-s20b-s33r'], [380, 's11-3-s1a'],
    [352, 'n32-2'], [330, 's2to-n24s'], [325, 'n24-2'], [300, 's1-miss3-n32r'], [280, 'n12-miss3-s23r'], [262, 's23-2-s11a'], [240, 'n3-2-n12a'], [222, 's2-miss2-s23r'],
    [219, 's23-2'], [200, 'n5-miss2-s1r'], [181, 's1-3-s2a'], [171, 'n5f-s1']];
  const keep = g; g = s;
  try {
    for (const [clk, line] of lines){
      const r = parseQuick(line, replay(s).st);
      if (r && r.plays) r.plays.forEach((p, k) => { const q = JSON.parse(JSON.stringify(p)); q.clk = clk; if (k === 0) q.q = line; s.plays.push(q); });
    }
  } finally { g = keep; }
  return s;
}

/* ---------- boot ---------- */
if (LIVE_ID) startViewer(LIVE_ID);   // a shared link: watch that game, read-only
else {
  load();
  if (db.games.sample && db.games.sample.sample !== 2) db.games.sample = sampleGame();
  seedTeamLibrary();
  const EDIT_ID = new URLSearchParams(location.search).get('edit');
  g = (EDIT_ID && db.games[EDIT_ID]) || db.games[db.cur] || Object.values(db.games)[0];
  if (EDIT_ID) history.replaceState(null, '', location.pathname);
  if (!g){ g = sampleGame(); db.games.sample = g; }
  ui.start = !EDIT_ID && idleGame(g);
  setCurrent();
  refresh();
  startSync();
}
