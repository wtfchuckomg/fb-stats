<style>
/* Gamecast palette, shared with the football Press Box: gray page, white cards, near-black type, blue actions, red active tab. */
:root{
  --page:#EDEEF0; --card:#FFFFFF; --surface:#F4F5F6; --surface-2:#E5E6E8;
  --ink:#2B2C2D; --ink-2:#101113; --muted:#6C6D6F; --line:#CECFCF; --line-2:#E6E7E9;
  --pill:#DCDDDF; --seg:#C7C7C9; --blue:#3772DF; --blue-ink:#FFFFFF; --red:#D6301E;
  --top-muted:#A5A6A7; --to:#F29A21; --to-off:#D5D6D8;
  --good:#1E8636; --good-wash:#E5F3E8; --bad:#C8281C; --bad-wash:#FBE9E7;
  --flag:#E8B400; --flag-wash:#FFF5D2; --flag-ink:#6B5200;
  --shadow:0 2px 8px rgba(18,18,19,.24); --shadow-sm:0 1px 4px rgba(18,18,19,.24);
  --cond:"Roboto Condensed","Arial Narrow",sans-serif;
  --sans:-apple-system,system-ui,Roboto,Arial,"Helvetica Neue",Helvetica,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:400 15px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font:700 11px/1.2 var(--cond);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.empty{padding:22px 12px;text-align:center;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- site bar, shared by the Kansas Media sites ---------- */
.sitebar{background:#000000}
.sitebar-in{max-width:1280px;margin:0 auto;padding:0 16px;min-height:54px;display:flex;align-items:center;gap:28px}
.sitelinks{display:flex;align-items:center;gap:24px;min-width:0;overflow-x:auto;scrollbar-width:none}
.sitelinks::-webkit-scrollbar{display:none}
.sitelink{font-family:'Anton',"Roboto Condensed","Arial Narrow",sans-serif;font-size:13px;letter-spacing:.5px;text-transform:uppercase;
  text-decoration:none;padding:17px 0;color:#B8B8B8;border-bottom:3px solid transparent;white-space:nowrap}
.sitelink:not(.active):hover{color:#FFFFFF}
.sitelink.active{color:#FFFFFF;border-bottom-color:#D6001C}
.mark{flex:none}
.mark img{display:block;height:40px;width:auto}
@media (max-width:640px){.sitebar-in{gap:16px;padding:0 12px}.mark img{height:34px}}

/* ---------- menu bar: the sport pages on the left, the scorer's buttons on the right ---------- */
.navbar{background:#2B2C2D;color:#FFFFFF;position:relative;z-index:40}
.navbar-in{max-width:1280px;margin:0 auto;padding:0 16px;min-height:54px;display:flex;align-items:center;flex-wrap:wrap;column-gap:20px}
.navlinks{display:flex;align-self:stretch;gap:24px;margin-right:auto;overflow-x:auto;scrollbar-width:none}
.navlinks::-webkit-scrollbar{display:none}
.navlink{display:flex;align-items:center;padding-top:3px;border-bottom:3px solid transparent;font:700 12px/1 var(--sans);color:#FFFFFF;text-decoration:none;white-space:nowrap}
.navlink:hover{border-bottom-color:rgba(255,255,255,.45)}
.navlink.on{border-bottom-color:var(--red)}
.navtools{display:flex;align-items:center;gap:4px}
.abtns,.vbtns{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.abtn{background:none;border:0;border-radius:6px;color:#FFFFFF;padding:9px 9px;font:600 14.5px/1 var(--sans);white-space:nowrap}
.abtn:hover{background:rgba(255,255,255,.12)}
a.abtn{display:inline-block;text-decoration:none}
.abtn.live,.syncbtn{display:inline-flex;align-items:center;gap:7px}
.syncbtn i,.abtn.live i,.livebadge i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--top-muted)}
.syncbtn.ok i{background:#3DBE6E}
.syncbtn.busy i{background:var(--to)}
.syncbtn.bad i{background:#FF5A4F}
.abtn.live{box-shadow:inset 0 0 0 1.5px #FF4436}
.abtn.live i{background:#FF4436}
.livebadge{display:inline-flex;align-items:center;gap:7px;margin-right:8px;font:700 12px/1 var(--sans);text-transform:uppercase;letter-spacing:.05em;color:#FFFFFF;white-space:nowrap}
.livebadge i{background:#FF4436;animation:pulse 1.6s ease-in-out infinite}
.livebadge.final i{animation:none;background:var(--top-muted)}
@keyframes pulse{50%{opacity:.3}}
@media (min-width:641px) and (max-width:1100px){.navlinks{gap:20px}.abtn{padding:8px 7px;font-size:14px}}
@media (max-width:640px){
  .navbar-in{padding:0 12px}
  .navlinks{flex-basis:100%;min-height:48px;gap:14px}
  .navlink{font-size:13.5px}
  .navtools{flex-basis:100%;flex-wrap:wrap;justify-content:space-between;padding:4px 0 6px;border-top:1px solid rgba(255,255,255,.14)}
  .navtools .abtns,.navtools .vbtns{display:contents}
  .abtn{padding:9px 8px;font-size:14px}
}

.sample{background:var(--flag-wash);color:var(--flag-ink);padding:8px 16px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.sample button{background:var(--ink-2);color:var(--card);border:0;border-radius:14px;padding:6px 12px;font:600 12.5px/1 var(--sans)}

/* ---------- game strip ---------- */
.strip{position:sticky;top:0;z-index:30;background:var(--card);box-shadow:0 1px 0 var(--line),0 2px 6px rgba(18,18,19,.08);overflow:hidden}
.strip-in{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:12px 16px}
.st-side{position:relative;display:flex;align-items:center;gap:14px;min-width:0}
.st-side::before{content:"";position:absolute;top:-40px;bottom:-40px;left:-60px;width:300px;pointer-events:none;
  background:radial-gradient(170px 110px at 60px 30px,color-mix(in srgb,var(--tc) 40%,transparent),transparent 72%)}
.st-side.home{flex-direction:row-reverse;text-align:right}
.st-side.home::before{left:auto;right:-60px;background:radial-gradient(170px 110px at 240px 30px,color-mix(in srgb,var(--tc) 40%,transparent),transparent 72%)}
.st-logo{position:relative;flex:none;width:64px;height:64px;display:grid;place-items:center}
.st-id{position:relative;flex:1;min-width:0}
.st-name{font:600 17px/1.2 var(--sans);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-rec{font-size:12px;color:var(--muted);margin-top:2px}
.st-side.away .st-id{text-align:right}
.st-side.home .st-id{text-align:left}
.st-side.lose .st-name,.st-side.lose .st-score{color:var(--muted)}
.st-win{flex:none;width:0;height:0;border-style:solid;border-width:7px 8px 7px 0;border-color:transparent var(--ink-2) transparent transparent}
.st-side.home .st-win{border-width:7px 0 7px 8px;border-color:transparent transparent transparent var(--ink-2)}
.st-scorebox{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:60px}
.st-score{display:flex;align-items:center;gap:7px;font:800 44px/1 var(--cond);color:var(--ink-2);font-variant-numeric:tabular-nums}
.st-side.home .st-score{flex-direction:row-reverse}
.st-poss{width:11px;height:7px;border-radius:50%;background:var(--ink-2)}
.st-tos{display:flex;gap:4px}
.st-tos i{width:5px;height:5px;border-radius:50%;background:var(--to-off)}
.st-tos i.on{background:var(--to)}
.st-tos i.full{width:7px;height:7px}
.st-arrow{font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.arrowbox{background:var(--surface);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.tobtns .btn small{font-weight:500;color:var(--muted)}
.dqtag{display:inline-block;margin-left:6px;padding:2px 5px;border-radius:3px;background:var(--bad-wash);color:var(--bad);font:700 10.5px/1 var(--sans);letter-spacing:.04em}
td.pf5{color:var(--bad);font-weight:700}
.lsin{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.lsin .inp{padding:0 6px;text-align:center}
.dlg-bd code{font:600 12px/1.3 var(--mono);background:var(--surface-2);padding:1px 5px;border-radius:3px}
.st-fouls{font:600 11px/1 var(--sans);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
.st-fouls.bonus{color:var(--bad)}
.st-ls{margin-top:6px;border-collapse:collapse;font:400 13.5px/1.45 var(--sans);font-variant-numeric:tabular-nums;color:var(--muted)}
.st-ls th{font-weight:400;padding:0 7px 1px;border-bottom:1px solid var(--line)}
.st-ls td{padding:1px 7px 0;text-align:center}
.st-ls th:first-child,.st-ls td:first-child{padding-left:0;text-align:left;font-weight:700;color:var(--ink-2)}
.st-ls td:last-child{font-weight:700;color:var(--ink-2)}
@media (max-width:640px){.st-ls{display:none}}
.st-mid{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:150px;text-align:center}
.st-line1{display:flex;align-items:center;gap:6px;font:700 18px/1.25 var(--sans);color:var(--ink-2)}
.st-clock{background:none;border:0;padding:0;font:inherit;color:inherit;font-variant-numeric:tabular-nums}
body:not(.viewer) button.st-clock{border-bottom:1px dashed var(--line)}
.st-clock.run{color:var(--good)}
input.st-clock{width:72px;text-align:center;border:1px solid var(--line);border-radius:4px;background:var(--card)}
.clk-go{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0;color:var(--ink)}
.clk-go svg{width:10px;height:10px;fill:currentColor}
.st-sit{font-size:14px;line-height:1.3;color:var(--muted)}
@media (max-width:700px){
  .strip-in{padding:10px 10px;gap:6px}
  .st-id{display:none}
  .st-logo{width:46px;height:46px}
  .st-score{font-size:38px}
  .st-mid{min-width:0}
  .st-line1{font-size:16px}
}

/* ---------- tabs ---------- */
.gtabs{background:var(--card);border-bottom:1px solid var(--line)}
.gtabs-in{max-width:1280px;margin:0 auto;padding:0 16px;display:flex;gap:24px;overflow-x:auto}
.gtab{background:none;border:0;border-bottom:3px solid transparent;padding:13px 0 10px;font:500 15px/1 var(--sans);color:var(--muted);white-space:nowrap}
.gtab:hover{color:var(--ink-2)}
.gtab[aria-selected="true"]{color:var(--ink-2);font-weight:600;border-bottom-color:var(--red)}

/* ---------- layout ---------- */
.gc{max-width:1280px;margin:0 auto;padding:16px 16px 60px;display:grid;grid-template-columns:minmax(0,1fr) 390px;
  grid-template-areas:"view pad" "view rail";gap:0 16px;align-items:start;grid-template-rows:auto 1fr}
.gc > #pad{grid-area:pad;margin-bottom:16px}
.gc-view{grid-area:view;display:flex;flex-direction:column;gap:16px;min-width:0}
.gc-rail{grid-area:rail;display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:1000px){
  .gc{grid-template-columns:minmax(0,1fr);grid-template-areas:"pad" "view" "rail";grid-template-rows:none;gap:16px 0;padding:12px 10px 60px}
  .gc > #pad{margin-bottom:0}
}
body.starting .strip,body.starting .gtabs,body.starting main.gc,body.starting .sample{display:none!important}
body.starting #sharebtn,body.starting .navtools [data-open="setup"],body.starting .navtools [data-open="export"]{display:none}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:16px}
.card-hd{display:flex;align-items:center;gap:10px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.card-title{margin:0;font:700 17px/1.1 var(--cond);text-transform:uppercase;color:var(--ink-2);letter-spacing:.01em}
.card-sub{font-size:13px;color:var(--muted);margin-top:3px}
.card-ft{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;text-align:center}
.linkbtn2{background:none;border:0;color:var(--blue);font:500 14px/1 var(--sans);padding:4px}
.linkbtn2:hover{text-decoration:underline}
.inner{background:var(--card);border-radius:10px;box-shadow:var(--shadow-sm);padding:12px 14px}
.tlogo{display:block;object-fit:contain;flex:none}
.tmono{display:inline-grid;place-items:center;flex:none;border-radius:50%;background:var(--tc);color:#fff;
  font-family:var(--cond);font-weight:800;letter-spacing:.02em;text-transform:uppercase;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}

/* the situation card on the Gamecast: score, period, who has the ball, fouls; then the last play */
.cd-split{display:grid;grid-template-columns:1fr 1px 1fr;align-items:center;text-align:center;margin:2px 0 8px}
.cd-split > i{background:var(--line);height:46px}
.cd-lbl{font-size:13px;color:var(--muted)}
.cd-val{font:600 18px/1.3 var(--sans);color:var(--ink-2)}
.lp{margin-top:12px}
.lp-hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lp-title{font:600 17px/1.2 var(--sans);color:var(--ink-2)}
.pill{background:var(--pill);color:var(--ink-2);border-radius:4px;padding:5px 8px;font:500 12px/1 var(--sans);white-space:nowrap}
.lp-txt{color:var(--muted);font-size:14px;margin-top:6px}
.lp-sit{color:var(--muted);font-size:13px;margin-top:8px}
/* Game Flow: each team's running score over game time, like ESPN's, with a cursor on the scoring plays */
.gf-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.gf-team{display:flex;align-items:center;gap:12px;min-width:0}
.gf-team.home{text-align:right}
.gf-sc{display:block;font:700 28px/1 var(--cond);color:var(--ink-2);font-variant-numeric:tabular-nums}
.gf-ab{display:flex;align-items:center;gap:6px;margin-top:3px;font:500 14px/1 var(--sans);color:var(--muted)}
.gf-team.home .gf-ab{justify-content:flex-end}
.gf-leg{display:inline-block;width:18px;border-top:3px solid var(--tc)}
.gf-leg.dash{border-top-style:dashed}
.gf-chart{width:100%;overflow:hidden}
.gf-svg{display:block;max-width:100%;height:auto;touch-action:pan-y;cursor:crosshair;user-select:none}
.gf-grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.gf-ax{font:400 13px var(--sans);fill:var(--muted)}
.gf-line{fill:none;stroke-width:3;stroke-linejoin:round}
.gf-line.dash{stroke-dasharray:4 4}
.gf-cursor{stroke:var(--muted);stroke-width:1.5}
.flow-lbl{display:flex;justify-content:space-between;font:600 11px/1 var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:4px 0 12px}
.gf-detail{min-height:86px}
.gf-d1{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.gf-d1 b{font:600 17px/1.2 var(--sans);color:var(--ink-2)}
.gf-d1 .muted{font-size:14px;margin-top:2px}
.gf-score{text-align:right;white-space:nowrap}
.gf-desc{margin-top:10px;font-size:15px;color:var(--muted)}

/* Offense boxes and Current Trends, in the style of StatBroadcast's */
.ob2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.ob2{grid-template-columns:1fr}}
.ob{padding:0;overflow:hidden;border-top:6px solid var(--tc)}
.ob-hd{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ob-hd h2{margin:0;font:800 19px/1.1 var(--cond);text-transform:uppercase;letter-spacing:.01em;color:var(--ink-2)}
.ob-rows{display:flex;flex-direction:column}
.ob-row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-2);font-size:15px}
.ob-row:last-child{border-bottom:0}
.ob-row span{color:var(--muted);font-size:13.5px}
.ob-row b{font:500 15px/1.35 var(--sans);color:var(--ink-2);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tr-rows{display:flex;flex-direction:column;gap:6px}
.tr-row{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:8px;background:var(--ink-2);color:#FFFFFF;font:700 17px/1.2 var(--cond);text-transform:uppercase;letter-spacing:.02em}
.tr-row.hot{background:var(--tc)}
.tr-row .tlogo{background:#FFFFFF;border-radius:6px;padding:3px;box-sizing:content-box}
.tr-row .tmono{box-shadow:0 0 0 2px #FFFFFF}
/* line score */
.tbl-wrap{overflow-x:auto}
.ls{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.ls th{font:500 14px var(--sans);color:var(--ink);padding:4px 8px 8px;text-align:center;border-bottom:1px solid var(--line)}
.ls td{padding:10px 8px;text-align:center;color:var(--muted)}
.ls td:first-child,.ls th:first-child{text-align:left;padding-left:0}
.ls td.tot{font-weight:700;color:var(--ink-2)}
.ls .tm{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-weight:500}

/* play-by-play filters: three pills, each opening a checklist sheet */
.fpills{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.fpill{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:980px;padding:11px 16px;background:var(--surface-2);font:600 14px/1 var(--sans);color:var(--ink-2)}
.fpill svg{width:11px;height:7px}
.fpill.on{background:var(--ink-2);color:var(--card)}
.flt-hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.flt-hd h2{margin:0;font:600 17px/1.2 var(--sans);color:var(--ink-2);text-align:center}
.flt-hd .linkbtn2{padding:6px 0;font-size:15px;justify-self:start}
.flt-hd .linkbtn2[data-close]{justify-self:end}
.flt-hd button:first-child{color:var(--ink)}
.flt-list{max-height:min(70vh,640px);overflow-y:auto;background:var(--surface)}
.flt-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 16px;font:600 16px/1.2 var(--sans);color:var(--ink-2);cursor:pointer}
.flt-row input{width:22px;height:22px;margin:0;accent-color:var(--blue);cursor:pointer}
.flt-grp{padding:14px 16px 4px;font:700 12px/1 var(--sans);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
/* play-by-play */
.segctl{display:flex;background:var(--seg);border-radius:100px;padding:2px;margin:0 0 6px}
.segctl button{flex:1;border:0;background:none;border-radius:100px;padding:10px 8px;font:500 14px/1 var(--sans);color:var(--ink-2)}
.segctl button[aria-pressed="true"]{background:var(--card);box-shadow:0 0 8px rgba(0,0,0,.25)}
.qhd{font:700 15px/1 var(--cond);text-transform:uppercase;color:var(--ink-2);margin:16px 0 10px;letter-spacing:.01em}
.plays{display:flex;flex-direction:column}
.pl{display:grid;grid-template-columns:52px 34px minmax(0,1fr) 64px;gap:10px;align-items:center;padding:9px 6px;border:0;border-bottom:1px solid var(--line-2);
  background:none;text-align:left;width:100%;font-size:14px;color:var(--ink)}
.pl:hover,.pl.open{background:var(--surface)}
.pl-clk{font:600 14px/1.2 var(--sans);color:var(--ink-2);font-variant-numeric:tabular-nums}
.pl-no{display:block;font-size:11px;color:var(--muted)}
.pl-txt s{color:var(--muted)}
.pl-sc{font:600 13.5px/1.2 var(--sans);color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pl-sc b{color:var(--ink-2)}
.pl.score .pl-sc{color:var(--ink-2)}
.pl-act{display:flex;gap:8px;padding:0 6px 10px 68px;background:var(--surface);border-bottom:1px solid var(--line-2)}
.tags{display:inline-flex;gap:4px;margin-left:6px;vertical-align:1px;flex-wrap:wrap}
.tag{font:700 10.5px/1 var(--sans);text-transform:uppercase;letter-spacing:.04em;padding:3px 5px;border-radius:3px;white-space:nowrap}
.tag.score{background:var(--good);color:#fff}
.tag.good{background:var(--good-wash);color:var(--good)}
.tag.to{background:var(--bad-wash);color:var(--bad)}
.tag.flag{background:var(--flag-wash);color:var(--flag-ink)}
.tag.info{background:var(--surface-2);color:var(--muted)}
.qsrc{font:600 11.5px/1.3 var(--mono);background:var(--surface-2);padding:1px 5px;border-radius:3px;color:var(--ink);margin-left:4px}
.scard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:0 12px;align-items:center;margin-bottom:12px}
.sc-title{font:500 17px/1.25 var(--sans);color:var(--ink-2)}
.sc-time{font-size:14px;color:var(--muted)}
.sc-score{display:grid;grid-template-columns:repeat(2,46px);text-align:center}
.sc-score b{font:700 18px/1.3 var(--sans);color:var(--ink-2)}
.sc-score span{font-size:12.5px;color:var(--muted)}
.sc-desc{grid-column:1 / -1;color:var(--muted);font-size:14px;margin-top:8px}
@media (max-width:640px){.pl{grid-template-columns:44px 30px minmax(0,1fr) 56px;gap:6px;font-size:13.5px}.pl-act{padding-left:6px}}

/* rail: leaders and team stats */
.ldr-cat{font:600 14px/1.2 var(--sans);color:var(--ink-2);margin:14px 0 8px}
.card-hd + .ldr-cat{margin-top:0}
.ldr-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ldr{display:grid;grid-template-columns:28px minmax(0,1fr) auto;grid-template-areas:"mark name big" "mark line big";gap:1px 8px;align-items:center;
  padding:8px;border-radius:8px;background:var(--surface);min-width:0}
.ldr-mark{grid-area:mark}
.ldr-name{grid-area:name;font:600 13px/1.2 var(--sans);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldr-line{grid-area:line;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldr-big{grid-area:big;font:800 21px/1 var(--cond);color:var(--ink-2)}
.ldr-empty{grid-template-areas:"mark name name"}
.cmp-teams{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font:700 14px/1 var(--cond);text-transform:uppercase;color:var(--ink-2)}
.cmp-teams span{display:inline-flex;align-items:center;gap:8px}
.cmp{padding:9px 0;border-bottom:1px solid var(--line-2)}
.cmp:last-of-type{border-bottom:0}
.cmp-top{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline}
.cmp-top b{font:600 15px/1.2 var(--sans);color:var(--ink-2);font-variant-numeric:tabular-nums}

.cmp-bar{display:flex;gap:3px;margin-top:6px;height:6px}
.cmp-bar i{display:block;border-radius:3px;min-width:3px}

/* box score tables */
.bx-team{display:flex;align-items:center;gap:8px;font:600 15px/1.2 var(--sans);color:var(--ink-2);margin-bottom:8px}
table.st{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}

table.st th:first-child,table.st td:first-child{text-align:left;padding-left:0}
table.st td:first-child{color:var(--ink-2);font-weight:500}
table.st tr:last-child td{border-bottom:0}
table.st tr.tot td{font-weight:700;color:var(--ink-2);border-top:1px solid var(--line)}

table.st td .pn{color:var(--muted);font-weight:400;margin-right:5px}
table.st.box th:first-child,table.st.box td:first-child{position:sticky;left:0;background:var(--card);z-index:1;max-width:150px;overflow:hidden;text-overflow:ellipsis}

/* ---------- entry pad ---------- */
.pad{display:flex;flex-direction:column;gap:14px}
.pad-hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.pad-hd .sit{font:700 17px/1.1 var(--cond);text-transform:uppercase;color:var(--ink-2)}
.editing-bar{background:var(--flag-wash);color:var(--flag-ink);border-radius:6px;padding:7px 10px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld > label,.fld > .eyebrow{display:block}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.inp{width:100%;height:44px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 10px;font:700 19px/1 var(--cond);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.inp:focus{border-color:var(--blue);background:var(--card);outline:none}
select.inp{font:500 15px/1 var(--sans)}

.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{flex:1 1 auto;border:0;background:none;padding:10px 9px;font:700 13.5px/1 var(--cond);text-transform:uppercase;letter-spacing:.02em;border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink-2);color:var(--card)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.actions{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:11px 16px;font:600 14px/1 var(--sans);color:var(--ink-2)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:8px 12px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
a.btn{text-decoration:none;display:inline-block}
.period{border-top:1px solid var(--line-2);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.tobtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tobtns .btn{padding:12px 8px;border-radius:10px}
.line{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
.linkbtn:hover{color:var(--ink-2)}
.final-card{text-align:center;padding:14px 8px;display:flex;flex-direction:column;gap:8px;align-items:center}
.final-card b{font:800 28px/1 var(--cond);text-transform:uppercase;color:var(--ink-2)}
.final-card .line{justify-content:center}

/* quick entry: the typed line, then the tap keys that build it */
.quick{display:flex;flex-direction:column;gap:10px}
.qk{width:100%;height:54px;border:2px solid var(--ink-2);border-radius:8px;background:var(--card);color:var(--ink-2);padding:0 12px;font:600 21px/1 var(--mono)}
.qk:focus{outline:none;border-color:var(--blue)}
.qk::placeholder{color:var(--muted);opacity:.7}
.qprev{border-radius:8px;padding:9px 11px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px;min-height:54px}
.qprev.ok{background:var(--good-wash)}
.qprev.err{background:var(--bad-wash);color:var(--bad)}
.qprev .next{font:700 14px/1.15 var(--cond);text-transform:uppercase}
.shake{animation:shake .28s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.keys{display:flex;flex-direction:column;gap:6px}
.krow{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.krow .kl{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:6px;background:var(--tc);color:#fff;font:800 14px/1 var(--cond);text-transform:uppercase}
.qkey{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 9px;height:34px;min-width:36px;font:600 13.5px/1 var(--mono);color:var(--ink-2)}
.qkey:hover{border-color:var(--muted)}
.qkey.act{background:var(--card)}
.qkey.made{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.qkey.miss{color:var(--bad)}
.qkey.wide{min-width:52px}
.cheat summary{cursor:pointer;font:700 13.5px/1 var(--cond);text-transform:uppercase;letter-spacing:.03em;padding:4px 0;color:var(--muted)}
.cheat[open] summary{color:var(--ink-2)}
.cheat table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.cheat td{text-align:left;vertical-align:top;padding:6px 6px;border-bottom:1px solid var(--line-2)}
.cheat td:first-child{white-space:nowrap}
.cheat code{font:600 12.5px/1.3 var(--mono);background:var(--surface-2);padding:1px 5px;border-radius:3px;color:var(--ink-2)}

/* ---------- dialogs ---------- */
dialog{border:0;border-radius:12px;background:var(--card);color:var(--ink);padding:0;box-shadow:0 10px 40px rgba(0,0,0,.35);
  width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(8,10,12,.55)}
dialog:not([open]){display:none}
dialog.fallback[open]{display:block;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1000;margin:0;
  max-height:calc(100% - 32px);overflow:auto;box-shadow:0 0 0 100vmax rgba(8,10,12,.55),0 10px 40px rgba(0,0,0,.35)}
.dlg-hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg-hd h2{margin:0;font:700 19px/1 var(--cond);text-transform:uppercase;color:var(--ink-2)}
.dlg-bd{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.dlg-ft{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line-2)}
.x{background:none;border:0;font-size:24px;line-height:1;color:var(--muted);padding:2px 6px}
.teamset{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 84px 54px;gap:8px;align-items:end}
@media (max-width:560px){.teamset{grid-template-columns:minmax(0,1fr) 84px 54px}.teamset>.fld:first-child{grid-column:1/-1}}
.teamset input[type=color]{width:100%;height:44px;border:1px solid var(--line);border-radius:6px;padding:3px;background:var(--surface)}
.grp{display:flex;flex-direction:column;gap:8px}
.grp h3{margin:0;font:700 15px/1 var(--cond);text-transform:uppercase;color:var(--ink-2)}
.glist{display:flex;flex-direction:column}
.gitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2)}
.gitem b{font:700 16px/1.1 var(--cond);text-transform:uppercase;color:var(--ink-2)}
.gitem .meta{font-size:12.5px;color:var(--muted)}
.gitem .acts{display:flex;gap:6px}
.cur-tag{font:700 11px/1 var(--sans);text-transform:uppercase;letter-spacing:.04em;color:var(--good);margin-left:6px}
.acct{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border-radius:8px;padding:11px 12px}
.acct > div{flex:1 1 260px;min-width:0}
.acct b{font:700 15px/1.2 var(--cond);text-transform:uppercase;color:var(--ink-2)}
.acct .hint{margin-top:3px}

/* ---------- start screen: no game under way ---------- */
.start{box-sizing:border-box;max-width:1280px;margin:0 auto;padding:16px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.s-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.hcard{background:var(--card);border-radius:10px;box-shadow:0 1px 3px rgba(18,18,19,.1);padding:18px 20px}
.h-eyebrow{font:700 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.s-hero h1{margin:9px 0 8px;font:800 30px/1.15 var(--sans);letter-spacing:-.01em;color:var(--ink-2)}
.s-hero p{margin:0 0 18px;font:400 16px/1.5 var(--sans);color:var(--muted)}
.h-btns{display:flex;flex-wrap:wrap;gap:10px}
.h-btn{display:inline-flex;align-items:center;border:1px solid var(--blue);border-radius:22px;padding:11px 18px;background:var(--card);font:600 14.5px/1 var(--sans);color:var(--blue);text-decoration:none;cursor:pointer}
.h-btn.primary{background:var(--blue);color:#FFFFFF}
.h-btn:hover{box-shadow:0 1px 6px rgba(55,114,223,.35)}
.h-rail{display:flex;align-items:center;gap:8px;margin:0 0 4px;padding-bottom:12px;border-bottom:1px solid var(--line-2);font:700 16px/1.2 var(--sans);color:var(--ink-2)}
.s-list{list-style:none;margin:2px 0 0;padding:0}
.s-list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px dotted var(--line)}
.s-list li:first-child{border-top:0}
.s-teams{flex:1;min-width:0}
.s-teams b{display:flex;align-items:center;flex-wrap:wrap;gap:6px 7px;font:600 15.5px/1.3 var(--sans);color:var(--ink-2)}
.s-t{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.s-teams>span{display:block;margin-top:3px;font:400 13px/1.3 var(--sans);color:var(--muted)}
.s-tag{border-radius:4px;padding:3px 6px;background:#E8F0FD;font:700 10.5px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--blue)}
.s-go{flex:none;border:1px solid var(--blue);border-radius:20px;padding:9px 14px;background:var(--card);font:600 13.5px/1 var(--sans);color:var(--blue);cursor:pointer}
.s-go.primary{background:var(--blue);color:#FFFFFF}
.h-codes{width:100%;border-collapse:collapse;font:400 14px/1.35 var(--sans);color:var(--ink)}
.h-codes td{padding:8px 0;border-top:1px solid var(--line-2);vertical-align:top}
.h-codes td:first-child{width:44%;padding-right:10px}
.h-codes code{font:600 13px/1.3 var(--mono);background:var(--surface-2);padding:2px 6px;border-radius:4px;color:var(--ink-2);white-space:nowrap}
.h-sec{margin:8px 0 12px;font:800 22px/1.2 var(--sans);color:var(--ink-2)}
@media (max-width:900px){.start{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.start{padding:10px 10px 30px;gap:10px}.s-hero h1{font-size:25px}}

.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink-2);color:var(--card);
  padding:10px 16px;border-radius:20px;font:600 13.5px/1 var(--sans);transition:opacity .18s,transform .18s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- viewer (live link) ---------- */
body.viewer .abtns,body.viewer #sync,body.viewer #pad{display:none}
body.viewer .pl{cursor:default}
body.viewer .pl:hover{background:none}

@media print{
  .sitebar,.navbar,.sample,.gtabs,#pad,.pl-act,.toast,.card-ft,.segctl{display:none!important}
  .strip{position:static;box-shadow:none}

  body{background:#fff}
}

<style>

/* ================================================================
   Engine. A game is its setup plus an ordered list of plays; every
   score, stat, foul count and possession is derived by replaying that
   list, so editing or deleting any play corrects everything after it.
   ================================================================ */
const other = s => s === 'H' ? 'A' : 'H';
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const ord = n => n + (['th', 'st', 'nd', 'rd'][n % 10 > 3 || (n % 100 >= 11 && n % 100 <= 13) ? 0 : n % 10] || 'th');
const PL_KEYS = 'pts fgm fga tpm tpa ftm fta oreb dreb reb ast stl blk to pf'.split(' ');
const TEAM_KEYS = [...PL_KEYS, 'tf', 'pot', 'scp', 'tmo', 'tmo60', 'tmo30', 'pip', 'fbp'];
const zeros = keys => Object.fromEntries(keys.map(k => [k, 0]));

// Kansas high school: four 8-minute quarters, 4-minute overtimes, the bonus (two shots) at a team's
// fifth foul of each quarter. Halves (two 16s or 18s) keep the older one-and-one at 7 and two shots at 10.
const FORMATS = {
  q: {n:4, per:8, ot:4, bonus:5, bonus2:null, tos:{f:3, s:2}},
  h: {n:2, per:16, ot:4, bonus:7, bonus2:10, tos:{f:3, s:2}}
};
function rulesOf(game){
  const s = (game && game.set) || {}, fmt = s.fmt === 'h' ? 'h' : 'q', f = FORMATS[fmt];
  const num = (v, d) => +v > 0 ? +v : d;
  return {fmt, n:f.n, per:num(s.per, f.per), ot:num(s.ot, f.ot), bonus:f.bonus, bonus2:f.bonus2, tos:f.tos};
}
const perName = (q, ru) => {
  const n = ru.n;
  if (q > n) return `OT${q - n > 1 ? ' ' + (q - n) : ''}`;
  return n === 2 ? `${ord(q)} Half` : `${ord(q)} Qtr`;
};
const perLong = (q, ru) => q > ru.n ? (q - ru.n > 1 ? `${ord(q - ru.n)} overtime` : 'overtime') : ru.n === 2 ? `${ord(q)} half` : `${ord(q)} quarter`;
const perShort = (q, ru) => q > ru.n ? `OT${q - ru.n > 1 ? q - ru.n : ''}` : ord(q);

// Timeouts under NFHS: three 60-second and two 30-second a game, one more 60 in each overtime.
const tosLeft = t => t.f + t.s;
function replay(g, upto = g.plays.length){
  if (g.box) return replayBox(g);   // a game entered from a box score has no plays
  const ru = rulesOf(g), T = g.teams;
  const st = {per:1, score:{A:0, H:0}, lines:{A:[0], H:[0]}, final:false, poss:null, arrow:null, periodStart:true, fouls:{A:0, H:0}, tos:{A:{...ru.tos}, H:{...ru.tos}},
    lastMiss:null, pot:null, scp:null, run:{s:null, pts:0}, and1:null};
  const S = {pl:{A:{}, H:{}}, team:{A:zeros(TEAM_KEYS), H:zeros(TEAM_KEYS)}};
  const X = {lead:{A:0, H:0}, leadChanges:0, ties:0, bigRun:{A:0, H:0}, flow:[]};
  const log = [], scoring = [];
  const P = (s, n) => { n = String(n); if (n === 'team') return null; return S.pl[s][n] || (S.pl[s][n] = Object.assign(zeros(PL_KEYS), {n})); };
  const bump = (s, n, k, v = 1) => { const p = P(s, n); if (p) p[k] += v; S.team[s][k] += v; };
  const name = (s, n) => n === 'team' || n == null ? T[s].abbr : (T[s].roster || {})[String(n)] || `#${n}`;
  const bonusOf = s => { const f = st.fouls[s], b = ru.bonus, b2 = ru.bonus2; return b2 && f >= b2 ? 'double bonus' : f >= b ? 'bonus' : ''; };
  let lastSign = 0;   // who led last, before the play (1 = A, -1 = H)
  const addScore = (s, pts, i) => {
    st.score[s] += pts; st.lines[s][st.per - 1] = (st.lines[s][st.per - 1] || 0) + pts;
    const now = st.score.A - st.score.H;
    if (now === 0) X.ties++;
    else { if (lastSign && Math.sign(now) !== lastSign) X.leadChanges++; lastSign = Math.sign(now); }
    X.lead.A = Math.max(X.lead.A, now); X.lead.H = Math.max(X.lead.H, -now);
    if (st.run.s === s) st.run.pts += pts; else st.run = {s, pts};
    X.bigRun[s] = Math.max(X.bigRun[s], st.run.pts);
    if (st.pot === s) S.team[s].pot += pts;
    if (st.scp === s) S.team[s].scp += pts;
    X.flow.push({i, per:st.per, lead:now});
  };
  const rebound = (s, n, kind) => {
    // Offensive if the shot was the rebounder's own team's; a dead-ball or unknown miss is defensive.
    const off = kind === 'o' || (kind !== 'd' && st.lastMiss === s);
    bump(s, n, off ? 'oreb' : 'dreb'); bump(s, n, 'reb');
    st.lastMiss = null; st.poss = s;
    if (off) st.scp = s; else { st.pot = null; st.scp = null; }
    return off;
  };
  // Every foul counts toward the team total. A player is disqualified on the fifth foul, on a second technical,
  // or on any flagrant foul; the log line says so and the box score marks it.
  const foul = (s, n, kind) => {
    bump(s, n, 'pf'); if (kind === 't') S.team[s].tf++;
    st.fouls[s]++;
    const pl = P(s, n); if (!pl) return '';
    if (kind === 't') pl.tech = (pl.tech || 0) + 1;
    if (pl.dq) return '';
    if (kind === 'f'){ pl.dq = 'ejected'; return ', ejected'; }
    if (pl.tech >= 2){ pl.dq = 'ejected'; return ', second technical, ejected'; }
    if (pl.pf >= 5){ pl.dq = 'fouled out'; return `, ${ord(pl.pf)} foul, fouls out`; }
    return '';
  };
  const PAINT = ['layup', 'dunk', 'putback', 'tip-in', 'reverse layup', 'alley-oop', 'hook', 'jam'];
  const arrowTxt = () => st.arrow ? ` (arrow now ${T[st.arrow].abbr})` : '';
  for (let i = 0; i < upto && i < g.plays.length; i++){
    const p = g.plays[i], e = {i, t:p.t, per:st.per, clk:p.clk ?? null, s:p.s || null, text:'', tags:[], src:p.q || '', grp:p.grp || null, pts:0};
    const A0 = st.score.A, H0 = st.score.H;
    switch (p.t){
      case 'shot': {
        const v = p.v === 3 ? 3 : 2, who = name(p.s, p.n), what = p.how || `${v}-pt shot`;
        bump(p.s, p.n, 'fga'); if (v === 3) bump(p.s, p.n, 'tpa');
        if (p.made){
          bump(p.s, p.n, 'fgm'); if (v === 3) bump(p.s, p.n, 'tpm'); bump(p.s, p.n, 'pts', v);
          addScore(p.s, v, i); e.pts = v;
          if (p.paint || PAINT.includes(p.how)) S.team[p.s].pip += v;
          if (p.fb) S.team[p.s].fbp += v;
          if (p.ast) bump(p.ast.s, p.ast.n, 'ast');
          e.text = `${who} makes ${what}${p.paint && !PAINT.includes(p.how) ? ' in the paint' : ''}${p.gt ? ' (goaltending)' : ''}${p.ast ? ` (${name(p.ast.s, p.ast.n)} assists)` : ''}${p.fb ? ' on the fast break' : ''}`;
          e.tags.push(['score', `+${v}`]);
          st.lastMiss = null; st.poss = other(p.s); st.pot = null; st.scp = null;
        } else {
          e.text = `${who} misses ${what}`;
          if (p.blk){ bump(p.blk.s, p.blk.n, 'blk'); e.text += `, blocked by ${name(p.blk.s, p.blk.n)}`; e.tags.push(['good', 'Block']); }
          else if (p.blocked) e.text += ', blocked';
          st.lastMiss = p.s; st.poss = null;
        }
        if (p.foul){
          const dq = foul(p.foul.s, p.foul.n, 'p');
          e.text += p.made ? `, fouled by ${name(p.foul.s, p.foul.n)} (and one)${dq}` : `, fouled by ${name(p.foul.s, p.foul.n)}${dq}`;
          e.tags.push(['flag', `Foul${bonusOf(p.foul.s) ? ' · ' + bonusOf(p.foul.s) : ''}`]);
          st.poss = p.s;   // free throws follow
        } else if (p.and1 && p.made) e.text += ' (and one)';
        if (p.reb && !p.made){ const off = rebound(p.reb.s, p.reb.n, p.reb.kind); e.text += `. ${p.reb.n === 'team' ? T[p.reb.s].abbr + ' team' : name(p.reb.s, p.reb.n)} ${off ? 'offensive' : 'defensive'} rebound`; }
        break;
      }
      case 'ft': {
        const seq = Array.isArray(p.seq) && p.seq.length ? p.seq : [true], who = name(p.s, p.n), n = seq.length;
        seq.forEach(m => { bump(p.s, p.n, 'fta'); if (m){ bump(p.s, p.n, 'ftm'); bump(p.s, p.n, 'pts'); addScore(p.s, 1, i); e.pts++; } });
        e.text = n === 1 ? `${who} ${seq[0] ? 'makes' : 'misses'} free throw`
          : `${who} ${seq.map((m, k) => `${m ? 'makes' : 'misses'} free throw ${k + 1} of ${n}`).join(', ')}`;
        if (e.pts) e.tags.push(['score', `+${e.pts}`]);
        const last = seq[n - 1];
        if (last){ st.lastMiss = null; st.poss = other(p.s); st.pot = null; st.scp = null; }
        else { st.lastMiss = p.s; st.poss = null; }
        if (p.reb && !last){ const off = rebound(p.reb.s, p.reb.n, p.reb.kind); e.text += `. ${p.reb.n === 'team' ? T[p.reb.s].abbr + ' team' : name(p.reb.s, p.reb.n)} ${off ? 'offensive' : 'defensive'} rebound`; }
        break;
      }
      case 'reb': {
        const off = rebound(p.s, p.n, p.kind);
        e.text = `${p.n === 'team' ? T[p.s].abbr + ' team' : name(p.s, p.n)} ${off ? 'offensive' : 'defensive'} rebound`;
        break;
      }
      case 'ast': bump(p.s, p.n, 'ast'); e.text = `${name(p.s, p.n)} assist`; break;
      case 'stl': {
        bump(p.s, p.n, 'stl');
        const t = p.to || {s:other(p.s), n:'team'};
        bump(t.s, t.n, 'to');
        e.text = `${name(p.s, p.n)} steal (${t.n === 'team' ? T[t.s].abbr : name(t.s, t.n)} turnover)`;
        e.tags.push(['good', 'Steal']);
        st.poss = p.s; st.pot = p.s; st.scp = null; st.lastMiss = null;
        break;
      }
      case 'blk': bump(p.s, p.n, 'blk'); e.text = `${name(p.s, p.n)} blocks a shot`; e.tags.push(['good', 'Block']); break;
      case 'to': {
        bump(p.s, p.n, 'to');
        const how = ({travel:'traveling', double:'double dribble', oob:'out of bounds', shotclock:'shot clock', bad:'bad pass', '3sec':'3 seconds', '5sec':'5 seconds', '10sec':'10 seconds',
          backcourt:'backcourt', lane:'lane violation', carry:'carrying', palming:'palming', held:'held ball'})[p.kind] || (p.kind && !/^\w+$/.test(p.kind) ? p.kind : '') || (p.kind || '').replace(/sec$/, ' seconds');
        e.text = `${p.n === 'team' ? T[p.s].abbr + ' team' : name(p.s, p.n)} turnover${how ? ` (${how})` : ''}`;
        if (p.stl){ bump(p.stl.s, p.stl.n, 'stl'); e.text += `, ${name(p.stl.s, p.stl.n)} steal`; }
        e.tags.push(['to', 'Turnover']);
        st.poss = other(p.s); st.pot = other(p.s); st.scp = null; st.lastMiss = null;
        break;
      }
      case 'foul': {
        const kind = p.kind || 'p';
        const dq = foul(p.s, p.n, kind);
        const who = p.n === 'team' ? `${T[p.s].abbr} bench` : name(p.s, p.n);
        const what = kind === 't' ? 'technical foul' : kind === 'o' ? 'offensive foul' : kind === 'f' ? 'flagrant foul' : kind === 'i' ? 'intentional foul' : p.how ? `${p.how} foul` : 'personal foul';
        e.text = `${who} ${what}${p.on ? ` on ${name(p.on.s, p.on.n)}` : ''}${dq}`;
        if (kind === 'o'){ bump(p.s, p.n, 'to'); e.text += ' (turnover)'; e.tags.push(['to', 'Turnover']); st.poss = other(p.s); st.pot = other(p.s); st.scp = null; }
        const b = bonusOf(p.s);
        e.text += ` · ${T[p.s].abbr} team foul ${st.fouls[p.s]}${b ? ', ' + b : ''}`;
        e.tags.push(['flag', b ? 'Bonus' : 'Foul']);
        if (dq) e.tags.push(['to', p.dq === 'ejected' || /eject/.test(dq) ? 'Ejected' : 'Fouled out']);
        st.lastMiss = null;
        break;
      }
      case 'eject': { const pl = P(p.s, p.n); if (pl) pl.dq = 'ejected'; e.text = `${name(p.s, p.n)} ejected`; e.tags.push(['to', 'Ejected']); break; }
      case 'own': {
        // a basket in the wrong hoop: two points for the other team, credited to no player
        const to = other(p.s);
        S.team[to].pts += 2; addScore(to, 2, i); e.pts = 2; e.s = to;
        e.text = `${name(p.s, p.n)} scores in the wrong basket, 2 points for ${T[to].abbr}`;
        e.tags.push(['score', '+2']);
        st.lastMiss = null; st.poss = p.s; st.pot = null; st.scp = null;
        break;
      }
      case 'viol': e.text = `${p.n === 'team' ? T[p.s].abbr : name(p.s, p.n)} ${p.kind || 'violation'}`; e.tags.push(['info', 'Violation']); break;
      case 'tmo': {
        const k = p.kind === '30' ? 's' : 'f', t = st.tos[p.s];
        if (t[k] > 0) t[k]--; else if (k === 's' && t.f > 0) t.f--;   // out of 30s: a 60 is charged
        S.team[p.s].tmo++; S.team[p.s][p.kind === '30' ? 'tmo30' : 'tmo60']++;
        e.text = `${T[p.s].name} ${p.kind === '30' ? '30-second' : '60-second'} timeout (${t.f} full, ${t.s} thirty left)`; e.tags.push(['info', 'Timeout']); break;
      }
      case 'jump': st.poss = p.s; st.arrow = other(p.s); e.text = `${T[p.s].abbr} wins the tip${arrowTxt()}`; e.tags.push(['info', 'Possession']); break;
      case 'poss': st.poss = p.s; if (st.periodStart) st.arrow = other(p.s); e.text = `${T[p.s].abbr} ball${st.periodStart ? ` to start the ${perLong(st.per, ru)}${arrowTxt()}` : ''}`; e.tags.push(['info', 'Possession']); break;
      case 'arrow': st.arrow = p.s; e.text = `Possession arrow set to ${T[p.s].abbr}`; e.tags.push(['info', 'Arrow']); break;
      case 'held': {
        if (p.s){ st.poss = p.s; st.arrow = other(p.s); e.text = `Held ball, ${T[p.s].abbr} ball${arrowTxt()}`; }
        else if (st.arrow){ st.poss = st.arrow; st.arrow = other(st.arrow); e.text = `Held ball, ${T[st.poss].abbr} ball on the arrow${arrowTxt()}`; }
        else e.text = 'Held ball (no arrow set yet: type jump, or arrow, with the team)';
        e.tags.push(['info', 'Held ball']); st.lastMiss = null;
        break;
      }
      case 'note': e.text = p.text || 'Note'; break;
      case 'endq': {
        const tied = st.score.A === st.score.H;
        e.text = `End of the ${perLong(st.per, ru)}`;
        if (st.per >= ru.n && !tied){ st.final = true; e.text = st.per > ru.n ? 'End of overtime, final' : 'End of regulation, final'; }
        else {
          const ot = st.per >= ru.n;
          if (ot){ e.text += ', tied: overtime'; st.tos.A.f++; st.tos.H.f++; }
          st.per++; st.lines.A[st.per - 1] = 0; st.lines.H[st.per - 1] = 0;
          st.fouls = {A:0, H:0}; st.pot = null; st.scp = null; st.lastMiss = null; st.run = {s:null, pts:0};
          // overtime starts with a jump ball; any other period goes to the possession arrow
          if (ot){ st.poss = null; st.arrow = null; }
          else if (st.arrow){ st.poss = st.arrow; st.arrow = other(st.arrow); e.text += `. ${T[st.poss].abbr} ball to start the ${perLong(st.per, ru)}${arrowTxt()}`; }
          else st.poss = null;
          st.periodStart = true;
        }
        break;
      }
      case 'final': st.final = true; e.text = 'Final'; break;
      default: e.text = 'Play';
    }
    if (!['endq', 'tmo', 'note', 'arrow', 'final'].includes(p.t)) st.periodStart = false;
    e.A = st.score.A; e.H = st.score.H;
    log.push(e);
    if (st.score.A !== A0 || st.score.H !== H0) scoring.push({i, per:e.per, clk:e.clk, s:e.s, pts:e.pts, A:e.A, H:e.H, desc:e.text, t:p.t});
  }
  const sit = st.final ? `Final, ${T.A.abbr} ${st.score.A}, ${T.H.abbr} ${st.score.H}`
    : `${perName(st.per, ru)} · ${T.A.abbr} ${st.score.A}, ${T.H.abbr} ${st.score.H}${st.poss ? ` · ${T[st.poss].abbr} ball` : ''}`;
  return {st, S, X, log, scoring, sit, ru, bonusOf};
}

// A game entered from a box score: the line score and each player's line, nothing to replay.
function replayBox(g){
  const ru = rulesOf(g), T = g.teams, B = g.box;
  const lines = {A:[...(B.lines.A || [])], H:[...(B.lines.H || [])]};
  const n = Math.max(ru.n, lines.A.length, lines.H.length);
  ['A', 'H'].forEach(s => { while (lines[s].length < n) lines[s].push(0); });
  const score = {A:lines.A.reduce((a, b) => a + (+b || 0), 0), H:lines.H.reduce((a, b) => a + (+b || 0), 0)};
  const S = {pl:{A:{}, H:{}}, team:{A:zeros(TEAM_KEYS), H:zeros(TEAM_KEYS)}};
  ['A', 'H'].forEach(s => {
    (B.pl[s] || []).forEach(x => { const p = Object.assign(zeros(PL_KEYS), x, {n:String(x.n)}); S.pl[s][p.n] = p; PL_KEYS.forEach(k => { S.team[s][k] += p[k] || 0; }); });
    const t = B.team && B.team[s];
    if (t) PL_KEYS.forEach(k => { if (t[k] != null && t[k] > S.team[s][k]) S.team[s][k] = t[k]; });
    S.team[s].pts = score[s];
  });
  const d = score.A - score.H;
  const st = {per:n, score, lines, final:true, poss:null, arrow:null, fouls:{A:0, H:0}, tos:{A:{...ru.tos}, H:{...ru.tos}}, lastMiss:null, pot:null, scp:null, run:{s:null, pts:0}, box:true};
  return {st, S, X:{lead:{A:Math.max(0, d), H:Math.max(0, -d)}, leadChanges:0, ties:0, bigRun:{A:0, H:0}, flow:[]}, log:[], scoring:[], sit:`Final, ${T.A.abbr} ${score.A}, ${T.H.abbr} ${score.H}`, ru, bonusOf:() => '', box:true};
}
</script>
<script>
/* ================================================================
   Quick entry. One line can be shorthand —
     a3-2 · a3-miss2 · a3-miss2-b10b-b13r · a3-3 · a3ft · a3ftm · a3r · a3a · a3s · a3b · a3to · a3f
   — or written out, several plays on a line —
     aug 2 blocked by eldo 3 reb by aug 10 shot by aug 10 miss reb by eldo 10
   Teams go by a letter (first letter of the short name), the short name,
   or the start of the school's name. Both forms feed the same engine.
   ================================================================ */
const CONNECT = new Set(['by', 'the', 'and', '&', 'with', 'on', 'from', 'of', 'for', 'off', 'it', 'his', 'her', 'then', 'at', 'in', 'is', 'was',
  'gets', 'get', 'goes', 'go', 'ball', 'pt', 'pts', 'point', 'points', 'pointer', 'throw', 'throws', 'out', 'up', 'over', 'a1', 'into', 'down', 'court', 'line', 'floor', 'back',
  'bench', 'coach', 'called', 'call', 'whistle', 'violation', 'to-the']);
const ACT = {
  made:  ['made', 'make', 'makes', 'hit', 'hits', 'good', 'scores', 'score', 'scored', 'basket', 'layup', 'layin', 'jumper', 'dunk', 'jam', 'slam', 'tip', 'tipin', 'putback', 'floater', 'hook', 'bank',
          'fadeaway', 'runner', 'pullup', 'stepback', 'reverse', 'alleyoop', 'turnaround', 'finger', '2', '3', '2pt', '3pt', '2p', '3p', 'two', 'three', 'trey', 'triple', 'fg'],
  miss:  ['miss', 'misses', 'missed', 'x', 'no', 'brick', 'miss2', 'miss3', 'x2', 'x3', '2miss', '3miss', '2x', '3x', 'airball', 'rim', 'short', 'long'],
  shot:  ['shot', 'shoots', 'shoot', 'attempt', 'attempts', 'jumpshot', 'fga'],
  ft:    ['ft', 'fts', 'freethrow', 'free', 'ftm', 'ftmiss', 'ftx', 'ftmade', 'ftgood', 'both', 'splits', 'split', 'frontend'],
  reb:   ['r', 'reb', 'rebound', 'rebounds', 'board', 'boards', 'oreb', 'dreb', 'orb', 'drb', 'off', 'def', 'defensive'],
  ast:   ['a', 'ast', 'assist', 'assists', 'assisted', 'dime'],
  stl:   ['s', 'stl', 'steal', 'steals', 'stolen', 'picks', 'pick', 'picked'],
  blk:   ['b', 'blk', 'block', 'blocks', 'blocked', 'swat', 'swats', 'swatted'],
  to:    ['to', 'tov', 'turnover', 'turnovers', 'travel', 'traveling', 'travels', 'travelling', 'double', 'doubledribble', 'lost', 'loses', 'oob', 'shotclock', 'badpass', 'bad',
          'backcourt', 'lane', 'carry', 'carrying', 'palming', 'stepped', 'threesec', 'fivesec', 'tensec'],
  foul:  ['f', 'pf', 'foul', 'fouls', 'fouled', 'foulsout', 'tf', 'tech', 'technical', 'of', 'offensive', 'charge', 'charges', 'charging', 'flagrant', 'ff', 'intentional', 'int', 'and1', 'andone',
          'shooting', 'personal', 'common', 'loose', 'reach', 'reaching', 'hold', 'holding', 'push', 'pushing', 'blocking', 'handcheck', 'elbow', 'overtheback', 'illegal', 'screen'],
  tmo:   ['tmo', 'timeout', 'time', 'time-out', 'full', 'thirty', 'sixty'],
  jump:  ['jump', 'jumpball', 'tipoff', 'tip-off', 'wins', 'won', 'arrow', 'poss', 'possession', 'inbounds', 'inbound'],
  held:  ['heldball', 'held', 'tieup', 'tiedup', 'jumpballheld'],
  gt:    ['goaltend', 'goaltending', 'goaltended', 'gt', 'interference'],
  own:   ['ownbasket', 'wrongbasket'],
  eject: ['ejected', 'ejection', 'eject', 'dq', 'disqualified'],
  viol:  ['kickedball', 'kick', 'kicked'],
  tag:   ['paint', 'fb', 'fastbreak', 'transition']
};
// what a foul was for, when the scorer says: the kind stays personal, the log says "shooting foul"
const FOUL_HOW = {shooting:'shooting', personal:'', common:'', loose:'loose-ball', reach:'reaching', reaching:'reaching', hold:'holding', holding:'holding', push:'pushing', pushing:'pushing',
  blocking:'blocking', handcheck:'hand-check', elbow:'elbow', overtheback:'over-the-back', illegal:'illegal screen', screen:'illegal screen'};
// 'off' is a rebound word only after a shot; elsewhere it is filler. 'free' + 'throw' is one free throw.
const ACT_OF = {}; for (const k in ACT) ACT[k].forEach(w => { ACT_OF[w] = k; });
CONNECT.delete('off');
const END_WORDS = ['eoq', 'eop', 'endq', 'endp', 'end', 'half', 'halftime', 'eoh', 'endofquarter', 'endofhalf', 'endquarter', 'endhalf', 'buzzer'];
const UNDO_WORDS = ['undo', 'oops', 'back'];
// Two- and three-word phrases become one token before parsing.
const PHRASES = [[/\bfree throws?\b/g, 'freethrow'], [/ft\s*(\d)\s*(?:of|\/|-)\s*(\d)\b/g, 'ft$1of$2'], [/\b(\d)\s*(?:of|\/)\s*(\d)\s*(?:from the line|at the line|free throws?|fts?)\b/g, 'ft$1of$2'],
  [/\blay[ -]?up\b/g, 'layup'], [/\blay[ -]?in\b/g, 'layup'], [/\bput[ -]?back\b/g, 'putback'], [/\btip[ -]?in\b/g, 'tipin'], [/\bpull[ -]?up\b/g, 'pullup'], [/\bstep[ -]?back\b/g, 'stepback'],
  [/\balley[ -]?oop\b/g, 'alleyoop'], [/\bfinger[ -]?roll\b/g, 'finger'], [/\bfast[ -]?break\b/g, 'fastbreak'], [/\bin the paint\b/g, 'paint'], [/\band[ -]?one\b/g, 'and1'], [/\bfouls? out\b/g, 'foulsout'],
  [/\bout of bounds\b/g, 'oob'], [/\bdouble[ -]?dribble\b/g, 'doubledribble'], [/\bbad pass\b/g, 'badpass'], [/\bshot[ -]?clock\b/g, 'shotclock'], [/\bover and back\b/g, 'backcourt'],
  [/\b(\d{1,2})[ -]?sec(?:ond)?s?\b(?! timeout| time)/g, (m, d) => ({3:'threesec', 5:'fivesec', 10:'tensec'})[+d] || m], [/\blane violation\b/g, 'lane'], [/\bkicked? ball\b/g, 'kickedball'],
  [/\bheld ball\b/g, 'heldball'], [/\btied? up\b/g, 'heldball'], [/\bjump ball\b/g, 'jumpball'], [/\b(own|wrong) basket\b/g, 'ownbasket'], [/\bbasket interference\b/g, 'interference'],
  [/\bhook shot\b/g, 'hook'], [/\bbank shot\b/g, 'bank'], [/\bhand[ -]?check\b/g, 'handcheck'], [/\bover the back\b/g, 'overtheback'], [/\bloose[ -]?ball\b/g, 'loose'], [/\bfront end\b/g, 'frontend'],
  [/\b(30|60)[ -]?(?:sec(?:ond)?s?)?[ -]?(?:time[ -]?out|time|tmo)\b/g, 'tmo$1'], [/\bfull[ -]?(?:time[ -]?out|time|tmo)\b/g, 'tmo60'], [/\bthirty[ -]?(?:second)?[ -]?(?:time[ -]?out|time|tmo)\b/g, 'tmo30'],
  [/\btime[ -]?out\b/g, 'timeout'], [/\btip[ -]?off\b/g, 'tipoff'], [/\bwins? the (?:tip|jump|jumpball|tipoff)\b/g, 'jump'], [/\bthree[ -]?point(?:er)?s?\b/g, 'three'], [/\b3[ -]?point(?:er)?s?\b/g, '3'],

function joinPhrases(s){ let t = ' ' + s.toLowerCase() + ' '; for (const [re, to] of PHRASES) t = t.replace(re, to); return t.trim(); }

// Team keys: the first letter of each short name (v/h if they clash), the short name, and the letters of the school name.
function quickTeams(){
  const a = String(g.teams.A.abbr || 'V').toLowerCase(), h = String(g.teams.H.abbr || 'H').toLowerCase();
  let ka = a[0], kh = h[0];
  if (ka === kh){ ka = 'v'; kh = 'h'; }
  const map = {[a]:'A', [h]:'H', [ka]:'A', [kh]:'H'};
  if (!map.v) map.v = 'A';
  if (!map.h) map.h = 'H';
  if (!map.away) map.away = 'A'; if (!map.home) map.home = 'H';
  const letters = s => String(g.teams[s].name || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  return {map, key:{A:ka, H:kh}, names:{A:letters('A'), H:letters('H')}, abbr:{A:a, H:h}};

// A token that names a team: a key, the short name, or at least two letters that begin only one school's name.
function teamOf(tok, Q){
  if (Q.map[tok]) return Q.map[tok];
  if (tok.length < 2 || /\d/.test(tok) || ACT_OF[tok]) return null;
  const hits = ['A', 'H'].filter(s => (Q.names[s].startsWith(tok) && Q.names[s]) || Q.abbr[s].startsWith(tok));
  return hits.length === 1 ? hits[0] : null;
}

// Dashes and spaces both separate; '#' is dropped: a3-miss2-b10b · aug #2 · aug-2.
function tokenize(s){
  return joinPhrases(String(s).replace(/#/g, '').replace(/&/g, ' and ')).split(/[\s,()\/\-–—]+/).filter(Boolean);
}

function parseQuick(raw, st){
  const line = String(raw || '').trim(); if (!line) return null;

  if (!toks.length) return null;
  if (toks[0] === 'score' || toks[0] === 'scores') return {error:'The score comes from the plays; there is no line for setting it. Fix the play that was wrong instead.'};
  if (UNDO_WORDS.includes(toks[0]) && toks.length === 1) return {undo:true};
  let clk = null;
  toks = toks.filter(t => { if (/^\d{1,2}:\d\d$/.test(t)){ const [m, s] = t.split(':'); clk = +m * 60 + +s; return false; } return true; });
  if (!toks.length) return {plays:[], clk};
  const w0 = toks[0], rest = toks.slice(1).join('');
  if (END_WORDS.includes(w0) || (w0 === 'end' && /quarter|half|period|q|ot/.test(rest))) return {plays:[{t:'endq'}], clk};
  if (w0 === 'final' || w0 === 'endgame' || w0 === 'gameover') return {plays:[{t:'final'}], clk};
  if (w0 === 'note') return {plays:[{t:'note', text:line.replace(/^note\s*[:\-]?\s*/i, '')}], clk};

  const Q = quickTeams(), events = [];
  let cur = null, subj = null, pendTeam = null, pendRole = null, pendKind = null, err = null;
  const push = ev => { ev.fresh = true; events.push(ev); cur = ev; return ev; };
  const isNum = t => /^\d{1,2}$/.test(t);
  const isPlayer = x => x && x.n != null;
  const roleName = {shooter:'Who took the shot?', reb:'Who got the rebound?', blk:'Who blocked it?', ast:'Who had the assist?', stl:'Who had the steal?', to:'Who turned it over?', foul:'Who fouled?', fouler:'Who fouled?', on:'Who was fouled?', actor:'Who?', team:'Which team?'};
  // "makes 1 of 2": a free-throw line from the count made and the count taken; any misses go last, so a rebound can follow
  const ftSummary = (m, n) => {
    const seq = [...Array(Math.min(m, n)).fill({made:true, x:true}), ...Array(Math.max(0, n - m)).fill({made:false, x:true})].map(x => ({...x}));
    if (cur && cur.t === 'shot' && cur.fresh && cur.v == null && !subj){ cur.t = 'ft'; cur.seq = seq; cur.summary = true; delete cur.v; delete cur.made; delete cur.how; return; }
    if (cur && cur.t === 'ft' && !subj){ cur.seq = seq; cur.summary = true; return; }
    const ev = push({t:'ft', s:null, n:null, seq, summary:true}); actor(ev, 'shooter');
  };
  // A player (or a team) slots into what's waiting for one: the role after "by", or the line's subject.
  const give = p => {
    if (pendRole){ const {ev, field} = pendRole; pendRole = null;
      if (field === 'shooter' || field === 'actor' || field === 'fouler'){ ev.s = p.s; ev.n = p.n; }

  };
  // A bare player after an event fills its obvious empty slot: the rebounder after a miss, the assist after a make, and so on.
  const fillBare = (ev, p) => {
    if (!ev || !p) return false;
    ev.fresh = false;
    if (ev.t === 'shot' && !ev.made && !ev.reb && ev.made != null){ ev.reb = p; return true; }
    if (ev.t === 'shot' && ev.made && !ev.ast && (p.s === ev.s)){ ev.ast = p; return true; }
    if (ev.t === 'shot' && ev.made && !ev.foul && p.s !== ev.s){ ev.foul = p; return true; }
    if (ev.t === 'ft' && ev.seq.length && !ev.seq[ev.seq.length - 1].made && !ev.reb){ ev.reb = p; return true; }
    if (ev.t === 'stl' && !ev.to){ ev.to = p; return true; }
    if (ev.t === 'to' && !ev.stl && p.s !== ev.s){ ev.stl = p; return true; }
    if (ev.t === 'foul' && !ev.on && p.s !== ev.s){ ev.on = p; return true; }
    if (ev.t === 'blk'){ Object.assign(ev, {t:'shot', s:p.s, n:p.n, v:ev.v || 2, made:false, blk:{s:ev.s, n:ev.n}}); delete ev.blk_; return true; }
    if ((ev.t === 'held' || ev.t === 'poss' || ev.t === 'jump' || ev.t === 'arrow' || ev.t === 'tmo') && p.n === 'team' && !ev.s){ ev.s = p.s; return true; }

  };
  const shotV = t => /3|three|trey|triple/.test(t) ? 3 : /2|two|layup|layin|dunk|jam|slam|tip|putback|hook|reverse|alleyoop|finger/.test(t) ? 2 : null;
  const shotHow = t => ({layup:'layup', layin:'layup', putback:'putback', dunk:'dunk', jam:'dunk', slam:'dunk', tip:'tip-in', tipin:'tip-in', jumper:'jumper', floater:'floater', hook:'hook', bank:'bank shot',
    fadeaway:'fadeaway', runner:'runner', pullup:'pull-up jumper', stepback:'step-back jumper', reverse:'reverse layup', alleyoop:'alley-oop', turnaround:'turnaround jumper', finger:'finger roll',

  const need = (field, ev) => { pendRole = {ev, field}; };
  const actor = (ev, field = 'actor') => { if (subj){ ev.s = subj.s; ev.n = subj.n; subj = null; } else need(field, ev); };

        if (cur && (cur.t === 'shot' && cur.made === false || cur.t === 'ft' && !cur.seq[cur.seq.length - 1].made) && !cur.reb){

        }
        if (cur && cur.t === 'reb' && !subj){ if (rk) cur.kind = rk; return; }   // "off reb", "reb off"

        if (cur && cur.t === 'shot' && !cur.blk){ cur.made = false; if (subj){ cur.blk = subj; subj = null; } else need('blk', cur); return; }

        if (cur && cur.t === 'to' && !cur.stl){ if (subj){ cur.stl = subj; subj = null; } else need('stl', cur); return; }

      }
      case 'to': {

          : tok === 'threesec' ? '3sec' : tok === 'fivesec' ? '5sec' : tok === 'tensec' ? '10sec' : tok === 'backcourt' ? 'backcourt' : tok === 'lane' ? 'lane' : /carry/.test(tok) ? 'carry' : tok === 'palming' ? 'palming' : null;

        if (tok === 'offensive' && next && ACT_OF[next] === 'reb'){ pendKind = 'o'; return; }   // "offensive rebound"
        const kind = /^t/.test(tok) ? 't' : /^of|charg/.test(tok) ? 'o' : /flag|^ff$/.test(tok) ? 'f' : /intent|^int$/.test(tok) ? 'i' : 'p';

        const passive = tok === 'fouled';

        if (cur && cur.t === 'shot' && !cur.foul && kind === 'p' && !passive && subj && subj.s !== cur.s){ cur.foul = subj; subj = null; return; }
        if (cur && cur.t === 'shot' && cur.foul && how && !subj) return;   // "a3-miss2-b10f shooting"
        if (how != null && !passive){ const ev = push({t:'foul', s:null, n:null, kind:'p', how}); actor(ev); return; }
        if (passive){

      case 'held': { const ev = push({t:'held', s:null, n:'team'}); if (subj){ ev.s = subj.s; subj = null; } return; }
      case 'gt': {
        if (cur && cur.t === 'shot' && !subj){ cur.made = true; cur.gt = true; return; }

      case 'eject': { const ev = push({t:'eject', s:null, n:null}); actor(ev); return; }
      case 'viol': { const ev = push({t:'viol', s:null, n:null, kind:'kicked ball'}); actor(ev); return; }

        return;
      }
    }
  };

  let ftWords = 0;   // words to skip after "1 of 2" ("free throws", "from the line")
  for (let k = 0; k < toks.length && !err; k++){
    const tok = toks[k]; next = toks[k + 1];
    if (ftWords && ['freethrow', 'ft', 'fts', 'from', 'the', 'line'].includes(tok)){ ftWords--; continue; }

    if (pendTeam){
      if (isNum(tok) && !(next === 'of' && isNum(toks[k + 2]))){ give({s:pendTeam, n:String(+tok)}); pendTeam = null; continue; }

    }

    // "n ball": the team has the ball (at a period start, that uses the arrow)
    if (tok === 'ball' && subj && subj.n === 'team' && !cur && !pendRole){ const ev = push({t:'poss', s:subj.s, n:'team'}); subj = null; continue; }
    if (['tmo30', 'tmo60'].includes(tok)){ handle('tmo', tok); continue; }
    if (/^ft\dof\d$/.test(tok)){ handle('ft', tok); continue; }
    if ((tok === '30' || tok === '60') && cur && cur.t === 'tmo' && !subj){ cur.kind = tok; continue; }
    if (CONNECT.has(tok)) continue;
    // "hits a three": that "a" is an article, not a team, when a shot word follows
    if (tok === 'a' && next && ['made', 'miss', 'shot', 'ft'].includes(ACT_OF[next]) && !isNum(next)) continue;

    const tm = teamOf(tok, Q);
    const teamAct = next && ['team', 'to', 'r', 'reb', 'rebound', 'tf', 'tech', 'tmo', 'tmo30', 'tmo60', 'timeout', 'ball', 'turnover', 'bench', 'coach', 'inbounds', 'wins', 'won'].includes(next);
    if (tm && (teamAct || !(tok.length === 1 && ACT_OF[tok] && !isNum(next || '') && (subj || (cur && !pendRole))))){ pendTeam = tm; continue; }

    const m = tok.match(/^([a-z]+?)(\d{1,2})([a-z0-9]*)$/);
    if (m && !ACT_OF[tok]){
      const side = teamOf(m[1], Q);
      if (!side){ err = `"${tok}": which team is ${m[1]}? Use ${Q.key.A} or ${Q.abbr.A} for ${g.teams.A.name}, ${Q.key.H} or ${Q.abbr.H} for ${g.teams.H.name}.`; break; }
      const p = {s:side, n:String(+m[2])}, suf = m[3];
