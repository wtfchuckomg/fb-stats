<script>
/* Looks: the site as it is (Original), Liquid Glass, and 8-Bit. A visitor's pick is kept on their own device, and
   ?skin=liquid / ?skin=tecmo / ?skin=original in a link sets it. It's applied here, before the page paints, so there's
   no flash of the other look. The Game Tracker follows the pick like every other page; embedded pages stay on the
   original, since they live inside someone else's page. */
(function(){
  var q = new URLSearchParams(location.search), want = q.get('skin'), s = null;
  try {
    if (want) localStorage.setItem('kms.skin', want);
    s = localStorage.getItem('kms.skin');
  } catch (e) { s = want; }
  window.KMS_SKIN = s === 'liquid' || s === 'tecmo' ? s : 'original';
  if (q.has('embed') || window.KMS_SKIN === 'original') return;
  document.documentElement.setAttribute('data-skin', window.KMS_SKIN);
  if (window.KMS_SKIN === 'tecmo'){
    var l = document.createElement('link'); l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600;700&display=swap';
    document.head.appendChild(l);
  }
})();
</script>
<style>
/* ======================================================================================

   ====================================================================================== */
html[data-skin="liquid"]{
  --page:#EEF1F6; --card:#FFFFFF; --ground:#FFFFFF; --surface:#F4F6F9; --surface-2:#E9EDF3;

  --good:#248A3D; --bad:#D70015;
  --lg-glass:rgba(255,255,255,.52); --lg-rim-hi:rgba(255,255,255,.95); --lg-rim-lo:rgba(255,255,255,.3);
  --lg-float:0 12px 34px rgba(24,36,70,.14),0 2px 8px rgba(24,36,70,.07);

}

/* ======================================================================================

html[data-skin="tecmo"] .navbar{border-bottom:4px solid #FCFCFC}
