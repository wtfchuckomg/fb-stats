<script>
/* The site's look: Liquid Glass, light or dark to match the device's own setting. It is applied here, before
   the page paints, so there's no flash of the plain page underneath. An embedded page stays plain, because it
   lives inside someone else's. */
(function(){
  if (new URLSearchParams(location.search).has('embed')) return;
  var ua = navigator.userAgent || '', dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  window.KMS_DEVICE = /iPhone|iPod/.test(ua) ? 'iphone' : /Android.*Mobile/i.test(ua) ? 'android' : 'other';
  window.KMS_SKIN = dark ? 'liquid-dark' : 'liquid';
  document.documentElement.setAttribute('data-skin', 'liquid');
  if (dark) document.documentElement.setAttribute('data-lg', 'dark');
})();
</script>
<style>
/* ======================================================================================
   LIQUID GLASS — content sits on solid white cards over a soft ground; the glass is kept
   for the things you touch: the menu bar floats as a glass pill, the score strip is a glass
   shelf, menus are glass. Solid cards also scroll faster on phones than glass ones.
   ====================================================================================== */
html[data-skin="liquid"]{
  --page:#EEF1F6; --card:#FFFFFF; --ground:#FFFFFF; --surface:#F4F6F9; --surface-2:#E9EDF3;
  --ink:#1D1D1F; --ink-2:#1D1D1F; --muted:#6E6E73; --line:rgba(60,60,67,.14); --line-2:rgba(60,60,67,.08);
  --pill:rgba(118,118,128,.12); --seg:rgba(118,118,128,.2); --blue:#007AFF; --accent:#007AFF; --red:#FF3B30;
  --good:#248A3D; --bad:#D70015;
  --lg-glass:rgba(255,255,255,.52); --lg-rim-hi:rgba(255,255,255,.95); --lg-rim-lo:rgba(255,255,255,.3);
  --lg-float:0 12px 34px rgba(24,36,70,.14),0 2px 8px rgba(24,36,70,.07);
  --lg-card-shadow:0 1px 2px rgba(24,36,70,.06),0 8px 24px rgba(24,36,70,.07);
  --lg-wall-a:#C9D6FF; --lg-wall-b:#F6D5E3; --lg-wall-c:#D8F1EA; --lg-cur:rgba(255,255,255,.7); --lg-zebra:rgba(118,118,128,.04);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
}
html[data-skin="liquid"] body{background:var(--page);letter-spacing:-.01em}
html[data-skin="liquid"] body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(55% 45% at 0% 0%,var(--lg-wall-a) 0,transparent 70%),radial-gradient(50% 40% at 100% 10%,var(--lg-wall-b) 0,transparent 70%),
    radial-gradient(60% 50% at 50% 100%,var(--lg-wall-c) 0,transparent 72%),var(--page)}
/* content: solid, rounded, lifted */
html[data-skin="liquid"] .bcard,html[data-skin="liquid"] .hcard,html[data-skin="liquid"] .card{
  background:var(--card);color:var(--ink);border:0;border-radius:22px;-webkit-backdrop-filter:none;backdrop-filter:none;
  box-shadow:var(--lg-card-shadow)}
/* controls: glass */
html[data-skin="liquid"] .navbar,html[data-skin="liquid"] .scores,html[data-skin="liquid"] .navmenu,html[data-skin="liquid"] .gtabs{
  background:var(--lg-glass);border:0;-webkit-backdrop-filter:blur(16px) saturate(190%) brightness(1.06);backdrop-filter:blur(16px) saturate(190%) brightness(1.06);
  box-shadow:inset 0 1px 0 var(--lg-rim-hi),inset 0 -1px 0 var(--lg-rim-lo),inset 0 0 0 .5px var(--lg-rim-lo),var(--lg-float)}
html[data-skin="liquid"] .navbar{top:8px;margin:10px auto 0;width:min(1180px,calc(100% - 24px));border-radius:999px}
html[data-skin="liquid"] .navmenu{border-radius:18px}
html[data-skin="liquid"] .scores{margin:10px auto 0;width:min(1180px,calc(100% - 24px));border-radius:22px;overflow:hidden}
html[data-skin="liquid"] .gtabs{border-radius:999px;margin-inline:auto}
html[data-skin="liquid"] .navlink{color:var(--ink);font-weight:500;opacity:.8}
html[data-skin="liquid"] .navlink.on{opacity:1;font-weight:600;color:var(--accent)}
html[data-skin="liquid"] .sc-game,html[data-skin="liquid"] .sc-wk{border-right-color:rgba(60,60,67,.1)}
html[data-skin="liquid"] .sc-game.cur{background:var(--lg-cur)}
/* buttons: filled accent capsules and quiet gray ones */
html[data-skin="liquid"] .bbtn,html[data-skin="liquid"] .btn.primary{background:var(--accent);color:#FFFFFF;border:0;border-radius:999px;box-shadow:0 4px 14px rgba(0,122,255,.3)}
html[data-skin="liquid"] .btn,html[data-skin="liquid"] .abtn{border-radius:999px}
html[data-skin="liquid"] .inp,html[data-skin="liquid"] select{border-radius:12px}
/* tables: hairlines only */
html[data-skin="liquid"] .ctbl th{background:transparent;border-bottom:1px solid var(--line)}
html[data-skin="liquid"] .ctbl td{background:transparent;border-bottom:1px solid var(--line-2)}
html[data-skin="liquid"] .ctbl tbody tr:nth-child(even) td{background:var(--lg-zebra)}

/* ---------- Liquid Glass on a phone: the menu as a floating glass tab bar at the bottom, big page titles ---------- */
.lgtabs{display:none}
@media (max-width:700px){
  html[data-skin="liquid"] .lgtabs{position:fixed;z-index:50;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px;border-radius:999px;
    background:var(--lg-glass);-webkit-backdrop-filter:blur(16px) saturate(190%) brightness(1.06);backdrop-filter:blur(16px) saturate(190%) brightness(1.06);
    box-shadow:inset 0 1px 0 var(--lg-rim-hi),inset 0 -1px 0 var(--lg-rim-lo),inset 0 0 0 .5px var(--lg-rim-lo),var(--lg-float)}
  html[data-skin="liquid"] .lgtabs a{display:grid;justify-items:center;gap:3px;padding:7px 2px 6px;border-radius:999px;color:var(--ink);text-decoration:none;
    font:500 10.5px/1 var(--sans)}
  html[data-skin="liquid"] .lgtabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  html[data-skin="liquid"] .lgtabs a[aria-current="page"]{color:var(--accent);background:var(--lg-cur);box-shadow:inset 0 1px 0 var(--lg-rim-hi)}
  html[data-skin="liquid"] body{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  html[data-skin="liquid"] h1{font-size:32px!important;font-weight:700!important;letter-spacing:-.03em!important;line-height:1.1!important}
}
/* ---------- Liquid Glass on the Game Tracker, wider screens: the game header floats under the menu and the
   play entry floats at the bottom of the window. Phones keep entry in place, since a bar pinned to the bottom
   of a phone slides under the keyboard. ---------- */
@media (min-width:761px){
  html[data-skin="liquid"] body:not(.viewer) #sb{position:sticky;top:72px;z-index:30;margin:10px auto;width:min(1180px,calc(100% - 24px));border-radius:26px;overflow:hidden;
    background:var(--lg-glass);-webkit-backdrop-filter:blur(16px) saturate(190%) brightness(1.06);backdrop-filter:blur(16px) saturate(190%) brightness(1.06);
    box-shadow:inset 0 1px 0 var(--lg-rim-hi),inset 0 -1px 0 var(--lg-rim-lo),var(--lg-float)}
  html[data-skin="liquid"] body:not(.viewer) .quick{position:fixed;z-index:40;left:50%;bottom:16px;transform:translateX(-50%);width:min(860px,calc(100% - 24px));
    display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding:12px 14px;border-radius:26px;
    background:var(--lg-glass);-webkit-backdrop-filter:blur(18px) saturate(190%) brightness(1.06);backdrop-filter:blur(18px) saturate(190%) brightness(1.06);
    box-shadow:inset 0 1px 0 var(--lg-rim-hi),inset 0 -1px 0 var(--lg-rim-lo),inset 0 0 0 .5px var(--lg-rim-lo),var(--lg-float)}
  html[data-skin="liquid"] body:not(.viewer) .quick .qkeys{order:1;grid-column:1/-1;display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0}
  html[data-skin="liquid"] body:not(.viewer) .quick .qkey{flex:none;border-radius:999px}
  html[data-skin="liquid"] body:not(.viewer) .quick .qk{order:2;grid-column:1;height:46px;border-radius:999px;font-size:17px;margin:0}
  html[data-skin="liquid"] body:not(.viewer) .quick .actions{order:3;grid-column:2;display:flex;gap:8px;margin:0}
  html[data-skin="liquid"] body:not(.viewer) .quick .actions .btn{border-radius:999px;height:46px;padding:0 20px}
  html[data-skin="liquid"] body:not(.viewer) .quick .qprev{order:4;grid-column:1/-1;margin:0;padding:6px 10px;background:transparent;border:0;font-size:12.5px}
  html[data-skin="liquid"] body:not(.viewer) .quick .hint{display:none}
  html[data-skin="liquid"] body:not(.viewer) .quick .cheat{order:5;grid-column:1/-1;margin:0;max-height:40vh;overflow:auto}
  html[data-skin="liquid"] body:not(.viewer){padding-bottom:230px}
}

/* ---------- Liquid Glass, dark: the demo's own dark palette ---------- */
html[data-skin="liquid"][data-lg="dark"]{
  --page:#07080B; --card:#17181D; --ground:#17181D; --surface:#1F2127; --surface-2:#2A2C33;
  --ink:#F5F5F7; --ink-2:#FFFFFF; --muted:#9A9AA1; --line:rgba(120,120,128,.3); --line-2:rgba(120,120,128,.18);
  --pill:rgba(118,118,128,.24); --seg:rgba(118,118,128,.32); --blue:#0A84FF; --accent:#0A84FF; --red:#FF453A;
  --good:#30D158; --good-wash:rgba(48,209,88,.16); --bad:#FF453A; --bad-wash:rgba(255,69,58,.16);
  --flag:#FFD60A; --flag-wash:rgba(255,214,10,.14); --flag-ink:#FFD60A;
  --top:#000000; --top-2:#17181D; --top-ink:#FFFFFF; --top-muted:#9A9AA1;
  --fld-a:#2F7A34; --fld-b:#28692C; --fld-line:rgba(255,255,255,.55); --fld-num:#FFFFFF; --drive:#FFFFFF;
  --lg-glass:rgba(38,40,48,.46); --lg-rim-hi:rgba(255,255,255,.3); --lg-rim-lo:rgba(255,255,255,.07);
  --lg-float:0 12px 34px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.45);
  --lg-card-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px rgba(0,0,0,.35);
  --lg-wall-a:#1B2550; --lg-wall-b:#3A1B2E; --lg-wall-c:#113129; --lg-cur:rgba(255,255,255,.1); --lg-zebra:rgba(255,255,255,.03);
  color-scheme:dark;
}
html[data-skin="liquid"][data-lg="dark"] body{color:var(--ink)}
html[data-skin="liquid"][data-lg="dark"] .navlink,html[data-skin="liquid"][data-lg="dark"] .navbar .abtn,html[data-skin="liquid"][data-lg="dark"] .gtab{color:var(--ink)}
html[data-skin="liquid"][data-lg="dark"] .inp,html[data-skin="liquid"][data-lg="dark"] select,html[data-skin="liquid"][data-lg="dark"] .qk,
html[data-skin="liquid"][data-lg="dark"] textarea{background:rgba(118,118,128,.18);color:var(--ink);border-color:var(--line)}

html[data-skin="liquid"][data-lg="dark"] .c-tabs button,html[data-skin="liquid"][data-lg="dark"] .c-pills button,html[data-skin="liquid"][data-lg="dark"] .bw{color:var(--ink)}
html[data-skin="liquid"][data-lg="dark"] dialog{background:#1C1D22;color:var(--ink)}
html[data-skin="liquid"][data-lg="dark"] .tp-edit-row td{background:#1F2127}
html[data-skin="liquid"][data-lg="dark"] .inner{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
html[data-skin="liquid"][data-lg="dark"] .sc-wk select,html[data-skin="liquid"][data-lg="dark"] .c-sel{background-color:rgba(118,118,128,.24);color:var(--ink);box-shadow:none}
html[data-skin="liquid"][data-lg="dark"] .navbar .abtn:hover,html[data-skin="liquid"][data-lg="dark"] .navmenu a:hover{background:rgba(255,255,255,.08)}
html[data-skin="liquid"][data-lg="dark"] .ctbl tr.hi td,html[data-skin="liquid"][data-lg="dark"] .ctbl tr.hi td.on{background:rgba(10,132,255,.18)}
html[data-skin="liquid"][data-lg="dark"] .av-st tbody tr:nth-child(even) td{background:rgba(255,255,255,.03)}
html[data-skin="liquid"][data-lg="dark"] .av-st .rk,html[data-skin="liquid"][data-lg="dark"] .av-st .nm,html[data-skin="liquid"][data-lg="dark"] .av-st tbody tr:nth-child(even) .rk,
html[data-skin="liquid"][data-lg="dark"] .av-st tbody tr:nth-child(even) .nm,html[data-skin="liquid"][data-lg="dark"] .tbl-wrap.pinned .av-st .rk,html[data-skin="liquid"][data-lg="dark"] .tbl-wrap.pinned .av-st .nm{background:var(--card)}
html[data-skin="liquid"][data-lg="dark"] .btn:not(.primary):not(.danger){background:rgba(118,118,128,.24);color:var(--ink);border-color:transparent}

</style>
