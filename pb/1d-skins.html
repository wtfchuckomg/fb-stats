<script>
/* The site's look: ESPN's, flat white cards on gray. One look, the same on every device, applied before the
   page paints. An embedded page stays plain: it lives inside someone else's. */
(function(){
  if (new URLSearchParams(location.search).has('embed')) return;
  var ua = navigator.userAgent || '';
  window.KMS_DEVICE = /iPhone|iPod/.test(ua) ? 'iphone' : /Android.*Mobile/i.test(ua) ? 'android' : 'other';
  window.KMS_SKIN = 'espn';
  document.documentElement.setAttribute('data-skin', 'espn');
})();
</script>
<style>
/* On a phone: the menu as a flat tab bar along the bottom of the screen. */
.lgtabs{display:none}
@media (max-width:700px){
  html[data-skin="espn"] .lgtabs{position:fixed;z-index:50;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    padding-bottom:env(safe-area-inset-bottom,0px);background:#FFFFFF;border-top:1px solid var(--line)}
  html[data-skin="espn"] .lgtabs a{display:grid;justify-items:center;gap:3px;padding:8px 2px 7px;color:var(--muted);text-decoration:none;font:500 10px/1 var(--sans)}
  html[data-skin="espn"] .lgtabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  html[data-skin="espn"] .lgtabs a[aria-current="page"]{color:var(--ink-2);box-shadow:inset 0 2px 0 var(--red)}
  html[data-skin="espn"] body{padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}
}
</style>
