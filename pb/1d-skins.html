<script>
/* Looks: Original, Liquid Glass (light or dark), Android and 8-Bit. A visitor's pick is kept on their own device, and
   ?skin=… in a link sets it (?skin=auto goes back to matching the device). With no pick, a phone gets its own look:
   an iPhone Liquid Glass, an Android phone the Android look, each light or dark with the phone's own setting; a
   computer or tablet gets the original. It's applied here, before the page paints, so there's no flash of another
   look. Embedded pages always stay on the original, since they live inside someone else's page. */
(function(){
  var q = new URLSearchParams(location.search), want = q.get('skin'), s = null;
  try {
    if (want === 'auto') localStorage.removeItem('kms.skin');
    else if (want) localStorage.setItem('kms.skin', want);
    s = localStorage.getItem('kms.skin');
  } catch (e) { s = want && want !== 'auto' ? want : null; }
  var ok = ['original', 'liquid', 'liquid-dark', 'material', 'tecmo'];
  window.KMS_SKIN_PICKED = ok.indexOf(s) >= 0;
  var ua = navigator.userAgent || '', dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  var iphone = /iPhone|iPod/.test(ua), android = /Android.*Mobile/i.test(ua);
  window.KMS_DEVICE = iphone ? 'iphone' : android ? 'android' : 'other';
  window.KMS_SKIN = window.KMS_SKIN_PICKED ? s
    : iphone ? (dark ? 'liquid-dark' : 'liquid') : android ? 'material' : 'original';
  if (q.has('embed') || window.KMS_SKIN === 'original') return;
  var root = document.documentElement;
  // Liquid Glass comes light or dark: one skin, with the dark tokens switched on for the dark one.
  root.setAttribute('data-skin', window.KMS_SKIN === 'liquid-dark' ? 'liquid' : window.KMS_SKIN);
  if (window.KMS_SKIN === 'liquid-dark') root.setAttribute('data-lg', 'dark');
  var font = window.KMS_SKIN === 'tecmo' ? 'Press+Start+2P' : window.KMS_SKIN === 'material' ? 'Roboto+Flex:opsz,wght@8..144,300..800' : '';
  if (font){
    var l = document.createElement('link'); l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=' + font + '&display=swap';
    document.head.appendChild(l);
  }
})();
</script>
