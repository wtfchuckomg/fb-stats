# Friday night in Kansas, from midnight on: read this season's results from KPreps and write kpscores.json, so a game
# nobody kept stats on still shows its final on the scoreboard. See .github/kp/scores.py.
name: Friday night scores

on:
  schedule:
    # Midnight in Kansas is 05:00 UTC in summer (CDT) and 06:00 in winter (CST). Both are listed; the first
    # step lets through only the one that is midnight in Kansas that night.
    - cron: '0 5 * * 6'
    - cron: '0 6 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: friday-scores
  cancel-in-progress: false

jobs:
  scores:
    runs-on: ubuntu-latest
    steps:
      # GitHub starts scheduled runs late (six hours on 2026-10-10). Waiting for exactly midnight skipped those
      # runs as successes, so any start before noon Saturday in Kansas counts, and the second cron line steps
      # aside when tonight's results were already saved.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Is it Friday night in Kansas?
        id: when
        run: |
          D=$(TZ=America/Chicago date +%u); H=$(TZ=America/Chicago date +%-H)
          last=$(git log -1 --format=%ct --author="Friday night scores" || echo 0); last=${last:-0}
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=1" >> "$GITHUB_OUTPUT"
          elif [ "$D" != "6" ] || [ "$H" -ge 12 ]; then echo "Not Friday night in Kansas; the other run has it."
          elif [ $(( $(date +%s) - last )) -lt 43200 ]; then echo "Already saved tonight."
          else echo "go=1" >> "$GITHUB_OUTPUT"; fi
      - name: Read tonight's results from KPreps
        if: steps.when.outputs.go == '1'
        env:
          KP_YEARS: '2026'
        run: python3 .github/kp/crawl.py
      - name: Write the finals the site reads
        if: steps.when.outputs.go == '1'
        run: python3 .github/kp/scores.py
      - name: Write every logo school's schedule
        if: steps.when.outputs.go == '1'
        run: python3 .github/kp/schedule.py
      - name: Fit the ratings on tonight's games
        if: steps.when.outputs.go == '1'
        run: python3 .github/kp/ratings.py
      - name: Write each school's seasons for the site
        if: steps.when.outputs.go == '1'
        run: python3 .github/kp/history.py
      - name: Add this season's playoff games to each school's playoff history
        if: steps.when.outputs.go == '1'
        run: python3 .github/kp/playoffs.py
      - name: Save and publish any changes
        if: steps.when.outputs.go == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A kpscores.json schedule.json ratings.json history playoffs .github/kp
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git -c user.name="Friday night scores" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Friday night: KPreps finals, ratings, history"
          git pull -q --rebase && git push -q
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" > /dev/null || true
