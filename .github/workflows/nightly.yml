# Every night at 3 a.m. Kansas time: rebuild season.json, stats.json, the game preview pages and the embed links
# from the live site. See .github/nightly.py.
name: Nightly rebuild

on:
  schedule:
    # GitHub's clock is UTC, and 3 a.m. in Kansas is 08:00 UTC in summer (CDT) and 09:00 in winter (CST).
    # Both are listed; the first step lets through only the one that is 3 a.m. in Kansas that day.
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: nightly-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    # 2026-10-02 the KPreps read hung for six hours, GitHub killed the job, and the rebuild it had already done was
    # never saved. Each KPreps step now has its own cap and can fail without stopping the save.
    timeout-minutes: 120
    steps:
      # GitHub starts scheduled runs late, sometimes by seven hours. Waiting for exactly 3 a.m. skipped every run
      # from 2026-10-02 on, all reported as successes. Any start from 3 a.m. to 3 p.m. Kansas time counts, and the
      # second cron line steps aside when a rebuild was already saved in the last ten hours.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Is it the night's rebuild?
        id: when
        run: |
          H=$(TZ=America/Chicago date +%-H)
          last=$(git log -1 --format=%ct --author="Nightly rebuild" || echo 0); last=${last:-0}
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=1" >> "$GITHUB_OUTPUT"
          elif [ "$H" -lt 3 ] || [ "$H" -ge 15 ]; then echo "Not between 3 a.m. and 3 p.m. in Kansas; the other run has it."
          elif [ $(( $(date +%s) - last )) -lt 36000 ]; then echo "Already rebuilt tonight."
          else echo "go=1" >> "$GITHUB_OUTPUT"; fi
      - name: Install Playwright and Pillow
        if: steps.when.outputs.go == '1'
        run: python3 -m pip install --quiet playwright Pillow
      - name: Rebuild from the live site
        if: steps.when.outputs.go == '1'
        run: python3 .github/nightly.py
      - name: Read this season's results from KPreps
        if: steps.when.outputs.go == '1'
        timeout-minutes: 20
        continue-on-error: true
        env:
          KP_YEARS: '2026'
        run: python3 .github/kp/crawl.py
      - name: Write the finals the site reads
        if: steps.when.outputs.go == '1'
        timeout-minutes: 20
        continue-on-error: true
        run: python3 .github/kp/scores.py
      - name: Write every logo school's schedule
        if: steps.when.outputs.go == '1'
        timeout-minutes: 20
        continue-on-error: true
        run: python3 .github/kp/schedule.py
      - name: Fit the ratings
        if: steps.when.outputs.go == '1'
        timeout-minutes: 20
        continue-on-error: true
        run: python3 .github/kp/ratings.py
      - name: Write each school's seasons for the site
        if: steps.when.outputs.go == '1'
        timeout-minutes: 20
        continue-on-error: true
        run: python3 .github/kp/history.py
      - name: Small copies of the logos
        if: steps.when.outputs.go == '1'
        continue-on-error: true
        run: python3 .github/logos_sm.py
      - name: Save and publish any changes
        if: steps.when.outputs.go == '1' && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A season.json stats.json rosters.json ratings.json kpscores.json schedule.json g p pv embed history .github/kp logos/sm
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git -c user.name="Nightly rebuild" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Nightly rebuild: season, stats, previews, embeds"
          git pull -q --rebase && git push -q
          # A push by this job doesn't start a Pages build by itself, so ask for one.
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" > /dev/null || true
      # Chuck, 2026-10-16: check the site every night. Each main page of both sites has to load, run without a
      # JavaScript error and redraw in under 1.5 seconds; if one doesn't, this step fails and GitHub emails the
      # failed run. Last, so a problem it finds never stops the rebuild from being saved.
      - name: Check the site
        if: steps.when.outputs.go == '1' && !cancelled()
        timeout-minutes: 15
        run: python3 .github/healthcheck.py
